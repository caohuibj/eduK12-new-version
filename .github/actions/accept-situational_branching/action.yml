name: situational_branching acceptance
description: Shared scenario implementation for isolated probes and grouped CI.
runs:
  using: composite
  steps:
  - name: reset only this job disposable services
    shell: bash
    run: node "$GITHUB_WORKSPACE/.github/scripts/ci-reset-media-services.mjs"
  - name: prisma generate and guarded migration
    working-directory: server-version/backend
    run: |
      npx prisma generate
      npm run db:migrate:guarded
    shell: bash
  - name: seed reference and configuration data
    working-directory: server-version/backend
    run: npm run db:seed
    env:
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password-2026
    shell: bash
  - name: seed V2 branching fixture
    working-directory: server-version/backend
    run: npx tsx ../e2e/situational-branching-browser-fixture.ts
    shell: bash
  - name: start backend
    run: |
      rm -rf "$SITUATIONAL_BRANCHING_E2E_SCREENSHOT_DIR"
      mkdir -p "$UPLOAD_DIR" "$CREDENTIAL_HANDOFF_DIR" "$SITUATIONAL_BRANCHING_E2E_SCREENSHOT_DIR"
      nohup setsid node backend/dist/index.js > /tmp/eduk12-situational-branching-backend.log 2>&1 &
      echo $! > /tmp/eduk12-situational-branching-backend.pid
      for attempt in $(seq 1 60); do
        if curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then exit 0; fi
        sleep 1
      done
      cat /tmp/eduk12-situational-branching-backend.log
      exit 1
    shell: bash
    working-directory: server-version
  - name: start frontend
    run: |
      nohup setsid npm --prefix frontend run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/eduk12-situational-branching-frontend.log 2>&1 &
      echo $! > /tmp/eduk12-situational-branching-frontend.pid
      for attempt in $(seq 1 60); do
        if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
        sleep 1
      done
      cat /tmp/eduk12-situational-branching-frontend.log
      exit 1
    shell: bash
    working-directory: server-version
  - name: run V2 branching browser acceptance
    run: node e2e/situational-branching-browser-e2e.cjs
    shell: bash
    working-directory: server-version
  - name: upload branching evidence
    if: always()
    continue-on-error: true
    uses: actions/upload-artifact@v4
    with:
      name: situational-v2-branching-acceptance-evidence
      path: |
        /tmp/eduk12-situational-branching-e2e
        /tmp/eduk12-situational-branching-backend.log
        /tmp/eduk12-situational-branching-frontend.log
      if-no-files-found: ignore
  - name: stop seeded services
    if: always()
    run: |
      if [ -f /tmp/eduk12-situational-branching-frontend.pid ]; then kill -- -$(cat /tmp/eduk12-situational-branching-frontend.pid) || true; fi
      if [ -f /tmp/eduk12-situational-branching-backend.pid ]; then kill -- -$(cat /tmp/eduk12-situational-branching-backend.pid) || true; fi
    shell: bash
    working-directory: server-version
