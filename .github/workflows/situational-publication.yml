name: Situational publication integrity
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: situational-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  publication:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Classify reviewed exact candidate catalog boundary without replay
        id: exact
        if: contains(fromJSON('["work/measurement-version-final-20261020","work/training-mac-ui-final-20261020"]'), github.event.pull_request.head.ref)
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {git,situationalPublicationBoundary} from './.github/scripts/exact-candidate-scope.mjs';
          const result=situationalPublicationBoundary(process.env.BASE_SHA,git('rev-parse','HEAD'));
          appendFileSync(process.env.GITHUB_OUTPUT,`handled=${result!==null}\n`);
          if(result) console.log(JSON.stringify(result));
          JS
      - name: Verify bounded SJT candidate scientific catalog input equivalence
        id: sjt
        if: github.event.pull_request.head.ref == 'backup/shared-sjt-native-20261024'
        env:
          CI_EVENT: pull_request
          CI_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {changedEntries} from './.github/scripts/content-scope.mjs';
          import {sjtNativePlan,publicationBoundary} from './.github/scripts/sjt-native-scope.mjs';
          const base=process.env.BASE_SHA,head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(!sjtNativePlan(changedEntries(base,head),base,head))throw Error('Missing exact SJT route');
          console.log(JSON.stringify(publicationBoundary(base,head)));
          appendFileSync(process.env.GITHUB_OUTPUT,'handled=true\n');
          JS
      - name: Detect publication-relevant changes
        if: steps.exact.outputs.handled != 'true' && steps.sjt.outputs.handled != 'true'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Tool-only changes are checked by the existing release-tools recipe.
          # Content/review/runtime/dependency changes cannot enter this boundary.
          if node --input-type=module <<'JS'
          import {changedEntries} from './.github/scripts/content-scope.mjs';
          import {toolingOnly} from './server-version/scripts/release/policy.mjs';
          process.exitCode=toolingOnly(changedEntries(process.env.BASE_SHA,'HEAD'))?0:1;
          JS
          then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relevant=false
          while IFS= read -r file; do
            case "$file" in
              server-version/backend/src/modules/situational/*|\
              server-version/backend/src/scripts/situational-*|\
              server-version/backend/scripts/situational-*|\
              server-version/backend/package.json|\
              server-version/backend/package-lock.json|\
              .github/workflows/situational-publication.yml)
                relevant=true
                break
                ;;
            esac
          done < <(git diff --no-renames --name-only "$BASE_SHA" HEAD)
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.relevant == 'true'
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts
        if: steps.scope.outputs.relevant == 'true'
        working-directory: server-version/backend
      - name: Verify publication, scoped scientific declarations and human reviews
        if: steps.scope.outputs.relevant == 'true'
        working-directory: server-version/backend
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run situational:onboarding-check -- --all --json --verify-reviews --base "$PUBLICATION_BASE_SHA"
