name: School Teacher visual frontend qualification
on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
permissions:
  contents: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      TZ: UTC
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify selected source and scope controls
        env:
          CI_EVENT: pull_request
          CI_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {changedEntries} from './.github/scripts/content-scope.mjs';
          import {schoolTeacherVisualPlan} from './.github/scripts/school-teacher-visual-scope.mjs';
          const p=JSON.parse(process.env.PLAN),head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.deepEqual(schoolTeacherVisualPlan(changedEntries(p.base,head),p.base,head),p);
          assert.equal(p.postMerge,false);
          JS
          node --test .github/scripts/school-teacher-visual.test.mjs .github/scripts/training-manual-ui.test.mjs .github/scripts/survey-manual-ui.test.mjs .github/scripts/ci-topology.test.mjs .github/scripts/content-workflows.test.mjs
      - name: install locked frontend and compile-only backend type dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix server-version/frontend
          npm ci --ignore-scripts --no-audit --no-fund --prefix server-version/backend
          cd server-version/backend
          node node_modules/prisma/build/index.js generate --schema prisma/schema.prisma
      - name: changed product lint and complete frontend types
        working-directory: server-version/frontend
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {binding} from '../../.github/scripts/school-teacher-visual-scope.mjs';
          const files=Object.keys(binding.source).filter(f=>/\.[jt]sx?$/.test(f)).map(f=>f.replace('server-version/frontend/',''));
          if(!files.length)throw Error('Missing changed lint inputs');
          execFileSync(process.execPath,['node_modules/eslint/bin/eslint.js',...files],{stdio:'inherit'});
          JS
          node node_modules/typescript/bin/tsc -p tsconfig.app.json --noEmit
      - name: targeted entry authorization navigation and draft consumers
        working-directory: server-version/frontend
        run: |
          mkdir -p ../../school-teacher-visual-evidence
          node node_modules/vitest/vitest.mjs run src/pages/AdminLogin.test.tsx src/admin/SurveyAdminEnrollmentContext.test.tsx src/admin/AdminAuthenticator.test.tsx src/components/app-shell/__tests__/SurveyAdminOrigin.test.tsx src/components/app-shell/__tests__/shell.test.tsx src/school/SchoolEntryMfa.test.tsx src/school/SchoolWorkspaceShell.test.tsx src/school/SchoolWorkspace.test.tsx src/school/SchoolPrivateToolNavigation.test.tsx src/huiteacher/HuiteacherWorkspaceFlow.test.tsx src/huiteacher/HuiteacherWorkspaceLayout.test.tsx src/huiteacher/HuiteacherPrivateToolNavigation.test.tsx src/pages/admin/EducationProductGovernance.test.tsx --maxWorkers=2 --reporter=default --reporter=json --outputFile=../../school-teacher-visual-evidence/consumer-tests.json
      - name: build production frontend once and bind official artifact
        working-directory: server-version/frontend
        run: |
          npm run build
          node "$GITHUB_WORKSPACE/.github/scripts/ci-artifact.mjs" write frontend
          node "$GITHUB_WORKSPACE/.github/scripts/ci-artifact.mjs" verify frontend
      - name: install pinned official browser and accessibility tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/release-tools
          node .github/release-tools/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: real production App and complete CSS synthetic browser matrix
        run: node .github/scripts/school-teacher-visual-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-teacher-visual-${{ github.sha }}
          path: |
            school-teacher-visual-evidence
            server-version/frontend/dist
          if-no-files-found: error
          retention-days: 3
