name: Training management bounded merge qualification
on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
  NODE_OPTIONS: --max-old-space-size=4096
  CI_EVENT: pull_request
  CI_HEAD_REF: work/survey-training-branding-20261023
  CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
  CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
  CI_PR_NUMBER: ${{ github.event.pull_request.number }}
  PLAN: ${{ inputs.plan }}
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: admit exact existing course assertions and source-bound lint
        run: node .github/scripts/training-admin-integration-checks.mjs admission
      - name: new exact-scope evidence and merge refusal contracts
        run: node --test --test-name-pattern='^(requires every selected assertion|admits only original unchanged course assertions|bounded workflow excludes)' .github/scripts/training-admin-integration.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-admin-admission-${{ github.sha }}
          path: training-admin-integration-evidence
          if-no-files-found: error
          retention-days: 3
  frontend:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:1/synthetic
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            server-version/frontend/package-lock.json
            server-version/backend/package-lock.json
      - name: install frozen dependencies and prepare cross-tree type imports
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix server-version/backend
          cd server-version/backend
          node node_modules/prisma/build/index.js generate
          cd ../frontend
          npm ci --ignore-scripts --no-audit --no-fund
      - name: integrated application types
        working-directory: server-version/frontend
        run: node node_modules/typescript/bin/tsc -p tsconfig.app.json --noEmit
      - name: changed lint and missing affected frontend consumers only
        run: node .github/scripts/training-admin-integration-checks.mjs frontend
      - name: compile integrated frontend exactly once
        working-directory: server-version/frontend
        run: node node_modules/vite/bin/vite.js build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-admin-frontend-${{ github.sha }}
          path: |
            training-admin-integration-evidence
            server-version/frontend/dist
          if-no-files-found: error
          retention-days: 3
  management-query:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:1/synthetic
      JWT_SECRET: synthetic-ci-only-management-query-secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: server-version/backend/package-lock.json
      - name: install locked query type and test tools
        working-directory: server-version/backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/prisma/build/index.js generate
      - name: integrated backend types without business build or database
        working-directory: server-version/backend
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: course sorting and Training identity query contracts only
        run: node .github/scripts/training-admin-integration-checks.mjs backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-admin-query-${{ github.sha }}
          path: training-admin-integration-evidence
          if-no-files-found: error
          retention-days: 3
  qualified:
    needs: [admission, frontend, management-query]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: every selected stage must actually succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node -e 'const n=JSON.parse(process.env.NEEDS);for(const k of ["admission","frontend","management-query"])if(n[k]?.result!=="success")throw Error(k+" did not succeed")'
