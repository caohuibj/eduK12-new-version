name: RA02 fix resolved consent narrowing
on:
  push:
    branches: [feat/ra-02-relational-product-integration]
    paths:
      - server-version/scripts/ra02-fix-resolved-null.py
      - .github/workflows/ra02-fix-resolved-null.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ra-02-relational-product-integration
      - run: python server-version/scripts/ra02-fix-resolved-null.py
      - name: commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-version/backend/src/modules/assessment-relational/product.service.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(relational): narrow accepted consent result"
          git push origin HEAD:feat/ra-02-relational-product-integration
