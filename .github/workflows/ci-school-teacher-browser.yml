name: School Teacher focused theme diagnostic
on:
  push:
    branches: ['ci/school-teacher-console-20261023']
permissions:
  contents: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
jobs:
  launch-diagnostic:
    if: ${{ github.event_name == 'push' && github.repository == 'caohuibj/eduK12-new-version' && github.ref == 'refs/heads/ci/school-teacher-console-20261023' && !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --prefix server-version/frontend
      - run: npm ci --ignore-scripts --prefix .github/release-tools
      - name: prepare official CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: compile current real components with synthetic diagnostic inputs
        working-directory: server-version/frontend
        run: node node_modules/vite/bin/vite.js build --config theme-diagnostic/vite.config.ts
      - name: narrow previously approved temporary Chrome write permissions
        env:
          SCHOOL_TEACHER_CHROME_TIGHTEN: confirmed-temporary-runner
        run: node server-version/e2e/school-teacher-chrome-permissions.cjs tighten
      - name: inspect theme transitions and material states without backend or database
        run: node server-version/e2e/school-teacher-theme-diagnostic.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-teacher-theme-diagnostic-${{ github.sha }}
          path: school-theme-diagnostic-evidence/
          retention-days: 3
          if-no-files-found: error
