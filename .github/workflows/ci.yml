      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        node .github/scripts/pr357-checks.mjs audit-reuse
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pr357-audit-${{ github.sha }}
