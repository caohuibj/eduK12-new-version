          // Python's extractor walks each paths entry as a directory, even in a mixed-language scan.
          // Exclude every unselected direct entry, including entire child directories.
          const config = {paths: [directory], 'paths-ignore': entries.filter(name => !selected.includes(name)).map(name => `${directory}/${name}`)};
