    if: ${{ !(github.event_name == 'workflow_dispatch' && contains(fromJSON('["work/measurement-version-final-20261020","work/training-mac-ui-final-20261020","work/scale-authoring-feedback-20261021","work/composite-csv-memory-20261021","work/scale-library-governance-20261021","work/survey-experience-20261022","work/admin-authenticator-main-20261022","work/training-student-20261022","survey-cloud-flow-visual-20261022","work/training-appearance-20261022","work/survey-visual-20261022","work/shared-assessment-authoring-20261023","work/school-teacher-review-20261022","work/school-teacher-visual-20261023","work/training-assessment-performance-20261023"]'), github.ref_name)) && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/survey/mac-visual-s01-20261019') && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/survey-wave-content-selection-20261021') && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/training-functional-final-20261020') && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/perf/training-load-followup-20261020') && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/admin-permissions/a01-a07-20261020') && (always() && (inputs.step_probe == '' || inputs.step_probe == 'none') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      IS_DRAFT: ${{ github.event.pull_request.draft == true && vars.CI_FORCE_FULL != 'true' }}
      CI_EVENT: ${{ github.event_name }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
      CI_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      CI_IS_DRAFT: ${{ github.event.pull_request.draft }}
      CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      CI_PR_NUMBER: ${{ github.event.pull_request.number }}
      CI_SURVEY_MAC_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      SURVEY_MAC_UI_REVIEWED_HEAD: ${{ vars.SURVEY_MAC_UI_REVIEWED_HEAD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: materialize complete merge-gate inputs
        shell: node {0}
        run: |
          const fs = require('node:fs');
          // The generated Node script receives a JSON string literal, never shell code.
          const serialized = ${{ toJSON(toJSON(needs)) }};
          if (Buffer.byteLength(serialized, 'utf8') > 4 * 1024 * 1024) throw new Error('Merge-gate inputs exceed 4 MiB');
          const path = require('node:path');
          const file = path.join(process.env.RUNNER_TEMP, `merge-gate-needs-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}.json`);
          if (/[\r\n]/.test(file)) throw new Error('Invalid merge-gate input path');
          fs.writeFileSync(file, serialized, { mode: 0o600, flag: 'wx' });
          fs.appendFileSync(process.env.GITHUB_ENV, `NEEDS_JSON_FILE=${file}\n`);
      - name: install pinned release classification tools
        if: needs.scope.outputs.application_route != 'training-assessment' && needs.scope.outputs.application_route != 'school-teacher-visual' && needs.scope.outputs.application_route != 'participant-access' && needs.scope.outputs.application_route != 'training-manual-ui' && needs.scope.outputs.application_route != 'survey-manual-ui' && needs.scope.outputs.application_route != 'shared-authoring' && needs.scope.outputs.application_route != 'school-teacher' && needs.scope.outputs.application_route != 'survey-workspace' && needs.scope.outputs.application_route != 'training-appearance' && needs.scope.outputs.application_route != 'survey-cloud' && needs.scope.outputs.documentation != 'true' && needs.scope.outputs.scenario != 'release-tooling' && !(needs.scope.outputs.application_route == 'training-workspace' && fromJSON(needs.scope.outputs.training_workspace_plan || '{}').candidate == 'mac-followup')
        run: npm ci --ignore-scripts --prefix .github/release-tools
      - name: require exact success for the selected route
        if: ${{ !inputs.complete_training }}
        run: node .github/scripts/merge-gate.mjs
      - name: verify approved frozen Training receipt and refusal cases
        if: inputs.complete_training
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s .github/scripts -p test_training_completion.py
          node --test .github/scripts/content-workflows.test.mjs .github/scripts/ci-topology.test.mjs .github/scripts/maintenance-routing.test.mjs
          python3 .github/scripts/training-completion.py
      - name: upload current-head evidence receipt
        if: always() && inputs.complete_training
        uses: actions/upload-artifact@v4
        with:
          name: training-completion-${{ github.sha }}
          path: training-completion.json
          retention-days: 3
          if-no-files-found: error
