      run: node .github/scripts/pr395-browser.mjs
    - name: qualify missing recorded-response UI consumers with active browser sandbox
      if: fromJSON(needs.scope.outputs.onboarding_plan || '{}').pr == 374
      run: node .github/scripts/pr374-browser.mjs
    - name: qualify observer displays and warning contrast with active browser sandbox
      if: fromJSON(needs.scope.outputs.onboarding_plan || '{}').pr == 376
      run: node .github/scripts/pr376-browser.mjs
    - name: build once and verify bounded four-entry compiled loading consumers
      if: fromJSON(needs.scope.outputs.onboarding_plan || '{}').pr == 378
      run: node .github/scripts/pr378-browser.mjs
    - name: verify active sandbox then build once for the single PR381 compiled editor
