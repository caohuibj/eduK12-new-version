# CI / merge gate
#
# 触发模型：
#   Pure Scale / existing Cognitive / SJT / Bundle content: one targeted content gate.
#   Presentation-only CSS/design-doc PR: frontend lint + typecheck + production build only.
#   Routing always runs; the stable aggregate check completes for every selected route.
#   Draft platform PR: lightweight compile/type gate only; development commits do not consume Full Gate capacity.
#   Ready platform PR: existing full backend/frontend/browser/docker/CodeQL merge gate.
#   Ready PR debug: synchronize continues to re-run Full Gate after a failed merge-gate attempt.
#   workflow_dispatch: one component probe; Full Gate requires explicit full_acceptance=true.
#   push main: short post-merge integrity smoke only; do not repeat the already-green Full Gate.
#   Pull-request review events do not rerun CI because review metadata does not change the tested head SHA.
#
# 编排：全部任务使用 GitHub 托管 Ubuntu，按场景并行执行。
#   Router:       changed-scope classification
#   Dependencies: backend build/performance, functional regression, frontend, CodeQL, Docker
#   Capacity:     hosted jobs release builds early and parallelize independent consumers
#   Browser:      consumes exact-run artifacts without waiting for unrelated frontend checks
#   Merge gate:   exact success for every selected route and acceptance
#
# jobs：
#   backend       : npm ci + prisma generate + guarded migrate deploy + seed + build + 200-completion SLA
#   backend-regression: independent DB + full regression except the separately gated performance SLA file
#   frontend-build: early production/UI-lab artifacts; frontend: lint/types/audit/full regression
#   browser       : isolated PostgreSQL/Redis + seeded Bundle + real Playwright acceptance flow
#   docker        : baseline + monitoring compose config + backend/frontend production image build
#   merge-gate    : fail-closed aggregate; only exact success for every Full Gate dependency passes
#
# 说明：
#   - Vite build 不作为 TypeScript typecheck 的替代品（v1.1 §11）。
#   - frontend typecheck 同时覆盖应用与 Cognitive 模块；全仓 tsc -b 的预存类型错误登记为独立清理项，
#     不扩大本里程碑范围。
#   - 两个 backend jobs 各有独立 CI Postgres service；集成测试不以跳过代替通过。
#   - backend/frontend builds use exact GITHUB_SHA artifacts from this run; missing artifacts fail closed.
#   - Browser consumers verify source/run/lockfile/content provenance; UI-lab has a separate artifact.
#   - merge-gate 使用 needs + always()；failure/cancelled/skipped/missing 均不得被解释为 merge-ready。

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'refactor/unified-runtime-v32-unit'
      - 'content/cognitive-expansion'
  workflow_dispatch:
    inputs:
      runner_profile:
        type: choice
        options: [hosted]
        default: hosted
        description: 'Use GitHub-hosted Ubuntu for every CI job'
      step_probe:
        type: choice
        options: [none, images, cognitive, frontend, backend, backend-regression, assessment-repair, reporting, browser, media, ui, ui-chromium, qa-ui, ops, maintenance, perf]
        default: none
        description: 'Run one CI component without full CI or CodeQL'
      probe_frontend_only:
        type: boolean
        default: false
        description: 'Image probe: frontend only; false builds backend/worker/frontend'
      complete_training:
        type: boolean
        default: false
        description: 'Approved frozen Training evidence receipt; no application tests rerun'
      full_acceptance:
        type: boolean
        default: false
        description: 'Explicitly opt into whole-platform CI; otherwise choose a step_probe'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.step_probe || 'none' }}-${{ inputs.step_probe == 'images' && inputs.probe_frontend_only && 'frontend' || 'all' }}
  cancel-in-progress: true

jobs:
  probe-frontend-build:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["frontend","browser","media","ui","ui-chromium","qa-ui"]'), inputs.step_probe)
    uses: ./.github/workflows/ci-frontend-build.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      ui_lab: ${{ contains(fromJSON('["ui","ui-chromium"]'), inputs.step_probe) }}
      ui_runner_labels: '["ubuntu-24.04"]'

  probe-browser-build:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["browser","media"]'), inputs.step_probe)
    uses: ./.github/workflows/ci-backend-browser-build.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  probe-backend:
    if: github.event_name == 'workflow_dispatch' && inputs.step_probe == 'backend'
    uses: ./.github/workflows/ci-backend.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  probe-backend-regression:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["backend-regression","assessment-repair","reporting"]'), inputs.step_probe)
    uses: ./.github/workflows/ci-backend-regression.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      focus: ${{ inputs.step_probe == 'reporting' && 'reporting' || (inputs.step_probe == 'assessment-repair' && 'assessment-repair' || 'full') }}

  probe-browser:
    needs: [probe-frontend-build, probe-browser-build]
    if: github.event_name == 'workflow_dispatch' && inputs.step_probe == 'browser'
    uses: ./.github/workflows/ci-browser.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  probe-media:
    needs: [probe-frontend-build, probe-browser-build]
    if: github.event_name == 'workflow_dispatch' && inputs.step_probe == 'media'
    uses: ./.github/workflows/ci-media.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      selected: '["media2","video_core","media7","situational_video","situational_branching"]'
      groups: '["images-video","cognitive-situational"]'

  probe-ui-mac:
    needs: probe-frontend-build
    if: github.event_name == 'workflow_dispatch' && inputs.step_probe == 'ui'
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    uses: ./.github/workflows/ci-ui.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      engine: ${{ matrix.engine }}
      canonical: true
      app_shell: ${{ matrix.engine == 'chromium' }}
      qa_round3: ${{ matrix.engine == 'chromium' }}

  probe-qa-ui:
    needs: probe-frontend-build
    if: github.event_name == 'workflow_dispatch' && inputs.step_probe == 'qa-ui'
    uses: ./.github/workflows/ci-ui.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      canonical: false
      app_shell: true
      qa_round3: true

  probe-ui-hosted:
    needs: probe-frontend-build
    if: github.event_name == 'workflow_dispatch' && inputs.step_probe == 'ui-chromium'
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium]
    uses: ./.github/workflows/ci-ui.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      engine: ${{ matrix.engine }}
      canonical: true
      app_shell: true
      qa_round3: true

  probe-maintenance:
    if: github.event_name == 'workflow_dispatch' && inputs.step_probe == 'maintenance'
    uses: ./.github/workflows/ci-maintenance.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  probe-ops:
    if: github.event_name == 'workflow_dispatch' && inputs.step_probe == 'ops'
    uses: ./.github/workflows/ops-prelaunch.yml

  probe-perf:
    if: github.event_name == 'workflow_dispatch' && inputs.step_probe == 'perf'
    uses: ./.github/workflows/perf-phase0-smoke.yml

  probe-images:
    if: github.event_name == 'workflow_dispatch' && inputs.step_probe == 'images'
    uses: ./.github/workflows/ci-images.yml
    with:
      frontend_only: ${{ inputs.probe_frontend_only }}

  probe-cognitive:
    if: github.event_name == 'workflow_dispatch' && inputs.step_probe == 'cognitive'
    uses: ./.github/workflows/ci-cognitive-step.yml

  probe-frontend:
    needs: probe-frontend-build
    if: github.event_name == 'workflow_dispatch' && inputs.step_probe == 'frontend'
    uses: ./.github/workflows/ci-frontend.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  scope:
    name: classify changed content
    if: ${{ !inputs.complete_training && (inputs.step_probe == '' || inputs.step_probe == 'none') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      runner_profile: ${{ steps.scope.outputs.runner_profile }}
      regression_runner: ${{ steps.scope.outputs.regression_runner }}
      browser_runner: ${{ steps.scope.outputs.browser_runner }}
      media_runner: ${{ steps.scope.outputs.media_runner }}
      visual_hosted: ${{ steps.scope.outputs.visual_hosted }}
      frontend_build: ${{ steps.scope.outputs.frontend_build }}
      ui_required: ${{ steps.scope.outputs.ui_required }}
      media_selection: ${{ steps.scope.outputs.media_selection }}
      media_groups: ${{ steps.scope.outputs.media_groups }}
      maintenance: ${{ steps.scope.outputs.maintenance }}
      scenario: ${{ steps.scope.outputs.scenario }}
      frontend: ${{ steps.scope.outputs.frontend }}
      documentation: ${{ steps.scope.outputs.documentation }}
      codeql: ${{ steps.scope.outputs.codeql }}
      heavy_runner: ${{ steps.scope.outputs.heavy_runner }}
      light_runner: ${{ steps.scope.outputs.light_runner }}
      codeql_runner: ${{ steps.scope.outputs.codeql_runner }}
      frontend_runner: ${{ steps.scope.outputs.frontend_runner }}
      docker_runner: ${{ steps.scope.outputs.docker_runner }}
      media2: ${{ steps.scope.outputs.media2 }}
      media7: ${{ steps.scope.outputs.media7 }}
      situational_video: ${{ steps.scope.outputs.situational_video }}
      situational_branching: ${{ steps.scope.outputs.situational_branching }}
      video_core: ${{ steps.scope.outputs.video_core }}
      app_shell: ${{ steps.scope.outputs.app_shell }}
      canonical_visual: ${{ steps.scope.outputs.canonical_visual }}
      perf_smoke: ${{ steps.scope.outputs.perf_smoke }}
      ops: ${{ steps.scope.outputs.ops }}
      content: ${{ steps.scope.outputs.content }}
      presentation: ${{ steps.scope.outputs.presentation }}
      scale: ${{ steps.scope.outputs.scale }}
      cognitive: ${{ steps.scope.outputs.cognitive }}
      situational: ${{ steps.scope.outputs.situational }}
      bundle: ${{ steps.scope.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: fetch the exact diff base without full history
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node .github/scripts/runner-preflight.mjs --control
          node .github/scripts/fetch-ci-base.mjs
      - run: node --test .github/scripts/runner-preflight.test.mjs .github/scripts/content-scope.test.mjs .github/scripts/browser-asset-filter.test.mjs .github/scripts/ci-timing-report.test.mjs .github/scripts/ci-browser-plan.test.mjs .github/scripts/api-response.test.mjs .github/scripts/mac-ci-cleanup.test.mjs .github/scripts/content-workflows.test.mjs .github/scripts/ci-image-plan.test.mjs .github/scripts/ci-topology.test.mjs .github/scripts/maintenance-routing.test.mjs .github/scripts/dependency-routing.test.mjs
      - id: scope
        env:
          CI_RUNNER_PROFILE: hosted
          CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CI_EVENT: ${{ github.event_name }}
          CI_FULL_ACCEPTANCE: ${{ inputs.full_acceptance }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/content-scope.mjs

  maintenance:
    needs: scope
    if: needs.scope.outputs.maintenance == 'true' || needs.scope.outputs.scenario == 'platform' || needs.scope.outputs.scenario == 'dependencies'
    uses: ./.github/workflows/ci-maintenance.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  documentation:
    name: documentation / whitespace and scope validation
    needs: scope
    if: needs.scope.outputs.documentation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: validate the exact documentation diff
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node .github/scripts/fetch-ci-base.mjs
          node .github/scripts/documentation-check.mjs

  content:
    name: assessment content
    needs: scope
    if: needs.scope.outputs.content == 'true'
    uses: ./.github/workflows/scale-onboarding-boundary.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      runner_profile: hosted
      scale: ${{ needs.scope.outputs.scale == 'true' }}
      cognitive: ${{ needs.scope.outputs.cognitive == 'true' }}
      situational: ${{ needs.scope.outputs.situational == 'true' }}
      bundle: ${{ needs.scope.outputs.bundle == 'true' }}
      base: ${{ github.event.pull_request.base.sha || github.event.before }}

  visual:
    needs: scope
    name: presentation / frontend lint + typecheck + build
    if: needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.presentation == 'true' && github.event_name == 'pull_request' && vars.CI_FORCE_FULL != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=3072
      TZ: UTC
    defaults:
      run:
        working-directory: server-version/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs" --frontend
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: production build
        run: npm run build
      - name: bound dedicated Mac CI caches and remove job dependencies
        if: ${{ always() && runner.os == 'macOS' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/mac-ci-cleanup.mjs"

  pr-light-backend:
    needs: scope
    name: PR light / backend compile
    if: ${{ needs.scope.outputs.scenario != 'frontend-test' && (needs.scope.outputs.scenario != 'dependencies' && (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == true && vars.CI_FORCE_FULL != 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: server-version/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs"
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: prepare canvas source-build dependencies
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-install-canvas-deps.sh"
      - name: npm ci
        run: npm ci
      - name: content routing boundary tests
        run: node --test ../../.github/scripts/cognitive-content.test.mjs ../../.github/scripts/content-workflows.test.mjs
      - name: prisma generate
        run: npx prisma generate
      - name: situational data-only manifests and publication gates
        run: npm run situational:contracts
      - name: verify SJT immutable releases and publication authority
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$PUBLICATION_BASE_SHA"
          npm run situational:onboarding-check -- --all --verify-reviews --base "$PUBLICATION_BASE_SHA"
      - name: cognitive task manifests and dependency boundaries
        run: npm run cognitive:contracts
      - name: Bundle content and immutable history
        env:
          BUNDLE_CONTENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npx tsx scripts/bundle-content-check.ts
      - name: build (tsc)
        run: npm run build
      - name: Mini identity and parent authorization unit contracts
        run: >-
          npx vitest run src/__tests__/parent-portal
          src/__tests__/mobile/discovery.test.ts
          src/__tests__/assessment-identity/episode-parent-invite.test.ts
          src/__tests__/middleware/auth.test.ts
          src/__tests__/middleware/csrf.test.ts
          src/__tests__/utils/authCookies.test.ts
          src/__tests__/controllers/authLibrary.test.ts

  pr-light-frontend:
    needs: scope
    name: PR light / frontend lint + typecheck
    if: ${{ needs.scope.outputs.scenario != 'frontend-test' && (needs.scope.outputs.scenario != 'dependencies' && (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft == true && vars.CI_FORCE_FULL != 'true' && (needs.scope.outputs.frontend == 'true' || (needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false')) && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || vars.CI_FORCE_FULL == 'true'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=3072
      TZ: UTC
    defaults:
      run:
        working-directory: server-version/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs" --frontend
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: bound dedicated Mac CI caches and remove job dependencies
        if: ${{ always() && runner.os == 'macOS' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/mac-ci-cleanup.mjs"

  post-merge-smoke:
    needs: scope
    name: main / post-merge compile smoke
    if: ${{ needs.scope.outputs.scenario != 'frontend-test' && (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.presentation != 'true' && github.event_name == 'push' && vars.CI_FORCE_FULL != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs"
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: prepare canvas source-build dependencies
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-install-canvas-deps.sh"
      - name: backend npm ci
        working-directory: server-version/backend
        run: npm ci
      - name: backend prisma generate
        working-directory: server-version/backend
        run: npx prisma generate
      - name: Bundle content and immutable history
        working-directory: server-version/backend
        env:
          BUNDLE_CONTENT_BASE_SHA: ${{ github.event.before }}
        run: npx tsx scripts/bundle-content-check.ts
      - name: backend compile smoke
        working-directory: server-version/backend
        run: npm run build
      - name: frontend npm ci
        working-directory: server-version/frontend
        run: npm ci
      - name: frontend typecheck smoke
        working-directory: server-version/frontend
        run: npm run typecheck
      - name: frontend production build smoke
        working-directory: server-version/frontend
        run: npm run build

  backend:
    needs: scope
    name: backend (migrate + build + performance gate)
    if: ${{ needs.scope.outputs.scenario != 'frontend-test' && (!cancelled() && ((needs.scope.outputs.scenario == 'dependencies' && github.event_name == 'pull_request') || (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))))) }}
    uses: ./.github/workflows/ci-backend.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  backend-regression:
    needs: scope
    name: backend regression (isolated job database)
    if: ${{ needs.scope.outputs.scenario != 'frontend-test' && (!cancelled() && ((needs.scope.outputs.scenario == 'dependencies' && github.event_name == 'pull_request') || (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))))) }}
    uses: ./.github/workflows/ci-backend-regression.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  frontend-build:
    name: frontend artifacts / release consumers early
    needs: scope
    if: ${{ !cancelled() && ((needs.scope.outputs.scenario == 'dependencies' && github.event_name == 'pull_request') || (needs.scope.outputs.frontend_build == 'true' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)))) }}
    uses: ./.github/workflows/ci-frontend-build.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      ui_lab: ${{ needs.scope.outputs.canonical_visual == 'true' }}
      ui_runner_labels: '["ubuntu-24.04"]'

  frontend:
    # Frontend lint/types/audit/tests consume source, not the production artifact.
    # Run independently; the aggregate still requires both successful jobs.
    needs: scope
    name: frontend (lint + types + full tests + build)
    if: ${{ !cancelled() && ((needs.scope.outputs.scenario == 'frontend-test' && github.event_name == 'pull_request') || (needs.scope.outputs.scenario == 'dependencies' && github.event_name == 'pull_request') || (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && (needs.scope.outputs.frontend == 'true' || (needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false')) && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)))) }}
    uses: ./.github/workflows/ci-frontend.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  browser:
    name: browser (seeded Situational Bundle + static visual acceptance)
    # Browser acceptance executes after both production lanes have passed.
    needs: [scope, backend, backend-browser-build, frontend-build]
    if: ${{ needs.scope.outputs.scenario != 'dependencies' && (!cancelled() && needs.scope.result == 'success' && needs.frontend-build.result == 'success' && ((needs.scope.outputs.frontend == 'true' && needs.backend-browser-build.result == 'success') || (needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false' && needs.backend.result == 'success')) && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))) }}
    uses: ./.github/workflows/ci-browser.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  docker:
    name: docker (compose config + production builds)
    # This job builds images from source and does not consume backend build
    # artifacts. Start it with scope; the merge gate independently requires
    # backend, production image scans and all other selected checks.
    needs: scope
    if: ${{ needs.scope.outputs.scenario != 'frontend-test' && (!cancelled() && ((needs.scope.outputs.scenario == 'dependencies' && github.event_name == 'pull_request') || (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && (needs.scope.outputs.frontend == 'true' || (needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false')) && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))))) }}
    uses: ./.github/workflows/ci-images.yml
    with:
      frontend_only: ${{ needs.scope.outputs.frontend == 'true' }}

  codeql:
    name: codeql (javascript/typescript SAST)
    # Static analysis runs independently; the aggregate gate still requires frontend.
    needs: scope
    if: ${{ !cancelled() && ((needs.scope.outputs.scenario == 'dependencies' && github.event_name == 'pull_request') || (needs.scope.outputs.codeql == 'true' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs"
      - name: initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Bound analysis resources on the hosted Ubuntu VM.
          ram: 3500
          threads: 2
      - name: analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          # This repository has not enabled GitHub code scanning yet. Keep the
          # local SAST analysis and SARIF generation, but do not fail while
          # uploading results to an unavailable code-scanning endpoint.
          upload: never
          upload-database: false

  miniprogram:
    name: mini program / foundation contract and page smoke
    needs: scope
    if: ${{ needs.scope.outputs.scenario != 'frontend-test' && (needs.scope.outputs.scenario != 'dependencies' && (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false' && (github.event_name != 'push' || vars.CI_FORCE_FULL == 'true'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs" --light
      - name: mini static and fixture smoke gates
        working-directory: server-version/miniprogram-v2
        run: npm run verify
      - name: verify Web feature inventory
        run: node server-version/miniprogram-v2/scripts/feature-inventory.cjs --check
      - name: bound dedicated Mac CI caches and remove job dependencies
        if: ${{ always() && runner.os == 'macOS' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/mac-ci-cleanup.mjs"

  backend-browser-build:
    name: UI/content route / backend browser build
    needs: scope
    if: ${{ needs.scope.outputs.scenario != 'dependencies' && (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && (needs.scope.outputs.frontend == 'true' || (needs.scope.outputs.scenario != 'platform' && needs.scope.outputs.media_selection != '[]')) && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))) }}
    uses: ./.github/workflows/ci-backend-browser-build.yml
    with:
      runner_labels: '["ubuntu-24.04"]'















  accept-media:
    needs: [scope, backend, backend-browser-build, frontend-build]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.media_selection != '[]' && needs.frontend-build.result == 'success' && (needs.backend.result == 'success' || needs.backend-browser-build.result == 'success') && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    uses: ./.github/workflows/ci-media.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      selected: ${{ needs.scope.outputs.media_selection }}
      groups: ${{ needs.scope.outputs.media_groups }}

  accept-ui:
    # UI acceptance uses exact-run artifacts; lint/test result is independently gated.
    needs: [scope, frontend-build]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.ui_required == 'true' && needs.frontend-build.result == 'success' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.scope.outputs.visual_hosted == 'true' && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    uses: ./.github/workflows/ci-ui.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      engine: ${{ matrix.engine }}
      canonical: ${{ needs.scope.outputs.canonical_visual == 'true' && needs.scope.outputs.visual_hosted != 'true' }}
      app_shell: ${{ needs.scope.outputs.app_shell == 'true' && matrix.engine == 'chromium' }}
      qa_round3: ${{ needs.scope.outputs.canonical_visual == 'true' && matrix.engine == 'chromium' }}

  accept-visual:
    needs: [scope, frontend-build]
    if: needs.scope.outputs.canonical_visual == 'true' && needs.scope.outputs.visual_hosted == 'true' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    uses: ./.github/workflows/ci-ui.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      engine: ${{ matrix.engine }}

  accept-perf:
    # Independent fresh-fixture runtime proof; do not wait for backend compile.
    needs: scope
    if: needs.scope.outputs.perf_smoke == 'true' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    uses: ./.github/workflows/perf-phase0-smoke.yml
    with:
      runner_profile: hosted

  accept-ops:
    # Independent recovery evidence; merge gate still requires backend success.
    needs: scope
    if: needs.scope.outputs.ops == 'true' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    uses: ./.github/workflows/ops-prelaunch.yml
    with:
      runner_profile: hosted

  merge-gate:
    name: merge gate / ready PR
    needs: [scope, maintenance, documentation, content, visual, pr-light-backend, pr-light-frontend, backend, backend-browser-build, backend-regression, frontend-build, frontend, browser, docker, codeql, miniprogram, accept-media, accept-ui, accept-visual, accept-perf, accept-ops]
    if: ${{ always() && (inputs.step_probe == '' || inputs.step_probe == 'none') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      IS_DRAFT: ${{ github.event.pull_request.draft == true && vars.CI_FORCE_FULL != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: require exact success for the selected route
        if: ${{ !inputs.complete_training }}
        run: node .github/scripts/merge-gate.mjs
      - name: verify approved frozen Training receipt and refusal cases
        if: inputs.complete_training
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s .github/scripts -p test_training_completion.py
          node --test .github/scripts/content-workflows.test.mjs .github/scripts/ci-topology.test.mjs .github/scripts/maintenance-routing.test.mjs
          python3 .github/scripts/training-completion.py
      - name: upload current-head evidence receipt
        if: always() && inputs.complete_training
        uses: actions/upload-artifact@v4
        with:
          name: training-completion-${{ github.sha }}
          path: training-completion.json
          retention-days: 3
          if-no-files-found: error
