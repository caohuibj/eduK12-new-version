# CI / merge gate
#
# 触发模型：
#   Pure Scale / existing Cognitive / SJT / Bundle content: one targeted content gate.
#   Presentation-only CSS/CUA-note PR: one frontend production build; public TSX uses the static candidate.
#   Routing always runs; the stable aggregate check completes for every selected route.
#   Draft platform PR: lightweight compile/type gate only; development commits do not consume Full Gate capacity.
#   Ready platform PR: existing full route with backend-regression checkpoint reuse.
#   Merged-PR exact-candidate lanes are retired; only generic risk tiers remain (docs/ci-risk-tier-and-reuse.md).
#   Ready PR debug: synchronize continues to re-run Full Gate after a failed merge-gate attempt.
#   workflow_dispatch: one component probe; Full Gate requires explicit full_acceptance=true.
#   push main: short post-merge integrity smoke only; do not repeat the already-green Full Gate.
#   Pull-request review events do not rerun CI because review metadata does not change the tested head SHA.
#
# 编排：全部任务使用 GitHub 托管 Ubuntu，按场景并行执行。
#   Router:       changed-scope classification
#   Dependencies: backend build/performance, functional regression, frontend, CodeQL, Docker
#   Capacity:     hosted jobs release builds early and parallelize independent consumers
#   Browser:      consumes exact-run artifacts without waiting for unrelated frontend checks
#   Merge gate:   exact success for every selected route and acceptance
#
# jobs：
#   backend       : npm ci + prisma generate + guarded migrate deploy + seed + build + 200-completion SLA
#   backend-regression: independent DB + full regression except the separately gated performance SLA file
#   frontend-build: early production/UI-lab artifacts; frontend: lint/types/audit/full regression
#   browser       : isolated PostgreSQL/Redis + seeded Bundle + real Playwright acceptance flow
#   docker        : baseline + monitoring compose config + backend/frontend production image build
#   merge-gate    : fail-closed aggregate; only exact success for every Full Gate dependency passes
#
# 说明：
#   - Vite build 不作为 TypeScript typecheck 的替代品（v1.1 §11）。
#   - frontend typecheck 同时覆盖应用与 Cognitive 模块；全仓 tsc -b 的预存类型错误登记为独立清理项，
#     不扩大本里程碑范围。
#   - 两个 backend jobs 各有独立 CI Postgres service；集成测试不以跳过代替通过。
#   - backend/frontend builds use exact GITHUB_SHA artifacts from this run; missing artifacts fail closed.
#   - Browser consumers verify source/run/lockfile/content provenance; UI-lab has a separate artifact.
#   - merge-gate 使用 needs + always()；failure/cancelled/skipped/missing 均不得被解释为 merge-ready。

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'refactor/unified-runtime-v32-unit'
      - 'content/cognitive-expansion'
  workflow_dispatch:
    inputs:
      runner_profile:
        type: choice
        options: [hosted]
        default: hosted
        description: 'Use GitHub-hosted Ubuntu for every CI job'
      step_probe:
        type: choice
        options: [none, images, cognitive, frontend, backend, backend-regression, assessment-repair, reporting, browser, media, ui, ui-chromium, qa-ui, ops, maintenance, perf]
        default: none
        description: 'Run one CI component without full CI or CodeQL'
      probe_frontend_only:
        type: boolean
        default: false
        description: 'Image probe: frontend only; false builds backend/worker/frontend'
      full_acceptance:
        type: boolean
        default: false
        description: 'Explicitly opt into whole-platform CI; otherwise choose a step_probe'


permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.step_probe || 'none' }}-${{ inputs.step_probe == 'images' && inputs.probe_frontend_only && 'frontend' || 'all' }}
  cancel-in-progress: true

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  probe-frontend-build:
    if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["frontend","browser","media","ui","ui-chromium","qa-ui"]'), inputs.step_probe) }}
    uses: ./.github/workflows/ci-frontend-build.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      ui_lab: ${{ contains(fromJSON('["ui","ui-chromium"]'), inputs.step_probe) }}
      ui_runner_labels: '["ubuntu-24.04"]'

  probe-browser-build:
    if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["browser","media"]'), inputs.step_probe) }}
    uses: ./.github/workflows/ci-backend-browser-build.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  probe-backend:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.step_probe == 'backend' }}
    uses: ./.github/workflows/ci-backend.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  probe-backend-regression:
    if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["backend-regression","assessment-repair","reporting"]'), inputs.step_probe) }}
    uses: ./.github/workflows/ci-backend-regression.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      focus: ${{ inputs.step_probe == 'reporting' && 'reporting' || (inputs.step_probe == 'assessment-repair' && 'assessment-repair' || 'full') }}

  probe-browser:
    needs: [probe-frontend-build, probe-browser-build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.step_probe == 'browser' }}
    uses: ./.github/workflows/ci-browser.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  probe-media:
    needs: [probe-frontend-build, probe-browser-build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.step_probe == 'media' }}
    uses: ./.github/workflows/ci-media.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      selected: '["media2","video_core","media7","situational_video","situational_branching"]'
      groups: '["images-video","cognitive-situational"]'

  probe-ui-mac:
    needs: probe-frontend-build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.step_probe == 'ui' }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    uses: ./.github/workflows/ci-ui.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      engine: ${{ matrix.engine }}
      canonical: true
      app_shell: ${{ matrix.engine == 'chromium' }}
      qa_round3: ${{ matrix.engine == 'chromium' }}

  probe-qa-ui:
    needs: probe-frontend-build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.step_probe == 'qa-ui' }}
    uses: ./.github/workflows/ci-ui.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      canonical: false
      app_shell: true
      qa_round3: true

  probe-ui-hosted:
    needs: probe-frontend-build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.step_probe == 'ui-chromium' }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium]
    uses: ./.github/workflows/ci-ui.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      engine: ${{ matrix.engine }}
      canonical: true
      app_shell: true
      qa_round3: true

  probe-maintenance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.step_probe == 'maintenance' }}
    uses: ./.github/workflows/ci-maintenance.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  probe-ops:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.step_probe == 'ops' }}
    uses: ./.github/workflows/ops-prelaunch.yml

  probe-perf:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.step_probe == 'perf' }}
    uses: ./.github/workflows/perf-phase0-smoke.yml

  probe-images:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.step_probe == 'images' }}
    uses: ./.github/workflows/ci-images.yml
    with:
      frontend_only: ${{ inputs.probe_frontend_only }}

  probe-cognitive:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.step_probe == 'cognitive' }}
    # Inline the unchanged diagnostic job to keep reusable references at GitHub's limit.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      COGNITIVE_MODULE_ENABLED: 'true'
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      TZ: UTC
      DATABASE_URL: postgresql://ci_guard:ci_guard_pw@127.0.0.1:5432/eduk12_content_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity
        run: node .github/scripts/runner-preflight.mjs
      - name: prepare native dependencies
        run: bash server-version/scripts/ci-install-canvas-deps.sh
      - name: install backend dependencies
        working-directory: server-version/backend
        run: npm ci
      - name: generate Prisma client without database access
        working-directory: server-version/backend
        run: npx prisma generate
      - name: run the exact shared Cognitive CI step
        run: bash .github/scripts/cognitive-ci-diagnostics.sh

  probe-frontend:
    needs: probe-frontend-build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.step_probe == 'frontend' }}
    uses: ./.github/workflows/ci-frontend.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  scope:
    name: classify changed content
    if: ${{ (inputs.step_probe == '' || inputs.step_probe == 'none') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      runner_profile: ${{ steps.scope.outputs.runner_profile }}
      regression_runner: ${{ steps.scope.outputs.regression_runner }}
      browser_runner: ${{ steps.scope.outputs.browser_runner }}
      media_runner: ${{ steps.scope.outputs.media_runner }}
      visual_hosted: ${{ steps.scope.outputs.visual_hosted }}
      frontend_build: ${{ steps.scope.outputs.frontend_build }}
      ui_required: ${{ steps.scope.outputs.ui_required }}
      media_selection: ${{ steps.scope.outputs.media_selection }}
      media_groups: ${{ steps.scope.outputs.media_groups }}
      maintenance: ${{ steps.scope.outputs.maintenance }}
      scenario: ${{ steps.scope.outputs.scenario }}
      bundle_family: ${{ steps.scope.outputs.bundle_family }}
      bundle_runtime: ${{ steps.scope.outputs.bundle_runtime }}
      student_discovery: ${{ steps.scope.outputs.student_discovery }}
      authoring_polish: ${{ steps.scope.outputs.authoring_polish }}
      diff_base: ${{ steps.scope.outputs.diff_base }}
      application_route: ${{ steps.scope.outputs.application_route }}
      release_plan: ${{ steps.scope.outputs.release_plan }}
      homepage_copy_plan: ${{ steps.scope.outputs.homepage_copy_plan }}
      frontend: ${{ steps.scope.outputs.frontend }}
      frontend_test: ${{ steps.scope.outputs.frontend_test }}
      frontend_retest: ${{ steps.scope.outputs.frontend_retest }}
      frontend_retest_file: ${{ steps.scope.outputs.frontend_retest_file }}
      frontend_retest_case: ${{ steps.scope.outputs.frontend_retest_case }}
      frontend_retest_source_run: ${{ steps.scope.outputs.frontend_retest_source_run }}
      frontend_retest_source_sha: ${{ steps.scope.outputs.frontend_retest_source_sha }}
      frontend_retest_gate_digest: ${{ steps.scope.outputs.frontend_retest_gate_digest }}
      frontend_retest_report_digest: ${{ steps.scope.outputs.frontend_retest_report_digest }}
      image_build: ${{ steps.scope.outputs.image_build }}
      dependencies_frontend_only: ${{ steps.scope.outputs.dependencies_frontend_only }}
      frontend_affected: ${{ steps.scope.outputs.frontend_affected }}
      backend_focus: ${{ steps.scope.outputs.backend_focus }}
      documentation: ${{ steps.scope.outputs.documentation }}
      codeql: ${{ steps.scope.outputs.codeql }}
      heavy_runner: ${{ steps.scope.outputs.heavy_runner }}
      light_runner: ${{ steps.scope.outputs.light_runner }}
      codeql_runner: ${{ steps.scope.outputs.codeql_runner }}
      frontend_runner: ${{ steps.scope.outputs.frontend_runner }}
      docker_runner: ${{ steps.scope.outputs.docker_runner }}
      media2: ${{ steps.scope.outputs.media2 }}
      media7: ${{ steps.scope.outputs.media7 }}
      situational_video: ${{ steps.scope.outputs.situational_video }}
      situational_branching: ${{ steps.scope.outputs.situational_branching }}
      video_core: ${{ steps.scope.outputs.video_core }}
      app_shell: ${{ steps.scope.outputs.app_shell }}
      canonical_visual: ${{ steps.scope.outputs.canonical_visual }}
      perf_smoke: ${{ steps.scope.outputs.perf_smoke }}
      ops: ${{ steps.scope.outputs.ops }}
      content: ${{ steps.scope.outputs.content }}
      presentation: ${{ steps.scope.outputs.presentation }}
      scale: ${{ steps.scope.outputs.scale }}
      scale_intake_light: ${{ steps.scope.outputs.scale_intake_light }}
      cognitive_intake_light: ${{ steps.scope.outputs.cognitive_intake_light }}
      cognitive_intake_plan: ${{ steps.scope.outputs.cognitive_intake_plan }}
      cognitive_product_plan: ${{ steps.scope.outputs.cognitive_product_plan }}
      cognitive: ${{ steps.scope.outputs.cognitive }}
      situational: ${{ steps.scope.outputs.situational }}
      bundle: ${{ steps.scope.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify bounded risk-tier routing and historical evidence refusal
        run: node --test .github/scripts/ci-qualification.test.mjs .github/scripts/ci-backend-regression-reuse.test.mjs .github/scripts/ci-legacy-retirement.test.mjs .github/scripts/ci-frontend-retest.test.mjs
      - name: fetch the exact diff base without full history
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node .github/scripts/runner-preflight.mjs --control
          node .github/scripts/fetch-ci-base.mjs
      - id: documentation-scope
        name: select dependency-free documentation or tooling classification
        env:
          CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT: ${{ github.event_name }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {changedEntries,classifyChanges,ciToolingScenario} from './.github/scripts/content-scope.mjs';
          import {catalogDiffBase,catalogDiscoveryScope} from './.github/scripts/catalog-discovery-scope.mjs';
          import {execFileSync} from 'node:child_process';
          import {toolingOnly} from './server-version/scripts/release/policy.mjs';
          const checkout=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const actualBase=catalogDiffBase(process.env.CI_BASE_SHA,checkout,changedEntries);
          const entries=process.env.CI_EVENT==='workflow_dispatch'?[]:changedEntries(actualBase);
          const docs=classifyChanges(entries,process.env.CI_FORCE_FULL==='true').documentation;
          const lightweight=process.env.CI_FORCE_FULL!=='true' && (catalogDiscoveryScope(entries)||docs||toolingOnly(entries)||ciToolingScenario(entries));
          appendFileSync(process.env.GITHUB_OUTPUT,`documentation=${docs}\nlightweight=${lightweight}\n`);
          JS
      - name: install pinned release classification tools
        if: steps.documentation-scope.outputs.lightweight != 'true'
        run: |
          npm ci --ignore-scripts --prefix .github/release-tools
          mkdir -p server-version/backend/node_modules
          test -e server-version/backend/node_modules/typescript || ln -s "$PWD/.github/release-tools/node_modules/typescript" server-version/backend/node_modules/typescript
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_IS_DRAFT: ${{ github.event.pull_request.draft }}
          CI_RUNNER_PROFILE: hosted
          CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_EVENT: ${{ github.event_name }}
          CI_FULL_ACCEPTANCE: ${{ inputs.full_acceptance }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/content-scope.mjs
      - name: run changed CI contract tests once
        if: steps.scope.outputs.scenario == 'ci-unit'
        env:
          CI_BASE_SHA: ${{ steps.scope.outputs.diff_base }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {changedEntries,ciToolingScenario} from './.github/scripts/content-scope.mjs';
          const entries=changedEntries(process.env.CI_BASE_SHA);
          if(ciToolingScenario(entries)!=='ci-unit')throw Error('Changed CI test files must match the full diff');
          // Qualification suites above already ran once in this job.
          const done=new Set(['ci-qualification.test.mjs','ci-backend-regression-reuse.test.mjs','ci-legacy-retirement.test.mjs']);
          const changed=entries.map(entry=>entry.file).filter(file=>!done.has(file.split('/').at(-1)));
          if(changed.length){
            const result=spawnSync(process.execPath,['--test',...changed],{stdio:'inherit'});
            if(result.error)throw result.error;
            if(result.status!==0)throw Error('CI contract tests failed: '+result.status);
          }
          JS
      - name: bounded backend API route and actual job selection contracts
        if: steps.scope.outputs.backend_focus == 'form-intake'
        run: node --test .github/scripts/backend-api-scope.test.mjs
      - name: bounded authoring recipe routing
        if: steps.scope.outputs.authoring_polish == 'true'
        run: node --test .github/scripts/scale-authoring-polish-scope.test.mjs .github/scripts/catalog-discovery-scope.test.mjs .github/scripts/student-discovery-scope.test.mjs
      - name: legacy routing contracts only for the legacy route
        if: steps.scope.outputs.application_route == 'legacy' && steps.scope.outputs.authoring_polish != 'true' && steps.scope.outputs.bundle_runtime != 'true' && steps.scope.outputs.scenario != 'release-tooling' && steps.scope.outputs.scenario != 'documentation' && steps.scope.outputs.scenario != 'maintenance'
        run: node --test .github/scripts/runner-preflight.test.mjs .github/scripts/content-scope.test.mjs .github/scripts/browser-asset-filter.test.mjs .github/scripts/ci-timing-report.test.mjs .github/scripts/ci-browser-plan.test.mjs .github/scripts/api-response.test.mjs .github/scripts/mac-ci-cleanup.test.mjs .github/scripts/content-workflows.test.mjs .github/scripts/ci-image-plan.test.mjs .github/scripts/ci-topology.test.mjs .github/scripts/maintenance-routing.test.mjs .github/scripts/dependency-routing.test.mjs
      - name: affected maintenance routing and merge contracts
        if: steps.scope.outputs.scenario == 'maintenance' && github.event_name == 'pull_request'
        run: node --test .github/scripts/content-scope.test.mjs .github/scripts/content-workflows.test.mjs .github/scripts/ci-topology.test.mjs .github/scripts/maintenance-routing.test.mjs
      - name: homepage copy boundary and affected routing contracts
        if: steps.scope.outputs.application_route == 'homepage-copy' && github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ fromJSON(steps.scope.outputs.homepage_copy_plan || '{}').base }}
        run: node --test .github/scripts/homepage-copy.test.mjs .github/scripts/content-workflows.test.mjs
      - name: validate bounded Bundle runtime routing
        if: steps.scope.outputs.bundle_runtime == 'true'
        run: node --test .github/scripts/bundle-runtime-scope.test.mjs

  edge-config:
    name: edge / nginx configuration and proxy routing
    needs: scope
    if: ${{ github.event_name == 'pull_request' && needs.scope.outputs.application_route == 'edge-config' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Check bounded configuration routing
        run: node --test .github/scripts/edge-config.test.mjs
      - name: Parse candidate and exercise both upstream routes
        run: bash .github/scripts/edge-config-smoke.sh

  maintenance:
    needs: scope
    if: ${{ needs.scope.outputs.scenario != 'catalog-discovery' && (needs.scope.outputs.scenario != 'backend' && (needs.scope.outputs.dependencies_frontend_only != 'true' && (((needs.scope.outputs.maintenance == 'true' || needs.scope.outputs.scenario == 'platform' || needs.scope.outputs.scenario == 'dependencies') && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling')))) }}
    uses: ./.github/workflows/ci-maintenance.yml
    with:
      runner_labels: '["ubuntu-24.04"]'

  documentation:
    name: documentation / whitespace and scope validation
    needs: scope
    if: ${{ (needs.scope.outputs.documentation == 'true' && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: validate the exact documentation diff
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HUI_EVIDENCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          HUI_LOCAL_VALIDATION_PUBLIC_KEY: ${{ vars.HUI_LOCAL_VALIDATION_PUBLIC_KEY }}
          HUI_LOCAL_VALIDATION_EVIDENCE: ${{ vars.HUI_LOCAL_VALIDATION_EVIDENCE }}
        run: |
          node .github/scripts/fetch-ci-base.mjs
          node .github/scripts/local-validation.mjs ci documentation

  cognitive-product:
    name: Cognitive product / compile and registration
    needs: scope
    if: ${{ needs.scope.outputs.application_route == 'cognitive-product' && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_REPLACE_REGISTRY_HOST: always
      COGNITIVE_PRODUCT_PLAN: ${{ needs.scope.outputs.cognitive_product_plan }}
      COGNITIVE_MODULE_ENABLED: 'true'
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      BACKGROUND_WORKERS_ENABLED: 'false'
      TZ: UTC
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:cognitive-ci-fixture-only@127.0.0.1:5432/cognitive_product_ci_test
      COGNITIVE_INSTALL_TEST_DATABASE_URL: postgresql://postgres:cognitive-ci-fixture-only@127.0.0.1:5432/cognitive_product_ci_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: synthetic-cognitive-ci-session-only
      CORS_ORIGIN: http://localhost:5174
      ADMIN_WEBAUTHN_ORIGIN: http://localhost:5174
      ADMIN_WEBAUTHN_RP_ID: localhost
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cognitive-ci-fixture-only
          POSTGRES_DB: cognitive_product_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cognitive_product_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.11-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            server-version/backend/package-lock.json
            server-version/frontend/package-lock.json
      - name: directed route and missing-check contract tests
        run: node --test .github/scripts/cognitive-product.test.mjs
      - name: install locked compiler and declaration dependencies without application hooks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix server-version/backend
          npm ci --ignore-scripts --no-audit --no-fund --prefix server-version/frontend
      - name: prepare the isolated empty database for real intake HTTP
        working-directory: server-version/backend
        run: |
