          CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_EVENT: ${{ github.event_name }}
          CI_FULL_ACCEPTANCE: ${{ inputs.full_acceptance }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/content-scope.mjs
      - name: Survey Mac exact scope, refusal and aggregate contracts
        if: steps.scope.outputs.application_route == 'survey-mac-ui' && github.event_name == 'pull_request'
        run: |
          node --test .github/scripts/survey-mac-ui-scope.test.mjs .github/scripts/content-scope.test.mjs .github/scripts/content-workflows.test.mjs .github/scripts/ci-topology.test.mjs .github/scripts/maintenance-routing.test.mjs .github/scripts/dependency-routing.test.mjs
          python3 -B .github/scripts/survey-mac-ui-candidate.test.py
      - name: Authenticator route, strict evidence and no-skip aggregate contracts
        if: steps.scope.outputs.application_route == 'admin-authenticator' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
        run: node --test .github/scripts/admin-authenticator.test.mjs

      - name: frozen Training workspace routing and strict merge contracts
        if: steps.scope.outputs.application_route == 'training-workspace' && github.event_name == 'pull_request'
        run: |
          node --test .github/scripts/training-workspace-scope.test.mjs
          if [ -f .github/scripts/training-student-bindings.json ]; then node --test .github/scripts/training-student.test.mjs; fi
          if [ -f .github/scripts/training-followup-bindings.json ]; then node --test .github/scripts/training-followup-scope.test.mjs; fi
      - name: legacy routing contracts only for the legacy route
        if: steps.scope.outputs.application_route == 'legacy' && steps.scope.outputs.scenario != 'frontend-performance' && steps.scope.outputs.scenario != 'release-tooling' && steps.scope.outputs.scenario != 'documentation' && steps.scope.outputs.scenario != 'maintenance'
        run: node --test .github/scripts/admin-permissions-functional.test.mjs .github/scripts/training-functional.test.mjs .github/scripts/training-functional-report.test.mjs .github/scripts/runner-preflight.test.mjs .github/scripts/content-scope.test.mjs .github/scripts/browser-asset-filter.test.mjs .github/scripts/ci-timing-report.test.mjs .github/scripts/ci-browser-plan.test.mjs .github/scripts/api-response.test.mjs .github/scripts/mac-ci-cleanup.test.mjs .github/scripts/content-workflows.test.mjs .github/scripts/ci-image-plan.test.mjs .github/scripts/ci-topology.test.mjs .github/scripts/maintenance-routing.test.mjs .github/scripts/dependency-routing.test.mjs

      - name: frontend startup and paging scope and fail-closed contracts
        if: steps.scope.outputs.scenario == 'frontend-performance' && github.event_name == 'pull_request'
        run: node --test .github/scripts/frontend-performance.test.mjs

      - name: affected maintenance routing and merge contracts
        if: steps.scope.outputs.scenario == 'maintenance' && github.event_name == 'pull_request'
        run: node --test .github/scripts/content-scope.test.mjs .github/scripts/content-workflows.test.mjs .github/scripts/ci-topology.test.mjs .github/scripts/maintenance-routing.test.mjs

      - name: homepage copy boundary and affected routing contracts
        if: steps.scope.outputs.application_route == 'homepage-copy' && github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ fromJSON(steps.scope.outputs.homepage_copy_plan || '{}').base }}
        run: node --test .github/scripts/homepage-copy.test.mjs .github/scripts/campus-scope.test.mjs .github/scripts/content-scope.test.mjs .github/scripts/maintenance-routing.test.mjs .github/scripts/dependency-routing.test.mjs .github/scripts/content-workflows.test.mjs .github/scripts/ci-topology.test.mjs

      - name: frozen assessment durability, routing and reuse refusal contracts
        if: steps.scope.outputs.application_route == 'assessment-capacity' && github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --test .github/scripts/assessment-capacity-scope.test.mjs
          python3 -B -m unittest discover -s .github/scripts -p test_assessment_capacity_reuse.py

      - name: frozen efficiency routing, prerequisite refusal and homepage preservation
        if: steps.scope.outputs.application_route == 'access-efficiency' && github.event_name == 'pull_request'
        run: |
          node --test .github/scripts/access-efficiency-scope.test.mjs .github/scripts/github-official-source.test.mjs .github/scripts/ci-image-plan.test.mjs .github/scripts/dependency-routing.test.mjs .github/scripts/survey-home.test.mjs .github/scripts/teacher-home.test.mjs
          python3 -B -m unittest discover -s .github/scripts -p test_access_efficiency_reuse.py

      - name: frozen governance routing, isolation and strict evidence contracts
        if: steps.scope.outputs.application_route == 'scale-library-governance' && github.event_name == 'pull_request'
        run: node --test .github/scripts/scale-library-governance-scope.test.mjs
      - name: frozen CSV memory routing and strict aggregate contracts
        if: steps.scope.outputs.application_route == 'composite-csv-memory' && github.event_name == 'pull_request'
        run: node --test .github/scripts/composite-csv-memory-scope.test.mjs
      - name: bounded Survey Wave selection routing and no-skip gate contracts
        if: steps.scope.outputs.scenario == 'survey-wave-selection' && github.event_name == 'pull_request'
        run: |
          node --test .github/scripts/survey-wave-selection.test.mjs
          python3 -B .github/scripts/survey-wave-selection-reuse.test.py
      - name: reviewed candidate boundary, refusal and stable merge contracts
        if: steps.scope.outputs.application_route == 'reviewed-candidate' && github.event_name == 'pull_request'
        run: |
          node --test .github/scripts/reviewed-candidate-scope.test.mjs
          python3 -B .github/scripts/reviewed-candidate-admission.test.py

      - name: frozen Survey scope and fail-closed merge contracts
        if: steps.scope.outputs.application_route == 'survey-candidate' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SURVEY_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B .github/scripts/survey-candidate-reuse.py --scope-receipt
          python3 -B .github/scripts/survey-candidate-reuse.test.py

      - name: frozen shared asset scope and fail-closed merge contracts
        if: steps.scope.outputs.application_route == 'shared-asset-storage' && github.event_name == 'pull_request'
        run: node --test .github/scripts/shared-asset-storage-scope.test.mjs

      - name: frozen backend repair routing and fail-closed merge contracts
        if: steps.scope.outputs.application_route == 'backend-security-efficiency' && github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node --test .github/scripts/backend-security-efficiency-scope.test.mjs .github/scripts/survey-home.test.mjs .github/scripts/teacher-home.test.mjs

      - name: Teacher exact patch routing and fail-closed merge contracts
        if: steps.scope.outputs.application_route == 'teacher-home' && github.event_name == 'pull_request'
        run: node --test .github/scripts/teacher-home.test.mjs

      - name: Survey exact patch routing and fail-closed merge contracts
        if: steps.scope.outputs.application_route == 'survey-home' && github.event_name == 'pull_request'
        run: node --test .github/scripts/survey-home.test.mjs

      - name: campus routing and fail-closed merge contracts
        if: steps.scope.outputs.application_route == 'campus' && github.event_name == 'pull_request'
        run: |
          node --test .github/scripts/campus-scope.test.mjs
          python3 -B -m unittest discover -s .github/scripts -p test_campus_reuse.py

      - name: exact scale authoring admission and routing control contracts
        if: steps.scope.outputs.application_route == 'exact-candidate' && fromJSON(steps.scope.outputs.exact_candidate_plan || '{}').candidate == 'scale-authoring' && github.event_name == 'pull_request'
        run: |
          node --test .github/scripts/exact-candidate.test.mjs
          python3 -B .github/scripts/scale-authoring-admission.test.py

  maintenance:
    needs: scope
    if: ${{ (needs.scope.outputs.maintenance == 'true' || needs.scope.outputs.scenario == 'platform' || needs.scope.outputs.scenario == 'dependencies') && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling' }}
    uses: ./.github/workflows/ci-maintenance.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      merge_proof: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 292 && needs.scope.outputs.scenario == 'maintenance' }}

  documentation:
    name: documentation / whitespace and scope validation
    needs: scope
    if: ${{ needs.scope.outputs.documentation == 'true' && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: validate the exact documentation diff
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HUI_EVIDENCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          HUI_LOCAL_VALIDATION_PUBLIC_KEY: ${{ vars.HUI_LOCAL_VALIDATION_PUBLIC_KEY }}
          HUI_LOCAL_VALIDATION_EVIDENCE: ${{ vars.HUI_LOCAL_VALIDATION_EVIDENCE }}
        run: |
          node .github/scripts/fetch-ci-base.mjs
          node .github/scripts/local-validation.mjs ci documentation

  content:
    name: assessment content
    needs: scope
    if: ${{ needs.scope.outputs.content == 'true' && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling' }}
    uses: ./.github/workflows/scale-onboarding-boundary.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      runner_profile: hosted
      scale: ${{ needs.scope.outputs.scale == 'true' }}
      cognitive: ${{ needs.scope.outputs.cognitive == 'true' }}
      situational: ${{ needs.scope.outputs.situational == 'true' }}
      bundle: ${{ needs.scope.outputs.bundle == 'true' }}
      base: ${{ github.event.pull_request.base.sha || github.event.before }}

  visual:
    needs: scope
    name: presentation / frontend lint + typecheck + build
    if: ${{ needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.presentation == 'true' && github.event_name == 'pull_request' && vars.CI_FORCE_FULL != 'true' && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=3072
      TZ: UTC
    defaults:
      run:
        working-directory: server-version/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs" --frontend
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: production build
        run: npm run build
      - name: bound dedicated Mac CI caches and remove job dependencies
        if: ${{ always() && runner.os == 'macOS' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/mac-ci-cleanup.mjs"

  pr-light-backend:
    needs: scope
    name: PR light / backend compile
    if: ${{ needs.scope.outputs.scenario != 'frontend-test' && needs.scope.outputs.scenario != 'survey-wave-selection' && (needs.scope.outputs.scenario != 'dependencies' && (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == true && vars.CI_FORCE_FULL != 'true')) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: server-version/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs"
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: prepare canvas source-build dependencies
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-install-canvas-deps.sh"
      - name: npm ci
        run: npm ci
      - name: content routing boundary tests
        run: node --test ../../.github/scripts/cognitive-content.test.mjs ../../.github/scripts/content-workflows.test.mjs
      - name: prisma generate
        run: npx prisma generate
      - name: situational data-only manifests and publication gates
        run: npm run situational:contracts
      - name: verify SJT immutable releases and publication authority
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$PUBLICATION_BASE_SHA"
          npm run situational:onboarding-check -- --all --verify-reviews --base "$PUBLICATION_BASE_SHA"
      - name: cognitive task manifests and dependency boundaries
        run: npm run cognitive:contracts
      - name: Bundle content and immutable history
        env:
          BUNDLE_CONTENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npx tsx scripts/bundle-content-check.ts
      - name: build (tsc)
        run: npm run build
      - name: Mini identity and parent authorization unit contracts
        run: >-
          npx vitest run src/__tests__/parent-portal
          src/__tests__/mobile/discovery.test.ts
          src/__tests__/assessment-identity/episode-parent-invite.test.ts
          src/__tests__/middleware/auth.test.ts
          src/__tests__/middleware/csrf.test.ts
          src/__tests__/utils/authCookies.test.ts
          src/__tests__/controllers/authLibrary.test.ts

  pr-light-frontend:
    needs: scope
    name: PR light / frontend lint + typecheck
    if: ${{ needs.scope.outputs.scenario != 'frontend-test' && needs.scope.outputs.scenario != 'survey-wave-selection' && needs.scope.outputs.scenario != 'frontend-performance' && (needs.scope.outputs.scenario != 'dependencies' && (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft == true && vars.CI_FORCE_FULL != 'true' && (needs.scope.outputs.frontend == 'true' || (needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false')) && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || vars.CI_FORCE_FULL == 'true'))) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=3072
      TZ: UTC
    defaults:
      run:
        working-directory: server-version/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs" --frontend
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: bound dedicated Mac CI caches and remove job dependencies
        if: ${{ always() && runner.os == 'macOS' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/mac-ci-cleanup.mjs"

  post-merge-smoke:
    needs: scope
    name: main / post-merge compile smoke
    if: ${{ needs.scope.outputs.scenario != 'frontend-test' && needs.scope.outputs.scenario != 'survey-wave-selection' && needs.scope.outputs.scenario != 'frontend-performance' && (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.presentation != 'true' && github.event_name == 'push' && vars.CI_FORCE_FULL != 'true') && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs"
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: prepare canvas source-build dependencies
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-install-canvas-deps.sh"
      - name: backend npm ci
        working-directory: server-version/backend
        run: npm ci
      - name: backend prisma generate
        working-directory: server-version/backend
        run: npx prisma generate
      - name: Bundle content and immutable history
        working-directory: server-version/backend
        env:
          BUNDLE_CONTENT_BASE_SHA: ${{ github.event.before }}
        run: npx tsx scripts/bundle-content-check.ts
      - name: backend compile smoke
        working-directory: server-version/backend
        run: npm run build
      - name: frontend npm ci
        working-directory: server-version/frontend
        run: npm ci
      - name: frontend typecheck smoke
        working-directory: server-version/frontend
        run: npm run typecheck
      - name: frontend production build smoke
        working-directory: server-version/frontend
        run: npm run build

  backend:
    needs: scope
    name: ${{ (needs.scope.outputs.training_functional_only == 'true' || needs.scope.outputs.admin_permissions_functional_only == 'true') && 'backend (migrate + build + functional gate; performance not executed)' || 'backend (migrate + build + performance gate)' }}
    if: ${{ needs.scope.outputs.scenario != 'frontend-test' && needs.scope.outputs.scenario != 'survey-wave-selection' && (!cancelled() && ((needs.scope.outputs.scenario == 'dependencies' && github.event_name == 'pull_request') || (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))))) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling' }}
    uses: ./.github/workflows/ci-backend.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      run_performance_tests: ${{ needs.scope.outputs.run_performance_tests != 'false' }}
      admin_permissions_functional: ${{ needs.scope.outputs.admin_permissions_functional_only == 'true' }}
      training_followup_functional: ${{ needs.scope.outputs.training_functional_only == 'true' && fromJSON(needs.scope.outputs.training_functional_plan).mode == 'training-followup-functional-only' }}

  backend-regression:
    needs: scope
    name: backend regression (isolated job database)
    if: ${{ needs.scope.outputs.scenario != 'frontend-test' && (!cancelled() && ((needs.scope.outputs.scenario == 'dependencies' && github.event_name == 'pull_request') || (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))))) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling' }}
    uses: ./.github/workflows/ci-backend-regression.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      focus: ${{ needs.scope.outputs.scenario == 'survey-wave-selection' && 'survey-wave-selection' || 'full' }}

  frontend-build:
    name: frontend artifacts / release consumers early
    needs: scope
    if: ${{ !cancelled() && ((needs.scope.outputs.scenario == 'dependencies' && github.event_name == 'pull_request') || (needs.scope.outputs.frontend_build == 'true' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)))) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling' }}
    uses: ./.github/workflows/ci-frontend-build.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      performance_smoke: ${{ needs.scope.outputs.scenario == 'frontend-performance' }}
      ui_lab: ${{ needs.scope.outputs.canonical_visual == 'true' }}
      ui_runner_labels: '["ubuntu-24.04"]'

  frontend:
    # Frontend lint/types/audit/tests consume source, not the production artifact.
    # Run independently; the aggregate still requires both successful jobs.
    needs: scope
    name: frontend (lint + types + full tests + build)
    if: ${{ !cancelled() && ((needs.scope.outputs.scenario == 'frontend-test' && github.event_name == 'pull_request') || (needs.scope.outputs.scenario == 'dependencies' && github.event_name == 'pull_request') || (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && (needs.scope.outputs.frontend == 'true' || (needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false')) && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)))) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling' }}
    uses: ./.github/workflows/ci-frontend.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      survey_selection: ${{ needs.scope.outputs.scenario == 'survey-wave-selection' }}

  browser:
    name: browser (seeded Situational Bundle + static visual acceptance)
    # Browser acceptance executes after both production lanes have passed.
    needs: [scope, backend, backend-browser-build, frontend-build]
    if: ${{ needs.scope.outputs.scenario != 'survey-wave-selection' && needs.scope.outputs.scenario != 'frontend-performance' && needs.scope.outputs.scenario != 'dependencies' && (!cancelled() && needs.scope.result == 'success' && needs.frontend-build.result == 'success' && ((needs.scope.outputs.frontend == 'true' && needs.backend-browser-build.result == 'success') || (needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false' && needs.backend.result == 'success')) && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling' }}
    uses: ./.github/workflows/ci-browser.yml
    with:
      admin_permissions_functional: ${{ needs.scope.outputs.admin_permissions_functional_only == 'true' }}
      training_followup_functional: ${{ needs.scope.outputs.training_functional_only == 'true' && fromJSON(needs.scope.outputs.training_functional_plan).mode == 'training-followup-functional-only' }}
      runner_labels: '["ubuntu-24.04"]'

  docker:
    name: docker (compose config + production builds)
    # This job builds images from source and does not consume backend build
    # artifacts. Start it with scope; the merge gate independently requires
    # backend, production image scans and all other selected checks.
    needs: scope
