        run: node --test .github/scripts/admin-permissions-functional.test.mjs .github/scripts/training-functional.test.mjs .github/scripts/training-functional-report.test.mjs .github/scripts/runner-preflight.test.mjs .github/scripts/content-scope.test.mjs .github/scripts/browser-asset-filter.test.mjs .github/scripts/ci-timing-report.test.mjs .github/scripts/ci-browser-plan.test.mjs .github/scripts/api-response.test.mjs .github/scripts/mac-ci-cleanup.test.mjs .github/scripts/content-workflows.test.mjs .github/scripts/ci-image-plan.test.mjs .github/scripts/ci-topology.test.mjs .github/scripts/maintenance-routing.test.mjs .github/scripts/dependency-routing.test.mjs

      - name: frontend startup and paging scope and fail-closed contracts
        if: steps.scope.outputs.scenario == 'frontend-performance' && github.event_name == 'pull_request'
        run: node --test .github/scripts/frontend-performance.test.mjs

      - name: affected maintenance routing and merge contracts
        if: steps.scope.outputs.scenario == 'maintenance' && github.event_name == 'pull_request'
        run: node --test .github/scripts/content-scope.test.mjs .github/scripts/content-workflows.test.mjs .github/scripts/ci-topology.test.mjs .github/scripts/maintenance-routing.test.mjs

      - name: homepage copy boundary and affected routing contracts
        if: steps.scope.outputs.application_route == 'homepage-copy' && github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ fromJSON(steps.scope.outputs.homepage_copy_plan || '{}').base }}
        run: node --test .github/scripts/homepage-copy.test.mjs .github/scripts/campus-scope.test.mjs .github/scripts/content-scope.test.mjs .github/scripts/maintenance-routing.test.mjs .github/scripts/dependency-routing.test.mjs .github/scripts/content-workflows.test.mjs .github/scripts/ci-topology.test.mjs

      - name: frozen assessment durability, routing and reuse refusal contracts
        if: steps.scope.outputs.application_route == 'assessment-capacity' && github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --test .github/scripts/assessment-capacity-scope.test.mjs
          python3 -B -m unittest discover -s .github/scripts -p test_assessment_capacity_reuse.py

      - name: frozen efficiency routing, prerequisite refusal and homepage preservation
        if: steps.scope.outputs.application_route == 'access-efficiency' && github.event_name == 'pull_request'
        run: |
          node --test .github/scripts/access-efficiency-scope.test.mjs .github/scripts/github-official-source.test.mjs .github/scripts/ci-image-plan.test.mjs .github/scripts/dependency-routing.test.mjs .github/scripts/survey-home.test.mjs .github/scripts/teacher-home.test.mjs
          python3 -B -m unittest discover -s .github/scripts -p test_access_efficiency_reuse.py

      - name: frozen governance routing, isolation and strict evidence contracts
        if: steps.scope.outputs.application_route == 'scale-library-governance' && github.event_name == 'pull_request'
        run: node --test .github/scripts/scale-library-governance-scope.test.mjs
      - name: frozen CSV memory routing and strict aggregate contracts
        if: steps.scope.outputs.application_route == 'composite-csv-memory' && github.event_name == 'pull_request'
        run: node --test .github/scripts/composite-csv-memory-scope.test.mjs
      - name: bounded Survey Wave selection routing and no-skip gate contracts
        if: steps.scope.outputs.scenario == 'survey-wave-selection' && github.event_name == 'pull_request'
        run: |
          node --test .github/scripts/survey-wave-selection.test.mjs
          python3 -B .github/scripts/survey-wave-selection-reuse.test.py
      - name: reviewed candidate boundary, refusal and stable merge contracts
        if: steps.scope.outputs.application_route == 'reviewed-candidate' && github.event_name == 'pull_request'
        run: |
          node --test .github/scripts/reviewed-candidate-scope.test.mjs
          python3 -B .github/scripts/reviewed-candidate-admission.test.py

      - name: frozen Survey scope and fail-closed merge contracts
        if: steps.scope.outputs.application_route == 'survey-candidate' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SURVEY_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B .github/scripts/survey-candidate-reuse.py --scope-receipt
          python3 -B .github/scripts/survey-candidate-reuse.test.py

      - name: frozen shared asset scope and fail-closed merge contracts
        if: steps.scope.outputs.application_route == 'shared-asset-storage' && github.event_name == 'pull_request'
        run: node --test .github/scripts/shared-asset-storage-scope.test.mjs

      - name: frozen backend repair routing and fail-closed merge contracts
        if: steps.scope.outputs.application_route == 'backend-security-efficiency' && github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node --test .github/scripts/backend-security-efficiency-scope.test.mjs .github/scripts/survey-home.test.mjs .github/scripts/teacher-home.test.mjs

      - name: Teacher exact patch routing and fail-closed merge contracts
        if: steps.scope.outputs.application_route == 'teacher-home' && github.event_name == 'pull_request'
        run: node --test .github/scripts/teacher-home.test.mjs

      - name: Survey exact patch routing and fail-closed merge contracts
        if: steps.scope.outputs.application_route == 'survey-home' && github.event_name == 'pull_request'
        run: node --test .github/scripts/survey-home.test.mjs

      - name: campus routing and fail-closed merge contracts
        if: steps.scope.outputs.application_route == 'campus' && github.event_name == 'pull_request'
        run: |
          node --test .github/scripts/campus-scope.test.mjs
          python3 -B -m unittest discover -s .github/scripts -p test_campus_reuse.py

      - name: exact scale authoring admission and routing control contracts
        if: steps.scope.outputs.application_route == 'exact-candidate' && fromJSON(steps.scope.outputs.exact_candidate_plan || '{}').candidate == 'scale-authoring' && github.event_name == 'pull_request'
        run: |
          node --test .github/scripts/exact-candidate.test.mjs
          python3 -B .github/scripts/scale-authoring-admission.test.py

      - name: group report Draft boundary contracts
        if: steps.scope.outputs.application_route == 'group-report-draft'
        run: node --test .github/scripts/group-report-draft.test.mjs

  maintenance:
    needs: scope
    if: ${{ needs.scope.outputs.personal_tracking_draft != 'true' && needs.scope.outputs.application_route != 'survey-governance' && needs.scope.outputs.application_route != 'training-polish' && ((needs.scope.outputs.maintenance == 'true' || needs.scope.outputs.scenario == 'platform' || needs.scope.outputs.scenario == 'dependencies') && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling') }}
    uses: ./.github/workflows/ci-maintenance.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      merge_proof: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 292 && needs.scope.outputs.scenario == 'maintenance' }}

  documentation:
    name: documentation / whitespace and scope validation
    needs: scope
    if: ${{ needs.scope.outputs.application_route != 'survey-governance' && needs.scope.outputs.application_route != 'training-polish' && (needs.scope.outputs.documentation == 'true' && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: validate the exact documentation diff
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HUI_EVIDENCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          HUI_LOCAL_VALIDATION_PUBLIC_KEY: ${{ vars.HUI_LOCAL_VALIDATION_PUBLIC_KEY }}
          HUI_LOCAL_VALIDATION_EVIDENCE: ${{ vars.HUI_LOCAL_VALIDATION_EVIDENCE }}
        run: |
          node .github/scripts/fetch-ci-base.mjs
          node .github/scripts/local-validation.mjs ci documentation

  content:
    name: assessment content
    needs: scope
    if: ${{ needs.scope.outputs.application_route != 'survey-governance' && needs.scope.outputs.application_route != 'training-polish' && (needs.scope.outputs.content == 'true' && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling') }}
    uses: ./.github/workflows/scale-onboarding-boundary.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      runner_profile: hosted
      scale: ${{ needs.scope.outputs.scale == 'true' }}
      scale_intake_light: ${{ needs.scope.outputs.scale_intake_light == 'true' }}
      cognitive: ${{ needs.scope.outputs.cognitive == 'true' }}
      cognitive_intake_light: ${{ needs.scope.outputs.cognitive_intake_light == 'true' }}
      situational: ${{ needs.scope.outputs.situational == 'true' }}
      bundle: ${{ needs.scope.outputs.bundle == 'true' }}
      base: ${{ github.event.pull_request.base.sha || github.event.before }}

  visual:
    needs: scope
    name: presentation / frontend lint + typecheck + build
    if: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.number == 363 || github.event.pull_request.head.ref == 'perf/four-entry-feedback-20261027')) && (needs.scope.outputs.application_route != 'survey-governance' && needs.scope.outputs.application_route != 'training-polish' && (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.presentation == 'true' && github.event_name == 'pull_request' && vars.CI_FORCE_FULL != 'true' && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=3072
      TZ: UTC
    defaults:
      run:
        working-directory: server-version/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs" --frontend
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: production build
        run: npm run build
      - name: bound dedicated Mac CI caches and remove job dependencies
        if: ${{ always() && runner.os == 'macOS' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/mac-ci-cleanup.mjs"

  survey-review:
    name: Survey PR350 / bounded qualification
    needs: scope
    if: ${{ needs.scope.outputs.application_route != 'survey-governance' && needs.scope.outputs.application_route != 'training-polish' && (github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.scope.outputs.application_route == 'survey-review') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: survey_review_ci
        ports: ['55432:5432']
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      CI_EVENT: pull_request
      CI_HEAD_REF: work/survey-review-20261024
      CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      CI_PR_NUMBER: ${{ github.event.pull_request.number }}
      CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      PLAN: ${{ needs.scope.outputs.survey_review_plan }}
      DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:55432/survey_review_ci
      SURVEY_MEMORABLE_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:55432/survey_review_ci
      SURVEY_DIRECTORY_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:55432/survey_review_ci
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      TZ: UTC
      DATA_ENCRYPTION_KEY: '3434343434343434343434343434343434343434343434343434343434343434'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify PR350 scope, reviewed FINAL results and original successful CI stages
        id: survey-admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/survey-review-checks.mjs admission
      - name: execute new exact scope, evidence and merge refusal contracts
        run: node --test .github/scripts/survey-review.test.mjs
      - name: admit exact existing successful HIGH CRITICAL lock audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/participant-access-checks.mjs audit
      - name: install locked frontend tools
        working-directory: server-version/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: prepare locked backend declarations and test dependencies
        working-directory: server-version/backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: generate Prisma declarations without modifying running services
        id: survey-prisma
        working-directory: server-version/backend
        run: node node_modules/prisma/build/index.js generate
      - name: check current integrated frontend application types
        id: survey-types
        working-directory: server-version/frontend
        run: node node_modules/typescript/bin/tsc -p tsconfig.app.json --noEmit
      - name: lint only inputs changed since original successful full lint
        id: survey-lint
        run: node .github/scripts/survey-review-checks.mjs lint
      - name: execute named missing affected frontend assertions
        id: survey-frontend-tests
        run: node .github/scripts/survey-review-checks.mjs frontend
      - name: upgrade isolated main database and preserve existing anonymous identity
        id: survey-upgrade
        if: ${{ !cancelled() && steps.survey-admission.outcome == 'success' && steps.survey-prisma.outcome == 'success' }}
        run: node .github/scripts/survey-review-checks.mjs upgrade
      - name: execute affected authority, FINAL and native PostgreSQL linkage assertions
        id: survey-backend-tests
        if: ${{ !cancelled() && steps.survey-upgrade.outcome == 'success' }}
        run: node .github/scripts/survey-review-checks.mjs backend
      - name: prove restore preserves participant links, registry and immutable finals
        id: survey-restore
        if: ${{ !cancelled() && steps.survey-backend-tests.outcome == 'success' }}
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node .github/scripts/survey-review-checks.mjs restore
      - name: compile the frontend candidate once
        id: survey-build
        if: ${{ !cancelled() && steps.survey-types.outcome == 'success' && steps.survey-lint.outcome == 'success' && steps.survey-frontend-tests.outcome == 'success' }}
        working-directory: server-version/frontend
        run: node node_modules/vite/bin/vite.js build
      - name: retain exact qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survey-review-evidence-${{ github.sha }}
          path: |
            survey-review-evidence
            participant-access-evidence/official-audit-reuse.json
          if-no-files-found: error
          retention-days: 3
      - name: retain the single frontend artifact
        if: ${{ !cancelled() && steps.survey-build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: survey-review-frontend-${{ github.sha }}
          path: server-version/frontend/dist
          if-no-files-found: error
          retention-days: 3

  pr-light-backend:
    needs: scope
    name: PR light / backend compile
    if: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.number == 363 || github.event.pull_request.head.ref == 'perf/four-entry-feedback-20261027')) && (needs.scope.outputs.application_route != 'survey-governance' && needs.scope.outputs.application_route != 'training-polish' && (needs.scope.outputs.scenario != 'frontend-test' && needs.scope.outputs.scenario != 'survey-wave-selection' && (needs.scope.outputs.scenario != 'dependencies' && (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == true && vars.CI_FORCE_FULL != 'true')) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: server-version/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs"
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: prepare canvas source-build dependencies
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-install-canvas-deps.sh"
      - name: npm ci
        run: npm ci
      - name: content routing boundary tests
        if: needs.scope.outputs.personal_tracking_draft != 'true'
        run: node --test ../../.github/scripts/cognitive-content.test.mjs ../../.github/scripts/content-workflows.test.mjs
      - name: prisma generate
        run: npx prisma generate
      - name: situational data-only manifests and publication gates
        if: needs.scope.outputs.personal_tracking_draft != 'true'
        run: npm run situational:contracts
      - name: verify SJT immutable releases and publication authority
        if: github.event_name == 'pull_request' && needs.scope.outputs.personal_tracking_draft != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$PUBLICATION_BASE_SHA"
          npm run situational:onboarding-check -- --all --verify-reviews --base "$PUBLICATION_BASE_SHA"
      - name: cognitive task manifests and dependency boundaries
        if: needs.scope.outputs.personal_tracking_draft != 'true'
        run: npm run cognitive:contracts
      - name: Bundle content and immutable history
        if: needs.scope.outputs.personal_tracking_draft != 'true'
        env:
          BUNDLE_CONTENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npx tsx scripts/bundle-content-check.ts
      - name: build (tsc)
        run: |
          if [ "${{ needs.scope.outputs.personal_tracking_draft }}" = "true" ]; then
            npx tsc
          else
            npm run build
          fi
      - name: Mini identity and parent authorization unit contracts
        if: needs.scope.outputs.personal_tracking_draft != 'true'
        run: >-
          npx vitest run src/__tests__/parent-portal
          src/__tests__/mobile/discovery.test.ts
          src/__tests__/assessment-identity/episode-parent-invite.test.ts
          src/__tests__/middleware/auth.test.ts
          src/__tests__/middleware/csrf.test.ts
          src/__tests__/utils/authCookies.test.ts
          src/__tests__/controllers/authLibrary.test.ts

  pr-light-frontend:
    needs: scope
    name: PR light / frontend lint + typecheck
    if: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.number == 363 || github.event.pull_request.head.ref == 'perf/four-entry-feedback-20261027')) && (!(github.event_name == 'workflow_dispatch' && github.ref_name == 'perf/four-entry-feedback-20261027') && (needs.scope.outputs.application_route != 'survey-governance' && needs.scope.outputs.application_route != 'training-polish' && (needs.scope.outputs.scenario != 'frontend-test' && needs.scope.outputs.scenario != 'survey-wave-selection' && needs.scope.outputs.scenario != 'frontend-performance' && (needs.scope.outputs.scenario != 'dependencies' && (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft == true && vars.CI_FORCE_FULL != 'true' && (needs.scope.outputs.frontend == 'true' || (needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false')) && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || vars.CI_FORCE_FULL == 'true'))) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=3072
      TZ: UTC
    defaults:
      run:
        working-directory: server-version/frontend
    steps:
