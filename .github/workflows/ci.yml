    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.scope.outputs.onboarding_plan || '{}').pr == 'task1' && 12 || fromJSON(needs.scope.outputs.onboarding_plan || '{}').pr == 374 && 15 || fromJSON(needs.scope.outputs.onboarding_plan || '{}').pr == 376 && 15 || fromJSON(needs.scope.outputs.onboarding_plan || '{}').pr == 378 && 15 || fromJSON(needs.scope.outputs.onboarding_plan || '{}').pr == 380 && 15 || fromJSON(needs.scope.outputs.onboarding_plan || '{}').pr == 381 && 10 || fromJSON(needs.scope.outputs.onboarding_plan || '{}').pr == 395 && 10 || 5 }}
