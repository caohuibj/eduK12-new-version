# CI / merge gate
#
# 触发模型：
#   Pure Scale / existing Cognitive / SJT / Bundle content: one targeted content gate.
#   Presentation-only CSS/CUA-note PR: one frontend production build; public TSX uses the static candidate.
#   Routing always runs; the stable aggregate check completes for every selected route.
#   Draft platform PR: lightweight compile/type gate only; development commits do not consume Full Gate capacity.
#   Ready platform PR: existing full route, except fixed PR356 observation-only entry.
#   Retired merged-PR admission pipelines are archived outside the active CI DAG.
#   Ready PR debug: synchronize continues to re-run Full Gate after a failed merge-gate attempt.
#   workflow_dispatch: one component probe; Full Gate requires explicit full_acceptance=true.
#   push main: short post-merge integrity smoke only; do not repeat the already-green Full Gate.
#   Pull-request review events do not rerun CI because review metadata does not change the tested head SHA.
#
# 编排：全部任务使用 GitHub 托管 Ubuntu，按场景并行执行。
#   Router:       changed-scope classification
#   Dependencies: backend build/performance, functional regression, frontend, CodeQL, Docker
#   Capacity:     hosted jobs release builds early and parallelize independent consumers
#   Browser:      consumes exact-run artifacts without waiting for unrelated frontend checks
#   Merge gate:   exact success for every selected route and acceptance
#
# jobs：
#   backend       : npm ci + prisma generate + guarded migrate deploy + seed + build + 200-completion SLA
#   backend-regression: independent DB + full regression except the separately gated performance SLA file
#   frontend-build: early production/UI-lab artifacts; frontend: lint/types/audit/full regression
#   browser       : isolated PostgreSQL/Redis + seeded Bundle + real Playwright acceptance flow
#   docker        : baseline + monitoring compose config + backend/frontend production image build
#   merge-gate    : fail-closed aggregate; only exact success for every Full Gate dependency passes
#
# 说明：
#   - Vite build 不作为 TypeScript typecheck 的替代品（v1.1 §11）。
#   - frontend typecheck 同时覆盖应用与 Cognitive 模块；全仓 tsc -b 的预存类型错误登记为独立清理项，
#     不扩大本里程碑范围。
#   - 两个 backend jobs 各有独立 CI Postgres service；集成测试不以跳过代替通过。
#   - backend/frontend builds use exact GITHUB_SHA artifacts from this run; missing artifacts fail closed.
#   - Browser consumers verify source/run/lockfile/content provenance; UI-lab has a separate artifact.
#   - merge-gate 使用 needs + always()；failure/cancelled/skipped/missing 均不得被解释为 merge-ready。

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'refactor/unified-runtime-v32-unit'
      - 'content/cognitive-expansion'
  workflow_dispatch:
    inputs:
      runner_profile:
        type: choice
        options: [hosted]
        default: hosted
        description: 'Use GitHub-hosted Ubuntu for every CI job'
      step_probe:
        type: choice
        options: [none, images, cognitive, frontend, backend, backend-regression, assessment-repair, reporting, browser, media, ui, ui-chromium, qa-ui, ops, maintenance, perf]
        default: none
        description: 'Run one CI component without full CI or CodeQL'
      probe_frontend_only:
        type: boolean
        default: false
        description: 'Image probe: frontend only; false builds backend/worker/frontend'
      complete_training:
        type: boolean
        default: false
        description: 'Approved frozen Training evidence receipt; no application tests rerun'
      full_acceptance:
        type: boolean
        default: false
        description: 'Explicitly opt into whole-platform CI; otherwise choose a step_probe'


permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.step_probe || 'none' }}-${{ inputs.step_probe == 'images' && inputs.probe_frontend_only && 'frontend' || 'all' }}${{ github.event.pull_request.head.ref == 'work/survey-training-branding-20261023' && '-trainer-repair' || '' }}
  cancel-in-progress: ${{ github.event.pull_request.head.ref != 'fix/runtime-time-and-validation-20261025' && github.ref_name != 'fix/runtime-time-and-validation-20261025' }}

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  exact-candidate-manual-refusal:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref_name == 'perf/four-entry-feedback-20261027') && (github.event_name == 'workflow_dispatch' && contains(fromJSON('["backup/shared-sjt-native-20261024","backup/training-survey-main350-20261024","perf/training-entry-20261023","work/measurement-version-final-20261020","work/training-mac-ui-final-20261020","work/scale-authoring-feedback-20261021","work/composite-csv-memory-20261021","work/scale-library-governance-20261021","work/survey-experience-20261022","work/admin-authenticator-main-20261022","work/training-student-20261022","survey-cloud-flow-visual-20261022","work/training-appearance-20261022","work/survey-visual-20261022","work/shared-assessment-authoring-20261023","work/school-teacher-review-20261022","release/education-observer-native-20261029","feat/bundle-evc-profile-20261029","feat/education-package-runtime-20261029","feat/teacher-jdr-bundle-20261030","work/school-teacher-visual-20261023"]'), github.ref_name)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: refuse unrelated full and component-probe execution
        run: node -e "throw new Error('These two candidates require their reviewed bounded PR qualification; manual full/probe is not authorized')"

  known-admin-functional-manual-refusal:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref_name == 'perf/four-entry-feedback-20261027') && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/admin-permissions/a01-a07-20261020') }}
