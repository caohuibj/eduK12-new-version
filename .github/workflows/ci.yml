# CI / merge gate
#
# 触发：
#   push feature/cognitive-core / feature/cognitive-runner
#   pull_request → dev / main
#
# jobs：
#   backend       : npm ci + prisma generate + npm run build + cognitive/config tests
#   frontend      : npm ci + typecheck（tsconfig.cognitive.json 严格门禁，覆盖新代码）+ cognitive tests + vite build
#   docker-config : docker compose config（拓扑合法）
#
# 说明：
#   - Vite build 不作为 TypeScript typecheck 的替代品（v1.1 §11）。
#   - frontend typecheck 聚焦 Cognitive 模块（tsconfig.cognitive.json）；全仓 tsc -b 存在 ~90 个
#     预存类型错误（前端从未有 typecheck 门禁），登记为独立清理项，不在本 PR 修复。
#   - backend vitest 默认跳过 concurrency.integration.test.ts（未设 COGNITIVE_INTEGRATION_DB_URL），
#     真实 DB 并发集成 / Docker E2E 仍为人工门禁。

name: CI

on:
  push:
    branches:
      - feature/cognitive-core
      - feature/cognitive-runner
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  backend:
    name: backend (ci + generate + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-version/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server-version/backend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: prisma generate
        run: npx prisma generate
      - name: build (tsc)
        run: npm run build
      - name: cognitive + config tests
        run: npx vitest run src/__tests__/cognitive src/__tests__/config/keys.test.ts

  frontend:
    name: frontend (typecheck + cognitive tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-version/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server-version/frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: cognitive frontend tests
        run: npm run test:cognitive
      - name: build (vite)
        run: npm run build

  docker-config:
    name: docker (compose config)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-version
    steps:
      - uses: actions/checkout@v4
      - name: validate compose
        run: docker compose config
