    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref_name == 'perf/four-entry-feedback-20261027') && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/admin-permissions/a01-a07-20261020') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: reject full and probe dispatch on the functional-only administrator candidate
        shell: node {0}
        run: throw new Error('Administrator performance/load work is not authorized; use its reviewed functional-only PR route.');

  known-training-functional-manual-refusal:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref_name == 'perf/four-entry-feedback-20261027') && (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/work/training-functional-final-20261020' || github.ref == 'refs/heads/perf/training-load-followup-20261020')) }}
