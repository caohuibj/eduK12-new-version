      - name: admit the exact successful Training appearance SAST without rescanning unchanged inputs
        if: needs.scope.outputs.application_route == 'training-appearance'
        id: appearance-codeql-reuse
        env:
          GH_TOKEN: ${{ github.token }}
        shell: node {0}
        run: |
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const {createHash} = require('node:crypto');
          const source = '1a0fc0f2c447c334e2ae02c8dacc438720073ef2';
          const repo = 'caohuibj/eduK12-new-version', runId = 39805784823, jobId = 119918625032;
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          const api = async path => {
            const r = await fetch(`https://api.github.com/repos/${repo}/${path}`, {headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
            assert.equal(r.status,200,'Official SAST metadata unavailable');return r.json();
          };
