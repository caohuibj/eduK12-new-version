    steps:
    - name: bind service endpoints only after runner service initialization
      env:
        DATABASE_URL: postgresql://ptool:synthetic-actions-disposable@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/school_teacher_browser_ci_test?schema=public&connection_limit=10
        SCHOOL_TEACHER_TEST_DATABASE_URL: postgresql://ptool:synthetic-actions-disposable@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/school_teacher_browser_ci_test?schema=public&connection_limit=10
        REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
        CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        SCHOOL_TEACHER_PRIVATE_DIR: ${{ runner.temp }}/school-teacher-private
      run: |
        for key in DATABASE_URL SCHOOL_TEACHER_TEST_DATABASE_URL REDIS_URL CI_POSTGRES_SERVICE_ID SCHOOL_TEACHER_PRIVATE_DIR; do
          printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
        done
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24.21.0
    - run: node .github/scripts/pr357-checks.mjs source
    - uses: actions/download-artifact@v4
      with:
        name: pr357-frontend-${{ github.sha }}
        path: server-version/frontend/dist
    - uses: actions/download-artifact@v4
      with:
        name: pr357-backend-${{ github.sha }}
        path: server-version/backend/dist
    - name: install locked runtime test dependencies, never rebuild either application
      run: |
        npm ci --ignore-scripts --prefix .github/release-tools
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
        fi
        bash server-version/scripts/ci-install-canvas-deps.sh
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
        npm ci --prefix server-version/backend
        node server-version/backend/node_modules/prisma/build/index.js generate --schema server-version/backend/prisma/schema.prisma
        node .github/scripts/ci-artifact.mjs verify frontend
        node .github/scripts/ci-artifact.mjs verify backend
    - name: tighten only the approved Chrome and CJK trusted paths on this ephemeral runner
      run: |
        # Specific user approvals: 2026-10-27 03:31 and 03:38 UTC.
        sudo python3 - <<'PYOPT'
        import os,stat,subprocess,pathlib,json
        chrome=['/opt/google/chrome/chrome','/opt/google/chrome/chrome-sandbox']
        fonts=sorted(set(subprocess.check_output(['/usr/bin/fc-list',':lang=zh','--format','%{file}\n'],text=True).splitlines()))
        assert fonts, 'No installed Chinese font candidates'
        assert all(f.startswith('/usr/share/fonts/') and pathlib.Path(f).suffix.lower() in ('.ttf','.ttc','.otf','.otc') for f in fonts)
        targets={}
        for file in chrome+fonts:
          p=pathlib.Path(file);targets[str(p)]='file'
          for parent in p.parents:
            if str(parent) in ('/','/usr'):continue
            assert str(parent) in ('/opt','/opt/google','/opt/google/chrome','/usr/share','/usr/share/fonts') or str(parent).startswith('/usr/share/fonts/')
            targets[str(parent)]='directory'
        # Validate the complete bounded set before changing any of it.
        before={}
        for p,kind in targets.items():
          st=os.lstat(p)
          assert st.st_uid==0 and st.st_gid==0 and not stat.S_ISLNK(st.st_mode) and os.path.realpath(p)==p
          assert stat.S_ISREG(st.st_mode) if kind=='file' else stat.S_ISDIR(st.st_mode)
          before[p]=stat.S_IMODE(st.st_mode)
        for p,mode in before.items():
          os.chmod(p,mode & ~0o022)
          assert stat.S_IMODE(os.lstat(p).st_mode)==mode & ~0o022
        print(json.dumps({'scope':'approved-ephemeral-chrome-cjk-only','changes':[{'path':p,'before':oct(mode),'after':oct(mode & ~0o022)} for p,mode in sorted(before.items())]}))
        PYOPT
        python3 - <<'PYFONT'
        import subprocess,os,stat,json,pathlib
        paths=subprocess.check_output(['/usr/bin/fc-list','--format','%{file}\n'],text=True).splitlines()
        rows=[]
        for file in sorted(set(paths)):
          if not file.startswith('/usr/share/fonts/'):
            continue
          for p in [pathlib.Path(file),*pathlib.Path(file).parents]:
            if str(p)=='/':continue
            st=os.lstat(p)
            if st.st_uid!=0 or stat.S_IMODE(st.st_mode)&0o022 or stat.S_ISLNK(st.st_mode):
              row={'path':str(p),'uid':st.st_uid,'gid':st.st_gid,'mode':oct(stat.S_IMODE(st.st_mode)),'symlink':stat.S_ISLNK(st.st_mode)}
              if row not in rows:rows.append(row)
        out=pathlib.Path('school-teacher-evidence');out.mkdir(exist_ok=True)
        (out/'font-path-diagnostics.json').write_text(json.dumps({'readOnly':True,'untrustedPaths':rows},indent=2))
        print(json.dumps({'readOnly':True,'untrustedPaths':rows}))
        PYFONT
    - name: require official sandboxed Chrome without weakening security checks
      run: node server-version/e2e/school-teacher-chrome.cjs preflight
    - name: prepare browser-only disposable schema and actual restricted principal
      run: |
        node server-version/backend/node_modules/prisma/build/index.js migrate deploy --schema server-version/backend/prisma/schema.prisma
        node server-version/e2e/school-teacher-fixture.cjs seed
    - name: execute existing real product journey and its assertion matrix against the same artifacts
      env:
        SCHOOL_TEACHER_ARTIFACTS_VERIFIED: '1'
      run: node server-version/e2e/school-teacher-browser.cjs
    - name: remove only this job's private synthetic browser material
      if: always()
      run: |
        node --input-type=module <<'JS'
        import {resolve,sep} from 'node:path';import {rmSync} from 'node:fs';
        const root=resolve(process.env.RUNNER_TEMP),dir=resolve(process.env.SCHOOL_TEACHER_PRIVATE_DIR);
        if(dir!==root+sep+'school-teacher-private')throw Error('Refuse unexpected cleanup target');
        rmSync(dir,{recursive:true,force:true});
        JS
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pr357-connected-${{ github.sha }}
        path: |
          school-teacher-evidence/*.json
          school-teacher-evidence/screenshots/*.png
        if-no-files-found: error
        retention-days: 3
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.scope.outputs.application_route == 'pr357'
  pr357:
    needs:
    - scope
    - pr357-admission
    - pr357-frontend
    - pr357-backend
    - pr357-audit
    - pr357-connected
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.scope.outputs.application_route == 'pr357'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: reject missing skipped cancelled and failed consumers
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        node -e "const n=JSON.parse(process.env.NEEDS);for(const k of ['pr357-admission','pr357-frontend','pr357-backend','pr357-audit','pr357-connected'])if(n[k]?.result!=='success')throw Error(k+' not qualified')"
    env:
      CI: 'true'
      TZ: UTC
      PLAN: ${{ needs.scope.outputs.pr357_plan }}
      CI_EVENT: pull_request
      CI_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      CI_PR_NUMBER: ${{ github.event.pull_request.number }}
      CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_REPLACE_REGISTRY_HOST: always

  post356:
    name: Post356 bounded backend repair
    needs: scope
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.scope.outputs.application_route == 'post356'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
      CI: 'true'
      CI_EVENT: pull_request
      CI_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      CI_PR_NUMBER: ${{ github.event.pull_request.number }}
      CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
      PLAN: ${{ needs.scope.outputs.post356_plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: recheck complete source plan and refusal contracts
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {post356Plan} from './.github/scripts/post356-scope.mjs';
          import {changedEntries} from './.github/scripts/content-scope.mjs';
          const p=JSON.parse(process.env.PLAN),head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.equal(p.head,head);assert.deepEqual(post356Plan(changedEntries(p.base,head),p.base,head),p);
          JS
          node --test .github/scripts/post356-scope.test.mjs
      - uses: docker/setup-buildx-action@v3
        if: ${{ !fromJSON(needs.scope.outputs.post356_plan).controlOnly }}
      - name: compile only changed backend once
        if: ${{ !fromJSON(needs.scope.outputs.post356_plan).controlOnly }}
        run: |
          mkdir post356-evidence
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server-version/backend/Dockerfile').read_text()
          assert 'RUN npm run build' in p
          Path('post356.Dockerfile').write_text(p.replace('RUN npm run build','RUN npx tsc'))
          PY
          docker buildx build --load --build-arg DEBIAN_MIRROR=deb.debian.org --target build -f post356.Dockerfile -t post356-build server-version/backend
      - name: affected longitudinal projection and authorized picker regressions
        if: ${{ !fromJSON(needs.scope.outputs.post356_plan).controlOnly }}
        run: |
          docker run --rm -e TZ=UTC -e NODE_ENV=test -v "$PWD/post356-evidence:/evidence" post356-build npx vitest run src/__tests__/assessment-reference/scale-wave1-longitudinal.test.ts src/__tests__/measurement-content/training-standard-source.test.ts --maxWorkers=1 --reporter=json --outputFile=/evidence/tests.json
          node -e "const r=require('./post356-evidence/tests.json');if(!r.success||r.numPendingTests||r.numFailedTests||r.numPassedTests<100)throw Error('Missing or failed required cases')"
      - name: produce runtime from the same backend build cache
        if: ${{ !fromJSON(needs.scope.outputs.post356_plan).controlOnly }}
        run: docker buildx build --load --build-arg DEBIAN_MIRROR=deb.debian.org --target runtime -f post356.Dockerfile -t post356-runtime server-version/backend
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        if: ${{ !fromJSON(needs.scope.outputs.post356_plan).controlOnly }}
        with:
          version: v0.70.0
          cache: false
      - name: scan changed runtime at existing thresholds
        if: ${{ !fromJSON(needs.scope.outputs.post356_plan).controlOnly }}
        run: trivy image --exit-code 1 --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --format json --output post356-evidence/scan.json post356-runtime
      - uses: actions/upload-artifact@v4
        if: ${{ !fromJSON(needs.scope.outputs.post356_plan).controlOnly && (success() || failure()) }}
        with:
          name: post356-${{ github.sha }}
          path: post356-evidence/
          if-no-files-found: error
          retention-days: 3

  training-polish:
    name: Training non-permission bounded qualification
    needs: scope
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.scope.outputs.application_route == 'training-polish'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PLAN: ${{ needs.scope.outputs.training_polish_plan }}
      CI_EVENT: pull_request
      CI_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      CI_PR_NUMBER: ${{ github.event.pull_request.number }}
      CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
      NODE_OPTIONS: --max-old-space-size=4096
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: server-version/frontend/package-lock.json
      - name: verify exact reviewed local evidence without replaying accepted application checks
        run: node .github/scripts/training-polish-checks.mjs admission
      - name: new scope refusal evidence and fail-closed merge contracts
        run: node --test --test-reporter=tap .github/scripts/training-polish.test.mjs
      - name: restore exact successful frontend subprocesses and immutable compiled artifact
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/training-polish-checks.mjs restore
      - name: install unchanged frontend and shared-contract dependencies from official locks
        if: steps.prior.outputs.restored != 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix server-version/frontend
          npm ci --ignore-scripts --no-audit --no-fund --prefix server-version/backend
      - name: only missing frontend assertions lint and one production frontend compilation
        if: steps.prior.outputs.restored != 'true'
        run: node .github/scripts/training-polish-checks.mjs frontend
      - name: install pinned compiled-browser controls
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/release-tools
          google-chrome --version
          if ! fc-list :lang=zh file | grep -q .; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o APT::Update::Error-Mode=any update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y --no-install-recommends fonts-wqy-zenhei
          fi
          test -n "$(fc-list :lang=zh file)"
      - name: compiled Training light dark narrow layout filters and read-only shortcuts
        run: node .github/scripts/training-polish-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-polish-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            training-polish-evidence
            server-version/frontend/dist
          include-hidden-files: true
