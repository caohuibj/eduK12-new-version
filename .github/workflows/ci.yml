      - name: install only locked browser consumer dependencies without app preparation
        run: npm ci --ignore-scripts --no-audit --prefix server-version/backend
      - name: integrated affected backend and frontend types
        run: node .github/scripts/survey-governance-checks.mjs types
      - name: changed frontend lint
