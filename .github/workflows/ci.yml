            assert.equal(run.head_sha,source);assert.equal(run.head_branch,'work/training-appearance-20261022');
            assert.equal(job.run_id,runId);assert.equal(job.head_sha,source);
            assert.equal(job.name,'codeql (javascript/typescript SAST)');
            assert.equal(job.status,'completed');assert.equal(job.conclusion,'success');
            const age = Date.now()-Date.parse(job.completed_at);assert.ok(age>=0&&age<24*60*60*1000,'Original SAST is expired');
            for(const name of ['initialize CodeQL','analyze with CodeQL'])assert.ok(job.steps.some(s=>s.name===name&&s.status==='completed'&&s.conclusion==='success'),'Original SAST stage missing');
            execFileSync('git',['fetch','--no-tags','--depth=1','origin',source],{stdio:'inherit'});
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            const trees={};for(const path of ['server-version/frontend','.github/scripts']){
              const before=git('rev-parse',`${source}:${path}`),current=git('rev-parse',`HEAD:${path}`);
              assert.equal(current,before,'SAST input tree changed: '+path);trees[path]=current;
            }
            const previous=execFileSync('git',['show',`${source}:.github/workflows/ci.yml`],{encoding:'utf8'}),current=fs.readFileSync('.github/workflows/ci.yml','utf8');
            const stage=(text,name)=>{
              const section=text.slice(text.indexOf('  codeql:\n'),text.indexOf('\n  miniprogram:\n'));
              const begin=section.indexOf(`      - name: ${name}\n`);assert.ok(begin>=0);
              const next=section.indexOf('\n      - ',begin+1);
              return section.slice(begin,next<0?undefined:next).replace(/^\s+if: steps\.appearance-codeql-reuse\.outputs\.reused != 'true'\n/gm,'').trim();
            };
            const stages={};for(const name of ['initialize CodeQL','analyze with CodeQL']){
              const original=stage(previous,name),now=stage(current,name);assert.equal(now,original,'CodeQL version, paths, languages, queries or resource settings changed');
              stages[name]=createHash('sha256').update(now).digest('hex');
