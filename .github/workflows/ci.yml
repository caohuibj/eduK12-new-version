    # the actual new base/source inputs without replaying those fixtures.
    - name: admit reviewed results and qualify only missing compiler inputs
      env:
        GH_TOKEN: ${{ github.token }}
      run: node .github/scripts/onboarding-checks.mjs admit
    - name: compile each missing Task1 component once and retain those exact artifacts
