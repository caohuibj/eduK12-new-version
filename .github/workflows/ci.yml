      CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      CI_PR_NUMBER: ${{ github.event.pull_request.number }}
      CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: ptool
          POSTGRES_PASSWORD: ptool123
          POSTGRES_DB: report_planning_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ptool -d report_planning_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.11-bookworm
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24.21.0
    - name: verify exact current source
      run: |
        node .github/scripts/report-planning-checks.mjs source
    - uses: docker/setup-buildx-action@v3
    - name: build backend once using locked official dependencies
      run: docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org --build-arg DEBIAN_MIRROR= --target build -t report-planning-build server-version/backend
    - name: create isolated PG16 fixture schema and restricted runtime
      env:
        PG_SERVICE: ${{ job.services.postgres.id }}
      run: |
        test "$(docker exec "$PG_SERVICE" psql -XAt -U ptool -d report_planning_ci_test -c 'SHOW server_version_num')" = 160015
        docker run --rm --network host -e DATABASE_URL=postgresql://ptool:ptool123@127.0.0.1:5432/report_planning_ci_test report-planning-build npx prisma migrate deploy
        docker exec "$PG_SERVICE" psql -X -v ON_ERROR_STOP=1 -U ptool -d report_planning_ci_test -c "CREATE ROLE report_planning_runtime LOGIN PASSWORD 'synthetic-runtime-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; REVOKE CREATE ON DATABASE report_planning_ci_test FROM PUBLIC; REVOKE CREATE ON SCHEMA public FROM PUBLIC; GRANT CONNECT ON DATABASE report_planning_ci_test TO report_planning_runtime; GRANT USAGE ON SCHEMA public TO report_planning_runtime;"
        docker exec -i "$PG_SERVICE" psql -X -v ON_ERROR_STOP=1 -U ptool -d report_planning_ci_test -v target_database=report_planning_ci_test -v migration_owner=ptool -v runtime_role=report_planning_runtime -v "table_policy=$(cat server-version/backend/scripts/runtime-table-policy.json)" < server-version/backend/scripts/runtime-role-defaults.sql
    - name: missing PG16 report consumers in default and compact formats
      shell: bash
      run: |
        set -euo pipefail
        common=(--rm --network host -e CI=true -e NODE_ENV=test
          -e DATABASE_URL=postgresql://report_planning_runtime:synthetic-runtime-only@127.0.0.1:5432/report_planning_ci_test
          -e RELEASE_INTEGRATION_DATABASE_URL=postgresql://report_planning_runtime:synthetic-runtime-only@127.0.0.1:5432/report_planning_ci_test
          -e REDIS_URL=redis://127.0.0.1:6379/13 -e BACKGROUND_WORKERS_ENABLED=false
          -e DATA_ENCRYPTION_KEY=5555555555555555555555555555555555555555555555555555555555555555
          -e DATA_PSEUDONYM_KEY=5656565656565656565656565656565656565656565656565656565656565656
          -e CAMPUS_ELIGIBILITY_HMAC_KEY=5757575757575757575757575757575757575757575757575757575757575757
          -e JWT_SECRET=synthetic-ci-report-planning-secret-only
          -v "$PWD/report-planning-evidence:/evidence")
        files=(src/__tests__/integration/educationLibraryPersonalReport.postgres.integration.test.ts src/__tests__/integration/educationPrivateScaleReport.postgres.integration.test.ts src/__tests__/integration/educationLibraryObserver.postgres.integration.test.ts)
        docker run "${common[@]}" report-planning-build npx vitest run "${files[@]}" --maxWorkers=1 --reporter=default --reporter=json --outputFile=/evidence/pg16-default.json
        docker run "${common[@]}" -e ASSESSMENT_COMPACT_FACTS_ENABLED=true -e ASSESSMENT_SHARED_CONTROL_ENABLED=true report-planning-build npx vitest run src/__tests__/integration/educationPrivateScaleReport.postgres.integration.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=/evidence/pg16-compact.json
        node .github/scripts/report-planning-checks.mjs reports
    - name: package runtime from the same cached build, without recompiling
      run: |
        docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org --build-arg DEBIAN_MIRROR= --target runtime -t report-planning-runtime server-version/backend
        docker image inspect report-planning-runtime --format '{{.Id}}' > report-planning-evidence/runtime-image-id.txt
        docker save report-planning-runtime | gzip -1 > report-planning-evidence/runtime-image.tar.gz
    - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
      with:
        version: v0.70.0
        cache: false
    - name: scan the exact saved runtime at unchanged severity thresholds
      run: trivy image --exit-code 1 --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --format json --output report-planning-evidence/scan.json report-planning-runtime
    - uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: report-planning-${{ github.sha }}
        path: report-planning-evidence/
        if-no-files-found: error
        retention-days: 3

  training-polish:
    name: Training non-permission bounded qualification
    needs: scope
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.scope.outputs.application_route == 'training-polish'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
