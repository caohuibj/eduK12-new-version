        --out "$PR356_EVIDENCE_DIR" --qualification-pin "$RUNNER_TEMP/pr356/specs/merge-admission-precheck/qualification-pin.json" --reviews "$RUNNER_TEMP/pr356/specs/merge-admission-precheck/security-reviews.json"
    - name: Stage successful exact artifact payload
      run: node .github/scripts/pr356-artifacts.mjs stage merge-admission-precheck --directory "$PR356_EVIDENCE_DIR" --phase-spec "$PR356_PHASE_SPEC" --destination
        "$RUNNER_TEMP/pr356/artifacts/merge-admission-precheck"
    - name: Upload exact original passing evidence
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.identity.outputs.artifact_name }}
        path: ${{ runner.temp }}/pr356/artifacts/merge-admission-precheck
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 7
        overwrite: false
    - name: Retain public failure diagnostics without qualification
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: pr356-merge-admission-precheck-failure-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pr356/results/merge-admission-precheck
        if-no-files-found: warn
        retention-days: 7
  pr356-postmerge:
    name: pr356-postmerge
    needs:
    - scope
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.pr356_phase == 'postmerge' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      producer_run: ${{ steps.identity.outputs.producer_run }}
      producer_head: ${{ steps.identity.outputs.producer_head }}
      producer_attempt: ${{ steps.identity.outputs.producer_attempt }}
      head: ${{ steps.identity.outputs.head }}
      base: ${{ steps.identity.outputs.base }}
      tree: ${{ steps.identity.outputs.tree }}
      candidate_inputs_sha256: ${{ steps.identity.outputs.candidate_inputs_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR356_PHASE: postmerge
      PR356_STEP_PROBE: ${{ inputs.step_probe || 'none' }}
      PR356_FULL_ACCEPTANCE: ${{ inputs.full_acceptance || 'false' }}
      PR356_COMPLETE_TRAINING: ${{ inputs.complete_training || 'false' }}
      PR356_EXPECTED_CANDIDATE_INPUTS_SHA256: ${{ needs.scope.outputs.pr356_candidate_inputs_sha256 }}
      PR356_SOURCE_PLAN: ${{ needs.scope.outputs.pr356_plan }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24.21.0
    - name: Bind controlled runner paths after runner allocation
      shell: node {0}
      run: |
        const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
        const root=fs.realpathSync(process.env.RUNNER_TEMP),paths={"PR356_EVIDENCE_DIR":"/pr356/results/main-reuse","PR356_PHASE_SPEC":"/pr356/specs/main-reuse/phase-spec.json","PR356_PHASE_INPUTS":"/pr356/specs/main-reuse/phase-inputs.json"};
        const lines=Object.entries(paths).map(([key,suffix])=>{assert(/^[A-Z][A-Z0-9_]*$/.test(key));const value=path.resolve(root,'.'+suffix);assert(value.startsWith(root+path.sep)&&!/[\r\n]/.test(value));return key+'='+value+'\n';});
        fs.appendFileSync(process.env.GITHUB_ENV,lines.join(''));
    - name: Recompute full official head/base/tree and complete selected plan
      env:
        PR356_EVIDENCE_DIR: ${{ runner.temp }}/pr356/specs/main-reuse/source
      run: node .github/scripts/pr356-scope.mjs --outputs
    - name: Bind stable source identity and aggregate role
      id: identity
      env:
        PR356_FULL_PLAN: ${{ runner.temp }}/pr356/specs/main-reuse/source/plan.json
      shell: node {0}
      run: |
        const fs=require('node:fs'),assert=require('node:assert/strict');
        const plan=JSON.parse(fs.readFileSync(process.env.PR356_FULL_PLAN,'utf8')),source=JSON.parse(process.env.PR356_SOURCE_PLAN);
        for(const key of ['phase','head','base','tree','checkout','inventorySHA256','bindingSHA256','acceptanceSHA256','candidateInputsSHA256'])assert.deepEqual(plan[key],source[key],key+' changed after source');
        const values={artifact_name:'pr356-main-reuse-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT,producer_run:process.env.GITHUB_RUN_ID,producer_head:process.env.GITHUB_SHA,producer_attempt:process.env.GITHUB_RUN_ATTEMPT,head:plan.head,base:plan.base,tree:plan.tree,candidate_inputs_sha256:plan.candidateInputsSHA256};
        fs.appendFileSync(process.env.GITHUB_OUTPUT,Object.entries(values).map(([k,v])=>k+'='+v+'\n').join(''));
    - name: Materialize exact aggregate recipe outside empty result directory
      run: |-
        node .github/scripts/pr356-admission.mjs aggregate-spec --plan "$RUNNER_TEMP/pr356/specs/main-reuse/source/plan.json" --role main-reuse > "$PR356_PHASE_SPEC"
        node -e 'const fs=require("node:fs"); const s=JSON.parse(fs.readFileSync(process.env.PR356_PHASE_SPEC));fs.writeFileSync(process.env.PR356_PHASE_INPUTS,JSON.stringify(s.inputs,null,2)+"\n",{flag:"wx",mode:0o600})'
    - name: Verify every selected original outcome and source without application replay
      run: node .github/scripts/pr356-admission.mjs postmerge --plan "$RUNNER_TEMP/pr356/specs/main-reuse/source/plan.json" --evidence .github/scripts/pr356-local-evidence.json
        --out "$PR356_EVIDENCE_DIR"
    - name: Stage successful exact artifact payload
      run: node .github/scripts/pr356-artifacts.mjs stage main-reuse --directory "$PR356_EVIDENCE_DIR" --phase-spec "$PR356_PHASE_SPEC" --destination "$RUNNER_TEMP/pr356/artifacts/main-reuse"
    - name: Upload exact original passing evidence
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.identity.outputs.artifact_name }}
        path: ${{ runner.temp }}/pr356/artifacts/main-reuse
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 7
        overwrite: false
    - name: Retain public failure diagnostics without qualification
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: pr356-main-reuse-failure-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pr356/results/main-reuse
        if-no-files-found: warn
        retention-days: 7
