      run: node .github/scripts/pr381-browser.mjs
    - name: reuse official build and finish missing postlogin consumers
      if: fromJSON(needs.scope.outputs.onboarding_plan || '{}').pr == 380
      env:
        GH_TOKEN: ${{ github.token }}
      run: node .github/scripts/pr380-browser.mjs
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: onboarding-admission-${{ github.sha }}
        path: onboarding-evidence/
