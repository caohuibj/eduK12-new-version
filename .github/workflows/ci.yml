      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_REPLACE_REGISTRY_HOST: always
  pr357-connected:
    needs:
    - scope
    - pr357-frontend
    - pr357-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: school_teacher_browser_ci_test
          POSTGRES_USER: ptool
          POSTGRES_PASSWORD: synthetic-actions-disposable
        ports:
        - 5432/tcp
        options: --health-cmd "pg_isready -U ptool -d school_teacher_browser_ci_test" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.11-bookworm
        ports:
        - 6379/tcp
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: 'true'
      TZ: UTC
      PLAN: ${{ needs.scope.outputs.pr357_plan }}
