        run: |
          const config=process.env.COGNITIVE_PRODUCT==='true'?{paths:['server-version/backend/src','server-version/frontend/src','.github/scripts','server-version/scripts/cognitive']}:process.env.CATALOG_DISCOVERY==='true'?{paths:['server-version/backend/src','server-version/frontend/src','.github/scripts']}:process.env.PUBLIC_PRESENTATION==='true'?{paths:['server-version/frontend/src','.github/scripts','server-version/scripts/release']}:process.env.RELEASE_TOOLING==='true'?{paths:['.github/scripts','server-version/scripts/release','server-version/backend/scripts','server-version/backend/src/scripts','server-version/scripts/cognitive']}:process.env.BACKEND_MODULES==='true'?{paths:['server-version/backend/src']}:{paths:['server-version/frontend/src']};
          if(process.env.BACKEND_MODULES==='true'&&process.env.BACKEND_API_FOCUS==='form-intake')config.paths.push('.github/scripts/backend-api-scope.mjs','.github/scripts/content-scope.mjs','.github/scripts/merge-gate.mjs');
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `config=${JSON.stringify(config)}\n`);
      - name: bound selected cognitive analysis to task inputs and checker controls
        id: cognitive-codeql-config
        if: needs.scope.outputs.cognitive_intake_light == 'true'
        env:
          COGNITIVE_PLAN: ${{ needs.scope.outputs.cognitive_intake_plan }}
        shell: node {0}
        run: |
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const plan=JSON.parse(process.env.COGNITIVE_PLAN);
          assert.equal(plan.selected,true);assert.ok(Array.isArray(plan.tasks)&&plan.tasks.length);
          const paths=['.github/scripts','server-version/scripts/cognitive','server-version/backend/src/scripts/cognitive-onboarding-check.ts'];
          for(const task of plan.tasks){assert.match(task,/^[a-zA-Z0-9_-]+$/);for(const prefix of ['server-version/backend/src/modules/cognitive/tasks/','server-version/frontend/src/modules/cognitive/tasks/']){const path=prefix+task;if(fs.existsSync(path))paths.push(path);}}
          for(const file of plan.files||[])if(/^server-version\/backend\/src\/modules\/cognitive\/generated\/(execution|catalog|seeds|presentation|scientific)\.ts$/.test(file))paths.push(file);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`config=${JSON.stringify({paths})}\n`);
      - name: initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ (needs.scope.outputs.scenario == 'release-tooling' || (needs.scope.outputs.application_route == 'homepage-copy' && fromJSON(needs.scope.outputs.homepage_copy_plan || '{}').toolsChanged)) && 'javascript-typescript,python' || 'javascript-typescript' }}
          config: >-
            ${{ steps.deps-codeql.outputs.config || steps.cognitive-codeql-config.outputs.config || needs.scope.outputs.frontend_affected == 'true' && 'paths: [server-version/frontend/src, .github/scripts/content-scope.mjs, .github/scripts/content-scope.test.mjs, .github/scripts/homepage-copy-scope.mjs, .github/scripts/merge-gate.mjs]' || '' }}
          # Keep the selected source paths and query set; use the hosted 4-core/16-GB VM.
          ram: 8000
          threads: 4
      - name: analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          # This repository has not enabled GitHub code scanning yet. Keep the
          # local SAST analysis and SARIF generation, but do not fail while
          # uploading results to an unavailable code-scanning endpoint.
          upload: never
          upload-database: false

  miniprogram:
    name: mini program / foundation contract and page smoke
    needs: scope
    if: ${{ (needs.scope.outputs.scenario != 'catalog-discovery' && (needs.scope.outputs.scenario != 'backend' && (((needs.scope.outputs.scenario != 'frontend-test' && (needs.scope.outputs.scenario != 'dependencies' && (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && needs.scope.outputs.content == 'false' && needs.scope.outputs.frontend == 'false' && needs.scope.outputs.presentation == 'false' && (github.event_name != 'push' || vars.CI_FORCE_FULL == 'true'))) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling'))))) && needs.scope.outputs.scenario != 'ci-unit' && needs.scope.outputs.scenario != 'ci-regression' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs" --light
      - name: mini static and fixture smoke gates
        working-directory: server-version/miniprogram-v2
        run: npm run verify
      - name: verify Web feature inventory
        run: node server-version/miniprogram-v2/scripts/feature-inventory.cjs --check
      - name: bound dedicated Mac CI caches and remove job dependencies
        if: ${{ always() && runner.os == 'macOS' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/mac-ci-cleanup.mjs"

  backend-browser-build:
    name: UI/content route / backend browser build
    needs: scope
    if: ${{ needs.scope.outputs.scenario != 'backend' && (needs.scope.outputs.frontend_affected != 'true' && ((((needs.scope.outputs.scenario != 'dependencies' && (needs.scope.outputs.documentation != 'true' && needs.scope.outputs.maintenance != 'true' && (needs.scope.outputs.frontend == 'true' || (needs.scope.outputs.scenario != 'platform' && needs.scope.outputs.media_selection != '[]')) && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling'))))) }}
    uses: ./.github/workflows/ci-backend-browser-build.yml
    with:
      runner_labels: '["ubuntu-24.04"]'















  accept-media:
    needs: [scope, backend, backend-browser-build, frontend-build]
    if: ${{ (((!cancelled() && needs.scope.result == 'success' && needs.scope.outputs.media_selection != '[]' && needs.frontend-build.result == 'success' && (needs.backend.result == 'success' || needs.backend-browser-build.result == 'success') && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling'))) }}
    uses: ./.github/workflows/ci-media.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      selected: ${{ needs.scope.outputs.media_selection }}
      groups: ${{ needs.scope.outputs.media_groups }}

  accept-ui:
    # UI acceptance uses exact-run artifacts; lint/test result is independently gated.
    needs: [scope, frontend-build]
    if: ${{ (((!cancelled() && needs.scope.result == 'success' && needs.scope.outputs.ui_required == 'true' && needs.frontend-build.result == 'success' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling'))) }}
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.scope.outputs.visual_hosted == 'true' && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    uses: ./.github/workflows/ci-ui.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      engine: ${{ matrix.engine }}
      canonical: ${{ needs.scope.outputs.canonical_visual == 'true' && needs.scope.outputs.visual_hosted != 'true' }}
      app_shell: ${{ needs.scope.outputs.app_shell == 'true' && matrix.engine == 'chromium' }}
      qa_round3: ${{ needs.scope.outputs.canonical_visual == 'true' && matrix.engine == 'chromium' }}

  accept-visual:
    needs: [scope, frontend-build]
    if: ${{ (((needs.scope.outputs.canonical_visual == 'true' && needs.scope.outputs.visual_hosted == 'true' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling'))) }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    uses: ./.github/workflows/ci-ui.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      engine: ${{ matrix.engine }}

  accept-perf:
    # Independent fresh-fixture runtime proof; do not wait for backend compile.
    needs: scope
    if: ${{ (((needs.scope.outputs.perf_smoke == 'true' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling'))) }}
    uses: ./.github/workflows/perf-phase0-smoke.yml
    with:
      runner_profile: hosted

  accept-ops:
    # Independent recovery evidence; merge gate still requires backend success.
    needs: scope
    if: ${{ (((needs.scope.outputs.ops == 'true' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && needs.scope.outputs.application_route == 'legacy' && needs.scope.outputs.scenario != 'release-tooling'))) }}
    uses: ./.github/workflows/ops-prelaunch.yml
    with:
      runner_profile: hosted

  release-tools:
    needs: scope
    if: ${{ (github.event_name == 'pull_request' && needs.scope.outputs.scenario == 'release-tooling') }}
    uses: ./.github/workflows/ci-release-tools.yml

  scoped-release:
    needs: scope
    if: ${{ (github.event_name == 'pull_request' && (needs.scope.outputs.application_route == 'A' || needs.scope.outputs.application_route == 'B')) }}
    uses: ./.github/workflows/ci-scoped-release.yml
    with:
      plan: ${{ needs.scope.outputs.release_plan }}

  homepage-copy:
    needs: scope
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.scope.outputs.application_route == 'homepage-copy') }}
    uses: ./.github/workflows/ci-homepage-copy.yml
    with:
      plan: ${{ needs.scope.outputs.homepage_copy_plan }}

  catalog-discovery:
    name: bounded application contracts
    needs: scope
    if: ${{ needs.scope.outputs.scenario == 'catalog-discovery' && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      BUNDLE_FAMILY: ${{ needs.scope.outputs.bundle_family }}
      BUNDLE_RUNTIME: ${{ needs.scope.outputs.bundle_runtime }}
      STUDENT_DISCOVERY: ${{ needs.scope.outputs.student_discovery }}
      AUTHORING_POLISH: ${{ needs.scope.outputs.authoring_polish }}
      TRAINING_ARCHIVE_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      SITUATIONAL_PRB_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      RELEASE_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      BUNDLE_PRODUCT_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      NODE_ENV: test
      DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      LIBRARY_DISCOVERY_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      JWT_SECRET: ci-jwt-secret-123456789012345678901234
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATA_PSEUDONYM_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      UPLOAD_DIR: /tmp/catalog-ci-uploads
      COGNITIVE_MODULE_ENABLED: 'true'
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: ptool
          POSTGRES_PASSWORD: ptool123
          POSTGRES_DB: ptool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptool -d ptool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: canvas dependency prerequisites
        run: bash server-version/scripts/ci-install-canvas-deps.sh
      - name: locked test dependencies and Prisma client
        working-directory: server-version/backend
        run: |
          npm ci
          npx prisma generate
      - name: prepare the isolated migrated schema for Bundle runtime contracts
        if: needs.scope.outputs.bundle_runtime == 'true' || needs.scope.outputs.student_discovery == 'true'
        working-directory: server-version/backend
        run: npx prisma migrate deploy
      - name: changed image build controls
        if: needs.scope.outputs.bundle_family != 'true' && needs.scope.outputs.bundle_runtime != 'true' && needs.scope.outputs.authoring_polish != 'true'
        run: node --test .github/scripts/ci-image-plan.test.mjs .github/scripts/catalog-discovery-scope.test.mjs .github/scripts/student-discovery-scope.test.mjs .github/scripts/scale-authoring-polish-scope.test.mjs
      - name: existing catalog unit and temporary-table PostgreSQL contracts
        working-directory: server-version/backend
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const recipe=process.env.AUTHORING_POLISH==='true'?'scale-authoring-polish-checks.json':process.env.STUDENT_DISCOVERY==='true'?'student-discovery-checks.json':process.env.BUNDLE_RUNTIME==='true'?'bundle-runtime-checks.json':process.env.BUNDLE_FAMILY==='true'?'bundle-family-checks.json':'catalog-discovery-checks.json';
          const {backendChecks}=JSON.parse(readFileSync('../../.github/config/'+recipe,'utf8'));
          const files=[...backendChecks.unitFiles,...backendChecks.postgresFiles];
          execFileSync('npm',['test','--',...files,'--no-file-parallelism','--reporter=default','--reporter=json','--outputFile=/tmp/catalog-backend.json'],{stdio:'inherit'});
          execFileSync(process.execPath,['scripts/assert-release-test-report.mjs','/tmp/catalog-backend.json',...files],{stdio:'inherit'});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-query-${{ github.sha }}
          path: /tmp/catalog-backend.json
          if-no-files-found: error
          retention-days: 3

  merge-gate:
    name: merge gate / ready PR
    needs:
    - scope
    - backend-regression-reuse
    - backend-unit
    - edge-config
    - cognitive-product
    - catalog-discovery
    - maintenance
    - documentation
    - content
    - visual
    - pr-light-backend
    - pr-light-frontend
    - backend
    - backend-browser-build
    - backend-regression
    - frontend-build
    - frontend
    - browser
    - docker
    - codeql
    - miniprogram
    - accept-media
    - accept-ui
    - accept-visual
    - accept-perf
    - accept-ops
    - scoped-release
    - homepage-copy
    - release-tools
    if: ${{ always() && (inputs.step_probe == '' || inputs.step_probe == 'none') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      IS_DRAFT: ${{ github.event.pull_request.draft == true && vars.CI_FORCE_FULL != 'true' }}
      CI_EVENT: ${{ github.event_name }}
      CI_BASE_SHA: ${{ needs.scope.outputs.diff_base || github.event.pull_request.base.sha || github.event.before }}
      CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
      CI_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      CI_IS_DRAFT: ${{ github.event.pull_request.draft }}
      CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      CI_PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24.21.0
    - name: materialize complete merge-gate inputs
      shell: node {0}
      run: |
        const fs = require('node:fs');
        // The generated Node script receives a JSON string literal, never shell code.
        const serialized = ${{ toJSON(toJSON(needs)) }};
        if (Buffer.byteLength(serialized, 'utf8') > 4 * 1024 * 1024) throw new Error('Merge-gate inputs exceed 4 MiB');
        const path = require('node:path');
        const file = path.join(process.env.RUNNER_TEMP, `merge-gate-needs-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}.json`);
        if (/[\r\n]/.test(file)) throw new Error('Invalid merge-gate input path');
        fs.writeFileSync(file, serialized, { mode: 0o600, flag: 'wx' });
        fs.appendFileSync(process.env.GITHUB_ENV, `NEEDS_JSON_FILE=${file}\n`);
    - name: install pinned release classification tools
      if: needs.scope.outputs.documentation != 'true' && needs.scope.outputs.scenario != 'release-tooling'
      run: |
        npm ci --ignore-scripts --prefix .github/release-tools
        mkdir -p server-version/backend/node_modules
        test -e server-version/backend/node_modules/typescript || ln -s "$PWD/.github/release-tools/node_modules/typescript" server-version/backend/node_modules/typescript
    - name: preserve original required-check evidence for safe future retests
      uses: actions/upload-artifact@v4
      with:
        name: ci-gate-evidence-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/merge-gate-needs-${{ github.run_id }}-${{ github.run_attempt }}.json
        if-no-files-found: error
        retention-days: 3
    - name: require exact success for the selected route
      run: node .github/scripts/merge-gate.mjs
