# CI / merge gate
#
# 触发模型：
#   Pure Scale / existing Cognitive / SJT / Bundle content: one targeted content gate.
#   Routing always runs; the stable aggregate check also completes for content PRs.
#   Draft platform PR: lightweight compile/type gate only; development commits do not consume Full Gate capacity.
#   Ready platform PR: existing full backend/frontend/browser/docker/CodeQL merge gate.
#   Ready PR debug: synchronize continues to re-run Full Gate after a failed merge-gate attempt.
#   workflow_dispatch: manual Full Gate for explicit debugging/verification.
#   push main: short post-merge integrity smoke only; do not repeat the already-green Full Gate.
#   Pull-request review events do not rerun CI because review metadata does not change the tested head SHA.
#
# 编排（双主机 self-hosted，两条 physical serial lane）：
#   Mac lane:     backend
#   Hosted:       main browser plus three independent browser gates, each isolated
#   Windows lane: frontend → codeql → docker
#   backend 与 frontend 在物理隔离的主机上并行启动；同一主机每次只匹配一个正式 runner。
#   这是 CI 调度稳定性优化，不代表 production performance improvement。
#
# jobs：
#   backend       : npm ci + prisma generate + guarded migrate deploy + seed + build + full regression
#   frontend      : npm ci + lint + typecheck + full regression + vite build
#   browser       : isolated PostgreSQL/Redis + seeded Bundle + real Playwright acceptance flow
#   docker        : baseline + monitoring compose config + backend/frontend production image build
#   merge-gate    : fail-closed aggregate; only exact success for every Full Gate dependency passes
#
# 说明：
#   - Vite build 不作为 TypeScript typecheck 的替代品（v1.1 §11）。
#   - frontend typecheck 同时覆盖应用与 Cognitive 模块；全仓 tsc -b 的预存类型错误登记为独立清理项，
#     不扩大本里程碑范围。
#   - backend 使用 CI Postgres service；COGNITIVE_INTEGRATION_DB_URL 与 DATABASE_URL 指向同一临时库，
#     full regression 会包含真实 DB 并发集成测试，不以跳过代替通过。
#   - backend/frontend builds use exact GITHUB_SHA artifacts from this run; missing artifacts fail closed.
#   - browser 下载同一运行的 production frontend build，用 preview 验收，避免重复构建和 Vite 首次转换超时。
#   - merge-gate 使用 needs + always()；failure/cancelled/skipped/missing 均不得被解释为 merge-ready。

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'refactor/unified-runtime-v32-unit'
      - 'content/cognitive-expansion'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: classify changed content
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.scope.outputs.content }}
      scale: ${{ steps.scope.outputs.scale }}
      cognitive: ${{ steps.scope.outputs.cognitive }}
      situational: ${{ steps.scope.outputs.situational }}
      bundle: ${{ steps.scope.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test .github/scripts/content-scope.test.mjs .github/scripts/browser-asset-filter.test.mjs .github/scripts/ci-timing-report.test.mjs .github/scripts/api-response.test.mjs
      - id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/content-scope.mjs

  content:
    name: assessment content
    needs: scope
    if: needs.scope.outputs.content == 'true'
    uses: ./.github/workflows/scale-onboarding-boundary.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      scale: ${{ needs.scope.outputs.scale == 'true' }}
      cognitive: ${{ needs.scope.outputs.cognitive == 'true' }}
      situational: ${{ needs.scope.outputs.situational == 'true' }}
      bundle: ${{ needs.scope.outputs.bundle == 'true' }}
      base: ${{ github.event.pull_request.base.sha || github.event.before }}

  pr-light-backend:
    needs: scope
    name: PR light / backend compile
    if: needs.scope.outputs.content == 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == true && vars.CI_FORCE_FULL != 'true'
    runs-on:
      - self-hosted
      - linux
      - eduk12-mac-ci
    defaults:
      run:
        working-directory: server-version/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: npm ci
        run: npm ci
      - name: content routing boundary tests
        run: node --test ../../.github/scripts/cognitive-content.test.mjs ../../.github/scripts/content-workflows.test.mjs
      - name: prisma generate
        run: npx prisma generate
      - name: situational data-only manifests and publication gates
        run: npm run situational:contracts
      - name: verify SJT immutable releases and publication authority
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$PUBLICATION_BASE_SHA"
          npm run situational:onboarding-check -- --all --verify-reviews --base "$PUBLICATION_BASE_SHA"
      - name: cognitive task manifests and dependency boundaries
        run: npm run cognitive:contracts
      - name: Bundle content and immutable history
        env:
          BUNDLE_CONTENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npx tsx scripts/bundle-content-check.ts
      - name: build (tsc)
        run: npm run build

  pr-light-frontend:
    needs: scope
    name: PR light / frontend lint + typecheck
    if: needs.scope.outputs.content == 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == true && vars.CI_FORCE_FULL != 'true'
    runs-on:
      - self-hosted
      - linux
      - eduk12-win-ci
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
    defaults:
      run:
        working-directory: server-version/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck

  post-merge-smoke:
    needs: scope
    name: main / post-merge compile smoke
    if: needs.scope.outputs.content == 'false' && github.event_name == 'push' && vars.CI_FORCE_FULL != 'true'
    runs-on:
      - self-hosted
      - linux
      - eduk12-mac-ci
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: backend npm ci
        working-directory: server-version/backend
        run: npm ci
      - name: backend prisma generate
        working-directory: server-version/backend
        run: npx prisma generate
      - name: Bundle content and immutable history
        working-directory: server-version/backend
        env:
          BUNDLE_CONTENT_BASE_SHA: ${{ github.event.before }}
        run: npx tsx scripts/bundle-content-check.ts
      - name: backend compile smoke
        working-directory: server-version/backend
        run: npm run build
      - name: frontend npm ci
        working-directory: server-version/frontend
        run: npm ci
      - name: frontend typecheck smoke
        working-directory: server-version/frontend
        run: npm run typecheck
      - name: frontend production build smoke
        working-directory: server-version/frontend
        run: npm run build

  backend:
    needs: scope
    name: backend (ci + migrate + build + full regression)
    if: needs.scope.outputs.content == 'false' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    runs-on:
      - self-hosted
      - linux
      - eduk12-mac-ci
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      COGNITIVE_INTEGRATION_DB_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR8_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR26_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR34_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR38_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      V32_1_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      V32_2_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      V32_3_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      BUNDLE_PRODUCT_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      SITUATIONAL_BUNDLE_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      INSTRUMENT_FINAL_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      RELEASE_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      UPLOAD_DIR: /tmp/eduk12-ci-uploads
      JWT_SECRET: ci-jwt-secret-123456789012345678901234
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATA_PSEUDONYM_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      COGNITIVE_MODULE_ENABLED: 'true'
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: ptool
          POSTGRES_PASSWORD: ptool123
          POSTGRES_DB: ptool
        ports:
          - 5432:5432
        # 保持与正式 release gate 相同的持久化语义（默认 durability），
        # 串行执行已实测满足 200 并发完成门（<10s SLA）。
        # services.postgres.options 是 docker create 参数：这里的 -c 会被
        # docker 解析为 --cpu-shares（非法值，服务直接起不来）；要给 PG
        # 传启动参数必须走 services.postgres.command。
        options: >-
          --health-cmd "pg_isready -U ptool -d ptool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server-version/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check CI disk headroom
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-disk-preflight.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: npm ci
        run: npm ci
      - name: dependency audit (high and critical)
        run: npm audit --audit-level=high
      - name: content routing boundary tests
        run: node --test ../../.github/scripts/cognitive-content.test.mjs ../../.github/scripts/content-workflows.test.mjs
      - name: prisma generate
        run: npx prisma generate
      - name: prisma migrate deploy
        run: npm run db:migrate:guarded
      - name: seed reference and configuration data
        run: npm run db:seed
        env:
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password-2026
      - name: backfill and validate check-in token protection
        run: npm run db:backfill:checkin-tokens
      - name: guarded migration idempotency after seeded data
        run: npm run db:migrate:guarded
      - name: PR3 populated baseline-to-head upgrade rehearsal
        run: node scripts/pr3-baseline-upgrade-rehearsal.mjs
      - name: prepare release preflight upload directory
        run: mkdir -p "$UPLOAD_DIR"
      - name: read-only release data preflight
        run: npm run db:release:preflight
      - name: situational data-only manifests and publication gates
        run: npm run situational:contracts
      - name: verify SJT immutable releases and publication authority
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$PUBLICATION_BASE_SHA"
          npm run situational:onboarding-check -- --all --verify-reviews --base "$PUBLICATION_BASE_SHA"
      - name: cognitive task manifests and dependency boundaries
        run: npm run cognitive:contracts
      - name: Bundle content and immutable history
        env:
          BUNDLE_CONTENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npx tsx scripts/bundle-content-check.ts
      - name: build (tsc)
        run: npm run build
      - name: publish tested backend build
        id: backend-build-upload
        # GitHub artifact creation/finalization can reset connections. Retry
        # with bounded backoff; the final attempt must succeed or fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: server-version/backend/dist
          retention-days: 1
          if-no-files-found: error
      - name: wait before retrying backend build upload
        if: ${{ !cancelled() && steps.backend-build-upload.outcome == 'failure' }}
        run: sleep 15
      - name: retry backend build upload
        id: backend-build-upload-retry
        continue-on-error: true
        if: ${{ !cancelled() && steps.backend-build-upload.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: server-version/backend/dist
          retention-days: 1
          if-no-files-found: error
          # Finalization may have succeeded remotely before the connection reset.
          overwrite: true
      - name: wait before final backend build upload
        if: ${{ !cancelled() && steps.backend-build-upload-retry.outcome == 'failure' }}
        run: sleep 45
      - name: final backend build upload
        if: ${{ !cancelled() && steps.backend-build-upload-retry.outcome == 'failure' }}
        # Do not ignore this failure: browser must consume this run's exact build.
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: server-version/backend/dist
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      # The unknown-package contract imports the generated frontend runner.
      # This job has its own checkout; dependencies installed by the frontend
      # job are not available here. Preserve the real import instead of mocking it.
      - name: frontend dependencies for cross-tree Cognitive package tests
        working-directory: server-version/frontend
        run: npm ci --ignore-scripts
      - name: full regression
        # 与 release-verify-local.sh 对齐：real-PG 集成测试文件串行执行；
        # 文件并行会让多个 worker / Prisma client 争抢同一 PG + CPU + IO，
        # 把 200 并发完成门从本地串行的 ~7.6s 放大到 ~15s（实测 FAIL）。
        run: npm test -- --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-backend-vitest.json
      - name: capture CI environment snapshot
        if: always()
        run: |-
          {
            echo "node $(node -v)"
            echo "cpus $(nproc)"
            grep -E 'MemTotal|MemAvailable' /proc/meminfo
            df -h /tmp | tail -1
            date -u +"timestamp %FT%TZ"
          } > /tmp/eduk12-ci-env.txt
      - name: critical integration suites must not skip
        run: >-
          node scripts/assert-release-test-report.mjs /tmp/eduk12-backend-vitest.json
          src/__tests__/cognitive/concurrency.integration.test.ts
          src/__tests__/scale/pr3-managed.postgres.integration.test.ts
          src/__tests__/situational/situational-standalone.postgres.integration.test.ts
          src/__tests__/composite/composite-analysis-snapshot.postgres.integration.test.ts
          src/__tests__/bundle-product/product.postgres.integration.test.ts
          src/__tests__/bundle-onboarding/lifecycle.postgres.integration.test.ts
          src/__tests__/bundle-onboarding/content.postgres.integration.test.ts
          src/__tests__/questionnaire/product.postgres.integration.test.ts
          src/__tests__/questionnaire/aggregate-report.postgres.integration.test.ts
          src/__tests__/questionnaire/form-answer.postgres.integration.test.ts
          src/__tests__/questionnaire/form-answer-bulk-mutation.pr38.postgres.integration.test.ts
          src/__tests__/integration/instrument-final-submit.postgres.integration.test.ts
          src/__tests__/assessment-runtime/v32-1.postgres.integration.test.ts
          src/__tests__/assessment-runtime/v32-2.postgres.integration.test.ts
          src/__tests__/assessment-runtime/v32-3.postgres.integration.test.ts
          src/__tests__/composite/situational-bundle.postgres.integration.test.ts
          src/__tests__/classroom/classroom-start.postgres.integration.test.ts
          src/__tests__/integration/courseCodeRotationConcurrency.integration.test.ts
          src/__tests__/integration/submissionIdempotencyReceipt.integration.test.ts
          src/__tests__/hotpath/query-budget.postgres.integration.test.ts
          src/__tests__/integration/assessmentRunConsentRecovery.postgres.integration.test.ts
          src/__tests__/integration/reportingCore.postgres.integration.test.ts
          src/__tests__/integration/reportingHttp.postgres.integration.test.ts
          src/__tests__/integration/reportingQueryBudget.postgres.integration.test.ts
          src/__tests__/integration/reportingDelivery.postgres.integration.test.ts
          src/__tests__/integration/reportingSeries.postgres.integration.test.ts
          src/__tests__/integration/reportingCohortSelector.postgres.integration.test.ts
          src/__tests__/integration/reportingLongitudinalPlanner.postgres.integration.test.ts
          src/__tests__/integration/reportingIndividualLongitudinal.postgres.integration.test.ts
          src/__tests__/integration/organizationProductContext.postgres.integration.test.ts
          src/__tests__/integration/organizationProductAdmin.postgres.integration.test.ts
          src/__tests__/integration/assessmentRunProductRead.postgres.integration.test.ts
          src/__tests__/integration/reportingDiscovery.postgres.integration.test.ts
          src/__tests__/integration/safetyDiscovery.postgres.integration.test.ts
      - name: upload vitest report artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-vitest-report
          path: |
            /tmp/eduk12-backend-vitest.json
            /tmp/eduk12-ci-env.txt
          if-no-files-found: ignore

      - name: remove this job's ephemeral service containers and anonymous volumes
        if: always()
        env:
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          CI_REDIS_SERVICE_ID: ${{ job.services.redis.id }}
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-cleanup-services.sh"

  frontend:
    needs: scope
    name: frontend (lint + typecheck + full tests + build)
    # Windows lane 的首个 job：不依赖 backend，从 workflow 开始即可启动。
    # 它与 Mac lane 的 backend 使用不同物理主机，避免跨 lane 资源竞争。
    if: needs.scope.outputs.content == 'false' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    runs-on:
      - self-hosted
      - linux
      - eduk12-win-ci
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
    defaults:
      run:
        working-directory: server-version/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: npm ci
        run: npm ci
      - name: dependency audit (high and critical)
        run: npm audit --audit-level=high
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: full frontend tests
        run: npm test
      - name: install offline Cognitive diagnostic dependencies
        working-directory: server-version/backend
        run: npm ci --ignore-scripts
      - name: all Cognitive onboarding decisions
        working-directory: server-version/backend
        run: npm run cognitive:onboarding-check -- --all --json
      - name: build (vite)
        run: npm run build
      - name: publish tested frontend for browser acceptance
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: server-version/frontend/dist
          retention-days: 1
          if-no-files-found: error

  browser:
    name: browser (seeded Situational Bundle + static visual acceptance)
    # Browser acceptance must execute against the same commit after both
    # production lanes have passed. It uses its own service containers and
    # uses an isolated hosted runner so browser work cannot stall the Mac lane.
    needs: [scope, backend, frontend]
    if: needs.scope.outputs.content == 'false' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    runs-on: ${{ fromJSON(vars.CI_BROWSER_HOSTED != 'false' && '["ubuntu-24.04"]' || '["self-hosted","linux","eduk12-mac-ci"]') }}
    timeout-minutes: 35
    env:
      NODE_ENV: test
      PORT: '3000'
      DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      JWT_SECRET: ci-jwt-secret-123456789012345678901234
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATA_PSEUDONYM_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      ASSET_SIGNING_SECRET: ci-asset-signing-secret-123456789012345678901234
      ASSET_MIGRATION_COMPLETE: 'false'
      COOKIE_SECURE: 'false'
      CORS_ORIGIN: http://127.0.0.1:5173
      REDIS_URL: redis://localhost:6379
      SOCKET_REDIS_REQUIRED: 'true'
      COGNITIVE_MODULE_ENABLED: 'true'
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      BACKGROUND_WORKERS_ENABLED: 'false'
      TRUST_PROXY_HOPS: '0'
      LOG_LEVEL: warn
      UPLOAD_DIR: /tmp/eduk12-situational-bundle-e2e-uploads
      CREDENTIAL_HANDOFF_DIR: /tmp/eduk12-situational-bundle-e2e-credentials
      SITUATIONAL_STATIC_VISUAL_FIXTURE: 'true'
      SITUATIONAL_BUNDLE_E2E_INSTRUMENT_KEY: sjt-static-visual-e2e-fixture
      SITUATIONAL_BUNDLE_E2E_FIXTURE_FILE: /tmp/eduk12-situational-bundle-fixture.json
      SITUATIONAL_BUNDLE_E2E_BASE_URL: http://127.0.0.1:5173
      SITUATIONAL_BUNDLE_E2E_SCREENSHOT_DIR: /tmp/eduk12-situational-bundle-e2e
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: ptool
          POSTGRES_PASSWORD: ptool123
          POSTGRES_DB: ptool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptool -d ptool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server-version
    steps:
      - uses: actions/checkout@v4
      - name: clear previous browser evidence
        run: |
          rm -rf /tmp/eduk12-situational-bundle-e2e /tmp/eduk12-situational-bundle-backend.log /tmp/eduk12-situational-bundle-frontend.log /tmp/eduk12-situational-bundle-backend.pid /tmp/eduk12-situational-bundle-frontend.pid /tmp/eduk12-pr5-scenarios-evidence /tmp/eduk12-pr5-release-rehearsal /tmp/eduk12-pr5-scenario-backend.log
      - name: check CI disk headroom
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-disk-preflight.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: configure runner-local npm and Playwright caches
        run: |
          mkdir -p "$HOME/.npm" "$HOME/.cache/ms-playwright" "$HOME/.cache/eduk12-ci"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      - name: restore hosted dependency downloads
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: browser-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server-version/backend/package-lock.json', 'server-version/frontend/package-lock.json') }}
          restore-keys: browser-npm-${{ runner.os }}-${{ runner.arch }}-
      - name: restore hosted Chromium binaries
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: browser-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server-version/backend/package-lock.json') }}
      - name: backend npm ci
        working-directory: server-version/backend
        run: npm ci
      - name: prepare Chromium for seeded browser
        working-directory: server-version/backend
        run: |
          playwright_version="$(node -p "require('playwright-core/package.json').version")"
          deps_marker="$HOME/.cache/eduk12-ci/playwright-deps-${playwright_version}"
          if [ ! -f "$deps_marker" ]; then
            npx playwright-core install-deps chromium
            touch "$deps_marker"
          fi
          npx playwright-core install chromium
      - name: frontend npm ci
        working-directory: server-version/frontend
        run: npm ci
      - name: restore tested frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: server-version/frontend/dist
      - name: prisma generate and guarded migration
        working-directory: server-version/backend
        run: |
          npx prisma generate
          npm run db:migrate:guarded
      - name: seed reference and configuration data
        working-directory: server-version/backend
        run: npm run db:seed
        env:
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password-2026
      - name: restore tested backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: server-version/backend/dist
      - name: seed isolated Bundle fixture
        working-directory: server-version/backend
        run: npx tsx ../e2e/situational-bundle-browser-fixture.ts
      - name: seed PR5 Organization fixture
        working-directory: server-version/backend
        run: npx tsx ../e2e/pr5-organization-browser-fixture.ts
      - name: start backend
        run: |
          mkdir -p "$UPLOAD_DIR" "$CREDENTIAL_HANDOFF_DIR"
          nohup setsid node backend/dist/index.js > /tmp/eduk12-situational-bundle-backend.log 2>&1 &
          echo $! > /tmp/eduk12-situational-bundle-backend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eduk12-situational-bundle-backend.log
          exit 1
      - name: start frontend
        run: |
          nohup setsid npm --prefix frontend run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/eduk12-situational-bundle-frontend.log 2>&1 &
          echo $! > /tmp/eduk12-situational-bundle-frontend.pid
          for attempt in $(seq 1 60); do
            if ! kill -0 $(cat /tmp/eduk12-situational-bundle-frontend.pid) 2>/dev/null; then break; fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eduk12-situational-bundle-frontend.log
          exit 1
      - name: verify built frontend in Chromium
        run: node e2e/browser-preflight.cjs http://127.0.0.1:5173 /tmp/eduk12-situational-bundle-e2e/preflight
      - name: run seeded browser acceptance
        run: node e2e/situational-bundle-browser-e2e.cjs
      - name: run FE-11 storage fault acceptance
        run: node e2e/fe-11-storage-fault-browser-e2e.cjs
      - name: run RA-02 four-role relational acceptance
        run: node e2e/relational-four-role-browser-e2e.cjs
      - name: run PR5 Organization cross-role acceptance
        run: node e2e/pr5-organization-browser-e2e.cjs
      - name: seed three PR5 business scenarios
        run: backend/node_modules/.bin/tsx e2e/pr5-product-scenarios-fixture.ts
      - name: start isolated PR5 scenario resource server
        env:
          PR5_SCENARIOS_ENABLED: 'true'
        run: |
          kill -- -$(cat /tmp/eduk12-situational-bundle-backend.pid)
          for attempt in $(seq 1 30); do
            if ! curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then break; fi
            sleep 1
          done
          nohup setsid backend/node_modules/.bin/tsx e2e/pr5-product-scenarios-server.ts > /tmp/eduk12-pr5-scenario-backend.log 2>&1 &
          echo $! > /tmp/eduk12-situational-bundle-backend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eduk12-pr5-scenario-backend.log
          exit 1
      - name: certify three PR5 business scenarios
        run: backend/node_modules/.bin/tsx e2e/pr5-product-scenarios.ts
      - name: rehearse PR5 encrypted backup restore and migration failure recovery
        env:
          PR5_SOURCE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node e2e/pr5-release-rehearsal.mjs
      - name: verify Bundle V3 browser lifecycle in isolated catalog
        env:
          BUNDLE_PRODUCTS_ENABLED: 'true'
          BUNDLE_PRODUCT_ISOLATED_DB: '1'
          BUNDLE_PRODUCT_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
          BUNDLE_PRODUCT_BASE_URL: http://127.0.0.1:5173
          BUNDLE_PRODUCT_EVIDENCE: /tmp/eduk12-bundle-products-e2e
        run: |
          rm -rf /tmp/eduk12-bundle-products-e2e
          backend/node_modules/.bin/tsx e2e/bundle-products-fixture.ts
          kill -- -$(cat /tmp/eduk12-situational-bundle-backend.pid)
          for attempt in $(seq 1 30); do
            if ! curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then break; fi
            sleep 1
          done
          nohup setsid backend/node_modules/.bin/tsx e2e/bundle-products-server.ts > /tmp/eduk12-bundle-products-backend.log 2>&1 &
          echo $! > /tmp/eduk12-situational-bundle-backend.pid
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/eduk12-bundle-products-backend.log; exit 1; fi
          node e2e/bundle-products-browser-e2e.cjs
      - name: Reporting V2.2 final product scenarios
        env:
          REPORTING_BROWSER_ISOLATED_DB: '1'
          REPORTING_BROWSER_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
          REPORTING_BROWSER_BASE_URL: http://127.0.0.1:5173
        run: |
          backend/node_modules/.bin/tsx e2e/reporting-v22-fixture.ts
          node e2e/reporting-v22-browser-e2e.cjs
      - name: anonymous questionnaire completion and exhausted-link recovery
        env:
          QUESTIONNAIRE_PRODUCT_ISOLATED_DB: '1'
          QUESTIONNAIRE_PRODUCT_PUBLIC: '1'
          QUESTIONNAIRE_PRODUCT_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
          QUESTIONNAIRE_PRODUCT_BASE_URL: http://127.0.0.1:5173
          QUESTIONNAIRE_PRODUCT_EVIDENCE: /tmp/eduk12-questionnaire-public-e2e
        run: |
          backend/node_modules/.bin/tsx e2e/questionnaire-products-fixture.ts
          node e2e/questionnaire-products-browser-e2e.cjs
      - name: upload seeded browser evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: situational-bundle-browser-evidence
          path: |
            /tmp/eduk12-situational-bundle-e2e
            /tmp/eduk12-situational-bundle-backend.log
            /tmp/eduk12-situational-bundle-frontend.log
            /tmp/eduk12-pr5-scenarios-evidence
            /tmp/eduk12-pr5-release-rehearsal
            /tmp/eduk12-pr5-scenario-backend.log
            /tmp/eduk12-bundle-products-e2e
            /tmp/eduk12-questionnaire-public-e2e
            /tmp/reporting-v22-evidence
            /tmp/eduk12-bundle-products-backend.log
          if-no-files-found: ignore
      - name: stop seeded services
        if: always()
        run: |
          if [ -f /tmp/eduk12-situational-bundle-frontend.pid ]; then kill -- -$(cat /tmp/eduk12-situational-bundle-frontend.pid) || true; fi
          if [ -f /tmp/eduk12-situational-bundle-backend.pid ]; then kill -- -$(cat /tmp/eduk12-situational-bundle-backend.pid) || true; fi

      - name: remove this job's ephemeral service containers and anonymous volumes
        if: always()
        env:
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          CI_REDIS_SERVICE_ID: ${{ job.services.redis.id }}
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-cleanup-services.sh"

  docker:
    name: docker (compose config + production builds)
    # Windows has one heavy lane: frontend -> CodeQL -> Docker.
    # No backend/browser artifacts are consumed here; the merge gate requires all.
    needs: [scope, codeql]
    if: needs.scope.outputs.content == 'false' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    runs-on:
      - self-hosted
      - linux
      - eduk12-win-ci
    timeout-minutes: 45
    env:
      JWT_SECRET: ci-jwt-secret-123456789012345678901234
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATA_PSEUDONYM_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      ASSET_SIGNING_SECRET: ci-asset-signing-secret-123456789012345678901234
      ASSET_MIGRATION_COMPLETE: 'true'
      COOKIE_SECURE: 'false'
      DB_USER: ci-ptool
      DB_PASSWORD: ci-ptool-password
      DB_NAME: ptool
      DATABASE_URL: postgresql://ci-ptool:ci-ptool-password@postgres:5432/ptool?schema=public
      POSTGRES_EXPORTER_DATA_SOURCE_NAME: postgresql://ci-ptool:ci-ptool-password@postgres:5432/ptool?sslmode=disable
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password-2026
      GRAFANA_PASSWORD: ci-grafana-password-2026
      COGNITIVE_MODULE_ENABLED: 'true'
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      CORS_ORIGIN: http://localhost
    defaults:
      run:
        working-directory: server-version
    steps:
      - uses: actions/checkout@v4
      - name: check CI disk headroom
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-disk-preflight.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: configure runner-local Trivy cache
        id: runner-cache
        run: |
          trivy_cache="$HOME/.cache/trivy"
          trivy_bin_dir="$HOME/.local/bin/trivy-bin"
          mkdir -p "$trivy_cache" "$trivy_bin_dir"
          echo "trivy_cache=$trivy_cache" >> "$GITHUB_OUTPUT"
          echo "$trivy_bin_dir" >> "$GITHUB_PATH"
      - name: detect runner-local Trivy 0.70.0
        id: trivy-local
        run: |
          trivy_bin="$HOME/.local/bin/trivy-bin/trivy"
          if [ -x "$trivy_bin" ] && "$trivy_bin" --version 2>/dev/null | grep -q '^Version: 0\.70\.0$'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: install Trivy 0.70.0 once per runner
        if: steps.trivy-local.outputs.ready != 'true'
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
          cache: false
      - name: validate compose
        run: docker compose config --format json > /tmp/eduk12-compose-config.json
      - name: assert API/worker isolation topology
        run: node scripts/assert-compose-worker-topology.mjs /tmp/eduk12-compose-config.json
      - name: validate monitoring compose
        run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config > /tmp/eduk12-monitoring-compose-config.yml
      - name: build production images
        run: docker compose build backend worker frontend
      - name: scan backend image (high and critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: server-version-backend:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          cache: 'false'
          skip-setup-trivy: true
          cache-dir: ${{ steps.runner-cache.outputs.trivy_cache }}
      - name: scan frontend image (high and critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: server-version-frontend:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          cache: 'false'
          skip-setup-trivy: true
          cache-dir: ${{ steps.runner-cache.outputs.trivy_cache }}

  codeql:
    name: codeql (javascript/typescript SAST)
    # Windows lane 的第二个 job：仅在 frontend 成功后启动；同一 dedicated
    # runner 负责物理串行化 Frontend → CodeQL。backend 不再作为前置条件。
    needs: [scope, frontend]
    if: needs.scope.outputs.content == 'false' && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    runs-on:
      - self-hosted
      - linux
      - eduk12-win-ci
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Runner unit cgroup caps memory at MemoryMax=5G; without an explicit
          # cap the CodeQL JVM grows to "most of system memory" and gets
          # OOM-killed mid-analysis.
          ram: 3500
          # 保持当前已验证的 CodeQL 资源参数；本次只调整 lane 调度，不做
          # CodeQL 性能调优。
          threads: 8
      - name: analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          # This repository has not enabled GitHub code scanning yet. Keep the
          # local SAST analysis and SARIF generation, but do not fail while
          # uploading results to an unavailable code-scanning endpoint.
          upload: never
          upload-database: false

  merge-gate:
    name: merge gate / ready PR
    needs: [scope, content, pr-light-backend, pr-light-frontend, backend, frontend, browser, docker, codeql]
    if: ${{ always() && (vars.CI_FORCE_FULL == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      IS_DRAFT: ${{ github.event.pull_request.draft == true && vars.CI_FORCE_FULL != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: require exact success for the selected route
        run: node .github/scripts/merge-gate.mjs
