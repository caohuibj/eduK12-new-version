        retention-days: 3
        if-no-files-found: error
    - name: Stage actual successful stable PR356 admission only
      if: ${{ needs.scope.outputs.application_route == 'pr356' && github.event_name == 'workflow_dispatch' }}
      run: node .github/scripts/pr356-artifacts.mjs stage merge-admission --directory "$PR356_EVIDENCE_DIR" --phase-spec "$PR356_PHASE_SPEC" --destination "$RUNNER_TEMP/pr356/artifacts/merge-admission"
    - name: Retain stable required admission for exact main reuse
      if: ${{ needs.scope.outputs.application_route == 'pr356' && github.event_name == 'workflow_dispatch' }}
      id: pr356-stable-upload
      uses: actions/upload-artifact@v4
      with:
        name: pr356-merge-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pr356/artifacts/merge-admission
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 7
        overwrite: false
    - name: Retain failed stable PR356 public diagnostics
      if: ${{ failure() && (github.ref_name == 'fix/runtime-time-and-validation-20261025' || needs.scope.outputs.application_route == 'pr356') }}
      uses: actions/upload-artifact@v4
      with:
        name: pr356-merge-admission-failure-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pr356/results/merge-admission
        if-no-files-found: warn
        retention-days: 7
