      working-directory: server-version/backend
      env:
        NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        NPM_CONFIG_REPLACE_REGISTRY_HOST: always
      run: |
        npm ci --ignore-scripts --no-audit --no-fund
        node node_modules/prisma/build/index.js generate
    - name: authenticate and reuse the successful exact Task1 component builds
      id: task1-build-reuse
      if: fromJSON(needs.scope.outputs.onboarding_plan || '{}').pr == 'task1'
      env:
        GH_TOKEN: ${{ github.token }}
      run: node .github/scripts/onboarding-checks.mjs task1-build-reuse
    - name: install only Task1 missing compilation dependencies once
      if: fromJSON(needs.scope.outputs.onboarding_plan || '{}').pr == 'task1' && steps.task1-build-reuse.outputs.backend-reused != 'true'
      env:
        NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        NPM_CONFIG_REPLACE_REGISTRY_HOST: always
      run: |
        npm ci --ignore-scripts --no-audit --no-fund --prefix server-version/backend
        node server-version/backend/node_modules/prisma/build/index.js generate --schema server-version/backend/prisma/schema.prisma
    # PR404's unchanged binding fixtures retain their successful run evidence;
