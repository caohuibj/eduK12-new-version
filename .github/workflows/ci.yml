          for(const file of plan.files||[])if(/^server-version\/backend\/src\/modules\/cognitive\/generated\/(execution|catalog|seeds|presentation|scientific)\.ts$/.test(file))paths.push(file);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`config=${JSON.stringify({paths})}\n`);
      - name: bound scale authoring cross-language extraction to six controls
