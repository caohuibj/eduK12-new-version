name: Training follow-up affected checks
on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
permissions:
  contents: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
  CI_EVENT: pull_request
  TZ: UTC
  NODE_OPTIONS: --max-old-space-size=3072
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAN: ${{ inputs.plan }}
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: server-version/frontend/package-lock.json
      - name: locked frontend dependencies
        working-directory: server-version/frontend
        run: npm ci
      - name: affected lint, integrated types, four direct contracts and one build
        run: node .github/scripts/training-followup-checks.mjs frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-followup-frontend-${{ github.sha }}
          path: training-followup-evidence
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: training-followup-dist-${{ github.sha }}
          path: server-version/frontend/dist
          retention-days: 3
          if-no-files-found: error
  browser:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@v4
        with:
          name: training-followup-dist-${{ github.sha }}
          path: server-version/frontend/dist
      - name: pinned Chromium tools
        run: |
          npm ci --ignore-scripts --prefix .github/release-tools
          node .github/release-tools/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: affected desktop, tablet and mobile layouts on the same build
        run: node .github/scripts/training-followup-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-followup-browser-${{ github.sha }}
          path: training-followup-evidence
          retention-days: 3
          if-no-files-found: error
  forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PLAN: ${{ inputs.plan }}
      NODE_ENV: test
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:5432/training_followup_ci
      RELEASE_INTEGRATION_DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:5432/training_followup_ci
      FORM_TEMPLATE_INTEGRATION: '1'
      MATERIAL_GRANTS_ENABLED: 'true'
      JWT_SECRET: synthetic-training-followup-ci-only-not-a-real-secret
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATA_PSEUDONYM_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic
          POSTGRES_DB: training_followup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d training_followup_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: server-version/backend/package-lock.json
      - name: locked backend dependencies
        working-directory: server-version/backend
        run: npm ci
      - name: integrated types, disposable migration and seven form authority contracts
        run: node .github/scripts/training-followup-checks.mjs backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-followup-forms-${{ github.sha }}
          path: training-followup-evidence
          retention-days: 3
          if-no-files-found: error
