name: Situational Video Acceptance
'on':
  workflow_call:
    inputs:
      runner_profile:
        type: string
        default: hosted
      use_build_artifacts:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      runner_profile:
        type: choice
        options:
        - hosted
        default: hosted
permissions:
  contents: read
  actions: read
concurrency:
  group: situational-video-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || vars.CI_FORCE_FULL == 'true'
    uses: ./.github/workflows/ci-media.yml
    with:
      runner_labels: '["ubuntu-24.04"]'
      selected: '["situational_video"]'
      groups: '["cognitive-situational"]'
      use_build_artifacts: ${{ inputs.use_build_artifacts || false }}
