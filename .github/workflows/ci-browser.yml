name: CI browser component

on:
  workflow_call:
    inputs:
      runner_labels:
        type: string
        required: true
      groups:
        type: string
        default: '["foundation","products","security"]'
      admin_permissions_functional:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  browser:
    name: ${{ matrix.group }} / seeded browser acceptance
    # Independent exact-SHA artifacts and isolated PostgreSQL/Redis per scenario group.
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.groups) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_ENV: test
      PORT: '3000'
      DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      RELEASE_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      JWT_SECRET: ci-jwt-secret-123456789012345678901234
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATA_PSEUDONYM_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      ASSET_SIGNING_SECRET: ci-asset-signing-secret-123456789012345678901234
      ASSET_MIGRATION_COMPLETE: 'false'
      COOKIE_SECURE: 'false'
      CORS_ORIGIN: http://127.0.0.1:5173
      REDIS_URL: redis://localhost:6379
      SOCKET_REDIS_REQUIRED: 'true'
      COGNITIVE_MODULE_ENABLED: 'true'
      # Browser START acceptance owns a fake fixture; production never opts in.
      COGNITIVE_TEST_FIXTURES_ENABLED: 'true'
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      BACKGROUND_WORKERS_ENABLED: 'false'
      TRUST_PROXY_HOPS: '0'
      LOG_LEVEL: warn
      UPLOAD_DIR: /tmp/eduk12-situational-bundle-e2e-uploads
      CREDENTIAL_HANDOFF_DIR: /tmp/eduk12-situational-bundle-e2e-credentials
      SITUATIONAL_STATIC_VISUAL_FIXTURE: 'true'
      SITUATIONAL_BUNDLE_E2E_INSTRUMENT_KEY: sjt-static-visual-e2e-fixture
      SITUATIONAL_BUNDLE_E2E_FIXTURE_FILE: /tmp/eduk12-situational-bundle-fixture.json
      SITUATIONAL_BUNDLE_E2E_BASE_URL: http://127.0.0.1:5173
      SITUATIONAL_BUNDLE_E2E_SCREENSHOT_DIR: /tmp/eduk12-situational-bundle-e2e
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: ptool
          POSTGRES_PASSWORD: ptool123
          POSTGRES_DB: ptool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptool -d ptool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server-version
    steps:
      - uses: actions/checkout@v4
      - name: ensure the full browser scenario matrix is required
        env:
          CI_BROWSER_GROUPS: ${{ inputs.groups }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/ci-browser-plan.mjs"
      - name: verify explicit administrator browser scope
        if: inputs.admin_permissions_functional && matrix.group == 'security'
        working-directory: .
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
        run: |
          git fetch --no-tags origin "$CI_BASE_SHA"
          node .github/scripts/admin-permissions-functional.mjs verify-browser
      - name: clear previous browser evidence
        run: |
          rm -rf /tmp/eduk12-situational-bundle-e2e /tmp/eduk12-situational-bundle-backend.log /tmp/eduk12-situational-bundle-frontend.log /tmp/eduk12-situational-bundle-backend.pid /tmp/eduk12-situational-bundle-frontend.pid /tmp/eduk12-pr5-scenarios-evidence /tmp/eduk12-pr5-release-rehearsal /tmp/eduk12-pr5-scenario-backend.log /tmp/eduk12-bundle-products-e2e /tmp/eduk12-bundle-products-backend.log /tmp/eduk12-questionnaire-public-e2e /tmp/reporting-v22-evidence
      - name: check CI disk headroom
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-disk-preflight.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs"
      - name: configure runner-local npm and Playwright caches
        run: |
          mkdir -p "$HOME/.npm" "$HOME/.cache/ms-playwright" "$HOME/.cache/eduk12-ci"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      - name: restore hosted dependency downloads
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: browser-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server-version/backend/package-lock.json', 'server-version/frontend/package-lock.json') }}
          restore-keys: browser-npm-${{ runner.os }}-${{ runner.arch }}-
      - name: restore hosted Chromium binaries
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: browser-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server-version/backend/package-lock.json') }}
      - name: prepare canvas source-build dependencies
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-install-canvas-deps.sh"
      - name: backend npm ci
        working-directory: server-version/backend
        run: npm ci
      - name: prepare Chromium for seeded browser
        working-directory: server-version/backend
        run: |
          playwright_version="$(node -p "require('playwright-core/package.json').version")"
          deps_marker="$HOME/.cache/eduk12-ci/playwright-deps-${playwright_version}"
          if [ ! -f "$deps_marker" ]; then
            npx playwright-core install-deps chromium
            touch "$deps_marker"
          fi
          npx playwright-core install chromium
      - name: frontend npm ci
        working-directory: server-version/frontend
        run: npm ci
      - name: restore tested frontend build
        id: frontend-build-download
        # Runner DNS/transport can fail transiently even when the artifact exists.
        # Every attempt consumes this run's exact tested SHA; no rebuild fallback.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: server-version/frontend/dist
      - name: wait before retrying frontend build download
        if: ${{ !cancelled() && steps.frontend-build-download.outcome == 'failure' }}
        run: sleep 15
      - name: retry tested frontend build download
        id: frontend-build-download-retry
        continue-on-error: true
        if: ${{ !cancelled() && steps.frontend-build-download.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: server-version/frontend/dist
      - name: wait before final frontend build download
        if: ${{ !cancelled() && steps.frontend-build-download-retry.outcome == 'failure' }}
        run: sleep 45
      - name: final tested frontend build download
        # Final failure remains fatal, even if earlier attempts left partial files.
        if: ${{ !cancelled() && steps.frontend-build-download-retry.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: server-version/frontend/dist
      - name: verify restored frontend entry point
        run: node "$GITHUB_WORKSPACE/.github/scripts/ci-artifact.mjs" verify frontend
      - name: prisma generate and guarded migration
        working-directory: server-version/backend
        run: |
          npx prisma generate
          npm run db:migrate:guarded
      - name: seed reference and configuration data
        working-directory: server-version/backend
        run: npm run db:seed
        env:
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password-2026
      - name: restore tested backend build
        id: backend-build-download
        # Runner DNS/transport can fail transiently even when the artifact exists.
        # Every attempt consumes this run's exact tested SHA; no rebuild fallback.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: server-version/backend/dist
      - name: wait before retrying backend build download
        if: ${{ !cancelled() && steps.backend-build-download.outcome == 'failure' }}
        run: sleep 15
      - name: retry tested backend build download
        id: backend-build-download-retry
        continue-on-error: true
        if: ${{ !cancelled() && steps.backend-build-download.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: server-version/backend/dist
      - name: wait before final backend build download
        if: ${{ !cancelled() && steps.backend-build-download-retry.outcome == 'failure' }}
        run: sleep 45
      - name: final tested backend build download
        # Final failure remains fatal, even if earlier attempts left partial files.
        if: ${{ !cancelled() && steps.backend-build-download-retry.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: server-version/backend/dist
      - name: verify restored backend entry point
        run: node "$GITHUB_WORKSPACE/.github/scripts/ci-artifact.mjs" verify backend
      - name: seed isolated Bundle fixture
        working-directory: server-version/backend
        run: npx tsx ../e2e/situational-bundle-browser-fixture.ts
      - name: seed PR5 Organization fixture
        working-directory: server-version/backend
        run: npx tsx ../e2e/pr5-organization-browser-fixture.ts
      - name: start backend
        run: |
          mkdir -p "$UPLOAD_DIR" "$CREDENTIAL_HANDOFF_DIR"
          nohup setsid node backend/dist/index.js > /tmp/eduk12-situational-bundle-backend.log 2>&1 &
          echo $! > /tmp/eduk12-situational-bundle-backend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eduk12-situational-bundle-backend.log
          exit 1
      - name: start frontend
        run: |
          nohup setsid npm --prefix frontend run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/eduk12-situational-bundle-frontend.log 2>&1 &
          echo $! > /tmp/eduk12-situational-bundle-frontend.pid
          for attempt in $(seq 1 60); do
            if ! kill -0 $(cat /tmp/eduk12-situational-bundle-frontend.pid) 2>/dev/null; then break; fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eduk12-situational-bundle-frontend.log
          exit 1
      - name: verify built frontend in Chromium
        run: node e2e/browser-preflight.cjs http://127.0.0.1:5173 /tmp/eduk12-situational-bundle-e2e/preflight
      - name: run seeded browser acceptance
        if: matrix.group == 'foundation'
        run: node e2e/situational-bundle-browser-e2e.cjs
      - name: Training native IndexedDB transaction contracts
        if: matrix.group == 'foundation'
        timeout-minutes: 2
        run: node e2e/training-draft-transactions-browser.cjs
      - name: run FE-11 storage fault acceptance
        if: matrix.group == 'foundation'
        run: node e2e/fe-11-storage-fault-browser-e2e.cjs
      - name: run RA-02 four-role relational acceptance
        if: matrix.group == 'foundation'
        run: node e2e/relational-four-role-browser-e2e.cjs
      - name: run PR5 Organization cross-role acceptance
        if: matrix.group == 'foundation'
        run: node e2e/pr5-organization-browser-e2e.cjs
      - name: seed three PR5 business scenarios
        if: matrix.group == 'foundation'
        run: backend/node_modules/.bin/tsx e2e/pr5-product-scenarios-fixture.ts
      - name: start isolated PR5 scenario resource server
        if: matrix.group == 'foundation'
        env:
          PR5_SCENARIOS_ENABLED: 'true'
          # This loopback-only synthetic scenario explicitly includes parents.
          # The production default and the preceding closed-entry checks stay off.
          PARENT_PORTAL_ENABLED: 'true'
        run: |
          kill -- -$(cat /tmp/eduk12-situational-bundle-backend.pid)
          for attempt in $(seq 1 30); do
            if ! curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then break; fi
            sleep 1
          done
          nohup setsid backend/node_modules/.bin/tsx e2e/pr5-product-scenarios-server.ts > /tmp/eduk12-pr5-scenario-backend.log 2>&1 &
          echo $! > /tmp/eduk12-situational-bundle-backend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eduk12-pr5-scenario-backend.log
          exit 1
      - name: certify three PR5 business scenarios
        if: matrix.group == 'foundation'
        run: backend/node_modules/.bin/tsx e2e/pr5-product-scenarios.ts
      - name: rehearse PR5 encrypted backup restore and migration failure recovery
        if: matrix.group == 'foundation'
        env:
          PR5_SOURCE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node e2e/pr5-release-rehearsal.mjs
      - name: verify Bundle V3 browser lifecycle in isolated catalog
        if: matrix.group == 'products'
        env:
          BUNDLE_PRODUCTS_ENABLED: 'true'
          BUNDLE_PRODUCT_ISOLATED_DB: '1'
          BUNDLE_PRODUCT_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
          BUNDLE_PRODUCT_BASE_URL: http://127.0.0.1:5173
          BUNDLE_PRODUCT_EVIDENCE: /tmp/eduk12-bundle-products-e2e
        run: |
          rm -rf /tmp/eduk12-bundle-products-e2e
          backend/node_modules/.bin/tsx e2e/bundle-products-fixture.ts
          kill -- -$(cat /tmp/eduk12-situational-bundle-backend.pid)
          for attempt in $(seq 1 30); do
            if ! curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then break; fi
            sleep 1
          done
          nohup setsid backend/node_modules/.bin/tsx e2e/bundle-products-server.ts > /tmp/eduk12-bundle-products-backend.log 2>&1 &
          echo $! > /tmp/eduk12-situational-bundle-backend.pid
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/eduk12-bundle-products-backend.log; exit 1; fi
          node e2e/bundle-products-browser-e2e.cjs
      - name: multi-role respondent inbox responsive acceptance
        if: matrix.group == 'products'
        env:
          INBOX_E2E_BASE_URL: http://127.0.0.1:5173
          INBOX_E2E_OUTPUT: /tmp/eduk12-inbox-e2e
        run: node e2e/multi-role-inbox-browser-e2e.cjs
      - name: anonymous study identity responsive acceptance
        if: matrix.group == 'products'
        env:
          INBOX_E2E_BASE_URL: http://127.0.0.1:5173
          STUDY_E2E_OUTPUT: /tmp/eduk12-anonymous-study-e2e
        run: node e2e/anonymous-study-browser-e2e.cjs
      - name: Reporting V2.2 final product scenarios
        if: matrix.group == 'products'
        env:
          REPORTING_BROWSER_ISOLATED_DB: '1'
          REPORTING_BROWSER_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
          REPORTING_BROWSER_BASE_URL: http://127.0.0.1:5173
        run: |
          backend/node_modules/.bin/tsx e2e/reporting-v22-fixture.ts
          node e2e/reporting-v22-browser-e2e.cjs
      - name: anonymous questionnaire completion and exhausted-link recovery
        if: matrix.group == 'products'
        env:
          QUESTIONNAIRE_PRODUCT_ISOLATED_DB: '1'
          QUESTIONNAIRE_PRODUCT_PUBLIC: '1'
          QUESTIONNAIRE_PRODUCT_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
          QUESTIONNAIRE_PRODUCT_BASE_URL: http://127.0.0.1:5173
          QUESTIONNAIRE_PRODUCT_EVIDENCE: /tmp/eduk12-questionnaire-public-e2e
        run: |
          backend/node_modules/.bin/tsx e2e/questionnaire-products-fixture.ts
          node e2e/questionnaire-products-browser-e2e.cjs
      - name: Training optional Form authenticated browser and CSV acceptance
        if: matrix.group == 'products'
        timeout-minutes: 6
        env:
          QUESTIONNAIRE_PRODUCT_ISOLATED_DB: '1'
          QUESTIONNAIRE_PRODUCT_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
          TRAINING_OPTIONAL_EVIDENCE: /tmp/eduk12-training-optional-e2e
          CORS_ORIGIN: https://training.eduk12.top:5443
          COOKIE_SECURE: 'true'
          TRAINING_OPTIONAL_EPHEMERAL_CA_APPROVED: 'true'
        run: |
          # Last products consumer: earlier cases have exited before changing the
          # exact isolated origin. No system hosts, trust store or production change.
          kill -- -$(cat /tmp/eduk12-situational-bundle-backend.pid)
          for attempt in $(seq 1 30); do
            if ! curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then break; fi
            sleep 1
          done
          if curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then exit 1; fi
          nohup setsid node backend/dist/index.js > /tmp/eduk12-training-optional-backend.log 2>&1 &
          echo $! > /tmp/eduk12-situational-bundle-backend.pid
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/eduk12-training-optional-backend.log; exit 1; fi
          backend/node_modules/.bin/tsx e2e/questionnaire-products-fixture.ts
          if ! command -v certutil >/dev/null; then
            timeout -k 10s 120s sudo -n apt-get update -o Acquire::Retries=1
            timeout -k 10s 120s sudo -n apt-get install -y --no-install-recommends libnss3-tools
          fi
          python3 e2e/training-optional-https.py
      - name: Training material lifecycle and populated restore acceptance
        if: matrix.group == 'products'
        timeout-minutes: 10
        env:
          QUESTIONNAIRE_PRODUCT_ISOLATED_DB: '1'
          QUESTIONNAIRE_PRODUCT_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          TRAINING_MATERIALS_PRIVATE_DIR: ${{ runner.temp }}/training-materials-private
          TRAINING_MATERIALS_EVIDENCE: /tmp/eduk12-training-materials-e2e
          TRAINING_HTTPS_SCENARIO: materials
          TRAINING_MATERIALS_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          ASSESSMENT_REPORT_ASYNC_ENABLED: 'true'
          CORS_ORIGIN: https://training.eduk12.top:5443
          COOKIE_SECURE: 'true'
          TRAINING_OPTIONAL_EPHEMERAL_CA_APPROVED: 'true'
        run: |
          set -euo pipefail
          # Existing products job, exact downloaded dist, fresh C20 resources only.
          # The original optional Form scenario above retains its original identity.
          owner_url="$DATABASE_URL"
          cleanup_materials() {
            if [ -f /tmp/eduk12-situational-bundle-backend.pid ]; then
              kill -- -$(cat /tmp/eduk12-situational-bundle-backend.pid) 2>/dev/null || true
            fi
            rm -rf -- "$TRAINING_MATERIALS_PRIVATE_DIR"
            test ! -e "$TRAINING_MATERIALS_PRIVATE_DIR"
          }
          trap cleanup_materials EXIT
          node e2e/training-materials-fixture.cjs bootstrap
          kill -- -$(cat /tmp/eduk12-situational-bundle-backend.pid)
          for attempt in $(seq 1 30); do
            if ! curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then break; fi
            sleep 1
          done
          if curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then exit 1; fi
          export DATABASE_URL="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.env.TRAINING_MATERIALS_PRIVATE_DIR+'/fixture.json')).runtimeUrl)")"
          export QUESTIONNAIRE_PRODUCT_TEST_DATABASE_URL="$DATABASE_URL"
          export DATABASE_URL_RUNTIME="$DATABASE_URL"
          export RUNTIME_ROLE_REQUIRED=true
          export ASSESSMENT_REPORT_ASYNC_COURSE_IDS="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.env.TRAINING_MATERIALS_PRIVATE_DIR+'/fixture.json')).courseId)")"
          (cd backend && node scripts/runtime-role-contract.mjs verify-current)
          # API logs remain private and are removed, never uploaded with evidence.
          nohup setsid node backend/dist/index.js >"$TRAINING_MATERIALS_PRIVATE_DIR/backend.log" 2>&1 &
          echo $! >/tmp/eduk12-situational-bundle-backend.pid
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          python3 e2e/training-optional-https.py
          kill -- -$(cat /tmp/eduk12-situational-bundle-backend.pid)
          for attempt in $(seq 1 30); do
            if ! kill -0 $(cat /tmp/eduk12-situational-bundle-backend.pid) 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 $(cat /tmp/eduk12-situational-bundle-backend.pid) 2>/dev/null; then exit 1; fi
          # Consume the same actually populated source once; do not replay its lifecycle.
          export DATABASE_URL="$owner_url"
          export QUESTIONNAIRE_PRODUCT_TEST_DATABASE_URL="$owner_url"
          unset DATABASE_URL_RUNTIME RUNTIME_ROLE_REQUIRED
          node e2e/training-materials-restore.mjs
      - name: enforced production CSP browser acceptance
        if: matrix.group == 'security'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            timeout -k 10s 120s sudo -n apt-get update -o Acquire::Retries=1
            timeout -k 10s 180s sudo -n apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version >/dev/null
          node e2e/production-csp-browser.cjs
      - name: administrator virtual CTAP2, business identity and entry revocation browser acceptance
        if: inputs.admin_permissions_functional && matrix.group == 'security'
        timeout-minutes: 8
        env:
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          ADMIN_PERMISSIONS_ISOLATED_TEST: '1'
          ADMIN_PERMISSIONS_PRIVATE_DIR: ${{ runner.temp }}/admin-permissions-private
          ADMIN_PERMISSIONS_FIXTURE_FILE: ${{ runner.temp }}/admin-permissions-private/browser-fixture.json
          ADMIN_PERMISSIONS_FIXTURE_BUSINESS: '1'
          ADMIN_PERMISSIONS_BROWSER_ORIGIN: http://localhost:5174
          DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/eduk12_admin_permissions_ci_browser?schema=public
          REDIS_URL: redis://localhost:6379/8
          PORT: '3100'
          E2E_BACKEND_URL: http://127.0.0.1:3100
          CORS_ORIGIN: http://localhost:5174
          ADMIN_WEBAUTHN_RP_ID: localhost
          ADMIN_WEBAUTHN_ORIGIN: http://localhost:5174
          SURVEY_WORKSPACE_ENABLED: 'true'
          HUITEACHER_WORKSPACE_ENABLED: 'true'
          BACKGROUND_WORKERS_ENABLED: 'false'
          UPLOAD_DIR: ${{ runner.temp }}/admin-permissions-private/uploads
          EXPORT_DIR: ${{ runner.temp }}/admin-permissions-private/exports
          ADMIN_USERNAME: ci-admin-permissions-reference
          ADMIN_PASSWORD: ci-admin-permissions-reference-2026
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$ADMIN_PERMISSIONS_PRIVATE_DIR" "$UPLOAD_DIR" "$EXPORT_DIR"
          admin_api_pid=''
          admin_preview_pid=''
          export ADMIN_BROWSER_STAGE='migration'
          cleanup_admin_browser() {
            admin_browser_status=$?
            if [ "$admin_browser_status" -ne 0 ]; then
              ADMIN_BROWSER_EXIT_STATUS="$admin_browser_status" node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const root=process.env.ADMIN_PERMISSIONS_PRIVATE_DIR;
          const failures=['business.log','workspaces.log'].flatMap(file=>{
            try{return readFileSync(root+'/'+file,'utf8').split('\n').flatMap(line=>{
              try{const row=JSON.parse(line);return row.result==='FAIL'?[row]:[];}catch{return [];}
            });}catch{return [];}
          }).map(row=>({
            step:typeof row.step==='string'&&/^[A-Za-z0-9-]{1,100}$/.test(row.step)?row.step:'unknown',
            checks:Number.isSafeInteger(row.checks)?row.checks:0,
            errorType:['AssertionError','TimeoutError','Error','TypeError'].includes(row.errorType)?row.errorType:'Error',
          }));
          const summary={result:'FAIL',head:process.env.GITHUB_SHA,mode:'admin-permissions-functional-only',
            stage:process.env.ADMIN_BROWSER_STAGE,exitStatus:Number(process.env.ADMIN_BROWSER_EXIT_STATUS),failures,
            physicalHardwareVerified:false,rawCredentialsUploaded:false,productionAccess:false};
          writeFileSync(process.env.RUNNER_TEMP+'/admin-permissions-browser-summary.json',JSON.stringify(summary,null,2),{mode:0o600});
          console.error(JSON.stringify(summary));
          NODE
            fi
            if [ -n "$admin_preview_pid" ]; then kill -- -"$admin_preview_pid" 2>/dev/null || true; fi
            if [ -n "$admin_api_pid" ]; then kill -- -"$admin_api_pid" 2>/dev/null || true; fi
            rm -rf -- "$ADMIN_PERMISSIONS_PRIVATE_DIR"
          }
          trap cleanup_admin_browser EXIT
          docker exec "$CI_POSTGRES_SERVICE_ID" createdb -U ptool eduk12_admin_permissions_ci_browser
          npm --prefix backend run db:migrate:guarded
          npm --prefix backend run db:seed
          export ADMIN_BROWSER_STAGE='fixture'
          (cd backend && npx tsx scripts/admin-permissions-fixture.ts)
          export CHROMIUM_EXECUTABLE="$(node -e "process.stdout.write(require('./backend/node_modules/playwright-core').chromium.executablePath())")"
          nohup setsid node backend/dist/index.js > "$ADMIN_PERMISSIONS_PRIVATE_DIR/api.log" 2>&1 &
          admin_api_pid=$!
          nohup setsid npm --prefix frontend run preview -- --host localhost --port 5174 --strictPort > "$ADMIN_PERMISSIONS_PRIVATE_DIR/preview.log" 2>&1 &
          admin_preview_pid=$!
          export ADMIN_BROWSER_STAGE='readiness'
          ready=false
          for attempt in $(seq 1 50); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3100/ready >/dev/null && curl --fail --silent --max-time 2 http://localhost:5174/ >/dev/null; then ready=true; break; fi
            if ! kill -0 "$admin_api_pid" 2>/dev/null || ! kill -0 "$admin_preview_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$ready" = true
          export ADMIN_BROWSER_STAGE='business'
          ADMIN_PERMISSIONS_BROWSER_PHASE=business-overlaps node e2e/admin-permissions-browser.cjs > "$ADMIN_PERMISSIONS_PRIVATE_DIR/business.log" 2>&1
          export ADMIN_BROWSER_STAGE='workspaces'
          ADMIN_PERMISSIONS_BROWSER_PHASE=workspaces-resume node e2e/admin-permissions-browser.cjs > "$ADMIN_PERMISSIONS_PRIVATE_DIR/workspaces.log" 2>&1
          export ADMIN_BROWSER_STAGE='summary'
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const root=process.env.ADMIN_PERMISSIONS_PRIVATE_DIR;
          const result=(file,phase,checks)=>{
            const rows=readFileSync(root+'/'+file,'utf8').split('\n').flatMap(line=>{
              try{return [JSON.parse(line)];}catch{return [];}
            }).filter(row=>row.phase===phase&&row.result==='PASS');
            assert.equal(rows.length,1);assert.equal(rows[0].checks,checks);assert.equal(rows[0].pageErrors,0);
            assert.equal(rows[0].physicalKeyVerified,false);assert.equal(rows[0].officialCI,true);
            return rows[0];
          };
          const business=result('business.log','P2-business-and-governance',42);
          const workspaces=result('workspaces.log','A05-workspaces',198);
          assert.equal(workspaces.identities,9);
          writeFileSync(process.env.RUNNER_TEMP+'/admin-permissions-browser-summary.json',JSON.stringify({
            result:'PASS',head:process.env.GITHUB_SHA,mode:'admin-permissions-functional-only',
            business,workspaces,physicalHardwareVerified:false,rawCredentialsUploaded:false,productionAccess:false,
          },null,2),{mode:0o600});
          NODE
      - name: upload administrator browser summary only
        if: inputs.admin_permissions_functional && matrix.group == 'security' && always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-permissions-browser-${{ github.sha }}
          path: ${{ runner.temp }}/admin-permissions-browser-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: upload seeded browser evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: situational-bundle-browser-evidence-${{ matrix.group }}
          path: |
            /tmp/eduk12-situational-bundle-e2e
            /tmp/eduk12-situational-bundle-backend.log
            /tmp/eduk12-situational-bundle-frontend.log
            /tmp/eduk12-pr5-scenarios-evidence
            /tmp/eduk12-pr5-release-rehearsal
            /tmp/eduk12-pr5-scenario-backend.log
            /tmp/eduk12-bundle-products-e2e
            /tmp/eduk12-questionnaire-public-e2e
            /tmp/eduk12-training-optional-e2e
            /tmp/eduk12-training-optional-backend.log
            /tmp/eduk12-training-materials-e2e
            /tmp/reporting-v22-evidence
            /tmp/eduk12-bundle-products-backend.log
          if-no-files-found: ignore
      - name: stop seeded services
        if: always()
        run: |
          if [ -f /tmp/eduk12-situational-bundle-frontend.pid ]; then kill -- -$(cat /tmp/eduk12-situational-bundle-frontend.pid) || true; fi
          if [ -f /tmp/eduk12-situational-bundle-backend.pid ]; then kill -- -$(cat /tmp/eduk12-situational-bundle-backend.pid) || true; fi

      - name: remove this job's ephemeral service containers and anonymous volumes
        if: always()
        env:
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          CI_REDIS_SERVICE_ID: ${{ job.services.redis.id }}
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-cleanup-services.sh"

