name: Backend security and efficiency candidate
on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
permissions:
  contents: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAN: ${{ inputs.plan }}
      BACKEND_SECURITY_EFFICIENCY_CANDIDATE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: recheck frozen full diff and backend-only plan
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {backendSecurityEfficiencyPlan} from './.github/scripts/backend-security-efficiency-scope.mjs';
          import {changedEntries} from './.github/scripts/content-scope.mjs';
          const p=JSON.parse(process.env.PLAN),head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.equal(p.head,head);
          assert.deepEqual(p,backendSecurityEfficiencyPlan(changedEntries(p.base,head),p.base,head));
          writeFileSync('backend-security-efficiency-plan.json',JSON.stringify(p,null,2));
          JS
      - uses: docker/setup-buildx-action@v3
      - name: compile backend once and run affected contracts on isolated PostgreSQL
        run: python3 -B .github/scripts/campus-candidate.py
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
          cache: false
      - name: scan the actual backend and worker runtime image at existing thresholds
        run: trivy image --exit-code 1 --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --format json --output backend-security-efficiency-evidence/scan.json eduk12-backend-security-efficiency-backend:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: backend-security-efficiency-${{ github.sha }}
          path: |
            backend-security-efficiency-plan.json
            backend-security-efficiency-evidence/
          if-no-files-found: error
          retention-days: 3
