name: Release tooling contracts only
on:
  workflow_call:
permissions:
  contents: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HUI_EVIDENCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      HUI_LOCAL_VALIDATION_PUBLIC_KEY: ${{ vars.HUI_LOCAL_VALIDATION_PUBLIC_KEY }}
      HUI_LOCAL_VALIDATION_EVIDENCE: ${{ vars.HUI_LOCAL_VALIDATION_EVIDENCE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - id: local
        name: authenticate local results without retesting
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {fromEnvironment} from './.github/scripts/local-validation.mjs';
          const p=fromEnvironment(process.env.CI_BASE_SHA,process.env.GITHUB_SHA);
          appendFileSync(process.env.GITHUB_OUTPUT,`reused=${p.checks.some(c=>c.check==='release-tools')}\n`);
          JS
      - name: install tools only for missing checks
        if: steps.local.outputs.reused != 'true'
        run: npm ci --ignore-scripts --prefix .github/release-tools
      - name: prepare native nginx only for missing ingress checks (official Ubuntu sources)
        if: steps.local.outputs.reused != 'true'
        run: |
          if git diff --name-only "$CI_BASE_SHA" "$GITHUB_SHA" -- server-version/ops/nginx server-version/scripts/release/ingress.py server-version/scripts/release/test_ingress.py | grep -q .; then
            cat > "$RUNNER_TEMP/ingress-official.list" <<'EOF'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe
          EOF
            sudo apt-get -o Dir::Etc::sourcelist="$RUNNER_TEMP/ingress-official.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup=0 update
            sudo apt-get -o Dir::Etc::sourcelist="$RUNNER_TEMP/ingress-official.list" -o Dir::Etc::sourceparts="-" install -y --no-install-recommends nginx-core
          fi
      - name: prepare selected assessment checker dependencies only when their tooling changes
        if: steps.local.outputs.reused != 'true'
        run: |
          if node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {cognitiveIntakeToolingChanged} from './.github/scripts/cognitive-intake-scope.mjs';
          import {scaleIntakeToolingChanged} from './.github/scripts/scale-intake-scope.mjs';
          const files=execFileSync('git',['diff','--name-only','-z','--no-renames',process.env.CI_BASE_SHA,process.env.GITHUB_SHA],{encoding:'utf8'}).split('\0').filter(Boolean);
          process.exitCode=scaleIntakeToolingChanged(files)||cognitiveIntakeToolingChanged(files)?0:1;
          JS
          then
            npm ci --ignore-scripts --no-audit --no-fund --prefix server-version/backend
          fi
      - name: consume local success or execute missing tooling checks
        run: node .github/scripts/local-validation.mjs ci release-tools
