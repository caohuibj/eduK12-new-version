name: CI runner fleet preparation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  prepare:
    name: prepare isolated ${{ matrix.host }} runner directories
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: mac
            labels: '["self-hosted","macOS","eduk12-mac-ci"]'
          - host: win
            labels: '["self-hosted","Linux","X64","eduk12-win-ci"]'
    # Bootstrap is the only legacy-label exception. It does not register lanes,
    # change legacy services, or run application/database/browser acceptance.
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: validate installer and host isolation
        run: python3 -B -m unittest discover -s ci/runner -p 'test_*.py' -v
      - name: prepare checksum-verified binaries and private lane directories
        env:
          CI_FLEET_HOST: ${{ matrix.host }}
        run: |
          legacy_root="$(python3 -c 'import os,pathlib; print(pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve().parents[2])')"
          python3 -B ci/runner/install-fleet.py prepare --host "$CI_FLEET_HOST" --reuse-light-root "$legacy_root"
      - name: capture non-secret fleet inventory
        run: cp "$HOME/eduk12-ci-fleet/inventory.json" "$RUNNER_TEMP/ci-fleet-inventory.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-fleet-${{ matrix.host }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-fleet-inventory.json
          if-no-files-found: error
          retention-days: 7
