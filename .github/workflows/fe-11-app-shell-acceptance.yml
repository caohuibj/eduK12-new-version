name: FE-11 AppShell Device Accessibility Acceptance
on:
  workflow_call:
    inputs:
      runner_profile:
        type: string
        default: local
      use_build_artifacts:
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fe-11-app-shell-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || vars.CI_FORCE_FULL == 'true'
    uses: ./.github/workflows/ci-ui.yml
    with:
      runner_labels: ${{ vars.CI_MAC_LIGHT_ENABLED == 'true' && '["self-hosted","macOS","eduk12-mac-ci"]' || '["self-hosted","Linux","X64","eduk12-win-ci"]' }}
      engine: chromium
      canonical: false
      app_shell: true
      use_build_artifacts: ${{ inputs.use_build_artifacts || false }}
