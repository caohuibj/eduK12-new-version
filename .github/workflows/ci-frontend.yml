name: CI frontend component

on:
  workflow_call:
    inputs:
      survey_selection:
        type: boolean
        default: false
      runner_labels:
        type: string
        required: true

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  frontend:
    name: frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=3072
      TZ: UTC
    defaults:
      run:
        working-directory: server-version/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs" --frontend
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: dependency audit (high and critical)
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed on attempt $attempt; retrying after transient-registry backoff"
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: full frontend tests
        if: inputs.survey_selection != true
        run: npm test
      - name: affected Wave selector and direct consumers
        if: inputs.survey_selection
        run: |
          npx vitest run src/survey/SurveyWaveContentSelection.test.tsx src/survey/SurveyWaveStudio.content.test.tsx src/survey/SurveyWaveStudio.feedback.test.tsx src/survey/SurveyWaveStudio.group-ip.test.tsx src/survey/SurveyWaveStudio.links.test.tsx src/survey/SurveyWaveStudio.preview.test.tsx --reporter=default --reporter=json --outputFile=/tmp/eduk12-survey-selection-frontend.json
          node ../backend/scripts/assert-release-test-report.mjs /tmp/eduk12-survey-selection-frontend.json src/survey/SurveyWaveContentSelection.test.tsx src/survey/SurveyWaveStudio.content.test.tsx src/survey/SurveyWaveStudio.feedback.test.tsx src/survey/SurveyWaveStudio.group-ip.test.tsx src/survey/SurveyWaveStudio.links.test.tsx src/survey/SurveyWaveStudio.preview.test.tsx
      - name: clean Mac dependencies and outputs after artifact upload
        if: ${{ always() && runner.os == 'macOS' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/mac-ci-cleanup.mjs"

