name: CI frontend component

on:
  workflow_call:
    inputs:
      survey_selection:
        type: boolean
        default: false
      affected_only:
        type: boolean
        default: false
      runner_labels:
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  frontend:
    name: frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=3072
      TZ: UTC
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    defaults:
      run:
        working-directory: server-version/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs" --frontend
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: accept original locked audit and unchanged frontend unit evidence
        if: inputs.survey_selection
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin b65f7d658db33f1ebbf08e655f6d41164ebc653d
          python3 -B .github/scripts/survey-wave-selection-reuse.py frontend
      - name: npm ci
        run: npm ci
      - name: prepare locked backend dependencies for shared contract types and tests
        working-directory: server-version/backend
        run: |
          npm ci --ignore-scripts
          npx prisma generate
      - name: lint
        if: inputs.survey_selection != true && inputs.affected_only != true
        run: npm run lint
      - name: lint changed local page surfaces
        if: inputs.affected_only
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const files=execFileSync('git',['diff','--name-only','-z','--no-renames',process.env.CI_BASE_SHA,'HEAD'],{encoding:'utf8'}).split('\0').filter(file=>/^server-version\/frontend\/src\/.*\.tsx?$/.test(file)).map(file=>file.slice('server-version/frontend/'.length));
          if(!files.length)throw Error('No changed frontend source to lint');
          execFileSync('npm',['exec','--','eslint',...files],{stdio:'inherit'});
          JS
      - name: lint changed Wave integration surfaces
        if: inputs.survey_selection
        run: npx eslint src/survey/SurveyWaveContentSelection.tsx src/survey/SurveyWaveContentSelection.test.tsx src/survey/SurveyWaveStudio.tsx src/survey/SurveyWaveStudio.content.test.tsx src/survey/SurveyWaveStudio.feedback.test.tsx
      - name: typecheck
        if: inputs.survey_selection != true && inputs.affected_only != true
        run: npm run typecheck
      - name: integrated application types without duplicate cognitive subset
        if: inputs.survey_selection || inputs.affected_only
        run: |
          npm run pretypecheck
          npx tsc -p tsconfig.app.json --noEmit
      - name: dependency audit (high and critical)
        if: inputs.survey_selection != true
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed on attempt $attempt; retrying after transient-registry backoff"
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: full frontend tests
        if: inputs.survey_selection != true && inputs.affected_only != true
        run: npm test
      - name: dependency-related frontend tests
        if: inputs.affected_only
        run: |
          npm test -- --changed "$CI_BASE_SHA" --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/frontend-affected.json"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/frontend-affected.json','utf8'));
          if(report.success!==true||!(report.numPassedTests>0)||report.numFailedTests!==0)throw Error('Affected frontend tests missing or failed');
          JS
      - name: affected Wave selector and direct consumers
        if: inputs.survey_selection
        run: |
          npx vitest run src/survey/SurveyWaveStudio.content.test.tsx src/survey/SurveyWaveStudio.feedback.test.tsx src/survey/SurveyWaveStudio.group-ip.test.tsx src/survey/SurveyWaveStudio.links.test.tsx src/survey/SurveyWaveStudio.preview.test.tsx --reporter=default --reporter=json --outputFile=/tmp/eduk12-survey-selection-frontend.json
          node ../backend/scripts/assert-release-test-report.mjs /tmp/eduk12-survey-selection-frontend.json src/survey/SurveyWaveStudio.content.test.tsx src/survey/SurveyWaveStudio.feedback.test.tsx src/survey/SurveyWaveStudio.group-ip.test.tsx src/survey/SurveyWaveStudio.links.test.tsx src/survey/SurveyWaveStudio.preview.test.tsx
      - name: clean Mac dependencies and outputs after artifact upload
        if: ${{ always() && runner.os == 'macOS' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/mac-ci-cleanup.mjs"

