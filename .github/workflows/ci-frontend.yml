name: CI frontend component

on:
  workflow_call:
    inputs:
      authoring_polish:
        type: boolean
        default: false
      student_discovery:
        type: boolean
        default: false
      bundle_runtime:
        type: boolean
        default: false
      bundle_family:
        type: boolean
        default: false
      base_sha:
        type: string
        default: ''
      catalog_discovery:
        type: boolean
        default: false
      affected_only:
        type: boolean
        default: false
      retry_only:
        type: boolean
        default: false
      retry_file:
        type: string
        default: ''
      cognitive_owned_by_backend:
        type: boolean
        default: false
      runner_labels:
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  frontend:
    name: frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STUDENT_DISCOVERY: ${{ inputs.student_discovery }}
      AUTHORING_POLISH: ${{ inputs.authoring_polish }}
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=3072
      TZ: UTC
      CI_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
    defaults:
      run:
        working-directory: server-version/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs" --frontend
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: npm ci
        run: npm ci
      - name: prepare locked backend dependencies for shared contract types and tests
        working-directory: server-version/backend
        run: |
          npm ci --ignore-scripts
          npx prisma generate
      - name: lint
        if: inputs.affected_only != true && !inputs.retry_only
        run: npm run lint
      - name: lint changed local page surfaces
        if: inputs.affected_only && !inputs.retry_only
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const files=execFileSync('git',['diff','--name-only','-z','--no-renames',process.env.CI_BASE_SHA,'HEAD'],{encoding:'utf8'}).split('\0').filter(file=>/^server-version\/frontend\/src\/.*\.tsx?$/.test(file)).map(file=>file.slice('server-version/frontend/'.length));
          if(!files.length)throw Error('No changed frontend source to lint');
          execFileSync('npm',['exec','--','eslint',...files],{stdio:'inherit'});
          JS
      - name: typecheck
        if: inputs.affected_only != true && !inputs.retry_only
        run: npm run typecheck
      - name: integrated application types without duplicate cognitive subset
        if: inputs.affected_only && !inputs.retry_only
        run: |
          if [ "${{ inputs.bundle_family }}" != "true" ] && [ "${{ inputs.bundle_runtime }}" != "true" ] && [ "${{ inputs.student_discovery }}" != "true" ]; then npm run pretypecheck; fi
          npx tsc -p tsconfig.app.json --noEmit
      - name: dependency audit (high and critical)
        if: inputs.affected_only != true && !inputs.retry_only
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed on attempt $attempt; retrying after transient-registry backoff"
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: full frontend tests
        id: full-frontend-tests
        if: inputs.affected_only != true && inputs.cognitive_owned_by_backend != true && !inputs.retry_only
        run: npm test -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/frontend-vitest.json"
      - name: publish original full Vitest verdicts for safe future repair
        if: ${{ always() && steps.full-frontend-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-report-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-vitest.json
          if-no-files-found: error
          retention-days: 3
      - name: rerun exactly the repaired frontend test file after proven full CI
        if: inputs.retry_only
        env:
          RETEST_FILE: ${{ inputs.retry_file }}
        run: |
          npm run lint
          npm run typecheck
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const file=process.env.RETEST_FILE;
          assert(/^src\/[a-zA-Z0-9_./-]+\.(?:test|spec)\.tsx?$/.test(file) && !file.split('/').some(v=>v==='.'||v==='..'), 'Invalid approved frontend test');
          for(let i=1;i<=3;i++){
            const report=join(process.env.RUNNER_TEMP,'frontend-retest-'+i+'.json');
            execFileSync('npm',['exec','--','vitest','run',file,'--maxWorkers=2','--reporter=json','--outputFile='+report],{stdio:'inherit'});
            const result=JSON.parse(readFileSync(report,'utf8'));
            assert(result.success===true && result.numFailedTests===0 && result.numPassedTests>0, 'Targeted frontend regression did not pass');
            assert(result.testResults?.length===1 && result.testResults[0].name.replaceAll('\\','/').endsWith('/server-version/frontend/'+file), 'Different test was executed');
          }
          JS
      - name: frontend tests excluding exact onboarding-owned suites
        if: inputs.affected_only != true && !inputs.retry_only && inputs.cognitive_owned_by_backend
        run: node ../scripts/cognitive/frontend-tests.cjs --onboarding-owned-by-backend
      - name: dependency-related frontend tests
        if: inputs.affected_only && !inputs.retry_only && inputs.catalog_discovery != true
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          // CSS has no TypeScript behavior. Do not use its reverse import graph
          // to select every consumer of a shared stylesheet.
          const files=execFileSync('git',['diff','--name-only','-z','--no-renames',process.env.CI_BASE_SHA,'HEAD'],{encoding:'utf8'}).split('\0').filter(file=>/^server-version\/frontend\/src\/.*\.tsx?$/.test(file)).map(file=>file.slice('server-version/frontend/'.length));
          if(!files.length)throw Error('Missing affected TypeScript source');
          const report='src/training/TrainingGroupReports.tsx', suite=report.replace('.tsx','.test.tsx');
          const selection=files.includes(report)&&files.every(file=>[report,suite].includes(file))?['run',suite]:['related','--run',...files];
          execFileSync('npm',['exec','--','vitest',...selection,'--reporter=default','--reporter=json','--outputFile='+process.env.RUNNER_TEMP+'/frontend-affected.json'],{stdio:'inherit'});
          JS
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/frontend-affected.json','utf8'));
          if(report.success!==true||!(report.numPassedTests>0)||report.numFailedTests!==0)throw Error('Affected frontend tests missing or failed');
          JS
      - name: affected catalog selectors and paging contracts
        if: inputs.catalog_discovery && !inputs.retry_only && !inputs.bundle_family && !inputs.bundle_runtime
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const recipe=process.env.AUTHORING_POLISH==='true'?'scale-authoring-polish-checks.json':process.env.STUDENT_DISCOVERY==='true'?'student-discovery-checks.json':'catalog-discovery-checks.json';
          const checks=JSON.parse(readFileSync('../../.github/config/'+recipe,'utf8'));
          const files=checks.tests.filter(f=>f.startsWith('server-version/frontend/')).map(f=>f.slice('server-version/frontend/'.length));
          execFileSync('npm',['test','--',...files,'--reporter=default','--reporter=json','--outputFile=/tmp/catalog-frontend.json'],{stdio:'inherit'});
          execFileSync(process.execPath,['../backend/scripts/assert-release-test-report.mjs','/tmp/catalog-frontend.json',...files],{stdio:'inherit'});
          JS
      - name: affected frozen Bundle report components
        if: inputs.bundle_runtime && !inputs.retry_only
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const {frontendChecks:files}=JSON.parse(readFileSync('../../.github/config/bundle-runtime-checks.json','utf8'));
          execFileSync('npm',['test','--',...files,'--reporter=default','--reporter=json','--outputFile=/tmp/bundle-runtime-frontend.json'],{stdio:'inherit'});
          execFileSync(process.execPath,['../backend/scripts/assert-release-test-report.mjs','/tmp/bundle-runtime-frontend.json',...files],{stdio:'inherit'});
          JS
      - name: clean Mac dependencies and outputs after artifact upload
        if: ${{ always() && runner.os == 'macOS' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/mac-ci-cleanup.mjs"

