name: C8MapRelationalFKs

on:
  push:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ra-01-relational-assessment-core
          fetch-depth: 0
      - run: python3 server-version/scripts/c8-map-relational-fks.py
      - name: commit schema map
        shell: bash
        run: |
          if git diff --quiet -- server-version/backend/prisma/schema.prisma; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-version/backend/prisma/schema.prisma
          git commit -m "wip C8 map Prisma relational FKs"
          git push origin HEAD:feat/ra-01-relational-assessment-core
