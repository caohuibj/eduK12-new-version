name: PR382 isolated Chrome environment verification
# Temporary environment evidence only; never application or merge admission.
on:
  push:
    branches: [ci/pr382-chrome-environment-20261029]
permissions:
  contents: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
jobs:
  environment:
    if: github.repository == 'caohuibj/eduK12-new-version' && github.event_name == 'push' && github.ref == 'refs/heads/ci/pr382-chrome-environment-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: install only the existing locked release tools from the official registry
        working-directory: .github/release-tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: tighten only the explicitly approved and dynamically verified Chrome scope
        env:
          SCHOOL_TEACHER_CHROME_TIGHTEN: confirmed-self-package-scope
        run: node server-version/e2e/school-teacher-chrome-permissions.cjs tighten
      - name: verify the sandbox and only the repaired locator against synthetic DOM
        run: |
          node <<'NODE'
          'use strict'
          const fs = require('node:fs'), path = require('node:path')
          const { createHash } = require('node:crypto')
          const { preflightChrome, CHROME_LAUNCH_OPTIONS, verifyChromeSandbox, validateChromeEvidence } = require('./server-version/e2e/school-teacher-chrome.cjs')
          const repo = process.cwd(), report = { schemaVersion: 1, purpose: 'PR382_CHROME_ENVIRONMENT_ONLY', acceptance: false,
            applicationQualified: false, browserLaunched: false, status: 'FAILED',
            reviewedFix: '0b6b3a31ce5a384abaafff6568d56329fec3174d',
            source: { sha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT },
            runner: { imageOS: process.env.ImageOS, imageVersion: process.env.ImageVersion, node: process.version },
            launchOptions: CHROME_LAUNCH_OPTIONS }
          let browser, stage = 'STRICT_PREFLIGHT'
          ;(async () => {
            try {
              report.preflight = preflightChrome({ repo, diagnostics: true })
              if (!report.preflight.ok) { report.code = report.preflight.code; return }
              stage = 'SANDBOXED_LAUNCH'
              const { chromium } = require(path.join(repo, '.github/release-tools/node_modules/playwright-core'))
              browser = await chromium.launch(CHROME_LAUNCH_OPTIONS); report.browserLaunched = true
              stage = 'SANDBOX_OBSERVATION'
              report.sandbox = await verifyChromeSandbox(browser)
              const checked = validateChromeEvidence({ options: CHROME_LAUNCH_OPTIONS, preflight: report.preflight, sandbox: report.sandbox })
              if (!checked.ok) { report.code = checked.code; return }
              stage = 'SELECTOR_SYNTHETIC_DOM'
              const assert = require('node:assert/strict')
              const source = fs.readFileSync(path.join(repo, 'server-version/e2e/education-self-questionnaire.cjs'), 'utf8')
              assert.equal(createHash('sha256').update(source).digest('hex'), '9d1fa6d1ac6fdbc56bbbb8a63d956515fe33346d18e82785898f7fa26d680dc5')
              const line = source.split('\n').find(row => row.includes("catalog.locator('article').filter(") && row.includes("name:'加入共用量表'"))
              const expression = line.trim().slice('await '.length, line.trim().indexOf(".getByRole('button'"))
              const p = await browser.newPage(), title = '合成获授权共用量表 精确来源', f = { library: { title } }
              await p.setContent(`<section aria-label="普通问卷编制"><section aria-label="获授权共用量表"><article><strong>${title} 附录</strong><button data-source="decoy" onclick="window.picked.push(this.dataset.source)">加入共用量表</button></article><article><strong>${title}</strong><button data-source="expected" onclick="window.picked.push(this.dataset.source)">加入共用量表</button></article></section></section><section aria-label="其他目录"><article><strong>${title}</strong><button data-source="outside" onclick="window.picked.push(this.dataset.source)">加入共用量表</button></article></section><script>window.picked=[]</script>`)
              const catalog = p.getByRole('region', { name: '普通问卷编制', exact: true }).getByRole('region', { name: '获授权共用量表', exact: true })
              const oldMatches = await catalog.locator('article').filter({ has: catalog.locator('strong').filter({ hasText: title }) }).count()
              const card = new Function('catalog', 'p', 'f', 'return (' + expression + ')')(catalog, p, f)
              const correctedMatches = await card.count()
              report.selectorDom = { scope: 'SYNTHETIC_DOM_ONLY', sourceCommit: '9b0aec2b576405b4eabdd2fcffe79f78b8520282', helperSha256: createHash('sha256').update(source).digest('hex'), oldMatches, correctedMatches }
              assert.equal(oldMatches, 0); assert.equal(correctedMatches, 1)
              await card.getByRole('button', { name: '加入共用量表', exact: true }).click()
              report.selectorDom.clicked = await p.evaluate(() => window.picked)
              assert.deepEqual(report.selectorDom.clicked, ['expected']); report.selectorDom.status = 'PASS'
              stage = 'TEACHER_PUBLICATION_SELECTOR_DOM'
              const publication = fs.readFileSync(path.join(repo, 'server-version/e2e/school-teacher-browser.cjs'), 'utf8')
              const publicationLine = publication.split('\n').find(row => row.includes("const picker=scope.locator('details').filter("))
              const publicationExpression = publicationLine.trim().slice('const picker='.length)
              await p.setContent(`<section aria-label="评价活动"><article class="ht-event"><strong>目标活动</strong><details id="expected-picker"><summary>选用本人普通问卷</summary><button>选择固定版本</button></details></article><article class="ht-event"><strong>其他活动</strong><details id="outside-picker"><summary>选用本人普通问卷</summary></details></article></section>`)
              const scope = p.getByRole('region', { name: '评价活动', exact: true }).locator('article.ht-event').filter({ has: p.getByText('目标活动', { exact: true }) })
              const oldPickerMatches = await scope.locator('details').filter({ has: scope.locator('summary').filter({ hasText: '选用本人普通问卷' }) }).count()
              const picker = new Function('scope', 's', 'return (' + publicationExpression + ')')(scope, { page: p })
              const correctedPickerMatches = await picker.count()
              report.publicationSelectorDom = { scope: 'SYNTHETIC_DOM_ONLY', sourceCommit: 'a1c203608290f9a58500a005ae866c14d8db6cee', publicationSha256: createHash('sha256').update(publication).digest('hex'), oldMatches: oldPickerMatches, correctedMatches: correctedPickerMatches }
              assert.equal(oldPickerMatches, 0); assert.equal(correctedPickerMatches, 1)
              await picker.locator('summary').click()
              assert.equal(await picker.getAttribute('id'), 'expected-picker')
              assert.equal(await picker.evaluate(node => node.open), true)
              report.publicationSelectorDom.openedExpectedOnly = await p.locator('#outside-picker').evaluate(node => !node.open)
              assert.equal(report.publicationSelectorDom.openedExpectedOnly, true); report.publicationSelectorDom.status = 'PASS'
              await p.close()
              report.status = 'ENVIRONMENT_READY'; report.code = 'CHROME_ENVIRONMENT_VERIFIED'
            } catch (error) {
              report.code = 'CHROME_ENVIRONMENT_OPERATION_FAILED'
              const message = String(error)
              // Emit only fixed public causes, never arbitrary stderr, argv or tokens.
              const reasons = [
                [/No usable sandbox/i, 'No usable sandbox'], [/Failed to move to new namespace/i, 'Failed to move to new namespace'],
                [/Operation not permitted/i, 'Operation not permitted'], [/SUID sandbox helper binary.+not configured correctly/i, 'SUID sandbox helper configuration is invalid'],
                [/error while loading shared libraries/i, 'Missing Chrome shared library'], [/Permission denied|EACCES/i, 'Permission denied'],
                [/ENOENT|No such file or directory/i, 'Required executable or file not found'], [/Timeout.+exceeded/i, 'Browser operation timed out'],
                [/Target page, context or browser has been closed/i, 'Browser closed during operation'], [/SIGTRAP|SIGSEGV|Received signal/i, 'Chrome terminated by signal']
              ]
              report.publicReasons = reasons.filter(([pattern]) => pattern.test(message)).map(([, reason]) => reason)
              report.errorKind = ['Error', 'TimeoutError'].includes(error?.name) ? error.name : 'UNCLASSIFIED_ERROR'
              report.errorDigest = createHash('sha256').update(message).digest('hex')
            } finally {
              report.stage = stage
              if (browser) { try { await browser.close() } catch { report.status = 'FAILED'; report.code = 'BROWSER_CLOSE_FAILED' } }
              try {
                fs.writeFileSync(path.join(repo, 'school-teacher-evidence/chrome-environment.json'), JSON.stringify(report, null, 2) + '\n', { mode: 0o600, flag: 'wx' })
              } catch { report.status = 'FAILED'; report.code = 'ENVIRONMENT_EVIDENCE_WRITE_FAILED' }
              process.stdout.write('CHROME_ENVIRONMENT ' + JSON.stringify(report) + '\n')
              process.exitCode = report.status === 'ENVIRONMENT_READY' ? 0 : 1
            }
          })()
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr382-chrome-environment-${{ github.sha }}
          path: |
            school-teacher-evidence/chrome-permissions.json
            school-teacher-evidence/chrome-environment.json
          if-no-files-found: error
          retention-days: 3
