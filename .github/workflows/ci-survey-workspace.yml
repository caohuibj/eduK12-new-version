name: Survey workspace bounded merge checks
on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
permissions:
  contents: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
  CI_EVENT: pull_request
  CI_HEAD_REF: work/survey-visual-20261022
  CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
  CI_PR_REPOSITORY: caohuibj/eduK12-new-version
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify reviewed original local records and immutable inputs
        run: node .github/scripts/survey-workspace-checks.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: survey-workspace-admission-${{ github.sha }}
          path: survey-workspace-evidence
          if-no-files-found: error
          retention-days: 3
  frontend:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: server-version/frontend/package-lock.json
      - name: install official locked compiler dependencies
        working-directory: server-version/frontend
        run: npm ci --ignore-scripts
      - name: typecheck the integrated application
        working-directory: server-version/frontend
        run: node node_modules/typescript/bin/tsc -p tsconfig.app.json --noEmit
      - name: compile frontend exactly once
        working-directory: server-version/frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survey-workspace-frontend-${{ github.sha }}
          path: server-version/frontend/dist
          if-no-files-found: error
          retention-days: 3
  browser:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@v4
        with:
          name: survey-workspace-frontend-${{ github.sha }}
          path: server-version/frontend/dist
      - name: install locked browser tools
        run: |
          npm ci --ignore-scripts --prefix .github/release-tools
          node .github/release-tools/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: verify compiled Survey entry, studios, application and study sections
        run: node .github/scripts/survey-workspace-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survey-workspace-browser-${{ github.sha }}
          path: survey-workspace-evidence
          if-no-files-found: error
          retention-days: 3
  backend:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: survey_ci_only
          POSTGRES_DB: survey_upgrade
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:survey_ci_only@127.0.0.1:5432/survey_upgrade
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: survey_ci_only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: server-version/backend/package-lock.json
      - name: install official locked backend dependencies
        working-directory: server-version/backend
        run: npm ci --ignore-scripts
      - name: validate and generate the corrected Prisma model
        working-directory: server-version/backend
        run: |
          node node_modules/prisma/build/index.js validate
          node node_modules/prisma/build/index.js generate
          node node_modules/typescript/bin/tsc --noEmit
      - name: upgrade from main and restore only disposable synthetic database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          node .github/scripts/survey-workspace-migration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survey-workspace-backend-${{ github.sha }}
          path: survey-workspace-evidence
          if-no-files-found: error
          retention-days: 3
