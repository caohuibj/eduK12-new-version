name: Training assessment affected qualification
on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
  CI_EVENT: pull_request
  CI_HEAD_REF: work/training-assessment-performance-20261023
  CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
  CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
  CI_PR_NUMBER: ${{ github.event.pull_request.number }}
  PLAN: ${{ inputs.plan }}
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify frozen scope and existing local builds without repeating them
        run: node .github/scripts/training-assessment-checks.mjs admission
      - name: execute new scope and merge refusal contracts
        run: node --test .github/scripts/training-assessment.test.mjs
      - name: reuse exact official successful unchanged dependency audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/participant-access-checks.mjs audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-assessment-admission-${{ github.sha }}
          path: |
            training-assessment-evidence
            participant-access-evidence/official-audit-reuse.json
          if-no-files-found: error
          retention-days: 3
  frontend:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: server-version/frontend/package-lock.json
      - name: install official locked frontend dependencies
        working-directory: server-version/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: lint only changed frontend source and tests
        run: |
          node --input-type=module - <<'JS'
          import {execFileSync} from 'node:child_process';
          import {binding} from './.github/scripts/training-assessment-scope.mjs';
          const files=Object.keys(binding.source).filter(f=>/^server-version\/frontend\/src\/.*\.(ts|tsx)$/.test(f)).map(f=>f.replace('server-version/frontend/',''));
          execFileSync(process.execPath,['node_modules/eslint/bin/eslint.js',...files],{cwd:'server-version/frontend',stdio:'inherit'});
          JS
      - name: check affected app and cognitive TypeScript contracts once
        working-directory: server-version/frontend
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.app.json --noEmit
          node node_modules/typescript/bin/tsc -p tsconfig.cognitive.json --noEmit
      - name: execute only affected runner media and persistence assertions
        run: node .github/scripts/training-assessment-checks.mjs frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-assessment-frontend-${{ github.sha }}
          path: training-assessment-evidence
          if-no-files-found: error
          retention-days: 3
  backend:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:5432/unused_compile_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: server-version/backend/package-lock.json
      - name: install official locked backend dependencies
        working-directory: server-version/backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: generate types from unchanged schema without a database
        working-directory: server-version/backend
        run: node node_modules/prisma/build/index.js generate
      - name: compile affected backend candidate once
        working-directory: server-version/backend
        run: node node_modules/typescript/bin/tsc -p tsconfig.json
      - name: execute selector permission and projection assertions
        run: node .github/scripts/training-assessment-checks.mjs backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-assessment-backend-${{ github.sha }}
          path: |
            training-assessment-evidence
            server-version/backend/dist
          if-no-files-found: error
          retention-days: 3
  qualified:
    needs: [admission, frontend, backend]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: require every selected component to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node -e 'const n=JSON.parse(process.env.NEEDS);for(const k of ["admission","frontend","backend"])if(n[k]?.result!=="success")throw Error(k+" did not succeed")'
