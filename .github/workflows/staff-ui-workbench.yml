name: Staff UI review workspace (temporary)

on:
  push:
    branches: [feat/staff-experience-upgrade]
    paths: [.github/workflows/staff-ui-workbench.yml]

permissions:
  contents: read

concurrency:
  group: staff-ui-review-workspace
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: [self-hosted, linux, eduk12-win-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact tracked source including interrupted review payload
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/staff-ui-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$work/output"
          git archive --format=tar HEAD > "$work/output/source.tar"
          git rev-parse HEAD > "$work/output/source.sha"
          sha256sum "$work/output/source.tar" > "$work/output/SHA256SUMS"
          echo "STAFF_UI_REVIEW_OUTPUT=$work/output" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: staff-ui-review-workspace
          path: ${{ env.STAFF_UI_REVIEW_OUTPUT }}
          retention-days: 1
          if-no-files-found: error
