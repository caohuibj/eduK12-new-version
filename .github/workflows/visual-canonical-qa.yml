name: Visual QA Canonical Screens
on:
  workflow_call:
    inputs:
      runner_profile:
        type: string
        default: local
      engine:
        type: string
        default: all
      use_build_artifacts:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      engine:
        type: choice
        options: [all, chromium, firefox, webkit]
        default: all
permissions:
  contents: read
  actions: read
concurrency:
  group: visual-canonical-qa-${{ github.event.pull_request.number || github.ref }}-${{ inputs.engine || 'all' }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || vars.CI_FORCE_FULL == 'true'
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(inputs.engine == 'chromium' && '["chromium"]' || inputs.engine == 'firefox' && '["firefox"]' || inputs.engine == 'webkit' && '["webkit"]' || '["chromium","firefox","webkit"]') }}
    uses: ./.github/workflows/ci-ui.yml
    with:
      runner_labels: ${{ matrix.engine == 'chromium' && vars.CI_MAC_LIGHT_ENABLED == 'true' && '["self-hosted","macOS","eduk12-mac-ci"]' || '["self-hosted","Linux","X64","eduk12-win-ci"]' }}
      engine: ${{ matrix.engine }}
      canonical: true
      app_shell: false
      use_build_artifacts: ${{ inputs.use_build_artifacts || false }}
