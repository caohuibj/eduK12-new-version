name: Visual QA Canonical Screens

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/visual-canonical-qa.yml'
      - 'server-version/e2e/visual-canonical-browser-e2e.cjs'
      - 'server-version/frontend/src/index.css'
      - 'server-version/frontend/src/components/app-shell/**'
      - 'server-version/frontend/src/components/product-ui/**'
      - 'server-version/frontend/src/components/auth/**'
      - 'server-version/frontend/src/components/student-ui/**'
      - 'server-version/frontend/src/components/parent-ui/**'
      - 'server-version/frontend/src/components/staff-ui/**'
      - 'server-version/frontend/src/components/public-ui/**'
      - 'server-version/frontend/src/components/classroom-ui/**'
      - 'server-version/frontend/src/components/assessment-ui/**'
      - 'server-version/frontend/src/components/shared-ui/**'
      - 'server-version/frontend/src/pages/Portal.tsx'
      - 'server-version/frontend/src/pages/*Login.tsx'
      - 'server-version/frontend/src/pages/ScaleLibrary.tsx'
      - 'server-version/frontend/src/pages/CourseList.tsx'
      - 'server-version/frontend/src/pages/student/**'
      - 'server-version/frontend/src/pages/parent/**'
      - 'server-version/frontend/src/pages/teacher/TeacherProfile.tsx'
      - 'server-version/frontend/src/pages/organization/OrganizationIndexPage.tsx'
      - 'server-version/frontend/src/modules/reporting/**'
      - 'server-version/frontend/src/modules/cognitive/Cognitive*ReportCard.tsx'
      - 'server-version/frontend/src/modules/cognitive/pages/CognitiveResult.tsx'
      - 'server-version/frontend/src/modules/composite/*Report*.tsx'
      - 'server-version/frontend/src/pages/bundle/BundleReport.tsx'
      - 'server-version/frontend/src/modules/cognitive/pages/CognitiveHistory.tsx'
  workflow_dispatch:

concurrency:
  group: visual-canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-visual-qa:
    name: canonical 390 / 768 / 1440 screenshot matrix
    runs-on:
      - self-hosted
      - linux
      - eduk12-mac-ci
    timeout-minutes: 20
    env:
      VISUAL_QA_BASE_URL: http://127.0.0.1:5173
      VISUAL_QA_EVIDENCE_DIR: /tmp/eduk12-visual-qa
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
    defaults:
      run:
        working-directory: server-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: configure runner-local npm and Playwright caches
        run: |
          mkdir -p "$HOME/.npm" "$HOME/.cache/ms-playwright" "$HOME/.cache/eduk12-ci"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      - name: backend npm ci for Playwright runtime
        working-directory: server-version/backend
        run: npm ci
      - name: prepare Chromium
        working-directory: server-version/backend
        run: |
          playwright_version="$(node -p "require('playwright-core/package.json').version")"
          deps_marker="$HOME/.cache/eduk12-ci/playwright-deps-${playwright_version}"
          if [ ! -f "$deps_marker" ]; then
            npx playwright-core install-deps chromium
            touch "$deps_marker"
          fi
          npx playwright-core install chromium
      - name: frontend npm ci
        working-directory: server-version/frontend
        run: npm ci
      - name: build production frontend
        working-directory: server-version/frontend
        run: npm run build
      - name: start production preview
        run: |
          rm -rf "$VISUAL_QA_EVIDENCE_DIR"
          nohup setsid npm --prefix frontend run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/eduk12-visual-qa-frontend.log 2>&1 &
          echo $! > /tmp/eduk12-visual-qa-frontend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eduk12-visual-qa-frontend.log
          exit 1
      - name: capture canonical visual matrix
        run: node e2e/visual-canonical-browser-e2e.cjs
      - name: upload canonical visual evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: canonical-visual-qa-${{ github.sha }}
          path: |
            /tmp/eduk12-visual-qa
            /tmp/eduk12-visual-qa-frontend.log
          if-no-files-found: ignore
          retention-days: 7
      - name: stop frontend
        if: always()
        run: |
          if [ -f /tmp/eduk12-visual-qa-frontend.pid ]; then
            kill -- -$(cat /tmp/eduk12-visual-qa-frontend.pid) || true
          fi
