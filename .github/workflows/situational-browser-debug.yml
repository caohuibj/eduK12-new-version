name: Situational Browser Debug

on:
  workflow_dispatch:
    inputs:
      runner_profile:
        type: choice
        options: [hybrid, hosted]
        default: hybrid
      target_ref:
        description: 'Optional branch, tag, or commit SHA to debug; defaults to the dispatched ref'
        required: false
        type: string

permissions:
  contents: read

jobs:
  browser-debug:
    name: seeded Situational Bundle browser debug
    runs-on: ${{ inputs.runner_profile == 'hosted' && fromJSON('["ubuntu-24.04"]') || (inputs.runner_profile != 'hybrid' && vars.CI_RUNNER_PROFILE == 'hosted') && fromJSON('["ubuntu-24.04"]') || fromJSON('["self-hosted","Linux","X64","eduk12-win-ci"]') }}
    timeout-minutes: 25
    env:
      NODE_ENV: test
      PORT: '3000'
      DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      JWT_SECRET: ci-jwt-secret-123456789012345678901234
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATA_PSEUDONYM_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      ASSET_SIGNING_SECRET: ci-asset-signing-secret-123456789012345678901234
      ASSET_MIGRATION_COMPLETE: 'false'
      COOKIE_SECURE: 'false'
      CORS_ORIGIN: http://127.0.0.1:5173
      REDIS_URL: redis://localhost:6379
      SOCKET_REDIS_REQUIRED: 'true'
      COGNITIVE_MODULE_ENABLED: 'true'
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      BACKGROUND_WORKERS_ENABLED: 'false'
      TRUST_PROXY_HOPS: '0'
      LOG_LEVEL: warn
      UPLOAD_DIR: /tmp/eduk12-situational-bundle-e2e-uploads
      CREDENTIAL_HANDOFF_DIR: /tmp/eduk12-situational-bundle-e2e-credentials
      SITUATIONAL_STATIC_VISUAL_FIXTURE: 'true'
      SITUATIONAL_BUNDLE_E2E_INSTRUMENT_KEY: sjt-static-visual-e2e-fixture
      SITUATIONAL_BUNDLE_E2E_FIXTURE_FILE: /tmp/eduk12-situational-bundle-fixture.json
      SITUATIONAL_BUNDLE_E2E_BASE_URL: http://127.0.0.1:5173
      SITUATIONAL_BUNDLE_E2E_SCREENSHOT_DIR: /tmp/eduk12-situational-bundle-e2e
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: ptool
          POSTGRES_PASSWORD: ptool123
          POSTGRES_DB: ptool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptool -d ptool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server-version
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.sha }}
      - name: check CI disk headroom
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-disk-preflight.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs"
      - name: report debug target
        run: |
          echo "Debugging commit: $(git rev-parse HEAD)"
          echo "Requested ref: ${TARGET_REF:-<dispatched ref>}"
        env:
          TARGET_REF: ${{ inputs.target_ref }}
      - name: configure runner-local npm and Playwright caches
        run: |
          mkdir -p "$HOME/.npm" "$HOME/.cache/ms-playwright" "$HOME/.cache/eduk12-ci"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      - name: backend npm ci
        working-directory: server-version/backend
        run: npm ci
      - name: prepare Chromium
        working-directory: server-version/backend
        run: |
          playwright_version="$(node -p "require('playwright-core/package.json').version")"
          deps_marker="$HOME/.cache/eduk12-ci/playwright-deps-${playwright_version}"
          if [ ! -f "$deps_marker" ]; then
            npx playwright-core install-deps chromium
            touch "$deps_marker"
          fi
          npx playwright-core install chromium
      - name: frontend npm ci
        working-directory: server-version/frontend
        run: npm ci
      - name: prepare database
        working-directory: server-version/backend
        run: |
          npx prisma generate
          npm run db:migrate:guarded
          npm run db:seed
        env:
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password-2026
      - name: build backend
        working-directory: server-version/backend
        run: npm run build
      - name: seed isolated Bundle fixture
        working-directory: server-version/backend
        run: npx tsx ../e2e/situational-bundle-browser-fixture.ts
      - name: start backend
        run: |
          mkdir -p "$UPLOAD_DIR" "$CREDENTIAL_HANDOFF_DIR"
          nohup setsid node backend/dist/index.js > /tmp/eduk12-situational-bundle-backend.log 2>&1 &
          echo $! > /tmp/eduk12-situational-bundle-backend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eduk12-situational-bundle-backend.log
          exit 1
      - name: start frontend
        run: |
          nohup setsid npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 > /tmp/eduk12-situational-bundle-frontend.log 2>&1 &
          echo $! > /tmp/eduk12-situational-bundle-frontend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eduk12-situational-bundle-frontend.log
          exit 1
      - name: run seeded browser acceptance
        run: node e2e/situational-bundle-browser-e2e.cjs
      - name: upload browser evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: situational-browser-debug-evidence
          path: |
            /tmp/eduk12-situational-bundle-e2e
            /tmp/eduk12-situational-bundle-backend.log
            /tmp/eduk12-situational-bundle-frontend.log
          if-no-files-found: ignore
      - name: stop debug services
        if: always()
        run: |
          if [ -f /tmp/eduk12-situational-bundle-frontend.pid ]; then kill -- -$(cat /tmp/eduk12-situational-bundle-frontend.pid) || true; fi
          if [ -f /tmp/eduk12-situational-bundle-backend.pid ]; then kill -- -$(cat /tmp/eduk12-situational-bundle-backend.pid) || true; fi
      - name: remove this job's ephemeral service containers and anonymous volumes
        if: always()
        env:
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          CI_REDIS_SERVICE_ID: ${{ job.services.redis.id }}
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-cleanup-services.sh"
