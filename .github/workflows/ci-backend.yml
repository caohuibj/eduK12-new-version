name: CI backend component

on:
  workflow_call:
    inputs:
      runner_labels:
        type: string
        required: true
      run_performance_tests:
        type: boolean
        default: true
        description: 'False only for an independently verified functional-only integration; all functional checks remain mandatory'
      admin_permissions_functional:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  backend:
    name: ${{ inputs.run_performance_tests && 'backend (migrate + build + performance gate)' || 'backend (migrate + build + functional gate; performance not executed)' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      COGNITIVE_INTEGRATION_DB_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR8_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR26_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR34_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR38_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      V32_1_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      V32_2_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      V32_3_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      BUNDLE_PRODUCT_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      SITUATIONAL_BUNDLE_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      INSTRUMENT_FINAL_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      RELEASE_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      UPLOAD_DIR: /tmp/eduk12-ci-uploads
      JWT_SECRET: ci-jwt-secret-123456789012345678901234
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATA_PSEUDONYM_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      COGNITIVE_MODULE_ENABLED: 'true'
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: ptool
          POSTGRES_PASSWORD: ptool123
          POSTGRES_DB: ptool
        ports:
          - 5432:5432
        # 保持与正式 release gate 相同的持久化语义（默认 durability），
        # 串行执行已实测满足 200 并发完成门（<10s SLA）。
        # services.postgres.options 是 docker create 参数：这里的 -c 会被
        # docker 解析为 --cpu-shares（非法值，服务直接起不来）；要给 PG
        # 传启动参数必须走 services.postgres.command。
        options: >-
          --health-cmd "pg_isready -U ptool -d ptool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server-version/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: clear reports from previous backend jobs
        run: rm -f /tmp/eduk12-backend-performance-vitest.json /tmp/eduk12-ci-env.txt /tmp/eduk12-backend-functional-vitest.json
      - name: check CI disk headroom
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-disk-preflight.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify explicit Training scope before omitting performance
        if: ${{ !inputs.run_performance_tests && !inputs.admin_permissions_functional }}
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
        working-directory: .
        run: node .github/scripts/training-functional.mjs verify-backend
      - name: verify explicit administrator scope before its functional checks
        if: inputs.admin_permissions_functional
        env:
          RUN_PERFORMANCE_TESTS: ${{ inputs.run_performance_tests }}
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
        working-directory: .
        run: |
          test "$RUN_PERFORMANCE_TESTS" = false
          node .github/scripts/admin-permissions-functional.mjs verify-backend
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs"
      - name: configure runner-local npm cache
        run: |
          mkdir -p "$HOME/.npm"
          echo "NPM_CONFIG_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: prepare canvas source-build dependencies
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-install-canvas-deps.sh"
      - name: npm ci
        run: npm ci
      - name: dependency audit (high and critical)
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed on attempt $attempt; retrying after transient-registry backoff"
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: content routing boundary tests
        run: node --test ../../.github/scripts/cognitive-content.test.mjs ../../.github/scripts/content-workflows.test.mjs
      - name: prisma generate
        run: npx prisma generate
      # Compile before seeding, upgrade rehearsal and long-running data gates.
      # One actual backend build; later jobs consume this exact verified artifact.
      - name: build (tsc) — fail fast on source/type errors
        run: npm run build
      - name: prisma migrate deploy
        run: npm run db:migrate:guarded
      - name: seed reference and configuration data
        run: npm run db:seed
        env:
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password-2026
      - name: backfill and validate check-in token protection
        run: npm run db:backfill:checkin-tokens
      - name: guarded migration idempotency after seeded data
        run: npm run db:migrate:guarded
      - name: PR3 populated baseline-to-head upgrade rehearsal
        run: node scripts/pr3-baseline-upgrade-rehearsal.mjs
      - name: prepare release preflight upload directory
        run: mkdir -p "$UPLOAD_DIR"
      - name: read-only release data preflight
        run: npm run db:release:preflight
      - name: verify SJT immutable releases and publication authority
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$PUBLICATION_BASE_SHA"
          npm run situational:onboarding-check -- --all --verify-reviews --base "$PUBLICATION_BASE_SHA"
      - name: cognitive task manifests and dependency boundaries
        run: npm run cognitive:contracts
      - name: Cognitive onboarding with frontend acceptances
        run: bash "$GITHUB_WORKSPACE/.github/scripts/cognitive-ci-diagnostics.sh"
      - name: Bundle content and immutable history
        env:
          BUNDLE_CONTENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npx tsx scripts/bundle-content-check.ts
      - name: bind backend artifact to source and run
        run: node "$GITHUB_WORKSPACE/.github/scripts/ci-artifact.mjs" write backend
      - name: publish tested backend build
        id: backend-build-upload
        # GitHub artifact creation/finalization can reset connections. Retry
        # with bounded backoff; the final attempt must succeed or fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: server-version/backend/dist
          retention-days: 1
          if-no-files-found: error
      - name: wait before retrying backend build upload
        if: ${{ !cancelled() && steps.backend-build-upload.outcome == 'failure' }}
        run: sleep 15
      - name: retry backend build upload
        id: backend-build-upload-retry
        continue-on-error: true
        if: ${{ !cancelled() && steps.backend-build-upload.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: server-version/backend/dist
          retention-days: 1
          if-no-files-found: error
          # Finalization may have succeeded remotely before the connection reset.
          overwrite: true
      - name: wait before final backend build upload
        if: ${{ !cancelled() && steps.backend-build-upload-retry.outcome == 'failure' }}
        run: sleep 45
      - name: final backend build upload
        if: ${{ !cancelled() && steps.backend-build-upload-retry.outcome == 'failure' }}
        # Do not ignore this failure: browser must consume this run's exact build.
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: server-version/backend/dist
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      - name: prelaunch load and resource contract self-tests
        run: node --test ../scripts/load/prelaunch-mixed-load.test.mjs ../scripts/prelaunch-resource-preflight.test.mjs
      - name: Wave1 calibration generator contracts
        run: python3 scripts/learning-motivation-wave1/test_reference_generation.py
      - name: 200-completion performance and report integrity gate
        if: inputs.run_performance_tests
        # Keep the <10s burst on its own hosted VM and durable PostgreSQL.
        run: npm test -- src/__tests__/questionnaire/aggregate-report.postgres.integration.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-backend-performance-vitest.json
      - name: aggregate encryption, readability and terminal replay functional contracts
        if: ${{ !inputs.run_performance_tests }}
        # Match both functional cases exactly. The 200-completion case remains
        # visibly unexecuted in JSON and is never reported as performance passed.
        run: npm test -- src/__tests__/questionnaire/aggregate-report.postgres.integration.test.ts --testNamePattern='(writes ciphertext only and keeps the report readable through the service|keeps one terminal report and timestamp across concurrent completion and replay)$' --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-backend-functional-vitest.json
      - name: capture CI environment snapshot
        if: always()
        run: |-
          {
            echo "node $(node -v)"
            echo "cpus $(nproc)"
            grep -E 'MemTotal|MemAvailable' /proc/meminfo
            df -h /tmp | tail -1
            date -u +"timestamp %FT%TZ"
          } > /tmp/eduk12-ci-env.txt
      - name: performance suite must not skip
        if: inputs.run_performance_tests
        run: node scripts/assert-release-test-report.mjs /tmp/eduk12-backend-performance-vitest.json src/__tests__/questionnaire/aggregate-report.postgres.integration.test.ts
      - name: functional aggregate must have exactly two passes and only the named performance nonexecution
        if: ${{ !inputs.run_performance_tests }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/training-functional-report.mjs" /tmp/eduk12-backend-functional-vitest.json
      - name: administrator real PostgreSQL, HTTP, ceremony and migration recovery contracts
        if: inputs.admin_permissions_functional
        timeout-minutes: 8
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          ADMIN_PERMISSIONS_ISOLATED_TEST: '1'
          ADMIN_PERMISSIONS_PRIVATE_DIR: ${{ runner.temp }}/admin-permissions-private
          DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/eduk12_admin_permissions_ci_backend?schema=public
          REDIS_URL: redis://localhost:6379/8
          PORT: '3100'
          CORS_ORIGIN: http://localhost:5174
          ADMIN_WEBAUTHN_RP_ID: localhost
          ADMIN_WEBAUTHN_ORIGIN: http://localhost:5174
          SURVEY_WORKSPACE_ENABLED: 'true'
          HUITEACHER_WORKSPACE_ENABLED: 'true'
          BACKGROUND_WORKERS_ENABLED: 'false'
          UPLOAD_DIR: ${{ runner.temp }}/admin-permissions-private/uploads
          EXPORT_DIR: ${{ runner.temp }}/admin-permissions-private/exports
          ADMIN_USERNAME: ci-admin-permissions-reference
          ADMIN_PASSWORD: ci-admin-permissions-reference-2026
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$ADMIN_PERMISSIONS_PRIVATE_DIR" "$UPLOAD_DIR" "$EXPORT_DIR"
          admin_api_pid=''
          cleanup_admin() {
            if [ -n "$admin_api_pid" ]; then kill -- -"$admin_api_pid" 2>/dev/null || true; fi
            rm -rf -- "$ADMIN_PERMISSIONS_PRIVATE_DIR"
          }
          trap cleanup_admin EXIT
          docker exec "$CI_POSTGRES_SERVICE_ID" createdb -U ptool eduk12_admin_permissions_ci_backend
          npm run db:migrate:guarded
          npm run db:seed
          nohup setsid node dist/index.js > "$ADMIN_PERMISSIONS_PRIVATE_DIR/api.log" 2>&1 &
          admin_api_pid=$!
          ready=false
          for attempt in $(seq 1 50); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3100/ready >/dev/null; then ready=true; break; fi
            if ! kill -0 "$admin_api_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$ready" = true
          files=(src/__tests__/admin-permissions/*.postgres.integration.test.ts)
          test "${#files[@]}" -eq 10
          npx vitest run "${files[@]}" --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile="$ADMIN_PERMISSIONS_PRIVATE_DIR/vitest.json"
          node scripts/assert-release-test-report.mjs "$ADMIN_PERMISSIONS_PRIVATE_DIR/vitest.json" "${files[@]}"
          node scripts/admin-permissions-rehearsal.mjs
          node scripts/admin-permissions-rollback-preflight.mjs "$(git rev-parse HEAD)" > "$ADMIN_PERMISSIONS_PRIVATE_DIR/rollback-current.json"
          set +e
          node scripts/admin-permissions-rollback-preflight.mjs "$CI_BASE_SHA" > "$ADMIN_PERMISSIONS_PRIVATE_DIR/rollback-old.json" 2>&1
          denied=$?
          set -e
          test "$denied" -eq 1
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const root=process.env.ADMIN_PERMISSIONS_PRIVATE_DIR;
          const read=name=>JSON.parse(readFileSync(root+'/'+name,'utf8'));
          const tests=read('vitest.json'),rehearsal=read('rehearsal-report.json');
          assert.equal(tests.success,true);assert.equal(tests.numPendingTests,0);assert.equal(tests.numFailedTests,0);
          assert.equal(rehearsal.result,'PASS');assert.equal(rehearsal.additiveReplayPreserved,true);
          assert.equal(rehearsal.dumpRestorePreserved,true);assert.equal(rehearsal.restrictedRuntime,true);
          assert.equal(read('rollback-current.json').result,'PASS');assert.equal(read('rollback-old.json').result,'DENIED');
          writeFileSync(process.env.RUNNER_TEMP+'/admin-permissions-functional-summary.json',JSON.stringify({
            result:'PASS',head:process.env.GITHUB_SHA,mode:'admin-permissions-functional-only',
            tests:{total:tests.numTotalTests,passed:tests.numPassedTests,pending:0,failed:0},
            additiveReplayPreserved:true,dumpRestorePreserved:true,restrictedRuntime:true,
            codeRollback:{current:'PASS',oldBase:'DENIED'},rawDatabaseUploaded:false,productionAccess:false,
          },null,2),{mode:0o600});
          NODE
      - name: upload administrator functional summary only
        if: inputs.admin_permissions_functional && always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-permissions-functional-${{ github.sha }}
          path: ${{ runner.temp }}/admin-permissions-functional-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: upload vitest report artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.run_performance_tests && 'backend-performance-vitest-report' || 'backend-functional-vitest-report' }}
          path: |
            /tmp/eduk12-backend-performance-vitest.json
            /tmp/eduk12-backend-functional-vitest.json
            /tmp/eduk12-ci-env.txt
          if-no-files-found: ignore

      - name: remove this job's ephemeral service containers and anonymous volumes
        if: always()
        env:
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          CI_REDIS_SERVICE_ID: ${{ job.services.redis.id }}
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-cleanup-services.sh"
