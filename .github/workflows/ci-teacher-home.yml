name: Teacher scoped candidate
on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --prefix .github/release-tools
      - name: recheck the exact reviewed patch
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {teacherHomePlan} from './.github/scripts/teacher-home-scope.mjs';
          import {changedEntries} from './.github/scripts/content-scope.mjs';
          const p=JSON.parse(process.env.PLAN),head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.equal(p.head,head);
          assert.deepEqual(p,teacherHomePlan(changedEntries(p.base,head),p.base,head));
          writeFileSync('teacher-home-plan.json',JSON.stringify(p,null,2));
          JS
      - uses: docker/setup-buildx-action@v3
      - name: verify and restore qualified prerequisites
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -B .github/scripts/teacher-home-reuse.py
      - name: compile changed components once and run affected contracts
        if: steps.reuse.outputs.reuse_runtime != 'true'
        run: python3 -B .github/scripts/teacher-home-candidate.py
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
          cache: false
      - name: scan the actual frontend runtime image at existing thresholds
        if: steps.reuse.outputs.reuse_frontend_runtime != 'true'
        run: trivy image --exit-code 1 --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --format json --output teacher-home-evidence/frontend-scan.json eduk12-teacher-home-frontend:${{ github.sha }}
      - name: scan the actual backend runtime image at existing thresholds
        if: steps.reuse.outputs.reuse_backend_runtime != 'true'
        run: trivy image --exit-code 1 --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --format json --output teacher-home-evidence/backend-scan.json eduk12-teacher-home-backend:${{ github.sha }}
      - name: install pinned Chromium
        run: node .github/release-tools/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Teacher responsive UI and real isolated registration boundaries on the same runtime images
        run: node .github/scripts/teacher-home-browser.mjs
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: teacher-home-${{ github.sha }}
          path: |
            teacher-home-plan.json
            teacher-home-evidence/
            teacher-home-reuse.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
