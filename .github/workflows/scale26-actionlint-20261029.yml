name: Scale26 workflow static diagnostics
on:
  push:
    branches: [validation/scale26-actionlint-20261029]
    paths: [.github/workflows/scale26-actionlint-20261029.yml]
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.8'
      - name: Verify exact PR source and one-workflow-only diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '333200ade0c6cb42130cbc052189ba9c64691a12'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/scale26-actionlint-20261029.yml'
          git checkout --detach '333200ade0c6cb42130cbc052189ba9c64691a12'
          test "$(git rev-parse HEAD^{tree})" = '2b8b486ca69646cbd1a68f2b385e50d51140a613'
      - name: Check GitHub Actions YAML and expression semantics
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color \
            .github/workflows/ci.yml \
            .github/workflows/ci-scale26-intake.yml \
            > /tmp/scale26-actionlint.log 2>&1 || {
              cat /tmp/scale26-actionlint.log
              exit 1
            }
          cat /tmp/scale26-actionlint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale26-actionlint-diagnostic
          path: /tmp/scale26-actionlint.log
          if-no-files-found: warn
          retention-days: 3
