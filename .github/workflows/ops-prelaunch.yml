name: Ops prelaunch acceptance

on:
  workflow_call:
    inputs:
      runner_profile:
        type: string
        default: local
  workflow_dispatch:
    inputs:
      runner_profile:
        type: choice
        options: [local]
        default: local

permissions:
  contents: read

concurrency:
  group: ops-prelaunch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-recovery:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || vars.CI_FORCE_FULL == 'true'
    runs-on: [self-hosted, Linux, X64, eduk12-win-ci]
    timeout-minutes: 35
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      RELEASE_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      REDIS_URL: redis://localhost:6379
      EXPORT_DIR: /tmp/huisurvey-ops-export-${{ github.run_id }}-${{ github.run_attempt }}
      OPS_PG16_EVIDENCE: /tmp/huisurvey-pg16-upgrade-evidence
      JWT_SECRET: ci-jwt-secret-123456789012345678901234
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATA_PSEUDONYM_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      ASSET_SIGNING_SECRET: ci-asset-signing-secret-123456789012345678901234
      COGNITIVE_MODULE_ENABLED: 'true'
      COOKIE_SECURE: 'false'
      TRUST_PROXY_HOPS: '0'
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: ptool
          POSTGRES_PASSWORD: ptool123
          POSTGRES_DB: ptool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptool -d ptool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server-version/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs"

      - name: Verify supported runtime pins
        working-directory: server-version
        run: |
          set -euo pipefail
          node --version | grep '^v24\.21\.0$'
          grep -q 'FROM node:24.21.0-bookworm-slim' backend/Dockerfile
          grep -q 'FROM node:24.21.0-bookworm-slim' frontend/Dockerfile
          grep -q 'FROM nginx:1.31.6-alpine3.24-slim' frontend/Dockerfile
          grep -q 'image: postgres:16.15-bookworm' docker-compose.yml
          grep -q 'image: redis:7.4.11-bookworm' docker-compose.yml
          grep -q 'postgres16_data:/var/lib/postgresql/data' docker-compose.yml
          if grep -q 'postgres_data:/var/lib/postgresql/data' docker-compose.yml; then
            echo 'PG16 must not reuse the old PG14 volume' >&2
            exit 1
          fi

      - name: Install backend dependencies on Node 24
        run: npm ci

      - name: Verify native runtime modules on Node 24
        run: |
          node -e "require('canvas'); require('sharp'); require('@node-rs/jieba'); console.log('native modules: PASS')"

      - name: Generate Prisma client and migrate PostgreSQL 16
        run: |
          npx prisma generate
          npm run db:migrate:guarded

      - name: Run PR2 deterministic contracts and PostgreSQL export fault injection
        run: |
          npm test --             src/__tests__/config/runtime-resources.test.ts             src/__tests__/workers/worker-shutdown.test.ts             src/__tests__/workers/worker-subprocess-registry.test.ts             src/__tests__/services/videoProcessingState.test.ts             src/__tests__/services/videoProcessingRecovery.test.ts             src/__tests__/services/export-preview-bounds.test.ts             src/__tests__/services/export-file-writer.test.ts             src/__tests__/integration/exportBatchRecovery.postgres.integration.test.ts             --no-file-parallelism

      - name: Build backend under Node 24
        run: npm run build

      - name: Real Bull export worker publishes a READY generation
        working-directory: server-version
        run: backend/node_modules/.bin/tsx e2e/ops-export-worker-smoke.ts

      - name: Real Bull export worker retries file failure before terminal FAILED
        working-directory: server-version
        env:
          EXPORT_MAX_BYTES: '1'
          OPS_EXPORT_EXPECT: FAILED
        run: backend/node_modules/.bin/tsx e2e/ops-export-worker-smoke.ts

      - name: Real worker process handles SIGTERM
        working-directory: server-version
        run: node e2e/ops-worker-sigterm-smoke.mjs

      - name: Rehearse populated PostgreSQL 14 to 16 logical upgrade
        working-directory: server-version
        run: node e2e/ops-pg16-upgrade-rehearsal.mjs

      - name: Validate production Compose expansion
        working-directory: server-version
        env:
          DB_USER: ptool
          DB_PASSWORD: ptool123
          DB_NAME: ptool
          DATABASE_URL: postgresql://ptool:ptool123@postgres:5432/ptool?schema=public
          JWT_SECRET: ci-jwt-secret-123456789012345678901234
          COOKIE_SECURE: 'false'
          DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DATA_PSEUDONYM_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          ASSET_SIGNING_SECRET: ci-asset-signing-secret-123456789012345678901234
          ASSET_MIGRATION_COMPLETE: 'true'
          CORS_ORIGIN: http://127.0.0.1
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password-2026
        run: docker compose config >/tmp/huisurvey-pr2-compose.yml

      - name: Upload PR2 ops evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pr2-ops-evidence
          path: |
            /tmp/huisurvey-pg16-upgrade-evidence
            /tmp/huisurvey-pr2-compose.yml
          retention-days: 3
          if-no-files-found: ignore
