name: Ops prelaunch acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ops-prelaunch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-review:
    if: github.head_ref == 'fix/ops-supported-runtime-bounded-workers' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, eduk12-win-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare clean public runtime images for isolated local integration tests
        run: |
          set -euo pipefail
          pg="ops-pg-runtime-${GITHUB_RUN_ID}"
          redis="ops-redis-runtime-${GITHUB_RUN_ID}"
          trap 'docker rm -fv "$pg" "$redis" >/dev/null 2>&1 || true' EXIT
          docker create --name "$pg" postgres:16.15-bookworm
          docker create --name "$redis" redis:7.4.11-bookworm
          docker export "$pg" | gzip -1 > "$RUNNER_TEMP/ops-pg16-runtime.tar.gz"
          docker export "$redis" | gzip -1 > "$RUNNER_TEMP/ops-redis-runtime.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ops-isolated-database-runtimes
          path: |
            ${{ runner.temp }}/ops-pg16-runtime.tar.gz
            ${{ runner.temp }}/ops-redis-runtime.tar.gz
          retention-days: 1
          if-no-files-found: error
