name: CI UI acceptance component
on:
  workflow_call:
    inputs:
      runner_labels:
        type: string
        required: true
      engine:
        type: string
        default: chromium
      canonical:
        type: boolean
        default: true
      app_shell:
        type: boolean
        default: false
      qa_round3:
        type: boolean
        default: false
      use_build_artifacts:
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  ui:
    name: ${{ inputs.engine }} frontend acceptance
    runs-on: ubuntu-24.04
    # Exact match for ci/browser/package-lock.json. The official image includes
    # all three browsers and their native system libraries/fonts, avoiding
    # unreliable hosted-runner apt mirrors without skipping visual acceptance.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=3072
      TZ: UTC
      # GitHub Actions mounts HOME=/github/home (owned by pwuser) while running
      # the official Playwright image as root. Firefox requires a root-owned HOME.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: trust exact mounted checkout in Playwright container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: |
            server-version/frontend/package-lock.json
            ci/browser/package-lock.json
      - run: node .github/scripts/runner-preflight.mjs --frontend
      - name: install only frontend and browser runtime
        run: |
          npm ci --prefix server-version/frontend
          npm ci --prefix ci/browser
          # Official Playwright container sets PLAYWRIGHT_BROWSERS_PATH=/ms-playwright.
          # Do not redirect it to an empty runner temp directory.
      - name: prepare selected browser
        shell: bash
        env:
          CI_BROWSER_ENGINE: ${{ inputs.engine }}
        run: |
          case "$CI_BROWSER_ENGINE" in
            all) engines=(chromium firefox webkit) ;;
            chromium|firefox|webkit) engines=("$CI_BROWSER_ENGINE") ;;
            *) exit 1 ;;
          esac
          # Fail closed if even one requested real engine fails to start;
          # never bypass the browser test or rely on an apt install marker.
          node - "${engines[@]}" <<'NODE'
          const { chromium, firefox, webkit } = require('./ci/browser/node_modules/playwright-core')
          const engines = { chromium, firefox, webkit }
          ;(async () => {
            for (const name of process.argv.slice(2)) {
              const browser = await engines[name].launch({ headless: true })
              try {
                const page = await browser.newPage()
                await page.goto('data:text/html,<title>CI Browser Smoke</title>')
                if (await page.title() !== 'CI Browser Smoke') throw new Error(name + ' smoke failed')
              } finally { await browser.close() }
            }
          })().catch(error => { console.error(error); process.exitCode = 1 })
          NODE
      - uses: actions/download-artifact@v4
        if: (inputs.app_shell || inputs.qa_round3) && inputs.use_build_artifacts
        with:
          name: frontend-dist-${{ github.sha }}
          path: server-version/frontend/dist
      - name: build standalone AppShell input
        if: (inputs.app_shell || inputs.qa_round3) && !inputs.use_build_artifacts
        run: |
          npm run build --prefix server-version/frontend
          node .github/scripts/ci-artifact.mjs write frontend
      - name: AppShell viewport input accessibility
        if: inputs.app_shell
        run: |
          node .github/scripts/ci-artifact.mjs verify frontend
          node .github/scripts/ci-ui.mjs app-shell chromium
      - name: remove production preview before restoring UI-lab
        if: inputs.canonical
        run: node -e "require('fs').rmSync('server-version/frontend/dist',{recursive:true,force:true})"
      - uses: actions/download-artifact@v4
        if: inputs.canonical && inputs.use_build_artifacts
        with:
          name: frontend-ui-lab-dist-${{ github.sha }}
          path: server-version/frontend/dist
      - name: build standalone UI-lab input
        if: inputs.canonical && !inputs.use_build_artifacts
        env:
          VITE_UI_LAB_ENABLED: 'true'
        run: |
          npm run build --prefix server-version/frontend
          node .github/scripts/ci-artifact.mjs write frontend-ui-lab
      - name: canonical visual and interaction acceptance
        if: inputs.canonical
        env:
          CI_BROWSER_ENGINE: ${{ inputs.engine }}
        run: |
          node .github/scripts/ci-artifact.mjs verify frontend-ui-lab
          node .github/scripts/ci-ui.mjs canonical "$CI_BROWSER_ENGINE"
      - name: QA round 3 real components with synthetic local APIs
        if: inputs.qa_round3
        env:
          PLAYWRIGHT_CORE_PATH: ${{ github.workspace }}/ci/browser/node_modules/playwright-core
          QA_EVIDENCE: ${{ runner.temp }}/eduk12-ui-${{ github.run_id }}-${{ inputs.engine }}/qa-round3
          QA_BUILD_KIND: ${{ inputs.canonical && 'frontend-ui-lab' || 'frontend' }}
        run: |
          node .github/scripts/ci-artifact.mjs verify "$QA_BUILD_KIND"
          node server-version/e2e/qa-round3-browser-e2e.cjs "$QA_EVIDENCE"
      - name: upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-ui-${{ inputs.engine }}-${{ github.sha }}
          path: ${{ runner.temp }}/eduk12-ui-${{ github.run_id }}-${{ inputs.engine }}
          retention-days: 3
          if-no-files-found: ignore
      - name: clean Mac dependencies outputs and temporary browsers
        if: ${{ always() && runner.os == 'macOS' }}
        run: node .github/scripts/mac-ci-cleanup.mjs
      - name: remove uploaded temporary UI evidence
        if: always()
        env:
          CI_UI_EVIDENCE: ${{ runner.temp }}/eduk12-ui-${{ github.run_id }}-${{ inputs.engine }}
        run: node -e "require('fs').rmSync(process.env.CI_UI_EVIDENCE,{recursive:true,force:true})"
