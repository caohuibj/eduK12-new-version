name: Situational Branching Acceptance
'on':
  workflow_call:
    inputs:
      runner_profile:
        type: string
        default: local
      use_build_artifacts:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      runner_profile:
        type: choice
        options:
        - local
        - speed
        default: local
permissions:
  contents: read
  actions: read
concurrency:
  group: situational-branching-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || vars.CI_FORCE_FULL == 'true'
    uses: ./.github/workflows/ci-media.yml
    with:
      runner_labels: ${{ inputs.runner_profile == 'speed' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","eduk12-win-ci"]' }}
      selected: '["situational_branching"]'
      groups: '["cognitive-situational"]'
      use_build_artifacts: ${{ inputs.use_build_artifacts || false }}
