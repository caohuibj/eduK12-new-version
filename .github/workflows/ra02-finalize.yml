name: RA02 Finalize Patch

on:
  push:
    branches:
      - feat/ra-02-relational-product-integration

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ra02-finalize-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ra-02-relational-product-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python server-version/scripts/ra02-finalize.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server-version/frontend/package-lock.json
      - working-directory: server-version/frontend
        run: npm ci
      - working-directory: server-version/frontend
        run: npm run inventory:product-ui
      - name: Commit deterministic patch
        run: |
          if git diff --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-version/backend server-version/frontend server-version/docs
          git commit -m 'feat(relational): finalize RA-02 product journeys [ra02-finalize-applied]'
          git push origin HEAD:feat/ra-02-relational-product-integration
