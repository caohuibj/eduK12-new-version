# Reused by CI for content-only changes; no second PR-triggered installation.
name: Assessment content gate
on:
  workflow_call:
    inputs:
      runner_profile:
        type: string
        default: hosted
      cognitive_intake_light:
        type: boolean
        default: false
      scale_intake_light:
        type: boolean
        default: false
      scale:
        type: boolean
        required: true
      cognitive:
        type: boolean
        required: true
      situational:
        type: boolean
        required: true
      bundle:
        type: boolean
        required: true
      base:
        type: string
        required: true
permissions:
  contents: read
  pull-requests: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  cognitive-intake:
    if: inputs.cognitive_intake_light
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CI: 'true'
      NODE_ENV: test
      COGNITIVE_MODULE_ENABLED: 'true'
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      BACKGROUND_WORKERS_ENABLED: 'false'
      TZ: UTC
      COGNITIVE_INTAKE_BASE_SHA: ${{ inputs.base }}
      COGNITIVE_INTAKE_HEAD_SHA: ${{ github.sha }}
      COGNITIVE_INTAKE_REPORT_DIR: ${{ github.workspace }}/cognitive-intake-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            server-version/backend/package-lock.json
            server-version/frontend/package-lock.json
      - name: enforce isolated cognitive input and exact Git scope before dependencies
        env:
          SCALE: ${{ inputs.scale }}
          SCALE_LIGHT: ${{ inputs.scale_intake_light }}
          COGNITIVE: ${{ inputs.cognitive }}
          SITUATIONAL: ${{ inputs.situational }}
          BUNDLE: ${{ inputs.bundle }}
        run: |
          test "$COGNITIVE" = true && test "$SCALE" = false && test "$SCALE_LIGHT" = false && test "$SITUATIONAL" = false && test "$BUNDLE" = false
          node .github/scripts/cognitive-intake-scope.mjs
      - name: install each unchanged locked dependency tree once without application hooks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix server-version/backend
          npm ci --ignore-scripts --no-audit --no-fund --prefix server-version/frontend
      - name: selected identities real scorer fixtures reports DOM and affected types
        run: env -u DATABASE_URL node .github/scripts/cognitive-intake-check.mjs
      - name: preserve actual selected execution and compiler reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-intake-evidence
          path: cognitive-intake-evidence
          if-no-files-found: warn
  scale-intake:
    if: inputs.scale_intake_light && !inputs.cognitive_intake_light
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CI: 'true'
      SCALE_INTAKE_BASE_SHA: ${{ inputs.base }}
      SCALE_INTAKE_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: server-version/backend/package-lock.json
      - name: recompute exact isolated declaration scope before installing dependencies
        run: node .github/scripts/scale-intake-scope.mjs
      - name: install the unchanged locked content dependencies without hooks
        working-directory: server-version/backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: check the generated registry once
        working-directory: server-version/backend
        run: npm run scale:instruments:check
      - name: selected source scoring parameters reports and affected dependencies
        working-directory: server-version/backend
        run: node --import tsx scripts/scale-intake-selected-check.ts
  boundary:
    # Declarations only: schemas, source references, golden scoring cases and
    # report/template compatibility. No app build, database or lifecycle fixture.
    if: ${{ !inputs.scale_intake_light && !inputs.cognitive_intake_light }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      NODE_ENV: test
      COGNITIVE_MODULE_ENABLED: 'true'
      BACKGROUND_WORKERS_ENABLED: 'false'
      BUNDLE_CONTENT_BASE_SHA: ${{ inputs.base }}
      BUNDLE_CONTENT_EVIDENCE: /tmp/bundle-content-evidence.json
    defaults:
      run:
        working-directory: server-version/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: server-version/backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Scale declaration schemas, registries and reference/report compatibility
        if: inputs.scale
        run: npm run scale:onboarding:check && npm run scale:instruments:check && npm run scale:qualification:check
      - name: Cognitive cross-tree declaration dependencies
        if: inputs.cognitive
        working-directory: server-version/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cognitive declaration boundary and selected task fixtures
        if: inputs.cognitive
        working-directory: .
        env:
          CI_BASE_SHA: ${{ inputs.base }}
        run: |
          node .github/scripts/cognitive-content.mjs
          tasks=$(git diff --name-only "$CI_BASE_SHA" HEAD -- server-version/backend/src/modules/cognitive/tasks/ | cut -d/ -f7 | sort -u | paste -sd, -)
          test -n "$tasks"
          cd server-version/backend
          npm run cognitive:onboarding-check -- --tasks "$tasks" --json
      - name: SJT declaration schemas, references and golden scoring fixtures
        if: inputs.situational
        run: npm run situational:contracts
      - name: SJT changed publication retains existing review authority
        if: inputs.situational && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_BASE_SHA: ${{ inputs.base }}
        run: |
          if git diff --name-only "$PUBLICATION_BASE_SHA" HEAD -- src/modules/situational/instruments/ | grep -q '/publication.json$'; then
            npm run situational:onboarding-check -- --all --verify-reviews --base "$PUBLICATION_BASE_SHA"
          fi
      - name: Bundle affected schemas, scoring fixtures, templates and source references
        run: |
          node --import tsx --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {verifyHistory} from './scripts/bundle-content-check.ts';
          const base=process.env.BUNDLE_CONTENT_BASE_SHA;
          const files=execFileSync('git',['diff','--name-only','-z',base,'HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const root='src/modules/assessment-bundle/packages';
          const units=files.map(f=>f.match(/src\/modules\/(?:scale|situational)\/instruments\/([^/]+)\/([^/]+)\//)).filter(Boolean).map(m=>m[1]+'/'+m[2]);
          const cognitive=files.some(f=>f.includes('/modules/cognitive/tasks/'));
          const selected=[];
          for(const key of fs.readdirSync(root))for(const version of fs.readdirSync(root+'/'+key)) {
            const dir=root+'/'+key+'/'+version, manifest=JSON.parse(fs.readFileSync(dir+'/manifest.json','utf8'));
            if(files.some(f=>f.includes('/'+dir+'/')) || manifest.definition.slots.some(slot=>units.includes(slot.instrumentKey+'/'+slot.instrumentVersion)||cognitive&&slot.unitType==='COGNITIVE'))selected.push(dir);
          }
          const run=args=>execFileSync(process.execPath,['--import','tsx','src/scripts/bundle-onboarding.ts',...args],{stdio:'inherit'});
          if(files.some(f=>f.includes('/modules/assessment-bundle/'))) {
            verifyHistory(base);
            run(['manifest-check']);
          }
          for(const dir of selected)run(['check',dir]);
          fs.writeFileSync(process.env.BUNDLE_CONTENT_EVIDENCE,JSON.stringify({base,selected,status:'success',validation:'existing affected package check; no database or lifecycle'}));
          JS
      - name: Save actual declaration validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-content-evidence
          path: /tmp/bundle-content-evidence.json
          if-no-files-found: error
