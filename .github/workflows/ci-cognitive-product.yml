name: Cognitive product checks
on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
permissions:
  contents: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COGNITIVE_PRODUCT_PLAN: ${{ inputs.plan }}
      COGNITIVE_MODULE_ENABLED: 'true'
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      BACKGROUND_WORKERS_ENABLED: 'false'
      TZ: UTC
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:cognitive-ci-fixture-only@127.0.0.1:5432/cognitive_product_ci_test
      COGNITIVE_INSTALL_TEST_DATABASE_URL: postgresql://postgres:cognitive-ci-fixture-only@127.0.0.1:5432/cognitive_product_ci_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: synthetic-cognitive-ci-session-only
      CORS_ORIGIN: http://localhost:5174
      ADMIN_WEBAUTHN_ORIGIN: http://localhost:5174
      ADMIN_WEBAUTHN_RP_ID: localhost
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cognitive-ci-fixture-only
          POSTGRES_DB: cognitive_product_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cognitive_product_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.11-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            server-version/backend/package-lock.json
            server-version/frontend/package-lock.json
      - name: directed route and missing-check contract tests
        run: node --test .github/scripts/cognitive-product.test.mjs
      - name: install locked compiler and declaration dependencies without application hooks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix server-version/backend
          npm ci --ignore-scripts --no-audit --no-fund --prefix server-version/frontend
      - name: prepare the isolated empty database for real intake HTTP
        working-directory: server-version/backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: real runner scorer freeze and isolated intake boundaries
        run: node .github/scripts/cognitive-product-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cognitive-product-${{ github.sha }}
          path: cognitive-product-evidence/
          if-no-files-found: error
