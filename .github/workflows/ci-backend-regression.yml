name: CI backend-regression component

on:
  workflow_call:
    inputs:
      runner_labels:
        type: string
        required: true
      focus:
        type: string
        default: full

permissions:
  contents: read
  actions: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  backend-regression:
    name: backend regression (isolated job database)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      COGNITIVE_INTEGRATION_DB_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR8_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR26_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR34_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR38_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      V32_1_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      V32_2_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      V32_3_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      BUNDLE_PRODUCT_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      QUESTIONNAIRE_PRODUCT_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      SJT_UPLOAD_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      SITUATIONAL_BUNDLE_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      INSTRUMENT_FINAL_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      RELEASE_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      # Explicit opt-ins point only to this job's disposable service.
      AUTHENTICATED_ADMISSION_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      TRAINING_ARCHIVE_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      TRAINING_PARTICIPATION_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      SURVEY_FOLLOWUP_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      SURVEY_MEMORABLE_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      SURVEY_DIRECTORY_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      SURVEY_SJT_ENTRY_AUTHORITY_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      SURVEY_SJT_BINDING_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      SURVEY_NATIVE_SJT_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      # C20 creates a UUID-isolated schema in this disposable job service only.
      TRAINING_MATERIAL_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      TRAINING_MATERIAL_ISOLATED_DB: '1'
      # Outbox fixtures require this exact disposable job DB; full suites run serially.
      REPORT_OUTBOX_INTEGRATION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      # These suites create synthetic data, roll back, or only read
      # within this job's disposable PostgreSQL service.
      SCHOOL_PLAN_GROUP_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      TRAINING_QUOTA_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      TEACHER_RUNTIME_QUERY_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR363_AUTHORITY_LOCKS_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PERSONAL_TRACKING_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      TRAINING_PERSONAL_TRACKING_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      GROUP_REPORT_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      TRAINING_GROUP_REPORT_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      GROUP_LONGITUDINAL_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      SCHOOL_GROUP_SOURCE_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      TASK_GROUP_HISTORY_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      PR363_FEEDBACK_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      LIBRARY_DISCOVERY_TEST_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      TEACHER_PRIVATE_GROUP_LONGITUDINAL_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
      UPLOAD_DIR: /tmp/eduk12-ci-uploads
      JWT_SECRET: ci-jwt-secret-123456789012345678901234
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATA_PSEUDONYM_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      # Same synthetic eligibility fixture key as the existing report-planning CI.
      CAMPUS_ELIGIBILITY_HMAC_KEY: '5757575757575757575757575757575757575757575757575757575757575757'
      COGNITIVE_MODULE_ENABLED: 'true'
      REDIS_URL: redis://localhost:6379
      MINI_OPERATIONS_TEST_REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: ptool
          POSTGRES_PASSWORD: ptool123
          POSTGRES_DB: ptool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptool -d ptool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server-version/backend
    steps:
      - uses: actions/checkout@v4
      - name: preflight explicit integration database opt-ins
        if: inputs.focus == 'full'
        run: |
          node <<'NODE'
          const suites={
            AUTHENTICATED_ADMISSION:'composite/authenticated-admission',TRAINING_ARCHIVE:'composite/student-archived-availability',
            TRAINING_PARTICIPATION:'integration/trainingParticipation,trainingResetBoundaries,trainingStableAdmission',
            SURVEY_FOLLOWUP:'survey/governed-native,standard-catalog-fingerprint',SURVEY_MEMORABLE:'survey/memorable-code',
            SURVEY_DIRECTORY:'survey/project-directory',SURVEY_SJT_BINDING:'survey/situational-native-binding',
            SURVEY_NATIVE_SJT:'survey/situational-native-*',SURVEY_SJT_ENTRY_AUTHORITY:'survey/situational-entry-authority'
          };
          const expected='postgresql://ptool:ptool123@localhost:5432/ptool?schema=public';
          const problems=Object.entries(suites).flatMap(([key,files])=>{
            const name=key+'_TEST_DATABASE_URL';
            return process.env[name]===expected&&process.env[name]===process.env.DATABASE_URL?[]:[name+' -> '+files];
          });
          if(problems.length)throw new Error('Missing or foreign job database opt-ins:\n'+problems.join('\n'));
          console.log('All 9 explicit newer integration opt-ins match the disposable job database; execution remains serial.');
          NODE
      - name: validate disjoint regression report controls
        run: node --test ../../.github/scripts/backend-regression-reports.test.mjs
      - name: clear reports from previous regression jobs
        # Self-hosted /tmp persists between jobs; never upload old-focus evidence.
        run: rm -f /tmp/eduk12-backend-vitest.json /tmp/eduk12-backend-vitest-base.json /tmp/eduk12-backend-vitest-export.json /tmp/eduk12-backend-vitest-roster.json /tmp/eduk12-training-bundle-producer.json /tmp/eduk12-training-course-producer.json /tmp/eduk12-teacher-runtime-vitest.json /tmp/eduk12-cognitive-install-vitest.json /tmp/eduk12-library-http-vitest.json /tmp/eduk12-parent-vitest.json /tmp/eduk12-r5-vitest.json /tmp/eduk12-hosted-ci-env.txt /tmp/eduk12-teacher-self-group.json /tmp/eduk12-library-self-group.json /tmp/eduk12-teacher-private-group.json /tmp/eduk12-school-private-source.json /tmp/eduk12-school-composition-delta.json /tmp/eduk12-school-native-source.json /tmp/eduk12-school-native-reports.json /tmp/eduk12-education-marker.json /tmp/eduk12-education-feedback-policy.json /tmp/eduk12-education-standard-marker.json /tmp/eduk12-education-license-selection.json /tmp/eduk12-education-publication.json /tmp/eduk12-group-native.json /tmp/eduk12-evc-lifecycle.json /tmp/eduk12-evc-restore.json /tmp/eduk12-legacy-education-setup.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          # Self-hosted runners already retain ~/.npm; remote cache uploads can
          # block the single slot long after the tests and service cleanup finish.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: server-version/backend/package-lock.json
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs"
      - name: check hosted runner disk headroom
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-disk-preflight.sh"
      - name: prepare canvas source-build dependencies
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-install-canvas-deps.sh"
      - name: accept original locked audit and unchanged backend unit evidence
        if: inputs.focus == 'survey-wave-selection'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin b65f7d658db33f1ebbf08e655f6d41164ebc653d
          python3 -B .github/scripts/survey-wave-selection-reuse.py backend
      - name: npm ci
        run: npm ci
      - name: prisma generate and guarded migration
        run: |
          npx prisma generate
          npm run db:migrate:guarded
      - name: configure independent regression database timezone
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const target = new URL(process.env.DATABASE_URL);
          if (process.env.CI !== 'true' || !['localhost', '127.0.0.1'].includes(target.hostname) || target.pathname !== '/ptool') {
            throw new Error('UTC setup requires the isolated CI database');
          }
          async function withClient(action) {
            const client = new PrismaClient({ datasources: { db: { url: target.href } } });
            try { await client.$connect(); return await action(client); }
            finally { await client.$disconnect(); }
          }
          (async () => {
            const before = await withClient(async client => {
              const result = await client.$queryRaw`SELECT current_setting('TimeZone') AS zone`;
              await client.$executeRaw`ALTER DATABASE ptool SET timezone TO 'UTC'`;
              return result[0].zone;
            });
            // A new connection verifies the default used by subsequent Prisma pools.
            const after = await withClient(async client => (await client.$queryRaw`SELECT current_setting('TimeZone') AS zone`)[0].zone);
            console.log(JSON.stringify({ databaseTimezoneBefore: before, databaseTimezoneAfter: after }));
            if (after !== 'UTC') throw new Error('CI database UTC configuration did not persist');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: retain empty migrated databases for isolated consumers
        id: empty-fixtures
        if: inputs.focus == 'full'
        env:
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          # These consumers require no installed configs or seeded business rows.
          docker exec "$CI_POSTGRES_SERVICE_ID" createdb -U ptool --template=ptool --owner=ptool cognitive_install_ci_test
          docker exec "$CI_POSTGRES_SERVICE_ID" createdb -U ptool --template=ptool --owner=ptool library_http_ci_test
          for variant in marker feedback_policy standard_marker license_selection publication; do
            docker exec "$CI_POSTGRES_SERVICE_ID" createdb -U ptool --template=ptool --owner=ptool "education_${variant}_ci_test"
          done
          docker exec "$CI_POSTGRES_SERVICE_ID" createdb -U ptool --template=ptool --owner=ptool evc_source_ci_test
          docker exec "$CI_POSTGRES_SERVICE_ID" createdb -U ptool --owner=ptool evc_restore_ci_test
      - name: seed reference and configuration data
        if: inputs.focus != 'survey-wave-selection'
        run: npm run db:seed
        env:
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password-2026
      - name: backfill check-in token protection
        id: regression-data
        if: inputs.focus != 'survey-wave-selection'
        run: npm run db:backfill:checkin-tokens
      - name: prepare isolated Teacher restricted-runtime fixture
        id: teacher-runtime-fixture
        if: inputs.focus == 'full'
        env:
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          # Clone before any test changes the seeded template; retain its ledger/triggers.
          docker exec "$CI_POSTGRES_SERVICE_ID" createdb -U ptool --template=ptool --owner=ptool pr363_runtime_test
          docker exec "$CI_POSTGRES_SERVICE_ID" psql -X -v ON_ERROR_STOP=1 -U ptool -d pr363_runtime_test -c "CREATE ROLE pr363_runtime LOGIN PASSWORD 'synthetic-runtime-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; REVOKE CREATE ON DATABASE pr363_runtime_test FROM PUBLIC; REVOKE CREATE ON SCHEMA public FROM PUBLIC; GRANT CONNECT ON DATABASE pr363_runtime_test TO pr363_runtime; GRANT USAGE ON SCHEMA public TO pr363_runtime;"
          docker exec -i "$CI_POSTGRES_SERVICE_ID" psql -X -v ON_ERROR_STOP=1 -U ptool -d pr363_runtime_test -v target_database=pr363_runtime_test -v migration_owner=ptool -v runtime_role=pr363_runtime -v "table_policy=$(cat scripts/runtime-table-policy.json)" < scripts/runtime-role-defaults.sql
      - name: frontend dependencies for cross-tree Cognitive package tests
        if: inputs.focus != 'survey-wave-selection'
        working-directory: server-version/frontend
        run: npm ci --ignore-scripts
      - name: validate regression selection
        env:
          REGRESSION_FOCUS: ${{ inputs.focus }}
        run: |
          case "$REGRESSION_FOCUS" in full|reporting|assessment-repair|survey-wave-selection) ;; *) exit 1 ;; esac
      - name: prepare the existing historical schema and legacy publisher sources
        id: historical-fixtures
        if: inputs.focus == 'full'
        env:
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin 8cf07bfd35702222e279cbfeee2f64d73a938b55 16845c9a2e982fc2dd713417c7fb745024789cc4
          mkdir -p "$RUNNER_TEMP/group-native-main" "$RUNNER_TEMP/legacy-education"
          git -C "$GITHUB_WORKSPACE" archive 8cf07bfd35702222e279cbfeee2f64d73a938b55 server-version/backend/prisma | tar -x -C "$RUNNER_TEMP/group-native-main"
          git -C "$GITHUB_WORKSPACE" archive 16845c9a2e982fc2dd713417c7fb745024789cc4 server-version/backend | tar -x -C "$RUNNER_TEMP/legacy-education"
          # Use today's audited dependencies; this is not an exact old build.
          ln -s "$GITHUB_WORKSPACE/server-version/backend/node_modules" "$RUNNER_TEMP/legacy-education/server-version/backend/node_modules"
          docker exec "$CI_POSTGRES_SERVICE_ID" createdb -U ptool --owner=ptool group_native_ci_test
          docker exec "$CI_POSTGRES_SERVICE_ID" createdb -U ptool --owner=ptool group_native_restore_test_ci
          DATABASE_URL='postgresql://ptool:ptool123@localhost:5432/group_native_ci_test?schema=public' node node_modules/prisma/build/index.js migrate deploy --schema "$RUNNER_TEMP/group-native-main/server-version/backend/prisma/schema.prisma"
      - name: bounded Survey Wave options and authoritative freeze contracts
        if: inputs.focus == 'survey-wave-selection'
        env:
          SURVEY_PUBLICATION_ENABLED: 'true'
          SURVEY_WORKSPACE_ENABLED: 'true'
        run: |
          npx tsc --noEmit --incremental false
          npm test -- src/__tests__/measurement-content/survey-content-options.postgres.integration.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-backend-vitest.json
          node scripts/assert-release-test-report.mjs /tmp/eduk12-backend-vitest.json src/__tests__/measurement-content/survey-content-options.postgres.integration.test.ts
      - name: R5 assessment repair regression
        if: inputs.focus == 'assessment-repair'
        env:
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: node scripts/r5-regression.mjs /tmp/eduk12-r5-vitest.json
      - name: reporting fixture and HTTP regression
        if: inputs.focus == 'reporting'
        run: |
          npm test -- src/__tests__/integration/parentPortal.postgres.integration.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-parent-vitest.json
          node scripts/assert-release-test-report.mjs /tmp/eduk12-parent-vitest.json src/__tests__/integration/parentPortal.postgres.integration.test.ts
          npm test -- src/__tests__/integration/reportingHttp.postgres.integration.test.ts src/__tests__/integration/registered-resource-longitudinal.postgres.integration.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-backend-vitest.json
          node scripts/assert-release-test-report.mjs /tmp/eduk12-backend-vitest.json src/__tests__/integration/reportingHttp.postgres.integration.test.ts src/__tests__/integration/registered-resource-longitudinal.postgres.integration.test.ts
      - name: Training Bundle checkpoint producer
        id: training-bundle
        if: (success() || failure()) && inputs.focus == 'full' && steps.regression-data.outcome == 'success'
        run: |
          # This hosted job owns these fixed synthetic checkpoint paths.
          rm -f /tmp/training-native-bundle-group-bootstrap.json /tmp/training-native-bundle-group-fixture.json /tmp/training-native-bundle-group-disclosed-fixture.json /tmp/training-scale-course-delivery-fixture.json /tmp/training-scale-course-delivery-started.json /tmp/training-standalone-scale-group-fixture.json /tmp/training-standalone-cognitive-group-fixture.json
          env -u TRAINING_BUNDLE_GROUP_FIXTURE -u TRAINING_BUNDLE_GROUP_BOOTSTRAP -u TRAINING_BUNDLE_GROUP_DISCLOSED_FIXTURE npm test -- src/__tests__/integration/trainingBundleLeafGroup.postgres.integration.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-training-bundle-producer.json
          node scripts/assert-release-test-report.mjs /tmp/eduk12-training-bundle-producer.json src/__tests__/integration/trainingBundleLeafGroup.postgres.integration.test.ts
      - name: Training Scale course checkpoint producer
        id: training-course
        if: (success() || failure()) && inputs.focus == 'full' && steps.training-bundle.outcome == 'success'
        # A failed producer blocks its consumers even when it left partial JSON.
        run: |
          npm test -- src/__tests__/integration/trainingStandaloneScaleCourse.postgres.integration.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-training-course-producer.json
          node scripts/assert-release-test-report.mjs /tmp/eduk12-training-course-producer.json src/__tests__/integration/trainingStandaloneScaleCourse.postgres.integration.test.ts
      - name: Teacher SELF and library GROUP checkpoints before private consumers
        id: teacher-groups
        if: (success() || failure()) && inputs.focus == 'full' && steps.regression-data.outcome == 'success'
        env:
          TEACHER_SELF_GROUP_CONTINUATION: /tmp/teacher-self-group-scale/source.json
          TEACHER_PRIVATE_LIBRARY_GROUP_CHECKPOINT: /tmp/library-self-group-release/source.json
          TEACHER_PRIVATE_GROUP_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
          TEACHER_PRIVATE_GROUP_CHECKPOINT: ${{ runner.temp }}/teacher-private-group-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          # Other retained consumers also read these paths in the same job database.
          mkdir -p /tmp/teacher-self-group-scale /tmp/library-self-group-release
          rm -f /tmp/teacher-self-group-scale/source.json /tmp/library-self-group-release/source.json
          npm test -- src/__tests__/integration/teacherSelfGroupScale.postgres.integration.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-teacher-self-group.json
          npm test -- src/__tests__/integration/librarySelfGroupScale.postgres.integration.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-library-self-group.json
          npm test -- src/__tests__/integration/teacherPrivateCompositionGroup.postgres.integration.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-teacher-private-group.json
      - name: School private publication checkpoint and its delta consumer
        if: (success() || failure()) && inputs.focus == 'full' && steps.regression-data.outcome == 'success'
        env:
          SCHOOL_GROUP_COMPOSITION_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
          SCHOOL_GROUP_COMPOSITION_CHECKPOINT: ${{ runner.temp }}/school-private-source-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          npm test -- src/__tests__/integration/schoolPrivateGroupSource.postgres.integration.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-school-private-source.json
          npm test -- src/__tests__/integration/schoolSelfGroupCompositionDelta.postgres.integration.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-school-composition-delta.json
      - name: School native waves before their retained-report consumers
        if: (success() || failure()) && inputs.focus == 'full' && steps.regression-data.outcome == 'success'
        env:
          SCHOOL_GROUP_NATIVE_DATABASE_URL: postgresql://ptool:ptool123@localhost:5432/ptool?schema=public
          SCHOOL_GROUP_NATIVE_CHECKPOINT: ${{ runner.temp }}/school-native-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          npm test -- src/__tests__/integration/schoolSelfGroupNative.postgres.integration.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-school-native-source.json
          npm test -- src/__tests__/integration/schoolSelfGroupNativeReports.postgres.integration.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/eduk12-school-native-reports.json
      - name: full functional regression
        if: (success() || failure()) && inputs.focus == 'full' && steps.training-course.outcome == 'success' && steps.teacher-groups.outcome == 'success'
        env:
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          TEACHER_PRIVATE_GROUP_LONGITUDINAL_CHECKPOINT: ${{ runner.temp }}/teacher-private-group-longitudinal-${{ github.run_id }}-${{ github.run_attempt }}.json
        # Real-PG suites remain serial. The single hardware-sensitive burst is
        # covered by the isolated backend job. Producers precede their consumers;
        # roster and export use Redis DB14/15. Reports cover the disjoint executions.
        run: >-
          npm test -- --no-file-parallelism
          --exclude=src/__tests__/questionnaire/aggregate-report.postgres.integration.test.ts
          --exclude=src/__tests__/integration/training-mac-export.postgres.integration.test.ts
          --exclude=src/__tests__/integration/educationRosterJobs.postgres.integration.test.ts
          --exclude=src/__tests__/integration/trainingBundleLeafGroup.postgres.integration.test.ts
          --exclude=src/__tests__/integration/trainingStandaloneScaleCourse.postgres.integration.test.ts
          --exclude=src/__tests__/huiteacher/assessment-runtime.postgres.integration.test.ts
