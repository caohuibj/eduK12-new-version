name: CI production image step
on:
  workflow_dispatch:
    inputs:
      release_source_sha:
        type: string
        required: true
      release_ci_run:
        type: string
        required: true
      release_ci_checkout:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  ops:
    name: build same-source migration ops image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release CI and check out the exact source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.release_source_sha }}
          RELEASE_CI_RUN: ${{ inputs.release_ci_run }}
          RELEASE_CI_CHECKOUT: ${{ inputs.release_ci_checkout }}
        run: |
          set -euo pipefail
          cp server-version/scripts/release/c_service_package.py "$RUNNER_TEMP/"
          export PYTHONPATH="$GITHUB_WORKSPACE/server-version/scripts/release"
          python3 -B "$RUNNER_TEMP/c_service_package.py" source "$RELEASE_SOURCE" "$RELEASE_CI_RUN" "$RELEASE_CI_CHECKOUT"
          git checkout --detach "$RELEASE_SOURCE"
      - name: Build matching ops image
        working-directory: server-version
        run: docker build --target ops --tag server-version-ops:release --file backend/Dockerfile backend
      - name: Export matching ops image and role contracts
        env:
          RELEASE_SOURCE: ${{ inputs.release_source_sha }}
          RELEASE_CI_RUN: ${{ inputs.release_ci_run }}
          RELEASE_CI_CHECKOUT: ${{ inputs.release_ci_checkout }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          mkdir -p "$RUNNER_TEMP/release-ops"
          docker save server-version-ops:release | gzip -1 > "$RUNNER_TEMP/release-ops/ops.tar.gz"
          id=$(docker image inspect --format '{{.Id}}' server-version-ops:release)
          container=$(docker create server-version-ops:release)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/scripts/runtime-role-defaults.sql" "$RUNNER_TEMP/release-ops/runtime-role-defaults.sql"
          docker cp "$container:/app/scripts/runtime-table-policy.json" "$RUNNER_TEMP/release-ops/runtime-table-policy.json"
          export OPS_ID="$id" OPS_OUTPUT="$RUNNER_TEMP/release-ops"
          python3 - <<'INNER'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['OPS_OUTPUT'])
          files={}
          for path in root.iterdir():
              digest=hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda:stream.read(1048576),b''):digest.update(chunk)
              files[path.name]={'sha256':digest.hexdigest(),'bytes':path.stat().st_size}
          data={'source':os.environ['RELEASE_SOURCE'],'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'ciRun':int(os.environ['RELEASE_CI_RUN']),'ciCheckout':os.environ['RELEASE_CI_CHECKOUT'],'imageRun':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'toolSha':os.environ['GITHUB_WORKFLOW_SHA'],'opsImage':os.environ['OPS_ID'],'files':files}
          (root/'manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          INNER
      - name: Upload same-source ops image
        uses: actions/upload-artifact@v4
        with:
          name: release-ops-${{ inputs.release_source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-ops/
          if-no-files-found: error
          retention-days: 3
