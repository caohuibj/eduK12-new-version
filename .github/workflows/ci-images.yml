name: CI production image step

on:
  workflow_call:
    inputs:
      cognitive_product:
        type: boolean
        default: false
      cognitive_product_plan:
        type: string
        default: ''
      catalog_discovery:
        type: boolean
        default: false
      frontend_only:
        type: boolean
        default: false
      backend_only:
        type: boolean
        default: false
      debian_mirror:
        type: string
        default: deb.debian.org
      npm_registry:
        type: string
        default: https://registry.npmjs.org
      alpine_mirror:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      frontend_only:
        type: boolean
        default: false
        description: 'Build/scan frontend only; leave both false for all components'
      backend_only:
        type: boolean
        default: false
        description: 'Build/scan backend and worker only'
      debian_mirror:
        type: string
        default: deb.debian.org
        description: 'Explicit Debian mirror host; retain official default unless selected'
      npm_registry:
        type: string
        default: https://registry.npmjs.org
        description: 'Explicit HTTPS npm registry for image builds'
      alpine_mirror:
        type: string
        default: ''
        description: 'Optional HTTPS Alpine repository prefix; empty retains official repositories'

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  images:
    name: production image build and scan
    # Production images are built in the dedicated Windows Linux slot.
    # No backend/browser artifacts are consumed here; the merge gate requires all.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEBIAN_MIRROR: ${{ inputs.debian_mirror || 'deb.debian.org' }}
      NPM_REGISTRY: ${{ inputs.npm_registry || 'https://registry.npmjs.org' }}
      ALPINE_MIRROR: ${{ inputs.alpine_mirror || '' }}
      JWT_SECRET: ci-jwt-secret-123456789012345678901234
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATA_PSEUDONYM_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      ASSET_SIGNING_SECRET: ci-asset-signing-secret-123456789012345678901234
      ASSET_MIGRATION_COMPLETE: 'true'
      COOKIE_SECURE: 'true'
      DB_USER: ci-ptool
      DB_PASSWORD: ci-ptool-password
      DB_NAME: ptool
      DATABASE_URL: postgresql://ci-ptool:ci-ptool-password@postgres:5432/ptool?schema=public
      POSTGRES_EXPORTER_DATA_SOURCE_NAME: postgresql://ci-ptool:ci-ptool-password@postgres:5432/ptool?sslmode=disable
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password-2026
      GRAFANA_PASSWORD: ci-grafana-password-2026
      COGNITIVE_MODULE_ENABLED: 'true'
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      CORS_ORIGIN: https://localhost
    defaults:
      run:
        working-directory: server-version
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.cognitive_product && '0' || '1' }}
      - name: check CI disk headroom
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-disk-preflight.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs"
      - name: configure runner-local Trivy cache
        id: runner-cache
        run: |
          trivy_cache="$HOME/.cache/trivy"
          trivy_bin_dir="$HOME/.local/bin/trivy-bin"
          mkdir -p "$trivy_cache" "$trivy_bin_dir"
          echo "trivy_cache=$trivy_cache" >> "$GITHUB_OUTPUT"
          echo "$trivy_bin_dir" >> "$GITHUB_PATH"
      - name: detect runner-local Trivy 0.70.0
        id: trivy-local
        run: |
          trivy_bin="$HOME/.local/bin/trivy-bin/trivy"
          if [ -x "$trivy_bin" ] && "$trivy_bin" --version 2>/dev/null | grep -q '^Version: 0\.70\.0$'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: install Trivy 0.70.0 once per runner
        id: trivy-install
        if: steps.trivy-local.outputs.ready != 'true'
        continue-on-error: true
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
          cache: false
      - name: fall back to a direct Trivy download when the action cannot reach the release host
        if: steps.trivy-local.outputs.ready != 'true' && steps.trivy-install.outcome == 'failure'
        run: |
          set -euo pipefail
          bin_dir="$HOME/.local/bin/trivy-bin"
          # The setup action resolved the tag through api.github.com but failed
          # to resolve github.com for the release asset on this runner (exit 6).
          # Fetch the exact asset through the API host instead, with retries;
          # the octet-stream accept header 302s to the release asset CDN.
          asset_url="$(curl -fsSL --retry 3 --retry-delay 4 --retry-all-errors --max-time 30 https://api.github.com/repos/aquasecurity/trivy/releases/tags/v0.70.0 \
            | python3 -c "import json,sys;print(next(a['url'] for a in json.load(sys.stdin)['assets'] if a['name']=='trivy_0.70.0_Linux-64bit.tar.gz'))" 2>/dev/null || echo "https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz")"
          ok=""
          for attempt in 1 2 3; do
            if curl -fsSL --retry 4 --retry-delay 8 --retry-all-errors --max-time 180 \
                -H "Accept: application/octet-stream" -o /tmp/trivy-0.70.0.tar.gz "$asset_url"; then
              ok=yes; break
            fi
            sleep "$((attempt * 10))"
          done
          [ -n "$ok" ] || { echo "Trivy fallback download failed" >&2; exit 1; }
          tar -xzf /tmp/trivy-0.70.0.tar.gz -C "$bin_dir" trivy
          "$bin_dir/trivy" --version | grep -q '^Version: 0\.70\.0$'
      - name: recheck actual Cognitive product scope before selecting its compile path
        if: inputs.cognitive_product
        working-directory: .
        env:
          COGNITIVE_PRODUCT_PLAN: ${{ inputs.cognitive_product_plan }}
        run: node .github/scripts/cognitive-product-check.mjs plan
      - name: validate compose
        run: docker compose config --format json > /tmp/eduk12-compose-config.json
      - name: assert prelaunch resource and HTTPS contract
        run: node scripts/prelaunch-resource-preflight.mjs --compose-json /tmp/eduk12-compose-config.json
      - name: assert API/worker isolation topology
        run: node scripts/assert-compose-worker-topology.mjs /tmp/eduk12-compose-config.json
      - name: validate monitoring compose
        run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config > /tmp/eduk12-monitoring-compose-config.yml
      - name: build production images
        env:
          FRONTEND_ONLY: ${{ inputs.frontend_only }}
          BACKEND_ONLY: ${{ inputs.backend_only }}
          CATALOG_DISCOVERY: ${{ inputs.catalog_discovery || inputs.cognitive_product }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/build-ci-images.sh"
      - name: verify production Nginx static asset MIME and security headers
        if: inputs.backend_only != true
        run: node scripts/frontend-nginx-static-smoke.mjs server-version-frontend:latest
      - name: scan backend image (high and critical)
        if: inputs.frontend_only != true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: server-version-backend:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          cache: 'false'
          skip-setup-trivy: true
          cache-dir: ${{ steps.runner-cache.outputs.trivy_cache }}
      - name: scan frontend image (high and critical)
        if: inputs.backend_only != true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: server-version-frontend:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          cache: 'false'
          skip-setup-trivy: true
          cache-dir: ${{ steps.runner-cache.outputs.trivy_cache }}
