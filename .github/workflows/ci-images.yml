name: CI production image step

on:
  workflow_call:
    inputs:
      cognitive_product:
        type: boolean
        default: false
      cognitive_product_plan:
        type: string
        default: ''
      catalog_discovery:
        type: boolean
        default: false
      survey_selection:
        type: boolean
        default: false
      frontend_only:
        type: boolean
        default: false
      backend_only:
        type: boolean
        default: false
      debian_mirror:
        type: string
        default: deb.debian.org
      npm_registry:
        type: string
        default: https://registry.npmjs.org
      alpine_mirror:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      frontend_only:
        type: boolean
        default: false
        description: 'Build/scan frontend only; leave both false for all components'
      backend_only:
        type: boolean
        default: false
        description: 'Build/scan backend and worker only'
      debian_mirror:
        type: string
        default: deb.debian.org
        description: 'Explicit Debian mirror host; retain official default unless selected'
      npm_registry:
        type: string
        default: https://registry.npmjs.org
        description: 'Explicit HTTPS npm registry for image builds'
      alpine_mirror:
        type: string
        default: ''
        description: 'Optional HTTPS Alpine repository prefix; empty retains official repositories'
      export_release:
        type: boolean
        default: false
        description: 'Export scanned runtime/frontend and same-source ops for deployment'
      release_source:
        type: string
        default: ''
        description: 'Exact approved 40-character release SHA; required for export'

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  images:
    name: production image build and scan
    # Production images are built in the dedicated Windows Linux slot.
    # No backend/browser artifacts are consumed here; the merge gate requires all.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEBIAN_MIRROR: ${{ inputs.debian_mirror || 'deb.debian.org' }}
      NPM_REGISTRY: ${{ inputs.npm_registry || 'https://registry.npmjs.org' }}
      ALPINE_MIRROR: ${{ inputs.alpine_mirror || '' }}
      JWT_SECRET: ci-jwt-secret-123456789012345678901234
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATA_PSEUDONYM_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      ASSET_SIGNING_SECRET: ci-asset-signing-secret-123456789012345678901234
      ASSET_MIGRATION_COMPLETE: 'true'
      COOKIE_SECURE: 'true'
      DB_USER: ci-ptool
      DB_PASSWORD: ci-ptool-password
      DB_NAME: ptool
      DATABASE_URL: postgresql://ci-ptool:ci-ptool-password@postgres:5432/ptool?schema=public
      POSTGRES_EXPORTER_DATA_SOURCE_NAME: postgresql://ci-ptool:ci-ptool-password@postgres:5432/ptool?sslmode=disable
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password-2026
      GRAFANA_PASSWORD: ci-grafana-password-2026
      COGNITIVE_MODULE_ENABLED: 'true'
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      CORS_ORIGIN: https://localhost
    defaults:
      run:
        working-directory: server-version
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.cognitive_product && '0' || '1' }}
          ref: ${{ inputs.export_release && inputs.release_source || github.sha }}
      - name: bind explicit release source before export
        if: inputs.export_release
        env:
          RELEASE_SOURCE: ${{ inputs.release_source }}
          FRONTEND_ONLY: ${{ inputs.frontend_only }}
          BACKEND_ONLY: ${{ inputs.backend_only }}
        run: |
          [[ "$RELEASE_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          test "$FRONTEND_ONLY" != true
          test "$BACKEND_ONLY" != true
      - name: check CI disk headroom
        run: bash "$GITHUB_WORKSPACE/server-version/scripts/ci-disk-preflight.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify runner capacity and clean application ports
        run: node "$GITHUB_WORKSPACE/.github/scripts/runner-preflight.mjs"
      - name: configure runner-local Trivy cache
        id: runner-cache
        run: |
          trivy_cache="$HOME/.cache/trivy"
          trivy_bin_dir="$HOME/.local/bin/trivy-bin"
          mkdir -p "$trivy_cache" "$trivy_bin_dir"
          echo "trivy_cache=$trivy_cache" >> "$GITHUB_OUTPUT"
          echo "$trivy_bin_dir" >> "$GITHUB_PATH"
      - name: detect runner-local Trivy 0.70.0
        id: trivy-local
        run: |
          trivy_bin="$HOME/.local/bin/trivy-bin/trivy"
          if [ -x "$trivy_bin" ] && "$trivy_bin" --version 2>/dev/null | grep -q '^Version: 0\.70\.0$'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: install Trivy 0.70.0 once per runner
        if: steps.trivy-local.outputs.ready != 'true'
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
          cache: false
      - name: recheck actual Cognitive product scope before selecting its compile path
        if: inputs.cognitive_product
        working-directory: .
        env:
          COGNITIVE_PRODUCT_PLAN: ${{ inputs.cognitive_product_plan }}
        run: node .github/scripts/cognitive-product-check.mjs plan
      - name: validate compose
        run: docker compose config --format json > /tmp/eduk12-compose-config.json
      - name: assert prelaunch resource and HTTPS contract
        run: node scripts/prelaunch-resource-preflight.mjs --compose-json /tmp/eduk12-compose-config.json
      - name: assert API/worker isolation topology
        run: node scripts/assert-compose-worker-topology.mjs /tmp/eduk12-compose-config.json
      - name: validate monitoring compose
        run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config > /tmp/eduk12-monitoring-compose-config.yml
      - name: build production images
        env:
          FRONTEND_ONLY: ${{ inputs.frontend_only }}
          BACKEND_ONLY: ${{ inputs.backend_only }}
          CATALOG_DISCOVERY: ${{ inputs.catalog_discovery || inputs.cognitive_product || inputs.export_release }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/build-ci-images.sh"
      - name: verify production Nginx static asset MIME and security headers
        if: inputs.backend_only != true
        run: node scripts/frontend-nginx-static-smoke.mjs server-version-frontend:latest
      - name: install pinned browser for the changed Wave UI
        if: inputs.survey_selection
        working-directory: .
        run: |
          npm ci --ignore-scripts --prefix .github/release-tools
          node .github/release-tools/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Wave selection smoke on this production frontend image
        if: inputs.survey_selection
        working-directory: .
        run: node .github/scripts/survey-wave-selection-browser.mjs
      - name: scan backend image (high and critical)
        if: inputs.frontend_only != true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: server-version-backend:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          cache: 'false'
          skip-setup-trivy: true
          cache-dir: ${{ steps.runner-cache.outputs.trivy_cache }}
      - name: scan frontend image (high and critical)
        if: inputs.backend_only != true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: server-version-frontend:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          cache: 'false'
          skip-setup-trivy: true
          cache-dir: ${{ steps.runner-cache.outputs.trivy_cache }}

      - uses: actions/upload-artifact@v4
        if: always() && inputs.survey_selection
        with:
          name: survey-wave-selection-browser-${{ github.sha }}
          path: survey-wave-selection-browser-report/
          if-no-files-found: error
          retention-days: 3

      # This opt-in preserves deployable bytes; normal CI callers are unchanged.
      # Compile/registration evidence is supplied by the approved source's PR CI.
      - name: build matching ops from the already cached compile stage
        if: inputs.export_release
        run: |
          set -euo pipefail
          recipe="$(mktemp "$GITHUB_WORKSPACE/server-version/backend/.release-ops.XXXXXX")"
          trap 'rm -f "$recipe"' EXIT
          export RELEASE_OPS_RECIPE="$recipe"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {pathToFileURL} from 'node:url';
          const {catalogCompileRecipe}=await import(pathToFileURL(process.env.GITHUB_WORKSPACE+'/.github/scripts/ci-image-plan.mjs'));
          writeFileSync(process.env.RELEASE_OPS_RECIPE,catalogCompileRecipe(readFileSync('backend/Dockerfile','utf8')));
          JS
          docker build --target ops --file "$recipe" --tag server-version-ops:release \
            --build-arg "DEBIAN_MIRROR=$DEBIAN_MIRROR" --build-arg "NPM_REGISTRY=$NPM_REGISTRY" backend
      - name: retain exact deployable images and operator inputs
        if: inputs.export_release
        env:
          RELEASE_SOURCE: ${{ inputs.release_source }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-images"
          export RELEASE_OUTPUT="$RUNNER_TEMP/release-images"
          python3 - <<'PY'
          import json,os,subprocess,pathlib
          out=pathlib.Path(os.environ['RELEASE_OUTPUT'])
          images={}
          for component,tag in [('runtime','server-version-backend:latest'),('frontend','server-version-frontend:latest'),('ops','server-version-ops:release')]:
              image=json.loads(subprocess.check_output(['docker','image','inspect',tag],text=True))[0]
              assert image['Os']=='linux' and image['Architecture']=='amd64'
              images[component]={'imageId':image['Id'],'tag':tag,'sizeBytes':image['Size']}
          manifest={'schemaVersion':1,'releaseSource':os.environ['RELEASE_SOURCE'],'producerRun':os.environ['GITHUB_RUN_ID'],'producerAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'images':images,'runtimeAndFrontendScans':'existing image steps succeeded','ops':'same Dockerfile build stage; not a new application validation'}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
          docker save server-version-backend:latest server-version-frontend:latest server-version-ops:release \
            | gzip -1 > "$RUNNER_TEMP/release-images/images.tar.gz"
          ops_container=$(docker create server-version-ops:release)
          trap 'docker rm "$ops_container" >/dev/null' EXIT
          docker cp "$ops_container:/app/scripts/runtime-role-defaults.sql" "$RUNNER_TEMP/release-images/runtime-role-defaults.sql"
          docker cp "$ops_container:/app/scripts/runtime-table-policy.json" "$RUNNER_TEMP/release-images/runtime-table-policy.json"
      - uses: actions/upload-artifact@v4
        if: success() && inputs.export_release
        with:
          name: release-images-${{ inputs.release_source }}
          path: ${{ runner.temp }}/release-images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
