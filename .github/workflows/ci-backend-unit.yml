name: CI backend unit-only component

on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  backend-unit:
    name: exact changed backend unit contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NODE_ENV: test
      CI_BASE_SHA: ${{ inputs.base_sha }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: server-version/backend/package-lock.json
      - name: Verify the qualification policy and its negative cases
        run: node --test .github/scripts/ci-qualification.test.mjs
      - name: Fetch exact PR base
        run: git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
      - name: Install locked backend dependencies
        working-directory: server-version/backend
        run: npm ci
      - name: Generate exact Prisma types
        working-directory: server-version/backend
        run: npx prisma generate
      - name: Run only the changed, admitted backend unit tests
        run: node .github/scripts/ci-backend-unit-runner.mjs
