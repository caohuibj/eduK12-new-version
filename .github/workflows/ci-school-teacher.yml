name: School Teacher exact affected qualification
on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  PLAN: ${{ inputs.plan }}
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
jobs:
  admission:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: authenticate frozen scope and all configured source inputs
        run: node .github/scripts/school-teacher-checks.mjs admission
      - name: verify only new control contracts
        run: node --test --test-name-pattern='Run15' .github/scripts/school-teacher.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-teacher-admission-${{ github.sha }}
          path: school-teacher-evidence/*.json
          if-no-files-found: error
          retention-days: 3
  frontend:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VITE_COGNITIVE_MODULE_ENABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify original frontend checks and exact run15 immutable frontend build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin dcbc58483c6b6ce8a81526ddbc124a8b1c1c993c 81ee1f6d6a097e0c9e0aca3da05582f614325878 81947063451c5a5e2ee028ee41256671b19ef201 dadcef2d497ed51f4d75458c12b46bbb2fc6d82b 051d8eb0f869c166b09739132ff8ea8e9a666613 6337343de882ba07999a47c1f5a2c71a58b1a597
          node .github/scripts/school-teacher-checks.mjs frontend
      - uses: actions/upload-artifact@v4
        with:
          name: school-teacher-frontend-${{ github.sha }}
          path: server-version/frontend/dist
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-teacher-frontend-checks-${{ github.sha }}
          path: school-teacher-evidence/*.json
          if-no-files-found: error
          retention-days: 3
      - name: remove private diagnostics
        if: always()
        run: node .github/scripts/school-teacher-checks.mjs cleanup
  connected:
    needs: [admission, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: school_teacher_browser_ci_test
          POSTGRES_USER: ptool
          POSTGRES_PASSWORD: synthetic-actions-disposable
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U ptool -d school_teacher_browser_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-bookworm
        ports: ['6379/tcp']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      SCHOOL_TEACHER_ISOLATED_DB: '1'
      PRISMA_SKIP_POSTINSTALL_GENERATE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: bind disposable endpoints after service initialization
        env:
          DATABASE_URL: postgresql://ptool:synthetic-actions-disposable@127.0.0.1:${{ job.services.postgres.ports[5432] }}/school_teacher_browser_ci_test?schema=public&connection_limit=10
          SCHOOL_TEACHER_TEST_DATABASE_URL: postgresql://ptool:synthetic-actions-disposable@127.0.0.1:${{ job.services.postgres.ports[5432] }}/school_teacher_browser_ci_test?schema=public&connection_limit=10
          RELEASE_INTEGRATION_DATABASE_URL: postgresql://ptool:synthetic-actions-disposable@127.0.0.1:${{ job.services.postgres.ports[5432] }}/school_teacher_browser_ci_test?schema=public&connection_limit=10
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/0
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          SCHOOL_TEACHER_PRIVATE_DIR: ${{ runner.temp }}/school-teacher-private
        run: |
          for key in DATABASE_URL SCHOOL_TEACHER_TEST_DATABASE_URL RELEASE_INTEGRATION_DATABASE_URL REDIS_URL CI_POSTGRES_SERVICE_ID SCHOOL_TEACHER_PRIVATE_DIR; do
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - run: npm ci --ignore-scripts --prefix .github/release-tools
      - run: bash server-version/scripts/ci-install-canvas-deps.sh
      - working-directory: server-version/backend
        run: npm ci
      - working-directory: server-version/backend
        run: |
          node node_modules/prisma/build/index.js validate --schema prisma/schema.prisma
          node node_modules/prisma/build/index.js generate --schema prisma/schema.prisma
      - name: verify fixed official backend compile and 105 passed cases then restore original dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin b717cddfdeb957bc3665ed3e69f8a680befa021b db477157b097556dc8e59cda1f6bda71f06a71f6
          node .github/scripts/school-teacher-checks.mjs backend
      - uses: actions/upload-artifact@v4
        with:
          name: school-teacher-backend-${{ github.sha }}
          path: server-version/backend/dist
          if-no-files-found: error
          retention-days: 3
      - name: retain original nonempty upgrade qualification and prepare this fresh isolated database
        run: node .github/scripts/school-teacher-checks.mjs migrate
      - name: verify the fixed official remaining five cases without executing business tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin 60f13df9121eeb66c221dfe8b1f0535082a4a59c c291aec6bbd2009e8c18f783e3eb42d0791ad1bb
          node .github/scripts/school-teacher-checks.mjs postgres
      - uses: actions/download-artifact@v4
        with:
          name: school-teacher-frontend-${{ github.sha }}
          path: server-version/frontend/dist
      - uses: actions/download-artifact@v4
        with:
          name: school-teacher-frontend-checks-${{ github.sha }}
          path: school-teacher-frontend-receipt
      - name: retain the exact verified frontend receipt
        run: |
          mkdir -p school-teacher-evidence
          cp school-teacher-frontend-receipt/official-frontend-build-reuse.json school-teacher-evidence/official-frontend-build-reuse.json
      - name: verify the original frontend and backend manifests against actual dist bytes
        run: |
          node .github/scripts/school-teacher-checks.mjs verify-frontend-artifact
          node .github/scripts/school-teacher-checks.mjs verify-backend-artifact
      - name: prepare only the missing authenticated CJK font without claiming visual success
        run: node .github/scripts/school-teacher-checks.mjs fonts
      - name: apply the confirmed temporary runner Chrome write-permission tightening
        if: github.repository == 'caohuibj/eduK12-new-version' && github.event_name == 'pull_request' && github.event.pull_request.number == 338 && github.event.pull_request.head.ref == 'work/school-teacher-review-20261022' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          SCHOOL_TEACHER_CHROME_TIGHTEN: confirmed-temporary-runner
        run: node server-version/e2e/school-teacher-chrome-permissions.cjs tighten
      - name: inspect this runner Chrome, no automatic install or fallback
        run: node server-version/e2e/school-teacher-chrome.cjs preflight
      - name: seed restricted synthetic browser identities without exposing private output
        run: node .github/scripts/school-teacher-checks.mjs seed
      - name: execute real School Teacher journey with sandboxed official Chrome
        env:
          SCHOOL_TEACHER_ARTIFACTS_VERIFIED: '1'
        run: node server-version/e2e/school-teacher-browser.cjs
      - name: require exact original and new UI assertion matrices
        run: node .github/scripts/school-teacher-checks.mjs browser-report
      - name: prove nonempty current schema restore retains affected facts
        run: node .github/scripts/school-teacher-checks.mjs restore
      - name: remove private test material on every outcome
        if: always()
        run: node .github/scripts/school-teacher-checks.mjs cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-teacher-connected-${{ github.sha }}
          path: |
            school-teacher-evidence/*.json
            school-teacher-evidence/screenshots/*.png
          if-no-files-found: error
          retention-days: 3
  security:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify original successful two-component audit and unchanged dependency inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin dcbc58483c6b6ce8a81526ddbc124a8b1c1c993c 81ee1f6d6a097e0c9e0aca3da05582f614325878
          node .github/scripts/school-teacher-checks.mjs audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-teacher-audit-${{ github.sha }}
          path: school-teacher-evidence/*.json
          if-no-files-found: error
          retention-days: 3
      - if: always()
        run: node .github/scripts/school-teacher-checks.mjs cleanup
  qualified:
    needs: [admission, frontend, connected, security]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: recompute full candidate and reject every missing skipped or failed job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/school-teacher-checks.mjs aggregate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: school-teacher-qualification-failure-${{ github.sha }}
          path: school-teacher-evidence/*.json
          if-no-files-found: error
          retention-days: 3
      - if: always()
        run: node .github/scripts/school-teacher-checks.mjs cleanup
# Called by the exact School/Teacher route; stable gate requires this workflow and actual CodeQL.
# Existing Survey workspace routing and its continuation evidence must remain unchanged.
# Stable merge gate must require scope, this entire workflow and actual CodeQL success.
# No production image/OS-scan or deployment qualification is claimed.
