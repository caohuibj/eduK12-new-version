name: Training Survey exact mixed merge qualification
on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
  CI_EVENT: pull_request
  CI_HEAD_REF: ${{ github.event.pull_request.head.ref }}
  CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
  CI_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
  CI_PR_NUMBER: ${{ github.event.pull_request.number }}
  PLAN: ${{ inputs.plan }}
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify exact scope and explicitly reviewed original local evidence
        run: node .github/scripts/training-entry-checks.mjs admission
      - name: run current frontend and backend HIGH CRITICAL dependency audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/training-entry-checks.mjs audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-entry-admission-${{ github.sha }}
          path: training-entry-evidence
          if-no-files-found: error
          retention-days: 3
  backend:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: verify complete successful official backend qualification and emitted bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/training-entry-checks.mjs recover-backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-entry-backend-${{ github.sha }}
          path: training-entry-evidence
          if-no-files-found: error
          retention-days: 3
  frontend:
    outputs:
      artifact: ${{ steps.dist.outputs.artifact-id }}
      manifest: ${{ steps.build.outputs.manifest }}
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: server-version/frontend/package-lock.json
      - name: install official locked frontend tools
        working-directory: server-version/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: only fixed missing-record affected frontend contracts
        run: node .github/scripts/training-entry-checks.mjs frontend
      - name: retain exact successful lint and unaffected browser scenarios
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/training-entry-checks.mjs recover-browser
      - name: lint only the changed batch review source and regression
        run: node .github/scripts/training-entry-checks.mjs batch-grade-lint
      - name: require explicit one-time rebuild exception
        run: node .github/scripts/training-entry-checks.mjs build-permission
      - name: compile once for previously unexecuted actual-dist browser acceptance
        id: build
        run: node .github/scripts/training-entry-checks.mjs frontend-build
      - uses: actions/upload-artifact@v4
        if: always()
        id: dist
        with:
          name: training-entry-frontend-${{ github.sha }}
          path: |
            training-entry-evidence
            server-version/frontend/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  browser:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TZ: UTC
      TRAINING_BUILD_MANIFEST_SHA256: ${{ needs.frontend.outputs.manifest }}
      TRAINING_BUILD_ARTIFACT_ID: ${{ needs.frontend.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: require exact successful producer artifact identity
        run: node -e 'if(!/^[1-9][0-9]*$/.test(process.env.TRAINING_BUILD_ARTIFACT_ID||""))throw Error("Missing producer artifact")'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.frontend.outputs.artifact }}
          merge-multiple: true
          path: .
      - name: verify same-run exact frontend output before browser execution
        run: node .github/scripts/training-entry-checks.mjs browser-input
      - name: install pinned controls and use the existing official sandboxed Chrome
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/release-tools
          google-chrome --version
          if ! fc-list :lang=zh file | grep -q .; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o APT::Update::Error-Mode=any update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y --no-install-recommends fonts-wqy-zenhei
          fi
          test -n "$(fc-list :lang=zh file)"
      - name: execute bounded real Chromium frontend journeys on these exact dist bytes
        run: node .github/scripts/training-entry-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-entry-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: training-entry-evidence
          if-no-files-found: error
          retention-days: 3
  qualified:
    needs: [admission, backend, frontend, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: require actual success of every selected nested job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node -e 'const n=JSON.parse(process.env.NEEDS);for(const k of ["admission","backend","frontend","browser"])if(n[k]?.result!=="success")throw Error(k+" did not succeed")'
