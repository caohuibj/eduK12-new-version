<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 960" role="img" aria-labelledby="title desc"><title id="title">ANT 正式几何与校准待确认方案</title><desc id="desc">项目布局示意，不是结果或已确认方案。区域八乘六度，箭头一乘零点五度，相邻中心距一点二五度，上下偏心一点五度，提示零点六度，线宽零点零六度。</desc><rect width="680" height="960" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#1f2937"><rect x="24" y="24" width="632" height="52" rx="8" fill="#fff3cd"/><text x="40" y="56" font-size="17">待确认的布局示意 · 不是测量结果或已批准的正式几何</text><text x="32" y="122" font-size="29" font-weight="600">ANT：校准后冻结呈现尺寸</text><text x="32" y="160" font-size="17">沿用现有形状、时序、题量、guided 练习与计分。</text><rect x="80" y="190" width="520" height="320" fill="#fff" stroke="#64748b"/><text x="340" y="216" text-anchor="middle" font-size="15" fill="#475569">呈现区域 8° × 6°（示意放大）</text><path d="M332 356H348M340 348V364" stroke="#000" stroke-width="2"/><defs><g id="a"><path d="M-13 0H11" stroke="#000" stroke-width="2"/><path d="M7-7L17 0L7 7Z" fill="#000"/></g></defs><g transform="translate(340 278)"><use href="#a" x="-136"/><use href="#a" x="-68"/><g transform="rotate(180)"><use href="#a"/></g><use href="#a" x="68"/><use href="#a" x="136"/></g><path d="M550 278V356M545 284L550 278L555 284M545 350L550 356L555 350" fill="none" stroke="#64748b"/><text x="564" y="320" font-size="14">1.5°</text><text x="340" y="464" font-size="17" text-anchor="middle">只判断中间箭头；本例选左</text><rect x="185" y="532" width="130" height="78" rx="8" fill="#fff" stroke="#64748b"/><rect x="333" y="532" width="130" height="78" rx="8" fill="#fff" stroke="#64748b"/><text x="250" y="580" text-anchor="middle" font-size="24">← 左</text><text x="398" y="580" text-anchor="middle" font-size="24">右 →</text><text x="32" y="656" font-size="18">箭头：1° × 0.5°；相邻中心距：1.25°</text><text x="32" y="693" font-size="18">提示直径：0.6°；线宽：0.06°；保留 absent</text><text x="32" y="730" font-size="18">回应区：130 × 78 CSS px；间距：18 px；键盘 ← / →</text><text x="32" y="780" font-size="17">复用 50 mm 标尺和观看距离自报；按真实校准换算。</text><text x="32" y="815" font-size="17">冻结几何／校准／viewport／输入映射；放不下不缩小。</text><text x="32" y="850" font-size="17">350 mm 距离、190 px / 50 mm 时，1°约 23.2 px。</text><text x="32" y="886" font-size="16" fill="#475569">以上为项目尺寸提案，不声称文献原尺寸；确认前不启用 ANT。</text><text x="32" y="934" font-size="15" fill="#475569">EDUK12.TOP · 图示与详细 HTML 方案共用同一组建议参数</text></g></svg>
