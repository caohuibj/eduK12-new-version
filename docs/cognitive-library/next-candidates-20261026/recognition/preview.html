<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连续图像再认｜静态设计评审</title><style>
*{box-sizing:border-box}body{margin:0;background:#F8FAFC;color:#1F2937;font:15px/1.7 system-ui,sans-serif}.review-toolbar{max-width:900px;margin:auto;padding:18px 18px 12px;border-bottom:1px solid #CBD5E1}.review-toolbar h1{font-size:18px;margin:0 0 6px}.review-toolbar p{font-size:12px;color:#4B5563;margin:3px 0}.review-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.review-controls label{display:flex;min-width:0;max-width:100%;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}.review-controls select,.review-controls button{font:inherit;color:#1F2937;background:#fff;border:1px solid #64748B;border-radius:6px;min-height:40px;max-width:100%;padding:5px 8px}.candidate{min-height:680px;color:#1F2937;background:#F8FAFC;isolation:isolate;max-width:760px;margin:auto;padding:26px 20px 40px}.candidate h2{font-size:25px;line-height:1.4;margin:0 0 14px;font-weight:600}.candidate h3{font-size:17px;margin:0 0 10px}.candidate p{margin:12px 0;color:#4B5563}.candidate .eyebrow{font-size:12px;margin:0 0 7px}.candidate .action{appearance:none;font:500 15px/1.7 system-ui,sans-serif;min-height:48px;padding:10px 18px;border:1px solid #1D4ED8;border-radius:8px;background:#1D4ED8;color:#fff;box-shadow:none;cursor:pointer}.candidate .action:hover{background:#1E40AF}.candidate .action:focus-visible,.candidate summary:focus-visible,.review-controls :focus-visible{outline:3px solid #64748B;outline-offset:3px}.candidate .secondary{color:#1F2937;border-color:#64748B;background:#fff}.candidate .card{border:1px solid #CBD5E1;border-radius:10px;background:#fff;padding:18px;margin:20px 0}.candidate .notice{font-size:13px;border-left:3px solid #64748B;padding:9px 12px;background:#fff}.candidate .small{font-size:12px;line-height:1.8}.candidate .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.candidate .actions>*{flex:1;min-width:120px}.candidate ul{padding-left:22px}.candidate li{margin:13px 0}.stage-head{display:flex;justify-content:space-between;gap:14px;font-size:12px;color:#4B5563;margin-bottom:16px}.stage-board{width:300px;height:300px;flex:none;margin:32px auto;background:#fff;border:1px solid #64748B;display:grid;place-items:center;overflow:hidden}.stage-board svg{display:block;width:100%;height:100%}.stage-cross{font-size:34px;color:#222;line-height:1}.response-space{margin:30px auto 0;width:300px}.candidate .seen{width:100%;min-height:64px;font-size:21px;touch-action:manipulation}.response-instruction{text-align:center;min-height:68px;font-size:13px}.stage-caption{font-size:12px;text-align:center}.metrics-line{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px}.metrics-line .stat{border:1px solid #CBD5E1;padding:15px 12px;border-radius:8px;background:#fff}.metrics-line .stat h3{font-size:14px;margin:0;color:#4B5563}.metrics-line .number{font-size:33px;line-height:1.3;color:#1F2937;font-weight:600;margin:12px 0 4px}.number small{font-size:17px;font-weight:400}.candidate details{margin:22px 0}.candidate summary{cursor:pointer;color:#4B5563}.candidate .takehome{margin:20px 0;max-width:440px}.takehome svg{display:block;width:100%;height:auto}.candidate table{width:100%;font-size:13px;border-collapse:collapse;text-align:left}.candidate th,.candidate td{padding:8px 6px;border-bottom:1px solid #CBD5E1;vertical-align:top}.candidate .table-wrap{overflow-x:auto}.candidate .check{display:flex;gap:10px;align-items:center;margin:20px 0;font-size:13px}.candidate .check input{width:20px;height:20px;accent-color:#1D4ED8}.preview-only{font-size:12px;color:#4B5563}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:360px){.stage-board,.response-space{width:100%;max-width:300px}.stage-board{height:auto;aspect-ratio:1}.metrics-line{grid-template-columns:1fr}.candidate h2{font-size:23px}}@media(min-width:700px){.candidate{padding-top:36px}.stage-board{margin-top:44px;margin-bottom:44px}}
</style></head><body>
<header class="review-toolbar"><h1 id="reviewTitle"></h1><p id="reviewNotice"></p><p id="reviewBoundary"></p><div class="review-controls"><label><span id="viewLabel"></span><select id="view"></select></label><label><span id="profileLabel"></span><select id="profile"></select></label><label><span id="languageLabel"></span><select id="language"><option value="zh">中文</option><option value="en">English</option></select></label><label id="sampleControl"><span id="sampleLabel"></span><select id="sample"></select></label></div></header>
<main class="candidate" data-cognitive-task-root="true" id="candidate-root"></main>
<script>
(()=>{'use strict';
const controls={view:document.getElementById('view'),profile:document.getElementById('profile'),language:document.getElementById('language'),sample:document.getElementById('sample')};
const query=new URLSearchParams(location.search);let state={view:query.get('view')||'intro',profile:query.get('profile')||'experience',language:query.get('lang')==='en'?'en':'zh',sample:query.get('sample')||'positive',showTakehome:true};
const allowed=['intro','image','isi','interpretable','limited','invalid','parameters'];if(!allowed.includes(state.view))state.view='intro';if(!['research','experience'].includes(state.profile))state.profile='experience';if(!['positive','negative'].includes(state.sample))state.sample='positive';
const T=(zh,en)=>state.language==='en'?en:zh;
const scenesvg=()=>'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" aria-label="'+T('原创几何布局占位图，不是正式测验素材','Original geometric layout placeholder, not assessment material')+'" role="img"><rect width="300" height="300" fill="#F2F2F2"/><rect x="38" y="39" width="96" height="105" rx="8" fill="#1D4ED8"/><circle cx="204" cy="92" r="42" fill="#E69F00"/><path d="M77 220 Q147 139 237 203 Q187 272 77 220Z" fill="#009E73"/><path d="M99 219 L209 204" stroke="#1F2937" stroke-width="5"/><rect x="43" y="257" width="214" height="7" fill="#64748B"/></svg>';
function source(){const research=state.profile==='research';const n=research?60:20;return{n,total:research?260:100,hits:state.sample==='negative'?(research?18:6):(research?48:16),falseAlarms:state.sample==='negative'?(research?30:10):(research?15:5),received:research?218:82,pairs:research?54:17,filler:research?124:54,vigilance:research?16:6}}
function model(){const s=source(),approved=state.view==='interpretable';return{...s,quality:state.view,hitRate:approved?s.hits/s.n:null,falseAlarmRate:approved?s.falseAlarms/s.n:null,crr:approved?s.hits/s.n-s.falseAlarms/s.n:null}}
function option(value,label){const element=document.createElement('option');element.value=value;element.textContent=label;return element}
function setOptions(select,list,value){select.replaceChildren(...list.map(([v,l])=>option(v,l)));select.value=value}
function setView(view){state.view=view;render();document.getElementById('candidate-root').focus?.()}
function reportImage(m){if(m.hitRate===null||m.falseAlarmRate===null||m.crr===null)return'';const line1=T('纳入统计的重复图：认出 '+m.hits+' / '+m.n,'Included repeat images: '+m.hits+' / '+m.n+' detected');const line2=T('对应目标首次：误认 '+m.falseAlarms+' / '+m.n,'Corresponding target first views: '+m.falseAlarms+' / '+m.n+' false alarms');return'<figure class="takehome"><svg xmlns="http://www.w3.org/2000/svg" width="440" height="194" viewBox="0 0 440 194" role="img" aria-label="'+line1+'; '+line2+'; '+T('合成体验设计示例','Synthetic design example')+'"><rect x="1" y="1" width="438" height="192" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="20" y="30" fill="#4B5563" font-family="system-ui,sans-serif" font-size="12">'+T('连续图像再认 · 合成设计示例','Continuous image recognition · synthetic example')+'</text><text x="20" y="67" fill="#1F2937" font-family="system-ui,sans-serif" font-size="18" font-weight="600">'+line1+'</text><text x="20" y="97" fill="#1F2937" font-family="system-ui,sans-serif" font-size="14">'+line2+'</text><text x="20" y="135" fill="#4B5563" font-family="system-ui,sans-serif" font-size="12">'+T('只描述本组图片与间隔；无适用常模','Only this image set and spacing; no applicable norms')+'</text><text x="20" y="169" fill="#1D4ED8" font-family="system-ui,sans-serif" font-size="14" font-weight="700">EDUK12.TOP</text></svg></figure>'}
function render(){document.documentElement.lang=state.language==='en'?'en':'zh-CN';document.getElementById('reviewTitle').textContent=T('连续图像再认 · 静态设计评审','Continuous Image Recognition · static design review');document.getElementById('reviewNotice').textContent=T('仅设计草案，不是运行测验；页面切换不代表750/800 ms真实计时。','Design proposal only, not a running assessment. View changes do not implement 750/800 ms timing.');document.getElementById('reviewBoundary').textContent=T('几何图仅为原创布局占位；正式刺激、短版和输入尚待确认。','Original geometry is a layout placeholder. Production stimuli, short profile and input remain unconfirmed.');
document.getElementById('viewLabel').textContent=T('评审画面','Review view');document.getElementById('profileLabel').textContent=T('版本提案','Profile proposal');document.getElementById('languageLabel').textContent=T('语言','Language');document.getElementById('sampleLabel').textContent=T('合成数据','Synthetic data');
setOptions(controls.view,[['intro',T('指导','Instructions')],['image',T('图像呈现','Image view')],['isi',T('图后间隔','Following interval')],['interpretable',T('可解释报告','Interpretable')],['limited',T('受限报告','Limited')],['invalid',T('无效报告','Invalid')],['parameters',T('参数与待确认','Parameters / decisions')]],state.view);setOptions(controls.profile,[['experience',T('体验版 · 100呈现提案','Experience · 100 views proposed')],['research',T('研究对照 · 260次（上游示例）','Research comparison · 260 views')]],state.profile);setOptions(controls.sample,[['positive',T('示例A','Example A')],['negative',T('负差值示例','Negative-difference example')]],state.sample);controls.language.value=state.language;document.getElementById('sampleControl').hidden=!['interpretable','limited','invalid'].includes(state.view);
const root=document.getElementById('candidate-root');root.dataset.view=state.view;root.dataset.profile=state.profile;const s=source(),label=state.profile==='research'?T('研究对照提案（上游示例参数）','Research comparison: upstream example'):T('体验版提案','Experience profile proposal');
if(state.view==='intro'){root.innerHTML='<p class="eyebrow">'+label+'</p><h2>'+T('见过这张图时，轻点一次','Tap once when you recognize a repeat')+'</h2><p>'+T('图片会一张张出现。第一次看到的图片，不用操作；认出刚才或之前见过的图片时，点一下“见过”。','Images appear one at a time. Do nothing on the first appearance. Tap “Seen” when you recognize an image from earlier.')+'</p><ul><li>'+T('图片消失后的短间隔，也可以回应上一张图；下一张图片出现后，回应就归新图片。','You may also respond to the previous image during its short following interval. Once the next image appears, responses belong to it.')+'</li><li>'+T('把手指轻放在回应区附近，不需要反复点击，也没有“没见过”按钮。','Keep your finger near the response area. Do not tap repeatedly. There is no “Not seen” button.')+'</li><li>'+T('使用鼠标时点同一按钮；使用键盘时按R。正式过程中不提示答对或答错。','Use the same button with a mouse, or press R on a keyboard. Formal trials do not give correctness feedback.')+'</li></ul><div class="card"><h3>'+T('先用示例熟悉操作','First, learn the response rule')+'</h3><p>'+T('拟增加8次独立练习，帮助理解“首次不点、重复才点”；这是项目新增提案，上游示例没有独立练习。','Eight separate practice views are proposed to demonstrate “first view: no response; repeat: tap”. This is a project addition, not an upstream practice block.')+'</p><p class="small">'+T('练习图独立，只教操作；短间隔和重复比例不代表正式序列。可重看说明，不设能力门槛。','Practice images are separate and teach controls only; their short lags and proportions do not represent formal trials. Instructions may be revisited; no ability cutoff is used.')+'</p></div><p class="notice">'+T('当前为静态评审。正式图片尚未选定与清权；下页几何图不作为正式测验内容。','This is a static review. Production images have not been selected or cleared; the geometric picture is not assessment material.')+'</p><div class="actions"><button class="action" data-next="image">'+T('查看图像画面','Preview image view')+'</button><button class="action secondary" data-next="parameters">'+T('查看版本差异','Review profile differences')+'</button></div>'}
else if(state.view==='image'||state.view==='isi'){const isi=state.view==='isi';root.innerHTML='<div class="stage-head"><span>'+T('静态画面 · 非计时施测','Static view · no assessment timing')+'</span><span>'+T('触屏优先','Touch first')+'</span></div><div class="stage-board">'+(isi?'<span class="stage-cross" aria-label="'+T('图后短间隔的注视符号','Fixation during the following interval')+'">+</span>':scenesvg())+'</div><div class="response-space"><button class="action seen" id="seen">'+T('见过','Seen')+'</button><p class="response-instruction">'+T(isi?'仍可回应上一张；首次图不操作。':'认出重复才点一次；首次看到不用操作。',isi?'You may still respond to the preceding image. No response on first views.':'Tap once only for a repeat. Do nothing on first views.')+'</p></div><p class="stage-caption">'+T(isi?'ISI拟800 ms；本静态页面不会自动计时或保存。':'图像拟750 ms；几何图只是布局占位，不是正式刺激。',isi?'ISI proposed at 800 ms; this page neither times nor saves trials.':'Image proposed at 750 ms; geometry is a placeholder, not production stimuli.')+'</p><p id="demoStatus" class="preview-only" role="status"></p>'}
else if(['interpretable','limited','invalid'].includes(state.view)){const m=model();root.dataset.reportState=m.quality;root.innerHTML='<p class="eyebrow">'+label+' · '+T('全部数字为合成设计示例','All values are synthetic design examples')+'</p>';
if(m.quality==='invalid'){root.innerHTML+='<h2>'+T('这份记录暂时无法解读','This record cannot be interpreted yet')+'</h2><p>'+T('关键流程或图片记录不完整，本次不提供表现结论。这不代表你做得不好。','Key image or sequence records were incomplete. No performance conclusion is shown; this does not mean you performed poorly.')+'</p><div class="card"><h3>'+T('接下来可以这样做','What you can do next')+'</h3><p>'+T('保留当前记录，稍后在稳定设备和较少中断的环境中重试。','Keep this record, then try again later on a stable device with fewer interruptions.')+'</p></div>'}
else if(m.quality==='limited'){root.innerHTML+='<h2>'+T('部分图片记录未完整保留','Some image records were incomplete')+'</h2><p>'+T('本次整体命中率、误报率和两者差值受影响，暂不展示。','The overall hit rate, false-alarm rate and their difference are affected and are hidden.')+'</p><div class="card"><h3>'+T('记录完整性','Record completeness')+'</h3><p>'+T('已收图像呈现','Image presentations received')+' '+m.received+' / '+m.total+'</p><p>'+T('完整目标配对','Complete target pairs')+' '+m.pairs+' / '+m.n+'</p><p class="small">'+T('这里只说明记录是否完整，不代表记忆好坏。','These counts describe completeness, not memory quality.')+'</p></div><p>'+T('缺失不是0分，也不会把未显示的图片算作漏认。','Missing data are not zero scores, and undisplayed images are not counted as misses.')+'</p>'}
else{const pct=(m.crr*100).toFixed(0);root.innerHTML+='<h2>'+T('这组重复图，你认出了 '+m.hits+' / '+m.n+' 次','You recognized '+m.hits+' / '+m.n+' included repeat images')+'</h2><p>'+T('也要一起看：对应目标图首次出现时，有 '+m.falseAlarms+' / '+m.n+' 次被误认为见过。','Read this together with first appearances: '+m.falseAlarms+' / '+m.n+' corresponding target first views were marked as seen.')+'</p><div class="metrics-line"><section class="stat"><h3>'+T('目标重复 · 认出','Target repeats · detected')+'</h3><p class="number">'+m.hits+'<small> / '+m.n+'</small></p><p class="small">'+(m.hitRate*100).toFixed(0)+'%</p></section><section class="stat"><h3>'+T('目标首次 · 误认','Target first views · false alarms')+'</h3><p class="number">'+m.falseAlarms+'<small> / '+m.n+'</small></p><p class="small">'+(m.falseAlarmRate*100).toFixed(0)+'%</p></section></div><p>'+T('两项只描述这组图片和间隔下的本轮记录，不换算成记忆能力等级。','Both describe this attempt with this image set and spacing, not a memory ability grade.')+'</p><details><summary>'+T('分母、差值与排除记录','Denominators, difference and exclusions')+'</summary><p>'+T('只用首呈和重呈都完整有效的同一目标配对。目标首次分母不含首次填充；目标重复分母不含短间隔警觉重复。','Only complete, technically usable target pairs are included. Target first-view counts exclude first-view fillers; target repeats exclude short-lag vigilance repeats.')+'</p><p>'+T('命中率减误报率为 ','Hit rate minus false-alarm rate is ')+pct+T(' 个百分点。这是有符号差值，不是记忆分数，负值不会改为0。',' percentage points. This is a signed difference, not a memory score; negative values remain negative.')+'</p><p>'+T('本例另有 '+m.filler+' 次首次填充、'+m.vigilance+' 次警觉重复，分别用于额外研究质控，不混入上面两项分母。','This example additionally has '+m.filler+' first-view fillers and '+m.vigilance+' vigilance repeats; these have separate research quality summaries.')+'</p></details><label class="check"><input id="takehomeToggle" type="checkbox" '+(state.showTakehome?'checked':'')+'>'+T('显示一张小结图（可选）','Show one small take-home image (optional)')+'</label>'+(state.showTakehome?reportImage(m):'')+'<div class="card"><h3>'+T('下次尝试前','Before another attempt')+'</h3><p>'+T('减少通知，把设备放稳，并尽量保持相同设备和操作方式。','Reduce notifications, stabilize the device, and keep the same device and response method when possible.')+'</p></div>'}
root.innerHTML+='<p class="small">'+T('此项目变式没有适用常模；本例不能用于同龄排名、诊断或录用判断。','No applicable norms exist for this project variant. This example is not an age ranking, diagnosis or hiring decision.')+'</p>'}
else{root.innerHTML='<h2>'+T('协议差异先确认，再开发','Confirm protocol differences before coding')+'</h2><p>'+T('两版保持750 ms图像＋800 ms间隔及单一seen回应，但短版不只改变总次数。','Both profiles retain 750 ms images, 800 ms intervals and one seen response, but shortening does not preserve every proportion.')+'</p><div class="table-wrap"><table><thead><tr><th>'+T('项目','Item')+'</th><th>'+T('对照提案','Comparison')+'</th><th>'+T('体验提案','Experience')+'</th></tr></thead><tbody><tr><th>'+T('呈现数','Views')+'</th><td>260</td><td>100</td></tr><tr><th>'+T('目标首次／重复','Target first / repeat')+'</th><td>60 / 60</td><td>20 / 20</td></tr><tr><th>'+T('填充／警觉','Filler / vigilance')+'</th><td>124 / 16</td><td>54 / 6</td></tr><tr><th>'+T('净呈现','Net presentation')+'</th><td>403 s</td><td>155 s</td></tr></tbody></table></div><p>'+T('重复目标占比从约23.08%变20%，起始/尾部开销比例也变；真实lag频数需核对，不能称短版等值。','Target-repeat prevalence changes from about 23.08% to 20%; padding proportions change, and actual lag counts require checking. Short-form equivalence is not claimed.')+'</p><ul><li>'+T('正式有权素材库尚未选定，几何图不替代记忆性验证。','Production image rights and selection remain unresolved; geometry does not replace memorability validation.')+'</li><li>'+T('300 CSS px固定图像区是新几何，不能自动视作512px上游或相同物理视角。','A fixed 300 CSS px field is new geometry, not the upstream 512px field or an equal physical angle.')+'</li><li>'+T('8次练习、ISI并入、个人配对分母与完整性gate均待确认。fixedOrder=false不保证默认重复顺序真正随机。','Practice, ISI attribution and personal pair denominators remain proposals. fixedOrder=false does not guarantee randomized repeat order under these defaults.')+'</li></ul><button class="action" data-next="intro">'+T('回到指导','Back to instructions')+'</button>'}
root.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.next)));root.querySelector('#seen')?.addEventListener('pointerdown',()=>{document.getElementById('demoStatus').textContent=T('仅演示回应区，不会保存作答或反馈正确性。','Response-area demonstration only; no answer is saved and no correctness feedback is given.')});root.querySelector('#takehomeToggle')?.addEventListener('change',e=>{state.showTakehome=e.target.checked;render()});
}
for(const [key,control] of Object.entries(controls))control.addEventListener('change',()=>{state[key]=control.value;render()});render();window.recognitionPreview={getState:()=>({...state}),getModel:model,go:view=>{state.view=view;render()}};
})();
</script></body></html>
