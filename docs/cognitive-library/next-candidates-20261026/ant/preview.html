<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ANT/PANT · 静态设计提案</title><style>
:root{color-scheme:light;--page:#F8FAFC;--surface:#fff;--text:#1F2937;--secondary:#4B5563;--line:#CBD5E1;--boundary:#64748B;--action:#1D4ED8}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:15px/1.75 system-ui,sans-serif}.review-tools{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;font-size:12px}.review-tools p{margin:0 0 7px}.tool-row{display:flex;gap:8px;flex-wrap:wrap}button,select{font:inherit}button{min-height:46px;border:1px solid var(--action);border-radius:8px;padding:9px 16px;background:var(--action);color:#fff;cursor:pointer}button.secondary{color:var(--text);border-color:var(--boundary);background:#fff}button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--boundary);outline-offset:3px}select{max-width:100%;min-height:40px;color:var(--text);background:#fff;border:1px solid var(--boundary);border-radius:5px;padding:4px 8px}.small{font-size:12px;color:var(--secondary)}.pill{border:1px solid var(--boundary);padding:2px 7px;border-radius:4px;font-size:11px;display:inline-block}.app{max-width:700px;margin:auto;padding:25px 20px 34px}.app.stage{max-width:740px}.eyebrow{font-size:12px;color:var(--secondary);margin:0 0 8px}h1{font-size:25px;line-height:1.4;margin:0 0 14px;font-weight:650}h2{font-size:17px;line-height:1.6;margin:0 0 10px}p{margin:12px 0;color:var(--secondary)}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin:18px 0}.row{display:flex;gap:12px;flex-wrap:wrap}.row button{flex:1}.example{display:block;margin:22px auto;max-width:95%}.note{border-left:3px solid var(--boundary);padding:8px 12px;background:#fff;font-size:13px}.field{background:#fff;border:1px solid var(--boundary);height:280px;position:relative;width:100%;margin:22px 0}.field svg{width:100%;height:100%;display:block}.responses{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.responses button{min-height:78px;background:#fff;color:#000;border-color:var(--boundary);font-size:18px;font-weight:600}.stage-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--secondary);margin-bottom:8px}.read-controls{display:grid;gap:12px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.choice{font-size:13px;min-height:2em}.metric{font-size:34px;color:var(--text);font-weight:650;margin:4px 0}.metric small{font-size:16px;font-weight:400}.summary-image{width:100%;height:auto;display:block;margin:18px 0;max-width:480px}.details-table{width:100%;font-size:13px;border-collapse:collapse}.details-table th,.details-table td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left}details{margin:18px 0}summary{cursor:pointer}.hidden{display:none!important}.statebar{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.statebar button{font-size:12px;min-height:40px;padding:5px 10px}@media(min-width:740px){.app{padding-top:36px}.field{height:340px}.responses button{min-height:82px}}@media(max-width:350px){.app{padding-left:14px;padding-right:14px}h1{font-size:23px}.responses{gap:12px}.tool-row button{font-size:11px;padding:5px 8px;min-height:38px}}
</style></head><body><div class="review-tools" id="tools"><p><strong id="draft-label">静态设计草案 · 尚非运行测验</strong> <span id="tools-note">以下切换只供审阅，不执行100ms或1700ms计时。</span></p><div class="tool-row"><button class="secondary" data-view="intro">指导</button><button class="secondary" data-view="cue">提示</button><button class="secondary" data-view="target">作答布局</button><button class="secondary" data-view="report">报告</button><button class="secondary" id="language">English</button></div></div><main id="app" class="app"></main><script>
const params=new URLSearchParams(location.search);let view=params.get('view')||'intro',lang=params.get('lang')==='en'?'en':'zh',quality=params.get('state')||'interpretable',cue='spatial',flanker='incongruent',neutral='none',position='top',direction='right',profile='experience';if(params.get('embed')==='1')document.getElementById('tools').classList.add('hidden');const app=document.getElementById('app'),t=(zh,en)=>lang==='en'?en:zh;
function arrowRow(mode=flanker,neutralType=neutral,dir=direction){let inner='';for(let i=0;i<5;i++){const mid=i===2;let d=mid?dir:mode==='congruent'?dir:mode==='incongruent'?(dir==='right'?'left':'right'):'neutral';const x=i*42;if(d==='neutral'){if(neutralType==='dash')inner+=`<line x1="${x+5}" y1="10" x2="${x+35}" y2="10" stroke="#000" stroke-width="2"/>`;}else inner+=`<line x1="${x+5}" y1="10" x2="${x+35}" y2="10" stroke="#000" stroke-width="2"/><path d="${d==='right'?`M${x+40} 10 L${x+30} 5 L${x+30} 15 Z`:`M${x} 10 L${x+10} 5 L${x+10} 15 Z`}" fill="#000"/>`;}return inner}
function rowSvg(mode,neutralType,dir){return `<svg class="example" width="210" height="20" viewBox="0 0 210 20" role="img" aria-label="${t('中间箭头向右，左右侧翼向左','Central arrow points right; flankers point left')}">${arrowRow(mode,neutralType,dir)}</svg>`}
function star(y){return `<g transform="translate(175 ${y})" stroke="#000" stroke-width="2"><path d="M-9 0H9M0 -9V9M-6.4 -6.4L6.4 6.4M-6.4 6.4L6.4 -6.4"/></g>`}
function field(){const y=position==='top'?88:192;let content='<path d="M167 140H183M175 132V148" stroke="#000" stroke-width="2"/>';if(view==='cue'){if(cue==='central')content=star(140);if(cue==='double')content+=star(88)+star(192);if(cue==='spatial')content+=star(y);}if(view==='target')content+=`<g transform="translate(70 ${y-10})">${arrowRow()}</g>`;return `<div class="field"><svg viewBox="0 0 350 280" aria-label="${t('静态提示或目标布局示意；尺寸未校准','Static cue or target layout; geometry uncalibrated')}" role="img">${content}</svg></div>`}
function change(key,value){window[key]=value;render()}
function render(){document.documentElement.lang=lang;document.getElementById('draft-label').textContent=t('静态设计草案 · 尚非运行测验','STATIC DESIGN · NOT A RUNNING ASSESSMENT');document.getElementById('tools-note').textContent=t('以下切换只供审阅，不执行100ms或1700ms计时。','Manual review only; no 100ms/1700ms timing is executed.');document.getElementById('language').textContent=lang==='zh'?'English':'中文';app.className='app'+(view==='cue'||view==='target'?' stage':'');
if(view==='intro')app.innerHTML=`<p class="eyebrow">${t('注意网络任务 · 触屏变式提案','Attentional Network Task · touch-first proposal')}</p><h1>${t('看中间，判断箭头方向','Look at the middle arrow')}</h1><p>${t('提示标记可能出现在中央、上下两个位置，或接下来会出现箭头的位置。请持续看着中间的注视点。','A cue may appear in the centre, at both possible target locations, or at the upcoming target location. Keep looking at the central fixation.')}</p><section class="card"><h2>${t('只看正中间那一个箭头','Judge only the central arrow')}</h2>${rowSvg('incongruent','none','right')}<p>${t('上图中间箭头向右。即使旁边箭头向左，也应选择“向右”。箭头出现在上方还是下方，不改变作答方向。','The middle arrow above points right. Choose “Right” even when the surrounding arrows point left. Its upper or lower screen position does not change your answer.')}</p></section><p>${t('把设备放稳，双手放在下方左右回应区附近。箭头出现后，尽快、准确地轻触对应方向。鼠标可点同一区域，键盘方案拟采用←／→。','Keep the device still, with your hands near the two response zones. When the arrow appears, tap its direction promptly and accurately. Mouse clicks use the same zones; proposed keyboard keys are ←/→.')}</p><div class="note">${t('两版均先练习24次。体验版正式48次，净正式约3.2分钟；练习约1.6分钟，另加说明、校准和休息。次数、键位和布局均待确认。','Both profiles propose 24 practice trials. Experience: 48 formal trials, about 3.2 minutes of formal pacing plus 1.6 minutes of practice, instructions, calibration and breaks. Counts, keys and layout await confirmation.')}</div><div class="row" style="margin-top:20px"><button id="show-target">${t('查看作答布局','Review response layout')}</button></div><details><summary>${t('查看版本与校准提案','Profiles and calibration proposal')}</summary><p>${t('文献次数对照版：288正式（3×96）；体验版：48正式（1×48）。刺激/时序/输入保持相同，主要减少重复次数。正式实现前需按物理尺寸/视距校准，屏幕容纳不了时不自动缩小。本图不能代替校准。','Literature-count comparison: 288 formal trials (3×96); experience: 48 (1×48). Stimulus, timing and input stay the same. Physical size/distance calibration is required before implementation; do not auto-shrink an incompatible display. This preview is not calibration.')}</p><p class="small">${t('年龄、中文理解和设备等值待核；此任务不诊断注意力障碍或脑网络健康。','Age suitability, comprehension and device equivalence are unverified. This is not a diagnosis of attention disorder or brain-network health.')}</p></details>`;
if(view==='cue'||view==='target')app.innerHTML=`<div class="stage-meta"><span>${t('布局示意 · 非计时','Layout only · not timed')}</span><span>${view==='cue'?t('提示阶段','Cue phase'):t('目标与回应区','Target and response zones')}</span></div>${field()}<div class="responses"><button id="respond-left">← ${t('向左','Left')}</button><button id="respond-right">${t('向右','Right')} →</button></div><p class="choice" id="choice" role="status">${t('点击只演示交互，不记录RT或计分。','Clicks demonstrate interaction only; no RT or scoring is recorded.')}</p><div class="read-controls"><p class="small">${t('以下为设计审阅控件，正式施测不显示。所有几何仅示意，未完成视角校准。','The following review controls are absent from formal testing. Geometry is illustrative and uncalibrated.')}</p><label>${t('提示','Cue')} <select id="cue-select"><option value="none">${t('无提示','None')}</option><option value="central">${t('中央提示','Central')}</option><option value="double">${t('双位置提示','Double')}</option><option value="spatial">${t('空间有效提示','Spatial valid')}</option></select></label><label>${t('侧翼','Flankers')} <select id="flanker-select"><option value="congruent">${t('一致','Congruent')}</option><option value="incongruent">${t('不一致','Incongruent')}</option><option value="neutral">${t('中性','Neutral')}</option></select></label><label>${t('中性形式（待确认）','Neutral form (pending)')} <select id="neutral-select"><option value="none">${t('PEBL：无侧翼','PEBL: absent')}</option><option value="dash">${t('Fan式：横杠','Fan-style: dashes')}</option></select></label><p class="small">${t('候选时序：提示100ms→注视400ms→目标至回应/1700ms；4000ms是试次起点间隔，不是额外ITI。此页不执行这些时序。','Proposed sequence: cue 100ms → fixation 400ms → target until response/1700ms. 4000ms is the trial start interval, not an extra ITI. This page does not execute it.')}</p></div>`;
if(view==='report'){const ok=quality==='interpretable',limited=quality==='limited';app.innerHTML=`<p class="eyebrow">${t('文献次数对照版 · 合成数据示例','Literature-count profile · synthetic example')}</p><h1>${ok?t('这轮的提示条件记录','Your cue-condition record'):limited?t('部分条件记录暂不能解释','Some condition records are limited'):t('本次暂不提供表现结论','No performance conclusion this time')}</h1><p>${t('这是图文绑定设计示例，不是任何真实用户的结果。质量规则和条件最低分母尚待冻结。','This illustrates data binding, not a real participant result. Quality rules and minimum condition counts are not frozen.')}</p>${ok?`<div class="card"><h2>${t('本轮答对','Correct this round')}</h2><p class="metric">246 <small>/ 288 ${t('次','trials')}</small></p><p>${t('无提示时答对的平均用时570ms；双位置提示时510ms，有效正确次数分别60和64。这里只描述本次条件记录。','Mean correct RT: 570ms without cues and 510ms with double cues; 60 and 64 correct responses respectively. These are records of this attempt only.')}</p></div><svg class="summary-image" viewBox="0 0 480 220" role="img" aria-label="${t('合成示例：本轮答对246/288次；只描述本次条件记录。EDUK12.TOP','Synthetic: 246/288 correct; this attempt only. EDUK12.TOP')}"><rect x="1" y="1" width="478" height="218" rx="12" fill="#fff" stroke="#CBD5E1"/><text x="24" y="34" font-size="13" fill="#4B5563">${t('注意网络任务 · 合成示例','ANT · SYNTHETIC EXAMPLE')}</text><text x="24" y="78" font-size="25" font-weight="600" fill="#1F2937">${t('这轮答对246 / 288次','246 / 288 correct this round')}</text><text x="24" y="111" font-size="14" fill="#4B5563">${t('无提示570ms · 双提示510ms','No cue 570ms · double cue 510ms')}</text><text x="24" y="140" font-size="13" fill="#4B5563">${t('有效正确60 / 64；不是能力或脑网络分。','60 / 64 correct responses; no ability score.')}</text><text x="24" y="187" font-size="15" font-weight="700" fill="#1D4ED8">EDUK12.TOP</text></svg>`:limited?`<div class="card"><p>${t('部分提示条件受到中断或记录不足影响，相关RT、差值和整体表现汇总已隐藏。不能用其他条件填0，也不能据此说明没有提示效应。','Some conditions were interrupted or insufficient. Affected RTs, differences and performance aggregates are hidden. Missing conditions are not zero and do not prove no cue effect.')}</p></div>`:`<div class="card"><p>${t('关键流程或有效记录不完整，因此不输出表现结论。这不代表你做得不好。你可以稍后在稳定设备和较少中断的环境中重新尝试。','Key records or task stages are incomplete, so no performance conclusion is shown. This does not mean poor performance. You can try later with a stable device and fewer interruptions.')}</p></div>`}<p>${t('下次可以把设备放稳，关闭通知，保持观看距离和回应姿势一致。','For next time, keep the device still, turn off notifications, and keep viewing distance and response posture consistent.')}</p><details><summary>${t('指标与限制','Methods and limits')}</summary><p>${t('建议公开正确试次均值及有效分母；超时仍进入正确率分母。警觉=无提示−双提示，定向=中央−空间，冲突=不一致−一致；负差值不裁0。每块必须独立从原始记录重算。','Proposed public RTs use correct responses with denominators; timeouts remain in accuracy. Alerting=no−double; orienting=central−spatial; conflict=incongruent−congruent. Negative values stay negative. Recompute each block from raw records.')}</p><p>${t('体验版每个完整条件格仅1次，边际记录不构成稳定网络能力。没有适用常模、年龄排名或诊断界值。','Experience has one trial per complete cell; marginal records do not establish stable network ability. No applicable norms, age ranks or diagnostic cutoffs.')}</p></details><div class="statebar" aria-label="${t('合成质量状态切换','Synthetic quality state')}"><button class="secondary" data-state="interpretable">${t('可解释示例','Interpretable')}</button><button class="secondary" data-state="limited">${t('受限示例','Limited')}</button><button class="secondary" data-state="invalid">${t('无效示例','Invalid')}</button></div>`;}
for(const b of document.querySelectorAll('[data-state]'))b.onclick=()=>{quality=b.dataset.state;render()};for(const [id,key,value]of [['cue-select','cue',cue],['flanker-select','flanker',flanker],['neutral-select','neutral',neutral]]){const e=document.getElementById(id);if(e){e.value=value;e.onchange=()=>{if(key==='cue')cue=e.value;if(key==='flanker')flanker=e.value;if(key==='neutral')neutral=e.value;render()}}}const show=document.getElementById('show-target');if(show)show.onclick=()=>{view='target';render()};for(const side of ['left','right']){const b=document.getElementById('respond-'+side);if(b)b.onclick=()=>{document.getElementById('choice').textContent=t('示意选择：','Demo choice: ')+(side==='left'?t('向左','Left'):t('向右','Right'))+t('；未计分、未保存、未测RT。','; not scored, saved or timed.')}}}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;render()};document.getElementById('language').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};document.addEventListener('keydown',e=>{if((view==='target'||view==='cue')&&!e.repeat&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){if(e.target.tagName==='SELECT')return;e.preventDefault();document.getElementById(e.key==='ArrowLeft'?'respond-left':'respond-right').click()}});render();
</script></body></html>
