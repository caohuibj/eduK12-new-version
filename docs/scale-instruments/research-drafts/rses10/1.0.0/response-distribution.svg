<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc"><title id="title">RSES虚构作答选项分布</title><desc id="desc">十题示例中：很不同意2题、不同意3题、同意3题、很同意2题。仅原始选项计数，不是反向计分后的自尊得分，不提供高低或诊断分档。</desc><rect width="920" height="360" fill="#f5f7fa"/><g font-family="sans-serif" fill="#20344a"><text x="32" y="42" font-size="24">看见作答分布，而不是给自己贴标签</text><text x="32" y="78" font-size="16">虚构10题示例：3, 2, 1, 2, 0, 3, 2, 1, 0, 1</text><text x="32" y="124" font-size="18">很不同意（0）</text><rect x="205" y="102" width="200" height="28" rx="6" fill="#829eb8"/><text x="420" y="124" font-size="18">2题</text><text x="32" y="168" font-size="18">不同意（1）</text><rect x="205" y="146" width="300" height="28" rx="6" fill="#829eb8"/><text x="520" y="168" font-size="18">3题</text><text x="32" y="212" font-size="18">同意（2）</text><rect x="205" y="190" width="300" height="28" rx="6" fill="#829eb8"/><text x="520" y="212" font-size="18">3题</text><text x="32" y="256" font-size="18">很同意（3）</text><rect x="205" y="234" width="200" height="28" rx="6" fill="#829eb8"/><text x="420" y="256" font-size="18">2题</text><text x="32" y="300" font-size="17">这里只数原始选项；反向题需另行计分。不能据此判定高低自尊或健康状况。</text><text x="32" y="334" font-size="14">项目原创文档示例，非作者量表图；未导入系统媒体库。</text></g></svg>
