# Validated on the eduK12 Ubuntu Nginx 1.18 ingress. Certificates stay managed by Certbot.
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 500M;
    client_body_buffer_size 128k;
    keepalive_timeout 65;
    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
    upstream eduk12_frontend {
        server 127.0.0.1:18080;
        keepalive 16;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    # Never log arguments, bodies, cookies, authorization headers, or token-bearing paths.
    log_format eduk12_timing escape=json '{"ingress":"$request_id","rid":"$upstream_http_x_request_id","status":$status,"rt":"$request_time","uct":"$upstream_connect_time","uht":"$upstream_header_time","urt":"$upstream_response_time","bytes":$body_bytes_sent}';
    access_log /var/log/nginx/eduk12-timing.log eduk12_timing;
    server { listen 80; server_name eduk12.top www.eduk12.top; return 301 https://eduk12.top$request_uri; }
    server { listen 80; server_name api.eduk12.top; return 301 https://api.eduk12.top$request_uri; }
    server {
        listen 443 ssl http2; server_name www.eduk12.top;
        ssl_certificate /etc/letsencrypt/live/eduk12.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/eduk12.top/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3; ssl_session_timeout 1d; ssl_session_cache shared:SSL:50m;
        return 301 https://eduk12.top$request_uri;
    }
    server {
        listen 443 ssl http2; server_name eduk12.top;
        ssl_certificate /etc/letsencrypt/live/eduk12.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/eduk12.top/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3; ssl_session_timeout 1d; ssl_session_cache shared:SSL:50m;
        location / {
            proxy_pass http://eduk12_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_connect_timeout 10s; proxy_send_timeout 600s; proxy_read_timeout 600s;
        }
    }
    server {
        listen 443 ssl http2; server_name api.eduk12.top;
        ssl_certificate /etc/letsencrypt/live/api.eduk12.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.eduk12.top/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3; ssl_session_timeout 1d; ssl_session_cache shared:SSL:50m;
        location / {
            proxy_pass http://eduk12_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_connect_timeout 10s; proxy_send_timeout 600s; proxy_read_timeout 600s;
        }
    }
    server { listen 80; server_name localhost; return 404; }
}
