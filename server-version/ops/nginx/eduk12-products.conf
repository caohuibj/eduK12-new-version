server {
    listen 80;
    server_name survey.eduk12.top teacher.eduk12.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/eduk12-products-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name survey.eduk12.top teacher.eduk12.top;
    ssl_certificate /etc/letsencrypt/live/eduk12-products/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduk12-products/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    location / {
        proxy_pass http://eduk12_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
