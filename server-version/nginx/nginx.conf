events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 请求体大小限制（视频上传）
    client_max_body_size 500M;
    client_body_buffer_size 10M;

    # 视频文件MIME类型补充（确保浏览器正确播放而非下载）
    # 系统mime.types已包含video/mp4,video/webm等，此处补充video/ogg
    types {
        video/ogg                           ogv;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Frontend - HTTP
    server {
        listen 80;
        server_name eduk12.top www.eduk12.top;
        
        # HTTP 转 HTTPS
        return 301 https://$server_name$request_uri;
    }

    # Frontend - HTTPS
    server {
        listen 443 ssl http2;
        server_name eduk12.top www.eduk12.top;

        # SSL 证书配置
        ssl_certificate /etc/letsencrypt/live/eduk12.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/eduk12.top/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # API proxy
        location /api/ {
            proxy_pass http://127.0.0.1:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 禁用所有缓存 - 确保API数据实时性
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            
            # 添加禁用缓存的响应头
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
            add_header Pragma 'no-cache' always;
            add_header Expires '0' always;
            
            # Increase timeout for file uploads
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Static uploads
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Documents - 优先本地，本地没有再从COS获取
        location /uploads/documents/ {
            alias /var/www/uploads/documents/;

            # 如果本地文件不存在，尝试从COS获取
            error_page 404 = @cos_documents;
        }

        # Images - 优先本地，本地没有再从COS获取
        location /uploads/images/ {
            alias /var/www/uploads/images/;
            
            # 如果本地文件不存在，尝试从COS获取
            error_page 404 = @cos_images;
        }

        location @cos_documents {
            rewrite ^/uploads(/.*)$ $1 break;
            proxy_pass https://cdn.eduk12.top;
            proxy_set_header Host cdn.eduk12.top;
            proxy_ssl_server_name on;
            add_header Cache-Control "public, max-age=604800";
        }

        location @cos_images {
            rewrite ^/uploads(/.*)$ $1 break;
            proxy_pass https://cdn.eduk12.top;
            proxy_set_header Host cdn.eduk12.top;
            proxy_ssl_server_name on;
            add_header Cache-Control "public, max-age=604800";
        }

        # Course covers - 从COS获取
        location /uploads/covers/ {
            alias /var/www/uploads/covers/;
            error_page 404 = @cos_covers;
        }

        location @cos_covers {
            rewrite ^/uploads(/.*)$ $1 break;
            proxy_pass https://cdn.eduk12.top;
            proxy_set_header Host cdn.eduk12.top;
            proxy_ssl_server_name on;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Video streaming - 从COS获取
        location /videos/processed/ {
            proxy_pass https://cdn.eduk12.top;
            proxy_set_header Host cdn.eduk12.top;
            proxy_ssl_server_name on;
            add_header Cache-Control "public, max-age=31536000";
            add_header Accept-Ranges bytes;
        }

        location /videos/thumbnails/ {
            proxy_pass https://cdn.eduk12.top;
            proxy_set_header Host cdn.eduk12.top;
            proxy_ssl_server_name on;
            add_header Cache-Control "public, max-age=604800";
        }

        # Video streaming (local)
        location /uploads/videos/ {
            alias /var/www/uploads/videos/;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Frontend static files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }

    # API Server - HTTP
    server {
        listen 80;
        server_name api.eduk12.top;
        return 301 https://$server_name$request_uri;
    }

    # API Server - HTTPS
    server {
        listen 443 ssl http2;
        server_name api.eduk12.top;

        ssl_certificate /etc/letsencrypt/live/api.eduk12.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.eduk12.top/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        location / {
            proxy_pass http://127.0.0.1:3001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
            
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }

    # Local dev server (localhost)
    server {
        listen 80;
        server_name localhost;

        # API proxy
        location /api/ {
            proxy_pass http://127.0.0.1:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 禁用所有缓存
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
            add_header Pragma 'no-cache' always;
            add_header Expires '0' always;
            
            # Increase timeout for file uploads
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Static uploads
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Video streaming
        location /uploads/videos/ {
            alias /var/www/uploads/videos/;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Frontend static files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
