<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training · Logo 字体对比</title>
<style>
:root{color-scheme:light;--paper:#f5f0e7;--surface:#fffdf8;--ink:#292d2b;--muted:#72796f;--green:#365a48;--line:#ded8cb;--soft:#eaece0;--art:url('/src/training/training-landscape-v2.webp')}
:root[data-theme=dark]{color-scheme:dark;--paper:#141a17;--surface:#1c2420;--ink:#e5e9df;--muted:#a7b2a5;--green:#bdd1a4;--line:#39443b;--soft:#29372b;--art:url('/src/training/training-moonlit-landscape.webp')}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 'PingFang SC','Microsoft YaHei',sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;color:inherit}a{color:var(--green)}main{max-width:1180px;margin:auto;padding:34px 32px 52px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.label{font-size:11px;letter-spacing:.12em;color:var(--green)}.top a{font-size:12px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin:30px 0}h1{margin:8px 0 12px;font:600 clamp(28px,4vw,40px)/1.5 'Songti SC','STSong',serif}p{margin:0;color:var(--muted);font-size:13px}.themes{display:flex;gap:5px;padding:4px;border:1px solid var(--line);border-radius:30px;flex:none}.themes button{min-height:36px;padding:0 16px;border:0;border-radius:24px;background:transparent;font-size:12px;white-space:nowrap}.themes button[aria-pressed=true]{background:var(--green);color:var(--paper)}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.choice{text-align:left;display:flex;flex-direction:column;gap:22px;padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--surface);transition:border-color .15s ease,box-shadow .15s ease;min-width:0}.choice[aria-pressed=true]{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}.choice:focus-visible,.themes button:focus-visible{outline:3px solid var(--green);outline-offset:5px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.code{font-size:11px;color:var(--muted);letter-spacing:.12em}.dot{width:14px;height:14px;border:1px solid var(--line);border-radius:50%;display:inline-block}.choice[aria-pressed=true] .dot{border:4px solid var(--green)}h2{margin:7px 0 6px;font:600 21px/1.5 'Songti SC','STSong',serif}.card-copy p{font-size:12px}.recommend{display:inline-block;margin-top:10px;padding:2px 8px;border-radius:20px;background:var(--soft);font-size:10px;color:var(--green)}.logo-stage{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:150px}.logo-stage .large{display:block;width:100%;max-width:330px;height:auto}.real-size{width:100%;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.real-size img{width:162px;height:auto;max-width:75%}.real-size span{font-size:10px;color:var(--muted);white-space:nowrap}.section-label{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:36px 0 16px}.section-label h2{font-size:19px;margin:0}.section-label span{font-size:11px;color:var(--muted)}.context{isolation:isolate;position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:24px 30px;background:var(--surface)}.context:before{content:'';position:absolute;inset:0;z-index:-1;background:var(--art) 72% 45%/cover;opacity:.35}.mock-header{display:flex;align-items:center;justify-content:space-between;gap:20px}.mock-header img{width:240px;max-width:60%;height:auto}.mock-header span{color:var(--green);font-size:11px;letter-spacing:.08em}.mock-copy{margin:30px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:28px}.poem{font:600 24px/1.6 'Songti SC','STSong',serif;color:var(--green)}.mock-login{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:230px;max-width:48%}.mock-login h3{margin:0 0 16px;font-size:16px;font-weight:600}.field{height:30px;border:1px solid var(--line);border-radius:6px;margin-top:9px}.footer{margin-top:22px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:20px}.footer a{text-underline-offset:4px}
@media(max-width:900px){.comparison{grid-template-columns:1fr;gap:12px}.choice{display:grid;grid-template-columns:minmax(100px,.65fr) minmax(0,1.5fr);gap:25px;padding:18px 22px;align-items:center}.logo-stage{min-height:105px;gap:14px}.real-size{padding-top:10px}.real-size span{font-size:9px}.intro{align-items:start}.themes{margin-top:14px}.context{padding:22px}.mock-header img{width:210px}}
@media(max-width:520px){main{padding:22px 18px 36px}.intro{display:block;margin-top:22px}.themes{width:fit-content;margin-top:16px}.choice{padding:18px 15px;gap:15px;grid-template-columns:90px minmax(0,1fr)}h2{font-size:18px}.card-copy p{font-size:10px}.logo-stage{min-height:118px}.real-size{display:block}.real-size img{width:140px;max-width:100%}.real-size span{display:block;margin-top:5px}.section-label{align-items:start;flex-direction:column;gap:4px}.mock-header img{width:185px;max-width:70%}.mock-copy{display:block}.poem{font-size:24px;margin-bottom:20px}.mock-login{max-width:100%;width:100%}.footer{display:block}.footer a{display:inline-block;margin-top:10px}}
</style>
</head>
<body><main>
<div class="top"><span class="label">TRAINING / 字标微调预览</span><a href="/login">返回登录页 ↗</a></div>
<div class="intro"><div><h1>给山水，一点书写感。</h1><p>新方案使用 @EduK12.top，保留山形与 Training 主字标。<br>点击方案，可在下方查看页面中的整体效果。</p></div><div class="themes" role="group" aria-label="预览配色"><button type="button" data-theme="light" aria-pressed="true">浅色</button><button type="button" data-theme="dark" aria-pressed="false">深色</button></div></div>
<div class="comparison" role="group" aria-label="Logo 字体方案">
<button type="button" class="choice" data-option="original" aria-pressed="false" aria-label="选择 A 原始字标"><div class="card-copy"><div class="card-head"><span class="code">A / ORIGINAL</span><i class="dot" aria-hidden="true"></i></div><h2>原始字标</h2><p>原有小写字标<br>保留作对照</p></div><div class="logo-stage"><img class="large" src="original-light.svg" data-version="original" alt="原始 Training logo"><div class="real-size"><img src="original-light.svg" data-version="original" alt="原始 logo 导航尺寸"><span>导航尺寸</span></div></div></button>
<button type="button" class="choice" data-option="italic" aria-pressed="false" aria-label="选择 B 轻斜体"><div class="card-copy"><div class="card-head"><span class="code">B / ITALIC</span><i class="dot" aria-hidden="true"></i></div><h2>轻斜体</h2><p>细微书写感<br>舒展、流动</p><span class="recommend">清晰与书写感兼顾</span></div><div class="logo-stage"><img class="large" src="italic-light.svg" data-version="italic" alt="轻斜体 Training logo"><div class="real-size"><img src="italic-light.svg" data-version="italic" alt="轻斜体 logo 导航尺寸"><span>导航尺寸</span></div></div></button>
<button type="button" class="choice" data-option="rounded" aria-pressed="false" aria-label="选择 C 柔和圆体"><div class="card-copy"><div class="card-head"><span class="code">C / ROUNDED</span><i class="dot" aria-hidden="true"></i></div><h2>柔和圆体</h2><p>圆润、亲切<br>更轻松活泼</p></div><div class="logo-stage"><img class="large" src="rounded-light.svg" data-version="rounded" alt="柔和圆体 Training logo"><div class="real-size"><img src="rounded-light.svg" data-version="rounded" alt="柔和圆体 logo 导航尺寸"><span>导航尺寸</span></div></div></button>
<button type="button" id="script-option" class="choice" data-option="script" aria-pressed="false" aria-label="选择 D 连笔花体"><div class="card-copy"><div class="card-head"><span class="code">D / SCRIPT</span><i class="dot" aria-hidden="true"></i></div><h2>连笔花体</h2><p>笔画舒展、连贯<br>装饰感更鲜明</p><span class="recommend">新增花体方案</span></div><div class="logo-stage"><img class="large" src="script-light.svg" data-version="script" alt="连笔花体 Training logo"><div class="real-size"><img src="script-light.svg" data-version="script" alt="连笔花体 logo 导航尺寸"><span>导航尺寸</span></div></div></button>
<button type="button" id="chancery-option" class="choice" data-option="chancery" aria-pressed="false" aria-label="选择 E 微花体稍加粗"><div class="card-copy"><div class="card-head"><span class="code">E / CHANCERY</span><i class="dot" aria-hidden="true"></i></div><h2>微花体 · 稍加粗</h2><p>介于斜体与花体之间<br>保留笔意，加强分量</p><span class="recommend">本次新增方案</span></div><div class="logo-stage"><img class="large" src="chancery-light.svg" data-version="chancery" alt="微花体稍加粗 Training logo"><div class="real-size"><img src="chancery-light.svg" data-version="chancery" alt="微花体稍加粗 logo 导航尺寸"><span>导航尺寸</span></div></div></button>
<button type="button" id="italian-bold-option" class="choice" data-option="italian-bold" aria-pressed="true" aria-label="选择 F 意大利斜体加粗"><div class="card-copy"><div class="card-head"><span class="code">F / SELECTED · BOLD ITALIC</span><i class="dot" aria-hidden="true"></i></div><h2>意大利斜体加粗</h2><p>经典衬线，笔画饱满<br>兼顾书写感与辨识度</p><span class="recommend">已应用此方案</span></div><div class="logo-stage"><img class="large" src="italian-bold-light.svg" data-version="italian-bold" alt="意大利斜体加粗 Training logo"><div class="real-size"><img src="italian-bold-light.svg" data-version="italian-bold" alt="意大利斜体加粗 logo 导航尺寸"><span>导航尺寸</span></div></div></button>
</div>
<div class="section-label"><h2>放回页面，看整体气质。</h2><span id="selected-label" role="status">当前预览：F · 意大利斜体加粗</span></div>
<section class="context" aria-label="登录页视觉示意"><div class="mock-header"><img src="italian-bold-light.svg" id="context-logo" alt="所选方案在页面中的 logo"><span>页面效果示意</span></div><div class="mock-copy"><div class="poem">以学习为径，<br>见更远的天地。</div><div class="mock-login" aria-hidden="true"><h3>登录 Huitraining</h3><div class="field"></div><div class="field"></div></div></div></section>
<div class="footer"><span>正式 logo 已采用 F · 意大利斜体加粗，其余方案保留作对比。</span><a href="/login">查看当前登录页 ↗</a></div>
</main>
<script>
let theme='light',version='italian-bold';const names={original:'A · 原始字标',italic:'B · 轻斜体',rounded:'C · 柔和圆体',script:'D · 连笔花体',chancery:'E · 微花体稍加粗','italian-bold':'F · 意大利斜体加粗'};
function update(){document.documentElement.dataset.theme=theme;document.querySelectorAll('img[data-version]').forEach(img=>img.src=`${img.dataset.version}-${theme}.svg`);document.querySelector('#context-logo').src=`${version}-${theme}.svg`;document.querySelector('#selected-label').textContent=`当前预览：${names[version]}`;document.querySelectorAll('button[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));document.querySelectorAll('button[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.option===version)))}
document.querySelectorAll('button[data-theme]').forEach(b=>b.addEventListener('click',()=>{theme=b.dataset.theme;update()}));document.querySelectorAll('button[data-option]').forEach(b=>b.addEventListener('click',()=>{version=b.dataset.option;update()}));
</script>
</body></html>
