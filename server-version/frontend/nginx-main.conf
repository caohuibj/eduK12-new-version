# Project-owned main config for nginx:1.31.6-alpine3.24-slim.
# nginx.conf beside this file is the HTTP site copied into conf.d/default.conf.
# An external main-config bind overrides this file; removing that bind restores
# this image default, without importing host TLS, domains or other private state.
user nginx;
worker_processes auto;
# Match the frontend Compose nofile soft/hard limit; this is a per-worker FD limit.
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    # Separate from nofile: includes client AND upstream connections per worker.
    # Keep the official image's 1024 setting; 65535 FDs is not 65535 concurrent users.
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
