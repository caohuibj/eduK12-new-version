map $http_x_perf_trace $eduk12_gateway_trace { default 0; "~^[a-f0-9]{24}$" 1; }
map $request_id $eduk12_gateway_forward { default $msec; }
map $request_id $eduk12_gateway_age { default $request_time; }
log_format eduk12_gateway_pressure escape=json '{"trace":"$http_x_perf_trace","status":$status,"finishedSec":"$msec","forwardSec":"$eduk12_gateway_forward","requestAgeAtForwardSec":"$eduk12_gateway_age","requestSeconds":"$request_time","connectSeconds":"$upstream_connect_time","headerSeconds":"$upstream_header_time","upstreamSeconds":"$upstream_response_time","requestLength":$request_length,"upstream":"$upstream_addr"}';
access_log /tmp/eduk12-pressure.jsonl eduk12_gateway_pressure if=$eduk12_gateway_trace;
upstream eduk12_whole_apis {
    zone eduk12_whole_apis 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:3000 resolve;
    server backend-2:3000 resolve;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 4s;
}
# Idle connections are bounded per Nginx worker, independently of Prisma pools.
# resolve follows API container replacement through Docker's private DNS.
upstream eduk12_api {
    zone eduk12_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:3000 resolve;
    server backend-2:3000 resolve;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 4s;
}
log_format eduk12_timing escape=json '{"rid":"$upstream_http_x_request_id","status":$status,"rt":"$request_time","uct":"$upstream_connect_time","uht":"$upstream_header_time","urt":"$upstream_response_time","bytes":$body_bytes_sent}';

# The outer TLS proxy must overwrite forwarded headers. Canonical host ingress
# is loopback-only; preserve its HTTPS scheme through this internal HTTP hop.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log eduk12_timing;
    access_log /tmp/eduk12-pressure.jsonl eduk12_gateway_pressure if=$eduk12_gateway_trace;

    # These headers also cover SPA/static responses, which do not pass through
    # backend Helmet. Enforce script and embedding boundaries. HTTPS media/PDF
    # fetches and inline component styles remain supported; do not add unsafe-eval.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss://eduk12.top wss://api.eduk12.top wss://www.eduk12.top; media-src 'self' blob: https:; frame-src 'self' https://player.bilibili.com https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; child-src 'self' blob:; report-uri /api/security/csp-report;" always;

    # 静态资源根目录（覆盖 nginx:alpine 默认的 /etc/nginx/html）
    root /usr/share/nginx/html;
    index index.html;

    # Keep ordinary JSON/API requests small. Large bodies are enabled only on
    # the explicit multipart upload locations below.
    client_max_body_size 2m;

    # SPA：未匹配静态资源时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PDF.js emits an ES module worker as .mjs. The base Nginx MIME table
    # omits that extension, which nosniff correctly prevents from executing.
    # Limit the mapping to built assets; missing modules must not become SPA HTML.
    location ~ ^/assets/[^/]+\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # API 反向代理（video/image 上传关闭请求缓冲并保留长超时）
    location = /api/videos/upload {
        client_max_body_size 500M;
        proxy_pass http://eduk12_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Perf-Gateway-Stamp $eduk12_gateway_forward;
        proxy_set_header X-Perf-Gateway-Age $eduk12_gateway_age;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/api/(uploads/image|documents/upload|courses/[^/]+/cover|checkins/(public/[^/]+/upload|[^/]+/submission-image))$ {
        client_max_body_size 20M;
        proxy_pass http://eduk12_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Perf-Gateway-Stamp $eduk12_gateway_forward;
        proxy_set_header X-Perf-Gateway-Age $eduk12_gateway_age;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }


    # The two whole-intake processes share 20 DB connections and 50 submit slots.
    # Other REST and Socket.IO traffic keeps its existing upstream.
    location ~ ^/api/composite-assessments/attempts/[^/]+/(whole/(definition|submit)|report-status|report)$ {
        client_max_body_size 2m;
        client_body_buffer_size 32k;
        proxy_pass http://eduk12_whole_apis;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Perf-Gateway-Stamp $eduk12_gateway_forward;
        proxy_set_header X-Perf-Gateway-Age $eduk12_gateway_age;
        proxy_next_upstream off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://eduk12_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Perf-Gateway-Stamp $eduk12_gateway_forward;
        proxy_set_header X-Perf-Gateway-Age $eduk12_gateway_age;

        # Ordinary JSON/API traffic uses default request buffering (on).
        # Multipart upload locations above keep proxy_request_buffering off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Keep host-side health monitoring on the same single frontend entrypoint
    # without publishing the backend container port.
    location = /health {
        proxy_pass http://eduk12_api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://eduk12_api/ready;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location = /metrics { return 404; }
    location = /api/metrics { return 404; }

    # Production legacy uploads fail closed in backend and at the single ingress.
    location /uploads/ { return 404; }

    # Socket.IO（同源连接，显式代理 Engine.IO transport）
    location /socket.io/ {
        proxy_pass http://eduk12_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Perf-Gateway-Stamp $eduk12_gateway_forward;
        proxy_set_header X-Perf-Gateway-Age $eduk12_gateway_age;

        proxy_read_timeout 75s;
        proxy_buffering off;
    }
}
