# Idle connections are bounded per Nginx worker, independently of Prisma pools.
# resolve follows API container replacement through Docker's private DNS.
upstream eduk12_api {
    zone eduk12_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:3000 resolve;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 4s;
}
log_format eduk12_timing escape=json '{"rid":"$upstream_http_x_request_id","status":$status,"rt":"$request_time","uct":"$upstream_connect_time","uht":"$upstream_header_time","urt":"$upstream_response_time","bytes":$body_bytes_sent}';

# The outer TLS proxy must overwrite forwarded headers. Canonical host ingress
# is loopback-only; preserve its HTTPS scheme through this internal HTTP hop.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log eduk12_timing;

    # These headers also cover SPA/static responses, which do not pass through
    # backend Helmet. CSP remains report-only until the external media/PDF
    # inventory is confirmed in each deployment.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; media-src 'self' blob: https:; frame-src 'self' https://player.bilibili.com https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; child-src 'self' blob:; report-uri /api/security/csp-report;" always;

    # 静态资源根目录（覆盖 nginx:alpine 默认的 /etc/nginx/html）
    root /usr/share/nginx/html;
    index index.html;

    # Keep ordinary JSON/API requests small. Large bodies are enabled only on
    # the explicit multipart upload locations below.
    client_max_body_size 2m;

    # SPA：未匹配静态资源时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（video/image 上传关闭请求缓冲并保留长超时）
    location = /api/videos/upload {
        client_max_body_size 500M;
        proxy_pass http://eduk12_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/api/(uploads/image|documents/upload|courses/[^/]+/cover|checkins/(public/[^/]+/upload|[^/]+/submission-image))$ {
        client_max_body_size 20M;
        proxy_pass http://eduk12_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://eduk12_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Ordinary JSON/API traffic uses default request buffering (on).
        # Multipart upload locations above keep proxy_request_buffering off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Keep host-side health monitoring on the same single frontend entrypoint
    # without publishing the backend container port.
    location = /health {
        proxy_pass http://eduk12_api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://eduk12_api/ready;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location = /metrics { return 404; }
    location = /api/metrics { return 404; }

    # Production legacy uploads fail closed in backend and at the single ingress.
    location /uploads/ { return 404; }

    # Socket.IO（同源连接，显式代理 Engine.IO transport）
    location /socket.io/ {
        proxy_pass http://eduk12_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_read_timeout 75s;
        proxy_buffering off;
    }
}
