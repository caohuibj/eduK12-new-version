# ============================================================
# eduK12 / PTool — Docker Baseline (Milestone C / 2A)
# steady-state: postgres | redis | backend | frontend
# one-shot   : migrate / seed / release-preflight (profiles: ["ops"])
#
# 运行前：复制 .env.example -> .env 并填写数据库、JWT、加密、CORS 和 seed 凭据
#   docker compose --profile ops run --rm migrate
#   docker compose --profile ops run --rm release-preflight
#   docker compose --profile ops run --rm seed   # 首次/明确需要时
#   docker compose up -d backend frontend
#
# 升级安全顺序：入口 drain + 停止旧 backend/worker/frontend（不要停止
# postgres/redis） -> 备份 -> migrate -> checkin-token-backfill（四类 public
# token） -> release-preflight（八个约束） -> 同一 SHA build/start -> public
# workflow smoke -> 恢复入口流量。NOT VALID 仍会检查迁移后的写入。
# ============================================================

services:
  postgres:
    image: postgres:14-alpine
    container_name: ptool-postgres
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER must be set} -d ${DB_NAME:?DB_NAME must be set}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # 默认不发布 Host port（仅容器内网可达）

  redis:
    image: redis:7-alpine
    container_name: ptool-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # 默认不发布 Host port

  backend:
    image: server-version-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: ptool-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      # Supply a complete URL with percent-encoded user/password credentials.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set with URL-encoded credentials}
      # Applied by backend/src/config/databasePool.ts when DATABASE_URL does not
      # already contain the corresponding Prisma query parameter.
      PRISMA_CONNECTION_POOL_SIZE: ${PRISMA_CONNECTION_POOL_SIZE:-10}
      PRISMA_POOL_TIMEOUT: ${PRISMA_POOL_TIMEOUT:-30}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Do not silently downgrade secure cookies in a production-mode
      # container. Set false explicitly for local HTTP and true for HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE must be set explicitly (false for local HTTP, true for HTTPS)}
      # 生产环境必需（config/index.ts 强制校验 64 位十六进制）
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY must be set}
      # AssessmentContext 快照指纹密钥；留空时由 backend 从 DATA_ENCRYPTION_KEY 派生域隔离 HMAC 密钥
      ASSESSMENT_CONTEXT_HASH_KEY: ${ASSESSMENT_CONTEXT_HASH_KEY:-}
      # Cognitive 模块开关（Release v1 默认开启；legacy-only 环境可显式设为 false）
      COGNITIVE_MODULE_ENABLED: ${COGNITIVE_MODULE_ENABLED:-true}
      # Cognitive 参与者假名化密钥（仅当 COGNITIVE_MODULE_ENABLED=true 时生产必需，64 位十六进制；与 DATA_ENCRYPTION_KEY 独立）
      DATA_PSEUDONYM_KEY: ${DATA_PSEUDONYM_KEY}
      REDIS_URL: redis://redis:6379
      SOCKET_REDIS_REQUIRED: ${SOCKET_REDIS_REQUIRED:-true}
      UPLOAD_DIR: /app/uploads
      ASSET_STORAGE_PROVIDER: ${ASSET_STORAGE_PROVIDER:-local}
      ASSET_MIGRATION_COMPLETE: ${ASSET_MIGRATION_COMPLETE:?ASSET_MIGRATION_COMPLETE must be set explicitly after asset/token migration}
      ASSET_SIGNING_SECRET: ${ASSET_SIGNING_SECRET:?ASSET_SIGNING_SECRET must be set}
      # Public check-in limits use a 15-minute window. Keep IP ceilings wider
      # than the shared-link ceilings so a school NAT is not a class-size cap.
      PUBLIC_CHECKIN_UPLOAD_IP_LIMIT: ${PUBLIC_CHECKIN_UPLOAD_IP_LIMIT:-1800}
      PUBLIC_CHECKIN_UPLOAD_TOKEN_LIMIT: ${PUBLIC_CHECKIN_UPLOAD_TOKEN_LIMIT:-600}
      PUBLIC_CHECKIN_SUBMIT_IP_LIMIT: ${PUBLIC_CHECKIN_SUBMIT_IP_LIMIT:-600}
      PUBLIC_CHECKIN_SUBMIT_TOKEN_LIMIT: ${PUBLIC_CHECKIN_SUBMIT_TOKEN_LIMIT:-120}
      CREDENTIAL_HANDOFF_DIR: /app/.local
      CREDENTIAL_HANDOFF_TTL_HOURS: ${CREDENTIAL_HANDOFF_TTL_HOURS:-24}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set to an explicit frontend origin}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      EXPORT_MAX_RECORDS: ${EXPORT_MAX_RECORDS:-10000}
      EXPORT_MAX_TRIALS: ${EXPORT_MAX_TRIALS:-100000}
      EXPORT_MAX_FIELDS: ${EXPORT_MAX_FIELDS:-2000}
      EXPORT_MAX_BYTES: ${EXPORT_MAX_BYTES:-52428800}
      EXPORT_RETENTION_HOURS: ${EXPORT_RETENTION_HOURS:-24}
      EXPORT_DIR: /app/exports
      # COS 可选；留空则不启用远程存储
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      COS_DOMAIN: ${COS_DOMAIN:-}
      # 视频处理低配优化（沿用 baseline 默认）
      VIDEO_LOW_POWER_MODE: ${VIDEO_LOW_POWER_MODE:-true}
      VIDEO_RESOLUTION: ${VIDEO_RESOLUTION:-480p}
      VIDEO_PRESET: ${VIDEO_PRESET:-ultrafast}
      VIDEO_CRF: ${VIDEO_CRF:-28}
      VIDEO_BITRATE: ${VIDEO_BITRATE:-800k}
      VIDEO_CONCURRENCY: ${VIDEO_CONCURRENCY:-2}
    volumes:
      - uploads_data:/app/uploads
      - exports_data:/app/exports
      - credential_handoff_data:/app/.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # 默认不发布 Host port 3000（仅 frontend:80 对外）

  # Named volumes keep their existing ownership when they are reused.  Run a
  # short-lived root init container so the long-running API can stay non-root.
  backend-volume-init:
    image: server-version-backend:latest
    user: root
    command: ["sh", "-ec", "chown -R node:node /app/uploads /app/exports /app/.local && chmod 750 /app/uploads /app/exports && chmod 700 /app/.local"]
    volumes:
      - uploads_data:/app/uploads
      - exports_data:/app/exports
      - credential_handoff_data:/app/.local
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 构建期 Feature Flag；Release v1 默认开启，与 backend flag 一致
        VITE_COGNITIVE_MODULE_ENABLED: ${VITE_COGNITIVE_MODULE_ENABLED:-true}
    container_name: ptool-frontend
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 唯一 Host HTTP 入口

  # ---------------- one-shot ops jobs ----------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ops
    container_name: ptool-migrate
    profiles: ["ops"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set with URL-encoded credentials}
      NODE_ENV: production
    command: npm run db:migrate:guarded
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Backfill all public bearer-token tables (legacy service name retained for
  # compatibility with existing operator commands).
  checkin-token-backfill:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ops
    container_name: ptool-checkin-token-backfill
    profiles: ["ops"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set with URL-encoded credentials}
      NODE_ENV: production
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY must be set for encrypted token backfills}
    command: npm run db:backfill:checkin-tokens
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Run the read-only release data gate against the same uploads volume used
  # by the backend. The read-only mount is intentional: this service must
  # never alter production assets while checking for legacy files.
  release-preflight:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ops
    container_name: ptool-release-preflight
    profiles: ["ops"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set with URL-encoded credentials}
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    command: npm run db:release:preflight
    volumes:
      - uploads_data:/app/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ops
    container_name: ptool-seed
    profiles: ["ops"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set with URL-encoded credentials}
      NODE_ENV: production
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set for the initial seed}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set for the initial seed}
    command: npm run db:seed
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  exports_data:
  credential_handoff_data:
