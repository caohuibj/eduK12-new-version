# ============================================================
# eduK12 / PTool — Docker Baseline (Milestone C / 2A)
# steady-state: postgres | redis | backend | frontend
# one-shot   : migrate / seed / release-preflight (profiles: ["ops"])
#
# 运行前：复制 .env.example -> .env 并填写数据库、JWT、加密、CORS 和 seed 凭据
#   docker compose --profile ops run --rm migrate
#   docker compose --profile ops run --rm release-preflight
#   docker compose --profile ops run --rm seed   # 首次/明确需要时
#   docker compose up -d backend worker frontend
#
# 升级安全顺序：入口 drain + 停止旧 backend/worker/frontend（不要停止
# postgres/redis） -> 备份 -> migrate -> checkin-token-backfill（四类 public
# token） -> release-preflight（八个约束） -> 同一 SHA build/start -> public
# workflow smoke -> 恢复入口流量。NOT VALID 仍会检查迁移后的写入。
# ============================================================

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set with URL-encoded credentials}
  PRISMA_CONNECTION_POOL_SIZE: ${PRISMA_CONNECTION_POOL_SIZE:-10}
  PRISMA_POOL_TIMEOUT: ${PRISMA_POOL_TIMEOUT:-30}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
  COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE must be set explicitly (false for local HTTP, true for HTTPS)}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY must be set}
  ASSESSMENT_CONTEXT_HASH_KEY: ${ASSESSMENT_CONTEXT_HASH_KEY:-}
  BUNDLE_PRODUCTS_ENABLED: ${BUNDLE_PRODUCTS_ENABLED:-false}
  BUNDLE_REVIEW_SIGNING_KEY: ${BUNDLE_REVIEW_SIGNING_KEY:-}
  COGNITIVE_MODULE_ENABLED: ${COGNITIVE_MODULE_ENABLED:-true}
  DATA_PSEUDONYM_KEY: ${DATA_PSEUDONYM_KEY}
  REDIS_URL: redis://redis:6379
  SOCKET_REDIS_REQUIRED: ${SOCKET_REDIS_REQUIRED:-true}
  UPLOAD_DIR: /app/uploads
  ASSET_STORAGE_PROVIDER: ${ASSET_STORAGE_PROVIDER:-local}
  ASSET_MIGRATION_COMPLETE: ${ASSET_MIGRATION_COMPLETE:?ASSET_MIGRATION_COMPLETE must be set explicitly after asset/token migration}
  ASSET_SIGNING_SECRET: ${ASSET_SIGNING_SECRET:?ASSET_SIGNING_SECRET must be set}
  PUBLIC_CHECKIN_UPLOAD_IP_LIMIT: ${PUBLIC_CHECKIN_UPLOAD_IP_LIMIT:-1800}
  PUBLIC_CHECKIN_UPLOAD_TOKEN_LIMIT: ${PUBLIC_CHECKIN_UPLOAD_TOKEN_LIMIT:-600}
  PUBLIC_CHECKIN_SUBMIT_IP_LIMIT: ${PUBLIC_CHECKIN_SUBMIT_IP_LIMIT:-600}
  PUBLIC_CHECKIN_SUBMIT_TOKEN_LIMIT: ${PUBLIC_CHECKIN_SUBMIT_TOKEN_LIMIT:-120}
  CREDENTIAL_HANDOFF_DIR: /app/.local
  CREDENTIAL_HANDOFF_TTL_HOURS: ${CREDENTIAL_HANDOFF_TTL_HOURS:-24}
  CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set to an explicit frontend origin}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
  # Conservative pre-measurement defaults. Final 4C4G pool/admission values
  # must be set from the production measurement pass; these are not certified optima.
  UNIT_SUBMIT_ADMISSION_LIMIT: ${UNIT_SUBMIT_ADMISSION_LIMIT:-7}
  UNIT_SUBMIT_ADMISSION_QUEUE: ${UNIT_SUBMIT_ADMISSION_QUEUE:-16}
  UNIT_SUBMIT_ADMISSION_TIMEOUT_MS: ${UNIT_SUBMIT_ADMISSION_TIMEOUT_MS:-500}
  UNIT_SUBMIT_RETRY_AFTER_SECONDS: ${UNIT_SUBMIT_RETRY_AFTER_SECONDS:-1}
  AGGREGATE_FINALIZATION_ADMISSION_LIMIT: ${AGGREGATE_FINALIZATION_ADMISSION_LIMIT:-3}
  AGGREGATE_FINALIZATION_ADMISSION_QUEUE: ${AGGREGATE_FINALIZATION_ADMISSION_QUEUE:-4}
  AGGREGATE_FINALIZATION_ADMISSION_TIMEOUT_MS: ${AGGREGATE_FINALIZATION_ADMISSION_TIMEOUT_MS:-250}
  AGGREGATE_FINALIZATION_RETRY_AFTER_SECONDS: ${AGGREGATE_FINALIZATION_RETRY_AFTER_SECONDS:-1}
  QUESTIONNAIRE_COMPLETION_ADMISSION_LIMIT: ${QUESTIONNAIRE_COMPLETION_ADMISSION_LIMIT:-8}
  QUESTIONNAIRE_COMPLETION_ADMISSION_QUEUE: ${QUESTIONNAIRE_COMPLETION_ADMISSION_QUEUE:-64}
  QUESTIONNAIRE_COMPLETION_ADMISSION_TIMEOUT_MS: ${QUESTIONNAIRE_COMPLETION_ADMISSION_TIMEOUT_MS:-1500}
  QUESTIONNAIRE_COMPLETION_RETRY_AFTER_SECONDS: ${QUESTIONNAIRE_COMPLETION_RETRY_AFTER_SECONDS:-1}
  # Public assessment multi-budget limiter (formula knobs; explicit *_LIMIT overrides win in config).
  PUBLIC_ASSESSMENT_EXPECTED_CLASS_SIZE: ${PUBLIC_ASSESSMENT_EXPECTED_CLASS_SIZE:-60}
  PUBLIC_ASSESSMENT_EXPECTED_START_TOKEN_AUDIENCE: ${PUBLIC_ASSESSMENT_EXPECTED_START_TOKEN_AUDIENCE:-500}
  PUBLIC_ASSESSMENT_GETS_PER_STUDENT: ${PUBLIC_ASSESSMENT_GETS_PER_STUDENT:-40}
  PUBLIC_ASSESSMENT_FINALS_PER_STUDENT: ${PUBLIC_ASSESSMENT_FINALS_PER_STUDENT:-8}
  PUBLIC_ASSESSMENT_NAT_SHARE_FACTOR: ${PUBLIC_ASSESSMENT_NAT_SHARE_FACTOR:-50}
  PUBLIC_ASSESSMENT_WINDOW_MS: ${PUBLIC_ASSESSMENT_WINDOW_MS:-900000}
  EXPORT_MAX_RECORDS: ${EXPORT_MAX_RECORDS:-10000}
  EXPORT_MAX_TRIALS: ${EXPORT_MAX_TRIALS:-100000}
  EXPORT_MAX_FIELDS: ${EXPORT_MAX_FIELDS:-2000}
  EXPORT_MAX_BYTES: ${EXPORT_MAX_BYTES:-52428800}
  EXPORT_RETENTION_HOURS: ${EXPORT_RETENTION_HOURS:-24}
  UPLOAD_MAX_CONCURRENT: ${UPLOAD_MAX_CONCURRENT:-2}
  UPLOAD_IMAGE_MAX_PIXELS: ${UPLOAD_IMAGE_MAX_PIXELS:-16000000}
  LOGIN_IP_REQUEST_LIMIT: ${LOGIN_IP_REQUEST_LIMIT:-3000}
  LOGIN_PASSWORD_MAX_WAIT_MS: ${LOGIN_PASSWORD_MAX_WAIT_MS:-30000}
  UPLOAD_REQUEST_LIMIT: ${UPLOAD_REQUEST_LIMIT:-30}
  UPLOAD_BYTE_BUDGET: ${UPLOAD_BYTE_BUDGET:-629145600}
  REGISTRATION_GLOBAL_LIMIT: ${REGISTRATION_GLOBAL_LIMIT:-6000}
  REGISTRATION_IP_LIMIT: ${REGISTRATION_IP_LIMIT:-3000}
  REGISTRATION_RESOURCE_LIMIT: ${REGISTRATION_RESOURCE_LIMIT:-3000}
  REGISTRATION_MAX_CONCURRENT: ${REGISTRATION_MAX_CONCURRENT:-2}
  REGISTRATION_MAX_QUEUE: ${REGISTRATION_MAX_QUEUE:-16}
  REGISTRATION_MAX_WAIT_MS: ${REGISTRATION_MAX_WAIT_MS:-3000}
  REGISTRATION_ACCOUNT_LIMIT: ${REGISTRATION_ACCOUNT_LIMIT:-10}
  REGISTRATION_TEACHER_CODE_LIMIT: ${REGISTRATION_TEACHER_CODE_LIMIT:-120}
  LOGIN_PASSWORD_MAX_CONCURRENT: ${LOGIN_PASSWORD_MAX_CONCURRENT:-4}
  LOGIN_PASSWORD_MAX_QUEUE: ${LOGIN_PASSWORD_MAX_QUEUE:-32}
  LOGIN_PASSWORD_WORKERS: ${LOGIN_PASSWORD_WORKERS:-0}
  PASSWORD_CHANGE_REQUEST_LIMIT: ${PASSWORD_CHANGE_REQUEST_LIMIT:-10}
  EXPORT_DIR: /app/exports
  COS_SECRET_ID: ${COS_SECRET_ID:-}
  COS_SECRET_KEY: ${COS_SECRET_KEY:-}
  COS_BUCKET: ${COS_BUCKET:-}
  COS_REGION: ${COS_REGION:-}
  COS_DOMAIN: ${COS_DOMAIN:-}
  VIDEO_LOW_POWER_MODE: ${VIDEO_LOW_POWER_MODE:-true}
  VIDEO_RESOLUTION: ${VIDEO_RESOLUTION:-480p}
  VIDEO_PRESET: ${VIDEO_PRESET:-veryfast}
  VIDEO_CRF: ${VIDEO_CRF:-26}
  VIDEO_BITRATE: ${VIDEO_BITRATE:-800k}
  VIDEO_AUDIO_BITRATE: ${VIDEO_AUDIO_BITRATE:-96k}
  VIDEO_SMART_COMPRESSION: ${VIDEO_SMART_COMPRESSION:-true}
  VIDEO_CONCURRENCY: ${VIDEO_CONCURRENCY:-1}
  VIDEO_TIMEOUT: ${VIDEO_TIMEOUT:-1800}
  VIDEO_URL_MAX_PENDING: ${VIDEO_URL_MAX_PENDING:-4}
  VIDEO_URL_MAX_PRINCIPAL_PENDING: ${VIDEO_URL_MAX_PRINCIPAL_PENDING:-2}
  VIDEO_URL_MAX_PRINCIPAL_STORED_BYTES: ${VIDEO_URL_MAX_PRINCIPAL_STORED_BYTES:-8589934592}
  VIDEO_URL_MAX_STORED_BYTES: ${VIDEO_URL_MAX_STORED_BYTES:-34359738368}
  VIDEO_URL_MIN_FREE_BYTES: ${VIDEO_URL_MIN_FREE_BYTES:-5368709120}
  VIDEO_URL_BYTE_BUDGET: ${VIDEO_URL_BYTE_BUDGET:-19327352832}
  VIDEO_URL_GLOBAL_BYTE_BUDGET: ${VIDEO_URL_GLOBAL_BYTE_BUDGET:-77309411328}
  IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-1}
  IMAGE_TIMEOUT: ${IMAGE_TIMEOUT:-30}
  EXPORT_CONCURRENCY: ${EXPORT_CONCURRENCY:-1}
  EXPORT_TIMEOUT: ${EXPORT_TIMEOUT:-1800}
  WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-30}

services:
  postgres:
    cpus: ${POSTGRES_CPUS:-1.0}
    mem_limit: ${POSTGRES_MEM_LIMIT:-1024m}
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}", "-c", "work_mem=${POSTGRES_WORK_MEM:-4MB}", "-c", "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-80}"]
    image: postgres:16.15-bookworm
    container_name: ptool-postgres
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
    volumes:
      - postgres16_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER must be set} -d ${DB_NAME:?DB_NAME must be set}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # 默认不发布 Host port（仅容器内网可达）

  redis:
    cpus: ${REDIS_CPUS:-0.25}
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    image: redis:7.4.11-bookworm
    container_name: ptool-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-128mb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # 默认不发布 Host port

  backend:
    cpus: ${BACKEND_CPUS:-1.75}
    mem_limit: ${BACKEND_MEM_LIMIT:-1024m}
    image: server-version-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: ptool-backend
    environment:
      <<: *app-environment
      DATABASE_URL_LEGACY: ${DATABASE_URL_LEGACY:-}
      LEGACY_DATA_ENCRYPTION_KEY: ${LEGACY_DATA_ENCRYPTION_KEY:-}
      NODE_OPTIONS: --max-old-space-size=${BACKEND_NODE_HEAP_MB:-640}
      BACKGROUND_WORKERS_ENABLED: ${BACKGROUND_WORKERS_ENABLED:-false}
    volumes:
      - uploads_data:/app/uploads
      - exports_data:/app/exports
      - credential_handoff_data:/app/.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # 默认不发布 Host port 3000（仅 frontend:80 对外）

  # Named volumes keep their existing ownership when they are reused.  Run a
  # short-lived root init container so the long-running API can stay non-root.
  backend-volume-init:
    image: server-version-backend:latest
    user: root
    command: ["sh", "-ec", "chown -R node:node /app/uploads /app/exports /app/.local && chmod 750 /app/uploads /app/exports && chmod 700 /app/.local"]
    volumes:
      - uploads_data:/app/uploads
      - exports_data:/app/exports
      - credential_handoff_data:/app/.local
    restart: "no"

  # Consume video/image/export Bull jobs. Canonical API sets
  # BACKGROUND_WORKERS_ENABLED=false so FINAL_ONLY submit does not share this
  # process's Prisma pool with transcode/export.
  worker:
    cpus: ${WORKER_CPUS:-0.75}
    mem_limit: ${WORKER_MEM_LIMIT:-768m}
    image: server-version-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: ptool-worker
    command: ["node", "dist/workers/main.js"]
    environment:
      <<: *app-environment
      NODE_OPTIONS: --max-old-space-size=${WORKER_NODE_HEAP_MB:-192}
      BACKGROUND_WORKERS_ENABLED: "true"
      PRISMA_CONNECTION_POOL_SIZE: ${WORKER_PRISMA_CONNECTION_POOL_SIZE:-4}
    volumes:
      - uploads_data:/app/uploads
      - exports_data:/app/exports
      - credential_handoff_data:/app/.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-volume-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    cpus: ${FRONTEND_CPUS:-0.25}
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 构建期 Feature Flag；Release v1 默认开启，与 backend flag 一致
        VITE_COGNITIVE_MODULE_ENABLED: ${VITE_COGNITIVE_MODULE_ENABLED:-true}
    container_name: ptool-frontend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 唯一 Host HTTP 入口

  # ---------------- one-shot ops jobs ----------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ops
    container_name: ptool-migrate
    profiles: ["ops"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set with URL-encoded credentials}
      DATABASE_URL_RUNTIME: ${DATABASE_URL_RUNTIME:-}
      NODE_ENV: production
    command: npm run db:migrate:guarded
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Backfill all public bearer-token tables (legacy service name retained for
  # compatibility with existing operator commands).
  checkin-token-backfill:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ops
    container_name: ptool-checkin-token-backfill
    profiles: ["ops"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set with URL-encoded credentials}
      NODE_ENV: production
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY must be set for encrypted token backfills}
    command: npm run db:backfill:checkin-tokens
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Run the read-only release data gate against the same uploads volume used
  # by the backend. The read-only mount is intentional: this service must
  # never alter production assets while checking for legacy files.
  release-preflight:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ops
    container_name: ptool-release-preflight
    profiles: ["ops"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set with URL-encoded credentials}
      DATABASE_URL_RUNTIME: ${DATABASE_URL_RUNTIME:-}
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    command: npm run db:release:preflight
    volumes:
      - uploads_data:/app/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ops
    container_name: ptool-seed
    profiles: ["ops"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set with URL-encoded credentials}
      NODE_ENV: production
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set for the initial seed}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set for the initial seed}
    command: npm run db:seed
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres16_data:
  redis_data:
  uploads_data:
  exports_data:
  credential_handoff_data:
