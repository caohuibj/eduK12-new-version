# =============================================================================
# PTool 监控服务编排 (可选)
# 功能: Prometheus + Grafana 可视化监控
# 说明: 适用于需要图形化监控面板的场景
# =============================================================================

version: '3.8'

services:
  # Prometheus - 指标收集
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ptool-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
      - ptool-network

  # Alertmanager - pinned version; external delivery is opt-in.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ptool-alertmanager
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/render-alertmanager.sh:/etc/alertmanager/render-and-start.sh:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    command: ["/bin/sh", "/etc/alertmanager/render-and-start.sh"]
    networks:
      - monitoring

  # Grafana - 可视化面板
  grafana:
    image: grafana/grafana:11.2.0
    container_name: ptool-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - monitoring
    depends_on:
      - prometheus

  # Node Exporter - 主机指标
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ptool-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring

  # PostgreSQL Exporter - 数据库指标
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ptool-postgres-exporter
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DATA_SOURCE_NAME:?POSTGRES_EXPORTER_DATA_SOURCE_NAME must be set with URL-encoded credentials}
    networks:
      - monitoring
      - ptool-network

  # Redis Exporter - Redis指标
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: ptool-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
    networks:
      - monitoring
      - ptool-network

  # cAdvisor - 容器指标
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ptool-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  monitoring:
    driver: bridge
  ptool-network:
    external: true
    # Match the supported main stack invocation:
    # docker compose --project-name server-version ...
    # Override PT_TOOL_NETWORK when a different project name is intentional.
    name: ${PT_TOOL_NETWORK:-server-version_default}
