server {
    server_name eduk12.top www.eduk12.top;

    gzip on;
    gzip_types text/plain text/css application/javascript;

    location / {
        root /opt/ptool/server-version/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # 禁用 HTML 缓存，确保获取最新版本
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
        
        # JS/CSS 带哈希文件可长期缓存（但不使用 immutable，允许重新验证）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
        }
    }

    # 监控大盘页面
    location /monitor {
        alias /opt/ptool/server-version/frontend/public/monitor.html;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    # 上传文件服务
    location /uploads {
        alias /var/www/uploads;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 超时配置 - 支持大文件上传
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
        client_body_timeout 600s;
        
        # 禁用所有缓存 - 确保API数据实时性
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        
        # 添加禁用缓存的响应头
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
        add_header Pragma 'no-cache' always;
        add_header Expires '0' always;
    }

    client_max_body_size 500M;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/eduk12.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eduk12.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    listen 80;
    server_name eduk12.top www.eduk12.top _;
    return 301 https://$host$request_uri;
}