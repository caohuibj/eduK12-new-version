groups:
  - name: eduk12-availability
    rules:
      - alert: EduK12BackendDown
        expr: up{job="ptool-api"} == 0
        for: 5m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: eduK12 backend metrics endpoint is unavailable

      - alert: EduK12Api5xxRateHigh
        expr: |
          sum(rate(ptool_api_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(ptool_api_requests_total[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: API 5xx rate exceeded 5 percent for five minutes

      - alert: EduK12DatabaseConnectionsHigh
        expr: |
          max(pg_stat_activity_count)
          /
          clamp_min(max(pg_settings_max_connections), 1)
          > 0.8
        for: 10m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: PostgreSQL connections exceeded 80 percent of configured maximum

      - alert: EduK12DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/", fstype!=""}
          /
          clamp_min(node_filesystem_size_bytes{mountpoint="/", fstype!=""}, 1)
          < 0.15
        for: 10m
        labels:
          severity: warning
          service: host
        annotations:
          summary: root filesystem free space is below 15 percent

      - alert: EduK12BackupStale
        expr: time() - ptool_backup_last_success_timestamp_seconds > 26 * 60 * 60
        for: 30m
        labels:
          severity: critical
          service: backup
        annotations:
          summary: the last verified database backup is older than 26 hours

      - alert: EduK12BackupStatusMissing
        expr: absent(ptool_backup_last_success_timestamp_seconds)
        for: 26h
        labels:
          severity: critical
          service: backup
        annotations:
          summary: no verified backup status metric has been reported for 26 hours

      - alert: EduK12MonitoringTargetDown
        expr: up{job=~"node-exporter|postgres-exporter|redis-exporter|cadvisor"} == 0
        for: 10m
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: a monitoring exporter target is down

  - name: eduk12-capacity
    rules:
      - alert: EduK12EventLoopDelayHigh
        expr: ptool_nodejs_event_loop_delay_seconds{quantile="0.99"} > 0.2
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: Node.js event-loop p99 delay stayed above 200 ms for five minutes

      - alert: EduK12AdmissionQueueSustained
        expr: max by (gate) (ptool_bounded_admission_queue) > 0
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: A bounded admission gate has remained queued for five minutes

      - alert: EduK12AdmissionRejectionsHigh
        expr: sum by (gate, reason) (increase(ptool_bounded_admission_rejections_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: A bounded admission gate is repeatedly rejecting work

      - alert: EduK12PrismaLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(ptool_prisma_call_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: Prisma call p95 latency stayed above 500 ms for ten minutes

      - alert: EduK12SerializationConflictRateHigh
        expr: |
          sum(rate(ptool_serialization_conflicts_total[5m]))
          /
          clamp_min(sum(rate(ptool_serializable_attempts_total[5m])), 0.001)
          > 0.2
        for: 10m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: Serializable transaction conflicts exceeded 20 percent of attempts
